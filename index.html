      // ölçü çizgileri
      const gz = flatTop + 0.03, off = 1.2;
      add([iso.seg(I, 0, plan.Dp + off, plan.Wp, plan.Dp + off, gz, { stroke: C.ink, sw: 1, opacity: 0.55 }), iso.seg(I, 0, plan.Dp + off - 0.4, 0, plan.Dp + off + 0.4, gz, { stroke: C.ink, sw: 1, opacity: 0.55 }), iso.seg(I, plan.Wp, plan.Dp + off - 0.4, plan.Wp, plan.Dp + off + 0.4, gz, { stroke: C.ink, sw: 1, opacity: 0.55 })]);
      add(iso.planText(I, plan.Wp / 2, plan.Dp + off + 1.1, gz, [sheet.dimText(plan.Wp)], Math.min(1.1, plan.Dp * 0.1), { dir: 'u', fill: C.ink, fam: 'm', weight: 600, opacity: 0.7 }));
      add([iso.seg(I, plan.Wp + off, 0, plan.Wp + off, plan.Dp, gz, { stroke: C.ink, sw: 1, opacity: 0.55 })]);
      add(iso.planText(I, plan.Wp + off + 1.3, plan.Dp / 2, gz, [sheet.dimText(plan.Dp)], Math.min(1.1, plan.Dp * 0.1), { dir: 'v', fill: C.ink, fam: 'm', weight: 600, opacity: 0.7 }));
    } else if (layerId === 'islev') {

        if (b.kind === 'corridor') { add(iso.prism(I, b.x, b.y, b.w, b.h, z, z + 0.05, C.corridor, { stroke: C.blockStroke, sw: 0.8 })); return; }

      });

    } else if (layerId === 'sirk') {
      sortByDepth(I, f.blocks.filter((b) => b.kind !== 'void')).forEach((b) => {
        const isC = b.kind === 'core' || b.kind === 'corridor' || b.zone === 'sirkulasyon';
        add(iso.prism(I, b.x, b.y, b.w, b.h, z, z + (b.kind === 'core' ? hW * 0.9 : isC ? 0.12 : 0.05), isC ? (C.glass ? C.core : C.accent) : C.flat, { stroke: C.blockStroke, sw: isC ? C.sw : 0.8, opacity: isC ? 1 : 0.8, topFill: isC && !C.glass ? C.accent : undefined }));
      });
      if (view.labels) sortByDepth(I, space).forEach((b) => {
        const isC = b.zone === 'sirkulasyon';
        add(blockLabel(I, b, z + 0.14, isC ? C.coreText : C.ink, { max: 14, area: false }));
      });
      const by = new Map();
      f.blocks.forEach((b) => { if (b.spaceId) by.set(b.spaceId, b); });
      let i = 0;
      Object.keys(project.relations).forEach((key) => {
        if (project.relations[key] !== 'strong') return;
        const ids = key.split('|');
        const a = by.get(ids[0]), b = by.get(ids[1]);
        if (!a || !b) return;
        const pa = relCenter(a), pb = relCenter(b);
        const from = a.zone === 'sirkulasyon' || b.zone !== 'sirkulasyon' ? pa : pb;
        const to = from === pa ? pb : pa;
        add(iso.arrow(I, from, curve(from, to, i++ % 2 ? 1 : -1), to, z + 0.3, { stroke: C.accent, sw: 2.4, head: 11 }));
      });
      if (plan.useCore) add(iso.planText(I, plan.cwid / 2, plan.Dp / 2, z + hW * 0.9 + 0.02, ['Düşey çekirdek'], Math.min(0.8, plan.cwid * 0.28), { dir: 'v', fill: C.coreText, fam: 'l', weight: 700, opacity: 0.9 }));
    } else if (layerId === 'doluluk') {
      const hh = hW * 1.5;
      sortByDepth(I, f.blocks.filter((b) => b.kind !== 'void')).forEach((b) => {
        const light = b.kind === 'corridor';
        add(iso.prism(I, b.x, b.y, b.w, b.h, z, z + (light ? 0.05 : hh), light ? C.corridor : C.dolu, { stroke: C.glass ? 'rgba(246,247,249,.55)' : C.slabTop, sw: 1.2 }));
      });
      f.blocks.filter((b) => b.kind === 'void').forEach((b) => {
        add(iso.hatch(I, b.x, b.y, b.w, b.h, flatTop, Math.max(1.0, plan.Dp / 10), { stroke: C.ink, sw: 1, opacity: 0.3 }));
      });
    } else if (layerId === 'iliski') {
      f.blocks.filter((b) => b.kind !== 'void').forEach((b) => {
        const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map((q) => I.proj(q[0], q[1], flatTop + 0.02));
        P.push({ t: 'poly', pts: pts, fill: C.flat, stroke: C.blockStroke, sw: 0.9, opacity: 0.85 });
      });
      const by = new Map();
      f.blocks.forEach((b) => { if (b.spaceId) by.set(b.spaceId, b); });
      const deg = new Map();
      const zz = flatTop + 0.15;
      Object.keys(project.relations).forEach((key) => {
        const ids = key.split('|');
        const a = by.get(ids[0]), b = by.get(ids[1]);
        if (!a || !b) return;
        const type = project.relations[key];
        deg.set(a.id, (deg.get(a.id) || 0) + 1); deg.set(b.id, (deg.get(b.id) || 0) + 1);
        const pa = relCenter(a), pb = relCenter(b);
        if (type === 'strong') add([iso.seg(I, pa[0], pa[1], pb[0], pb[1], zz, { stroke: C.strongLine, sw: 3.4, cap: 'round' })]);
        else if (type === 'weak') add([iso.seg(I, pa[0], pa[1], pb[0], pb[1], zz, { stroke: C.ink, sw: 1.6, dash: [7, 6], opacity: 0.7 })]);
        else if (type === 'avoid') {
          add([iso.seg(I, pa[0], pa[1], pb[0], pb[1], zz, { stroke: C.glass ? C.ink : App.PAL.red, sw: 2, dash: [1, 7], cap: 'round' })]);
          const m = I.proj((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, zz);
          P.push({ t: 'circle', cx: m[0], cy: m[1], r: 7, fill: C.slabTop, stroke: C.glass ? C.ink : App.PAL.red, sw: 1.6 });
          P.push({ t: 'line', x1: m[0] - 3, y1: m[1] - 3, x2: m[0] + 3, y2: m[1] + 3, stroke: C.glass ? C.ink : App.PAL.red, sw: 1.6, cap: 'round' });
          P.push({ t: 'line', x1: m[0] - 3, y1: m[1] + 3, x2: m[0] + 3, y2: m[1] - 3, stroke: C.glass ? C.ink : App.PAL.red, sw: 1.6, cap: 'round' });
        }
      });
      sortByDepth(I, space).forEach((b) => {
        const c = relCenter(b);
        const q = I.proj(c[0], c[1], zz + 0.05);
        const r = 5 + Math.min(6, (deg.get(b.id) || 0) * 1.2);

      });
      if (view.labels) space.forEach((b) => add(blockLabel(I, Object.assign({}, b, { y: b.y + b.h * 0.18 }), zz + 0.2, C.ink, { max: 12, area: false })));

  /* ---------- sahne ---------- */
  function layerLegend(id, C, A, plan, f) {
    const sq = (label, fill, stroke) => ({ label: label, fill: fill, stroke: stroke });
    if (id === 'taban') return [sq('Mekân', '#FFFFFF', C.ink), sq('Çekirdek', C.core), sq('Koridor', C.corridor)];
    if (id === 'islev') return App.ZONE_ORDER.filter((z) => f.blocks.some((b) => b.zone === z && b.kind === 'space')).slice(0, 4).map((z) => sq(App.ZONES[z].label, App.ZONES[z].fill, C.ink));
    if (id === 'sirk') return [sq('Düşey çekirdek', C.glass ? C.core : C.accent), sq('Koridor / hol', C.glass ? C.core : C.accent), sq('Güçlü bağ (ok)', C.accent)];
    if (id === 'doluluk') return [sq('Dolu hacim', C.dolu), sq('Boşluk / teras', 'none', C.ink)];
    if (id === 'iliski') return [sq('Güçlü ilişki', C.strongLine), sq('Zayıf ilişki', 'none', C.ink), sq('Ayrı tut', 'none', C.glass ? C.ink : App.PAL.red)];
    if (id === 'gurultu') return [sq('Gürültülü', C.noise.loud), sq('Orta', C.noise.mid), sq('Sessiz', C.noise.quiet)];
    return [];
  }

  function layerNote(id, plan, f, A, project) {
    const occ = plan.plateArea;
    if (id === 'taban') return fmt(plan.Wp, 1) + ' × ' + fmt(plan.Dp, 1) + ' m · ' + fmt(plan.plateArea) + ' m²';
    if (id === 'islev') return f.spaces.length + ' mekân · ' + fmt(f.net) + ' m² net';
    if (id === 'sirk') { let c = 0; f.blocks.forEach((b) => { if (b.kind === 'core' || b.kind === 'corridor' || b.zone === 'sirkulasyon') c += b.w * b.h; }); return 'Sirkülasyon %' + Math.round((c / occ) * 100); }
    if (id === 'doluluk') return 'Dolu %' + Math.round(((occ - f.void) / occ) * 100) + ' · Boşluk %' + Math.round((f.void / occ) * 100);
    if (id === 'iliski') { let s = 0, w = 0, a = 0; const ids = new Set(f.spaces.map((x) => x.id)); Object.keys(project.relations).forEach((k) => { const q = k.split('|'); if (ids.has(q[0]) && ids.has(q[1])) { const t = project.relations[k]; if (t === 'strong') s++; else if (t === 'weak') w++; else a++; } }); return s + ' güçlü · ' + w + ' zayıf · ' + a + ' ayrı'; }
    if (id === 'gurultu') { const c = { loud: 0, mid: 0, quiet: 0 }; f.spaces.forEach((x) => c[A.noise.get(x.id) || 'mid']++); return c.loud + ' gürültülü · ' + c.mid + ' orta · ' + c.quiet + ' sessiz'; }

  function scene(project, d, view, live) {
    const plan = d.plan;
    const A = analyze(project, d);
    const C = cols();
    const g = C.glass;
    const mode = view.mode === 'layers' ? 'layers' : 'floors';
    const tb = sheet.tb;

    // levha listesi (alttan üste)
    let slabs;
    let floor = plan.floors.find((f) => f.id === view.floorId) || plan.floors[0];
    if (mode === 'floors') slabs = plan.floors.map((f) => ({ id: f.id, f: f, name: f.name }));
    else {
      const on = LAYERS.filter((l) => view.layers.indexOf(l.id) >= 0);
      slabs = (on.length ? on : [LAYERS[1]]).map((l) => ({ id: l.id, f: floor, name: l.name, layer: l }));
    }
    const n = slabs.length;
    const area = mode === 'floors' ? { x: 56, y: 62, w: 960, h: tb.y - 62 - 30 } : { x: 360, y: 62, w: 990, h: tb.y - 62 - 30 };

    const SLAB = 0.45, GAP0 = 0.55;
    const Gx = 0.45 * Math.max(plan.Wp, plan.Dp);
    const hW = Math.max(1.2, Math.min(2.8, 0.2 * Math.min(plan.Wp, plan.Dp)));
    const ex = U.clamp(view.explode, 0, 1);
    const step = SLAB + GAP0 + ex * Gx;
    const zMax = (n - 1) * (SLAB + GAP0 + Gx) + hW * 1.6;
    const zCur = (n - 1) * step + hW * 1.6;
    const diag = Math.hypot(plan.Wp, plan.Dp);
    const pr = (view.pitch * Math.PI) / 180;
    const bw = diag * 1.04 + (mode === 'layers' ? 3 : 0), bh = diag * Math.sin(pr) + zMax * Math.cos(pr);
    const s = Math.min(area.w / bw, area.h / bh, 70) * 0.97;
    const cx = area.x + area.w / 2;
    const cy = area.y + area.h / 2 + (zCur * Math.cos(pr) * s) / 2 - (hW * 0.8 * Math.cos(pr) * s) / 2;
    const I = iso.make({ yaw: view.yaw, pitch: view.pitch, s: s, cx: cx, cy: cy, center: [plan.Wp / 2, plan.Dp / 2] });

    // künye
    const zones = [];
    project.spaces.forEach((sp) => { if (zones.indexOf(sp.zone) < 0) zones.push(sp.zone); });
    const info = {
      name: project.meta.name,
      subtitle: 'Mekân analizi · ' + (mode === 'floors' ? 'kat kat' : floor.name + ' katmanları'),
      legend: sheet.zoneLegend(zones),
      stats: [['Kat', String(plan.floors.length)], ['Plak', fmt(plan.Wp, 1) + ' × ' + fmt(plan.Dp, 1) + ' m'], ['Doluluk', '%' + Math.round(d.metrics.fill * 100)]],
      scoreLabel: 'Uyum skoru', percent: A.score,
    };
    const prims = sheet.frame(info, live);
    const hits = [];
    const marks = [];
    const gz = (i) => i * step;
    const slabTopPts = (i) => [[0, 0], [plan.Wp, 0], [plan.Wp, plan.Dp], [0, plan.Dp]].map((q) => I.proj(q[0], q[1], gz(i)));

    slabs.forEach((sl, i) => {
      const z = gz(i);
      const dim = mode === 'floors' && view.sel && view.sel !== sl.id ? 0.28 : 1;
      let P;
      if (mode === 'floors') P = floorSlab(I, project, plan, sl.f, z, view, C, hW, A.noise);
      else P = layerSlab(I, project, plan, sl.f, z, sl.id, view, C, hW, A);
      dimOp(P, dim).forEach((p) => prims.push(p));
      // düşey kılavuzlar ve düşey sirkülasyon (levha i ile i+1 arası)
      if (i < n - 1) {
        const z1 = z + (mode === 'floors' ? hW * 1.1 : 0.02), z2 = gz(i + 1) - (mode === 'floors' ? 0.45 : 0.3);
        if (view.guides) [[0, 0], [plan.Wp, 0], [plan.Wp, plan.Dp], [0, plan.Dp]].forEach((q) => {
          const a = I.proj(q[0], q[1], z + 0.02), b = I.proj(q[0], q[1], z2);
          prims.push({ t: 'line', x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.guide, sw: 1, dash: [5, 5], opacity: ex < 0.05 ? 0 : 0.7 });
        });
        if (mode === 'floors' && plan.useCore && view.arrows && ex > 0.05) {
          const a = I.proj(plan.cwid / 2, plan.Dp / 2, z1), b = I.proj(plan.cwid / 2, plan.Dp / 2, z2);
          prims.push({ t: 'line', x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.accent, sw: 3.2, cap: 'round', opacity: 0.95 });
          prims.push({ t: 'circle', cx: a[0], cy: a[1], r: 4, fill: C.accent });
          prims.push({ t: 'circle', cx: b[0], cy: b[1], r: 4, fill: C.accent });
        }
      }
      // etkileşim bölgeleri
      const tp = slabTopPts(i);
      hits.push({ kind: 'slab', id: sl.id, pts: tp });
      if (mode === 'floors') sl.f.blocks.forEach((b) => {
        if (b.kind !== 'space') return;
        const top = z + (view.volume ? hW : 0.12);
        hits.push({ kind: 'block', id: b.spaceId, floorId: sl.f.id, name: b.name, area: b.area, pts: [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map((q) => I.proj(q[0], q[1], top)) });
      });
      const ctr = I.proj(plan.Wp / 2, plan.Dp / 2, z);
      const maxX = Math.max.apply(null, tp.map((q) => q[0]));
      const minX = Math.min.apply(null, tp.map((q) => q[0]));
      marks.push({ i: i, id: sl.id, cy: ctr[1], maxX: maxX, minX: minX, z: z });
    });

    // kat arası güçlü bağlar (kat modu)
    if (mode === 'floors' && view.arrows && ex > 0.3) {
      const where = new Map();
      plan.floors.forEach((f, i) => f.blocks.forEach((b) => { if (b.spaceId) where.set(b.spaceId, { b: b, i: i }); }));
      Object.keys(project.relations).forEach((key) => {
        if (project.relations[key] !== 'strong') return;
        const ids = key.split('|');
        const A1 = where.get(ids[0]), B1 = where.get(ids[1]);
        if (!A1 || !B1 || A1.i === B1.i) return;
        const lo = A1.i < B1.i ? A1 : B1, hi = lo === A1 ? B1 : A1;
        const p0 = I.proj(lo.b.x + lo.b.w / 2, lo.b.y + lo.b.h / 2, gz(lo.i) + (view.volume ? hW : 0.12));
        const p1 = I.proj(hi.b.x + hi.b.w / 2, hi.b.y + hi.b.h / 2, gz(hi.i) + (view.volume ? hW : 0.12));
        const mid = [(p0[0] + p1[0]) / 2 + 26, (p0[1] + p1[1]) / 2];
        iso.arrowScreen(p0, mid, p1, { stroke: C.accent, sw: 1.8, dash: [6, 5], opacity: 0.85, head: 9 }).forEach((p) => prims.push(p));
      });
    }

    // ---- kat modu: sağda kat göstergesi
    if (mode === 'floors') {
      const lx = 1074, lw = 290;
      const top = 62, hAll = tb.y - top - 30;
      const bh2 = hAll / n;
      for (let k = 0; k < n; k++) {
        const fi = n - 1 - k; // üstteki kat üstte
        const f = plan.floors[fi];
        const y0 = top + k * bh2;
        const dim = view.sel && view.sel !== f.id ? 0.35 : 1;
        const Pg = [];
        const bgc = C.numBg[fi % C.numBg.length], fgc = C.numFg[fi % C.numFg.length];
        Pg.push({ t: 'rect', x: lx, y: y0, w: lw, h: 34, rx: g ? 17 : 0, fill: bgc, stroke: g ? undefined : C.ink, sw: g ? 0 : 2.5 });
        Pg.push({ t: 'text', x: lx + (g ? 18 : 14), y: y0 + 24, s: String(fi), size: 20, weight: g ? 400 : 700, fam: 'd', fill: fgc });
        Pg.push({ t: 'text', x: lx + 46, y: y0 + 22, s: g ? f.name : f.name.toLocaleUpperCase('tr'), size: 12.5, weight: 700, fam: 'b', fill: fgc, ls: g ? 0 : 1 });
        Pg.push({ t: 'text', x: lx + lw - 14, y: y0 + 22, s: fmt(f.net) + ' m²', size: 12, weight: 600, fam: 'm', fill: fgc, anchor: 'end', opacity: 0.85 });
        const lines = Math.max(0, Math.floor((bh2 - 50) / 17));
        const list = f.spaces.slice().sort((a, b) => b.area - a.area);
        list.slice(0, lines).forEach((sp, j) => {
          const zz = App.ZONES[sp.zone] || App.ZONES.sosyal;
          const yy = y0 + 56 + j * 17;
          Pg.push({ t: 'circle', cx: lx + 8, cy: yy - 4, r: 4.8, fill: zz.fill, stroke: g ? 'rgba(23,24,27,.3)' : C.ink, sw: g ? 1 : 1.6 });
          const nm = sp.name.length > 24 ? sp.name.slice(0, 23) + '…' : sp.name;
          Pg.push({ t: 'text', x: lx + 22, y: yy, s: nm, size: 12, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
          Pg.push({ t: 'text', x: lx + lw - 2, y: yy, s: fmt(sp.area) + ' m²', size: 11.5, weight: 500, fam: 'm', fill: C.ink, opacity: 0.55, anchor: 'end' });
        });
        if (list.length > lines && lines > 0) Pg.push({ t: 'text', x: lx + 22, y: y0 + 56 + lines * 17, s: '+ ' + (list.length - lines) + ' mekân daha', size: 11.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.45 });
        dimOp(Pg, dim).forEach((p) => prims.push(p));
        // kılavuz çizgisi: levhadan göstergeye
        const mk = marks[fi];
        prims.push({ t: 'line', x1: mk.maxX + 8, y1: mk.cy, x2: lx - 10, y2: y0 + 17, stroke: C.ink, sw: 1, dash: [2, 4], opacity: 0.4 * dim });
        prims.push({ t: 'circle', cx: mk.maxX + 8, cy: mk.cy, r: 2.6, fill: C.ink, opacity: 0.55 * dim });
      }
    } else {
      // ---- katman modu: solda başlık + gösterge
      slabs.forEach((sl, i) => {
        const mk = marks[i];
        const x0 = 70, y0 = mk.cy - 34;
        prims.push({ t: 'text', x: x0, y: y0, s: g ? sl.layer.name : sl.layer.name.toLocaleUpperCase('tr'), size: g ? 17 : 18, weight: g ? 400 : 700, fam: 'd', fill: C.ink, ls: g ? 0 : 1 });
        prims.push({ t: 'line', x1: x0, y1: y0 + 8, x2: Math.max(x0 + 160, mk.minX - 12), y2: y0 + 8, stroke: C.ink, sw: g ? 1.2 : 2.5, opacity: g ? 0.5 : 1 });
        prims.push({ t: 'text', x: x0, y: y0 + 26, s: layerNote(sl.id, plan, sl.f, A, project), size: 12.5, weight: 700, fam: g ? 'b' : 'm', fill: C.ink, opacity: 0.7 });
        layerLegend(sl.id, C, A, plan, sl.f).forEach((it, j) => {
          const yy = y0 + 46 + j * 18;
          if (it.fill === 'none') prims.push({ t: 'rect', x: x0, y: yy - 11, w: 14, h: 14, rx: g ? 7 : 0, stroke: it.stroke, sw: 1.6, dash: [3, 2.4] });
          else prims.push({ t: 'rect', x: x0, y: yy - 11, w: 14, h: 14, rx: g ? 7 : 0, fill: it.fill, stroke: g ? 'rgba(23,24,27,.3)' : C.ink, sw: g ? 1 : 1.6 });
          prims.push({ t: 'text', x: x0 + 22, y: yy, s: it.label, size: 12.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
        });
        prims.push({ t: 'line', x1: Math.max(x0 + 160, mk.minX - 12), y1: y0 + 8, x2: mk.minX + 6, y2: mk.cy, stroke: C.ink, sw: 1, dash: [2, 4], opacity: 0.4 });
      });
    }
    return { prims: prims, hits: hits, A: A, scale: s, floor: floor, mode: mode, W: sheet.W, H: sheet.H };
  }

  /* JSON uzantısı: extensions.spaceAnalysis (yalnızca okunur; içe aktarmada yeniden hesaplanır) */
  const r3 = (v) => (v == null ? null : Math.round(v * 1000) / 1000);
  function toExt(project) {
    if (!project.study) return {};
    const d = App.study.derive(project);
    const A = analyze(project, d);
    return {
      spaceAnalysis: {
        version: 1,
        harmonyScore: A.score,
        parts: A.parts.map((p) => ({ name: p.k, value: r3(p.v), weight: p.w })),
        stats: { daylight: r3(A.stats.daylight), circulationShare: r3(A.stats.circShare), wetStackAlignment: r3(A.stats.wetAlign), noiseConflicts: A.stats.conflicts, fillRatio: r3(A.stats.fill) },
        perFloor: A.mix.map((m) => ({ floorId: m.id, name: m.name, totalArea: Math.round(m.total * 100) / 100, zones: m.zones.map((z) => ({ zone: z.zone, area: Math.round(z.area * 100) / 100, share: r3(z.share) })) })),
        noise: Array.from(A.noise.entries()).map((e) => ({ spaceId: e[0], class: e[1] })),
        findings: A.items.filter((i) => i.level !== 'ok').map((i) => ({ id: i.id, level: i.level, title: i.title })),
      },
    };
  }
  App.extProviders.push(toExt);

  App.analysis = { LAYERS: LAYERS, analyze: analyze, scene: scene, toExt: toExt, NOISE_LABEL: NOISE_LABEL };
})();

/* ==========================================================================
   35-lib-floorscene.js — kat etüdü paftası: kat planları yan yana (primitifler)
   Canlı SVG ve PNG/PDF çıktısı aynı listeden çizilir.
   ========================================================================== */
(function () {
  const App = window.App;
  const sheet = App.sheet;
  const fmt = App.util.fmt;

  const HEAD = 46, DIM = 28, LEFT = 36;

  /* kat planlarının pafta üzerindeki yerleşimi (arayüz de bunu kullanır) */
  function boardLayout(plan) {
    const n = plan.floors.length;
    const tb = sheet.tb;
    const area = { x: 64, y: 54, w: sheet.W - 128, h: tb.y - 54 - 22 };
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const gx = 52, gy = 26;
      const cellW = (area.w - (cols - 1) * gx) / cols;
      const cellH = (area.h - (rows - 1) * gy) / rows - HEAD - DIM;
      const s = Math.min((cellW - LEFT) / plan.Wp, cellH / plan.Dp);
      if (!best || s > best.s) best = { s: s, cols: cols, rows: rows, gx: gx, gy: gy };
    }
    best.s = Math.max(2, Math.min(best.s, 72));
    const pw = plan.Wp * best.s, ph = plan.Dp * best.s;
    const cw = pw + LEFT, rh = ph + HEAD + DIM;
    const gridW = best.cols * cw + (best.cols - 1) * best.gx;
    const gridH = best.rows * rh + (best.rows - 1) * best.gy;
    const x0 = area.x + (area.w - gridW) / 2, y0 = area.y + (area.h - gridH) / 2;
    best.cells = plan.floors.map((f, i) => {
      const col = i % best.cols, row = Math.floor(i / best.cols);
      const cx = x0 + col * (cw + best.gx), cy = y0 + row * (rh + best.gy);
      return { id: f.id, index: i, cx: cx, cy: cy, cw: cw, rh: rh, ox: cx + LEFT, oy: cy + HEAD, pw: pw, ph: ph };
    });
    return best;
  }

  const glass = () => App.theme.name === 'glass';

  function floorPrims(f, cell, L, plan) {
    const P = [];
    const PAL = App.PAL;
    const ink = PAL.ink;
    const s = L.s;
    const g = glass();
    // başlık
    P.push({ t: 'text', x: cell.ox, y: cell.cy + 24, s: g ? f.name : f.name.toLocaleUpperCase('tr'), size: g ? 16 : 17, weight: g ? 400 : 700, fam: 'd', fill: ink, ls: g ? 0 : 1 });
    P.push({ t: 'text', x: cell.ox + cell.pw, y: cell.cy + 24, s: fmt(f.net) + ' m² net', size: 13, weight: 600, fam: g ? 'b' : 'm', fill: ink, opacity: 0.6, anchor: 'end' });
    P.push({ t: 'text', x: cell.ox, y: cell.cy + 40, s: f.spaces.length + ' mekân' + (f.void > 0.5 ? ' · boş ' + fmt(f.void) + ' m²' : ''), size: 12, weight: 500, fam: g ? 'b' : 'm', fill: ink, opacity: 0.5 });
    // plak
    if (g) P.push({ t: 'rect', x: cell.ox - 3, y: cell.oy - 3, w: cell.pw + 6, h: cell.ph + 6, rx: 8, fill: '#EDEEF2', stroke: 'rgba(23,24,27,.16)', sw: 1 });
    else P.push({ t: 'rect', x: cell.ox - 3, y: cell.oy - 3, w: cell.pw + 6, h: cell.ph + 6, fill: PAL.paperDark, stroke: ink, sw: 4 });
    f.blocks.forEach((b) => {
      const x = cell.ox + b.x * s, y = cell.oy + b.y * s, w = b.w * s, h = b.h * s;
      const z = App.ZONES[b.zone] || App.ZONES.sosyal;
      if (b.kind === 'void') {
        P.push({ t: 'rect', x: x + 2, y: y + 2, w: Math.max(0, w - 4), h: Math.max(0, h - 4), stroke: ink, sw: 1.4, dash: [6, 6], opacity: 0.35 });
        if (w > 70 && h > 30) P.push({ t: 'text', x: x + w / 2, y: y + h / 2 + 4, s: 'Boş / teras', size: 12, weight: 600, fam: g ? 'b' : 'm', fill: ink, opacity: 0.45, anchor: 'middle' });
        return;
      }
      if (b.kind === 'core') {
        P.push({ t: 'rect', x: x, y: y, w: w, h: h, rx: g ? 5 : 0, fill: g ? '#2A2B30' : ink, stroke: g ? '#F6F7F9' : ink, sw: g ? 2 : 3 });
        const c = g ? '#F6F7F9' : PAL.paper;
        for (let k = 1; k < 4; k++) P.push({ t: 'line', x1: x + 4, y1: y + (h * k) / 4, x2: x + w - 4, y2: y + (h * k) / 4, stroke: c, sw: 1, opacity: 0.28 });
        if (w > 28) P.push({ t: 'text', x: x + w / 2, y: y + h / 2 + 4, s: 'Çekirdek', size: 11, weight: 700, fam: g ? 'b' : 'm', fill: c, anchor: 'middle', xf: [0, -1, 1, 0] });
        return;
      }
      if (b.kind === 'corridor') {
        P.push({ t: 'rect', x: x, y: y, w: w, h: h, fill: g ? 'rgba(23,24,27,.06)' : PAL.paper, stroke: g ? undefined : ink, sw: 2 });
        P.push({ t: 'line', x1: x + 6, y1: y + h / 2, x2: x + w - 6, y2: y + h / 2, stroke: ink, sw: 1.4, dash: [7, 6], opacity: 0.4 });
        if (w > 90) P.push({ t: 'text', x: x + w / 2, y: y + h / 2 - 4, s: 'Koridor', size: 11, weight: 600, fam: g ? 'b' : 'm', fill: ink, opacity: 0.5, anchor: 'middle' });
        return;
      }
      P.push({ t: 'rect', x: x, y: y, w: w, h: h, rx: g ? 4 : 0, fill: z.fill, stroke: g ? '#F6F7F9' : ink, sw: g ? 2.4 : 3 });
      const lab = sheet.fitLabel(b.name, w, h, { withArea: true, max: 16 });
      if (lab) {
        const lh = lab.fs * 1.16, afs = Math.max(8, lab.fs * 0.82);
        const bh = lab.lines.length * lh + afs;
        let ty = y + h / 2 - bh / 2 + lab.fs * 0.84;
        lab.lines.forEach((ln, i) => P.push({ t: 'text', x: x + w / 2, y: ty + i * lh, s: ln, size: lab.fs, weight: 700, fam: 'l', fill: z.text, anchor: 'middle', ls: lab.ls }));
        P.push({ t: 'text', x: x + w / 2, y: ty + lab.lines.length * lh + 1, s: fmt(b.area) + ' m²', size: afs, weight: 500, fam: 'm', fill: z.text, anchor: 'middle', opacity: 0.75 });
      } else if (w > 26 && h > 18) {
        P.push({ t: 'text', x: x + w / 2, y: y + h / 2 + 3.5, s: fmt(b.area, 0), size: 10, weight: 700, fam: 'b', fill: z.text, anchor: 'middle', opacity: 0.8 });
      }
    });
    // ölçü çizgileri
    const by = cell.oy + cell.ph + 14, lx = cell.ox - 16;
    const dl = { stroke: ink, sw: 1, opacity: 0.35 };
    P.push(Object.assign({ t: 'line', x1: cell.ox, y1: by, x2: cell.ox + cell.pw, y2: by }, dl));
    P.push(Object.assign({ t: 'line', x1: cell.ox, y1: by - 4, x2: cell.ox, y2: by + 4 }, dl));
    P.push(Object.assign({ t: 'line', x1: cell.ox + cell.pw, y1: by - 4, x2: cell.ox + cell.pw, y2: by + 4 }, dl));
    P.push({ t: 'text', x: cell.ox + cell.pw / 2, y: by + 14, s: sheet.dimText(plan.Wp), size: 12, weight: 600, fam: g ? 'b' : 'm', fill: ink, opacity: 0.55, anchor: 'middle' });
    P.push(Object.assign({ t: 'line', x1: lx, y1: cell.oy, x2: lx, y2: cell.oy + cell.ph }, dl));
    P.push(Object.assign({ t: 'line', x1: lx - 4, y1: cell.oy, x2: lx + 4, y2: cell.oy }, dl));
    P.push(Object.assign({ t: 'line', x1: lx - 4, y1: cell.oy + cell.ph, x2: lx + 4, y2: cell.oy + cell.ph }, dl));
    P.push({ t: 'text', x: lx - 6, y: cell.oy + cell.ph / 2, s: sheet.dimText(plan.Dp), size: 12, weight: 600, fam: g ? 'b' : 'm', fill: ink, opacity: 0.55, anchor: 'middle', xf: [0, -1, 1, 0] });
    return P;
  }

  const TYP = { serbest: 'Serbest yerleşim', koridor: 'Orta koridorlu' };

  function scene(project, d, live) {
    const plan = d.plan, m = d.metrics;
    const L = boardLayout(plan);
    const zones = [];
    project.spaces.forEach((s) => { if (zones.indexOf(s.zone) < 0) zones.push(s.zone); });
    const info = {
      name: project.meta.name,
      subtitle: 'Kat etüdü · ' + plan.floors.length + ' kat · ' + TYP[plan.typology],
      legend: sheet.zoneLegend(zones),
      stats: [['Kat', String(plan.floors.length)], ['Net toplam', fmt(m.totalNet) + ' m²'], ['Plak', fmt(plan.Wp, 1) + ' × ' + fmt(plan.Dp, 1) + ' m']],
      scoreLabel: 'Kat skoru', percent: m.score,
    };
    const prims = sheet.frame(info, live);
    plan.floors.forEach((f, i) => floorPrims(f, L.cells[i], L, plan).forEach((p) => prims.push(p)));
    return { prims: prims, L: L };
  }

  App.study.boardLayout = boardLayout;
  App.study.scene = scene;
  App.study.TYPOLOGY = TYP;
})();

/* ==========================================================================
   36-lib-gis.js — coğrafi geometri çekirdeği (Modül 4–6 ortak)
   Saf fonksiyonlar, arayüzden bağımsız. Yerel koordinat: x = doğu, y = kuzey (metre),
   başlangıç = çalışma noktası. Projeksiyon küçük alanlar için eşdikdörtgen (≤ 3 km'de hata < %0,1).
   İçerik: projeksiyon · çokgen işlemleri (alan, kırpma, içeri öteleme, sadeleştirme) ·
           yol grafı + en kısa yol (izokron) · güneş konumu ve gölge.
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = (App.gis = {});
  const D2R = Math.PI / 180;

  /* ---------------- projeksiyon ---------------- */
  gis.makeProj = function (lat0, lon0) {
    const mLat = 111132.92 - 559.82 * Math.cos(2 * lat0 * D2R) + 1.175 * Math.cos(4 * lat0 * D2R);
    const mLon = 111412.84 * Math.cos(lat0 * D2R) - 93.5 * Math.cos(3 * lat0 * D2R);
    return {
      lat0: lat0, lon0: lon0, mLat: mLat, mLon: mLon,
      fwd: (lat, lon) => [(lon - lon0) * mLon, (lat - lat0) * mLat],
      inv: (x, y) => [lat0 + y / mLat, lon0 + x / mLon],
    };
  };

  gis.haversine = function (lat1, lon1, lat2, lon2) {
    const dφ = (lat2 - lat1) * D2R, dλ = (lon2 - lon1) * D2R;
    const a = Math.sin(dφ / 2) ** 2 + Math.cos(lat1 * D2R) * Math.cos(lat2 * D2R) * Math.sin(dλ / 2) ** 2;
    return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(a)));
  };

  /* ---------------- temel vektör / çokgen ---------------- */
  gis.dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  // işaretli alan: saat yönünün tersi (CCW) pozitif
  gis.area = function (p) {
    let s = 0;
    for (let i = 0, n = p.length; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; }
    return s / 2;
  };
  gis.ccw = (p) => (gis.area(p) >= 0 ? p : p.slice().reverse());

  gis.centroid = function (p) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, n = p.length; i < n; i++) {
      const u = p[i], v = p[(i + 1) % n], c = u[0] * v[1] - v[0] * u[1];
      a += c; cx += (u[0] + v[0]) * c; cy += (u[1] + v[1]) * c;
    }
    if (Math.abs(a) < 1e-9) { // dejenere: ortalama
      let sx = 0, sy = 0;
      p.forEach((q) => { sx += q[0]; sy += q[1]; });
      return [sx / p.length, sy / p.length];
    }
    return [cx / (3 * a), cy / (3 * a)];
  };

  gis.bbox = function (p) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < p.length; i++) { const q = p[i]; if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    return { x0: x0, y0: y0, x1: x1, y1: y1, w: x1 - x0, h: y1 - y0 };
  };

  gis.pointInPoly = function (pt, p) {
    let inside = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const a = p[i], b = p[j];
      if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < ((b[0] - a[0]) * (pt[1] - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  };

  // nokta → doğru parçası: en yakın nokta { x, y, t, d }
  gis.nearestOnSeg = function (px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const x = ax + dx * t, y = ay + dy * t;
    return { x: x, y: y, t: t, d: Math.hypot(px - x, py - y) };
  };

  gis.distToPoly = function (pt, p, closed) {
    let best = Infinity;
    const n = p.length;
    for (let i = 0; i < (closed === false ? n - 1 : n); i++) {
      const a = p[i], b = p[(i + 1) % n];
      const q = gis.nearestOnSeg(pt[0], pt[1], a[0], a[1], b[0], b[1]);
      if (q.d < best) best = q.d;
    }
    return best;
  };

  // iki doğru (nokta + yön) kesişimi; paralelse null
  function lineX(p, d, q, e) {
    const cr = d[0] * e[1] - d[1] * e[0];
    if (Math.abs(cr) < 1e-9) return null;
    const t = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / cr;
    return [p[0] + d[0] * t, p[1] + d[1] * t];
  }

  gis.polyPath = function (p, close) {
    let s = '';
    for (let i = 0; i < p.length; i++) s += (i ? 'L' : 'M') + p[i][0].toFixed(1) + ' ' + p[i][1].toFixed(1);
    return s + (close === false ? '' : 'Z');
  };

  /* Douglas–Peucker (yinelemesiz) */
  gis.simplify = function (pts, tol) {
    const n = pts.length;
    if (n <= 2 || !(tol > 0)) return pts;
    const keep = new Uint8Array(n);
    keep[0] = keep[n - 1] = 1;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const se = stack.pop(), s = se[0], e = se[1];
      let md = 0, mi = -1;
      for (let i = s + 1; i < e; i++) {
        const d = gis.nearestOnSeg(pts[i][0], pts[i][1], pts[s][0], pts[s][1], pts[e][0], pts[e][1]).d;
        if (d > md) { md = d; mi = i; }
      }
      if (mi >= 0 && md > tol) { keep[mi] = 1; stack.push([s, mi], [mi, e]); }
    }
    const out = [];
    for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[i]);
    return out;
  };

  /* ---------------- daire kırpma (çalışma yarıçapı) ---------------- */
  gis.circlePoly = function (r, n) {
    n = n || 72;
    const p = [];
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; p.push([Math.cos(a) * r, Math.sin(a) * r]); }
    return p;
  };

  // Sutherland–Hodgman: kırpma çokgeni dışbükey ve CCW olmalı
  gis.clipPoly = function (subject, clip) {
    let out = subject;
    for (let i = 0; i < clip.length && out.length; i++) {
      const a = clip[i], b = clip[(i + 1) % clip.length];
      const inp = out;
      out = [];
      const side = (q) => (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]);
      for (let j = 0; j < inp.length; j++) {
        const cur = inp[j], prev = inp[(j + inp.length - 1) % inp.length];
        const sc = side(cur), sp = side(prev);
        if (sc >= 0) {
          if (sp < 0) { const x = lineX(prev, [cur[0] - prev[0], cur[1] - prev[1]], a, [b[0] - a[0], b[1] - a[1]]); if (x) out.push(x); }
          out.push(cur);
        } else if (sp >= 0) { const x = lineX(prev, [cur[0] - prev[0], cur[1] - prev[1]], a, [b[0] - a[0], b[1] - a[1]]); if (x) out.push(x); }
      }
    }
    return out;
  };

  // çoklu çizgiyi daireye kırp → parça listesi
  gis.clipLineToCircle = function (pts, r) {
    const out = [];
    let cur = null;
    const r2 = r * r;
    for (let i = 0; i < pts.length; i++) {
      const b = pts[i];
      const bin = b[0] * b[0] + b[1] * b[1] <= r2;
      if (i === 0) { if (bin) cur = [b]; continue; }
      const a = pts[i - 1];
      const ain = a[0] * a[0] + a[1] * a[1] <= r2;
      if (ain && bin) { cur.push(b); continue; }
      // kesişim(ler)
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const A = dx * dx + dy * dy, B = 2 * (a[0] * dx + a[1] * dy), C = a[0] * a[0] + a[1] * a[1] - r2;
      const disc = B * B - 4 * A * C;
      const ts = [];
      if (A > 1e-12 && disc >= 0) {
        const sq = Math.sqrt(disc);
        const t1 = (-B - sq) / (2 * A), t2 = (-B + sq) / (2 * A);
        if (t1 > 0 && t1 < 1) ts.push(t1);
        if (t2 > 0 && t2 < 1) ts.push(t2);
      }
      const at = (t) => [a[0] + dx * t, a[1] + dy * t];
      if (ain && !bin) { if (ts.length) { cur.push(at(ts[0])); } out.push(cur); cur = null; }
      else if (!ain && bin) { cur = ts.length ? [at(ts[ts.length - 1]), b] : [b]; }
      else if (ts.length === 2) { out.push([at(ts[0]), at(ts[1])]); }
    }
    if (cur && cur.length > 1) out.push(cur);
    return out.filter((s) => s.length > 1);
  };

  /* ---------------- içeri öteleme (çekme mesafeleri) ----------------
     p: açık halka (ilk nokta tekrarlanmaz) · dists: tek sayı ya da kenar başına dizi (kenar i: p[i] → p[i+1])
     Dönüş: yeni halka (CCW) ya da null (mesafe parseli tüketiyorsa) */
  gis.offsetPoly = function (p, dists) {
    const n = p.length;
    if (n < 3) return null;
    const P = gis.area(p) >= 0 ? p : p.slice().reverse();
    const rev = P !== p;
    // ters çevrildiğinde kenar eşlemesi: ters halkada j. kenar = özgün (n-2-j). kenar
    const dArr = [];
    for (let i = 0; i < n; i++) {
      if (!Array.isArray(dists)) dArr.push(dists);
      else dArr.push(rev ? dists[(n - 2 - i + n * 2) % n] : dists[i]);
    }
    const lines = [];
    for (let i = 0; i < n; i++) {
      const a = P[i], b = P[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      const nx = -dy / l, ny = dx / l; // sol normal = iç yön (CCW)
      lines.push({ p: [a[0] + nx * dArr[i], a[1] + ny * dArr[i]], d: [dx / l, dy / l], n: [nx, ny], dist: dArr[i], a: a });
    }
    const out = [];
    for (let i = 0; i < n; i++) {
      const L0 = lines[(i + n - 1) % n], L1 = lines[i];
      let v = lineX(L0.p, L0.d, L1.p, L1.d);
      const lim = 6 * Math.max(Math.abs(L0.dist), Math.abs(L1.dist), 1);
      if (!v || Math.hypot(v[0] - P[i][0], v[1] - P[i][1]) > lim) v = [P[i][0] + L1.n[0] * L1.dist, P[i][1] + L1.n[1] * L1.dist];
      out.push(v);
    }
    // geçerlilik: alan pozitif ve kenar yönleri korunmuş
    const a0 = gis.area(P), a1 = gis.area(out);
    if (!(a1 > 0.25) || a1 > a0 * (dArr.some((d) => d < 0) ? 1e9 : 1.0001)) return null;
    for (let i = 0; i < n; i++) {
      const o0 = out[i], o1 = out[(i + 1) % n];
      const dx = o1[0] - o0[0], dy = o1[1] - o0[1];
      if (dx * lines[i].d[0] + dy * lines[i].d[1] <= 0) return null;
    }
    return out;
  };

  /* ---------------- dışbükey zarf ---------------- */
  gis.hull = function (pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (p.length < 3) return p;
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [];
    p.forEach((q) => { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); });
    const up = [];
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    up.pop(); lo.pop();
    return lo.concat(up);
  };

  /* ---------------- yol grafı + en kısa yol ---------------- */
  /* roads: [{ pts: [[x,y]...], cls, nf }] → graf { nodes: [[x,y]], adj: [[to, len, edge]], edges: [{ a, b, len, cls }], grid } */
  gis.buildGraph = function (roads, canWalk) {
    const idx = new Map();
    const nodes = [], adj = [], edges = [];
    const node = (q) => {
      const k = Math.round(q[0] * 10) + '|' + Math.round(q[1] * 10);
      let i = idx.get(k);
      if (i === undefined) { i = nodes.length; idx.set(k, i); nodes.push([q[0], q[1]]); adj.push([]); }
      return i;
    };
    roads.forEach((r) => {
      if (canWalk && !canWalk(r)) return;
      for (let i = 1; i < r.pts.length; i++) {
        const a = node(r.pts[i - 1]), b = node(r.pts[i]);
        if (a === b) continue;
        const len = Math.hypot(nodes[a][0] - nodes[b][0], nodes[a][1] - nodes[b][1]);
        const e = edges.length;
        edges.push({ a: a, b: b, len: len, cls: r.cls });
        adj[a].push([b, len, e]);
        adj[b].push([a, len, e]);
      }
    });
    // ızgara dizini (60 m hücre): en yakın kenar sorguları için
    const cell = 60, grid = new Map();
    edges.forEach((e, ei) => {
      const A = nodes[e.a], B = nodes[e.b];
      const x0 = Math.floor(Math.min(A[0], B[0]) / cell), x1 = Math.floor(Math.max(A[0], B[0]) / cell);
      const y0 = Math.floor(Math.min(A[1], B[1]) / cell), y1 = Math.floor(Math.max(A[1], B[1]) / cell);
      for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
        const k = gx + ',' + gy;
        const l = grid.get(k);
        if (l) l.push(ei); else grid.set(k, [ei]);
      }
    });
    return { nodes: nodes, adj: adj, edges: edges, grid: grid, cell: cell };
  };

  // (x, y) noktasına en yakın kenar: { e, t, d, x, y } ya da null
  gis.snap = function (g, x, y, maxD) {
    const cell = g.cell;
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    let best = null;
    const rings = Math.ceil((maxD || 400) / cell);
    for (let r = 0; r <= rings; r++) {
      for (let ix = gx - r; ix <= gx + r; ix++) for (let iy = gy - r; iy <= gy + r; iy++) {
        if (Math.max(Math.abs(ix - gx), Math.abs(iy - gy)) !== r) continue;
        const l = g.grid.get(ix + ',' + iy);
        if (!l) continue;
        for (let k = 0; k < l.length; k++) {
          const e = g.edges[l[k]], A = g.nodes[e.a], B = g.nodes[e.b];
          const q = gis.nearestOnSeg(x, y, A[0], A[1], B[0], B[1]);
          if (!best || q.d < best.d) best = { e: l[k], t: q.t, d: q.d, x: q.x, y: q.y };
        }
      }
      if (best && best.d <= r * cell) break; // daha dış halka daha yakın olamaz
    }
    return best && best.d <= (maxD || 400) ? best : null;
  };

  /* Dijkstra: kaynak = kenar üzerindeki bir nokta (sanal başlangıç); dönüş: Float64Array mesafe (m, düğüm başına) */
  gis.shortest = function (g, src, maxLen) {
    const n = g.nodes.length;
    const dist = new Float64Array(n).fill(Infinity);
    const heap = []; // [mesafe, düğüm]
    const push = (d, v) => {
      heap.push([d, v]);
      let i = heap.length - 1;
      while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; const t = heap[p]; heap[p] = heap[i]; heap[i] = t; i = p; }
    };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          const t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m;
        }
      }
      return top;
    };
    dist.src = src; // aynı kenardaki hedefler için doğrudan yol (gis.reach)
    const e = g.edges[src.e];
    const da = src.d + src.t * e.len, db = src.d + (1 - src.t) * e.len;
    if (da <= maxLen) { dist[e.a] = da; push(da, e.a); }
    if (db <= maxLen && db < dist[e.b]) { dist[e.b] = db; push(db, e.b); }
    while (heap.length) {
      const top = pop(), d = top[0], v = top[1];
      if (d > dist[v]) continue;
      const nb = g.adj[v];
      for (let i = 0; i < nb.length; i++) {
        const nd = d + nb[i][1];
        if (nd <= maxLen && nd < dist[nb[i][0]]) { dist[nb[i][0]] = nd; push(nd, nb[i][0]); }
      }
    }
    return dist;
  };

  // bir (x, y) noktasının, mesafe dizisine göre yürüme mesafesi (m); ulaşılamazsa Infinity
  gis.reach = function (g, dist, x, y, maxSnap) {
    const s = gis.snap(g, x, y, maxSnap || 150);
    if (!s) return Infinity;
    const e = g.edges[s.e];
    let w = Math.min(dist[e.a] + s.t * e.len, dist[e.b] + (1 - s.t) * e.len) + s.d;
    if (dist.src && dist.src.e === s.e) w = Math.min(w, Math.abs(s.t - dist.src.t) * e.len + dist.src.d + s.d);
    return w;
  };

  /* izokron bandı: D (m) içinde kalan kenar parçaları → [[x1,y1,x2,y2]] */
  gis.bandSegments = function (g, dist, D) {
    const out = [];
    for (let i = 0; i < g.edges.length; i++) {
      const e = g.edges[i], da = dist[e.a], db = dist[e.b];
      const A = g.nodes[e.a], B = g.nodes[e.b];
      const ra = da <= D, rb = db <= D;
      if (ra && rb) out.push([A[0], A[1], B[0], B[1]]);
      else if (ra) { const t = Math.min(1, (D - da) / e.len); if (t > 0) out.push([A[0], A[1], A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
      else if (rb) { const t = Math.min(1, (D - db) / e.len); if (t > 0) out.push([B[0], B[1], B[0] + (A[0] - B[0]) * t, B[1] + (A[1] - B[1]) * t]); }
    }
    return out;
  };

  /* segmentlerin etrafında w (m) yarıçaplı tampon kapsama alanı (m²) — ızgara örnekleme */
  gis.bufferArea = function (segs, w, R) {
    if (!segs.length) return 0;
    const cs = Math.max(8, w * 0.5);
    const grid = new Map();
    const key = (ix, iy) => ix + ',' + iy;
    segs.forEach((s, i) => {
      const x0 = Math.floor((Math.min(s[0], s[2]) - w) / cs), x1 = Math.floor((Math.max(s[0], s[2]) + w) / cs);
      const y0 = Math.floor((Math.min(s[1], s[3]) - w) / cs), y1 = Math.floor((Math.max(s[1], s[3]) + w) / cs);
      for (let ix = x0; ix <= x1; ix++) for (let iy = y0; iy <= y1; iy++) { const k = key(ix, iy); const l = grid.get(k); if (l) l.push(i); else grid.set(k, [i]); }
    });
    let cnt = 0;
    grid.forEach((list, k) => {
      const q = k.split(',');
      const cx = (Number(q[0]) + 0.5) * cs, cy = (Number(q[1]) + 0.5) * cs;
      if (cx * cx + cy * cy > R * R) return;
      for (let i = 0; i < list.length; i++) {
        const s = segs[list[i]];
        if (gis.nearestOnSeg(cx, cy, s[0], s[1], s[2], s[3]).d <= w) { cnt++; return; }
      }
    });
    return cnt * cs * cs;
  };

  /* ---------------- güneş ----------------
     Güneş saati (12 = güneş öğlesi) ve yılın günü ile; saat dilimi / yaz saati gerekmez. */
  gis.sunPos = function (latDeg, doy, solarHour) {
    const φ = latDeg * D2R;
    const δ = 23.45 * D2R * Math.sin(((360 / 365) * (284 + doy)) * D2R);
    const H = 15 * (solarHour - 12) * D2R;
    const sa = Math.sin(φ) * Math.sin(δ) + Math.cos(φ) * Math.cos(δ) * Math.cos(H);
    const alt = Math.asin(Math.max(-1, Math.min(1, sa)));
    let ca = (Math.sin(δ) - Math.sin(alt) * Math.sin(φ)) / (Math.cos(alt) * Math.cos(φ) || 1e-9);
    ca = Math.max(-1, Math.min(1, ca));
    let az = Math.acos(ca);
    if (H > 0) az = 2 * Math.PI - az;
    return { alt: alt / D2R, az: az / D2R };
  };
  gis.dayLength = function (latDeg, doy) {
    const φ = latDeg * D2R;
    const δ = 23.45 * D2R * Math.sin(((360 / 365) * (284 + doy)) * D2R);
    const x = -Math.tan(φ) * Math.tan(δ);
    if (x >= 1) return 0;
    if (x <= -1) return 24;
    return (2 * Math.acos(x)) / D2R / 15;
  };
  // temsilci günler: 21 Mart, 21 Haziran, 22 Eylül, 21 Aralık
  gis.SUN_DAYS = [
    { id: 'kis', label: '21 Aralık', doy: 355 },
    { id: 'ekinoks', label: '21 Mart / 22 Eylül', doy: 80 },
    { id: 'yaz', label: '21 Haziran', doy: 172 },
  ];

  /* bina gölgeleri: her bina için taban + her kenarın süpürdüğü dörtgen → tek path altında birleşir.
     buildings: [{ pts, hgt }] · dönüş: [[x,y]...] çokgen listesi */
  gis.shadows = function (buildings, alt, az) {
    if (alt <= 1.5) return [];
    const t = Math.tan(alt * D2R);
    const ux = -Math.sin(az * D2R), uy = -Math.cos(az * D2R);
    const polys = [];
    buildings.forEach((b) => {
      const L = Math.min(b.hgt / t, 160);
      const dx = ux * L, dy = uy * L;
      const p = b.pts;
      polys.push(p);
      for (let i = 0, n = p.length; i < n; i++) {
        const a = p[i], c = p[(i + 1) % n];
        polys.push([a, c, [c[0] + dx, c[1] + dy], [a[0] + dx, a[1] + dy]]);
      }
    });
    return polys;
  };

  /* ---------------- küçük yardımcılar ---------------- */
  gis.walkMin = (m) => m / 80; // 4,8 km/sa ≈ 80 m/dk
  gis.compass = function (deg) {
    const n = ['K', 'KKD', 'KD', 'DKD', 'D', 'DGD', 'GD', 'GGD', 'G', 'GGB', 'GB', 'BGB', 'B', 'BKB', 'KB', 'KKB'];
    return n[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
  };
  // sembolik ölçek çubuğu uzunluğu (m): 1-2-5 dizisi
  gis.niceLen = function (m) {
    const e = Math.pow(10, Math.floor(Math.log10(m)));
    const f = m / e;
    return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * e;
  };
})();
