(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const geo = App.geo;

  let drag = null;

  function toWorld(e) {
    const svg = ui.svgEl;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function bubbleDown(e, s, r) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    const w = toWorld(e);
    drag = { id: s.id, dx: s.x - w.x, dy: s.y - w.y, sx: e.clientX, sy: e.clientY, moved: false, r: r };
    try { ui.svgEl.setPointerCapture(e.pointerId); } catch (err) {}
    App.ctl.dispatch({ type: 'SELECT', id: s.id });
  }
  function svgMove(e) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
      App.ctl.dispatch({ type: 'DRAG_START' });
      ui.dragging = true;
    }
    const w = toWorld(e);
    const c = geo.clampPos(w.x + drag.dx, w.y + drag.dy, drag.r);
    App.ctl.dispatch({ type: 'MOVE', id: drag.id, x: c.x, y: c.y });
  }
  function svgUp(e) {
    if (!drag) return;
    try { ui.svgEl.releasePointerCapture(e.pointerId); } catch (err) {}
    drag = null;
    ui.dragging = false;
  }

  ui.board = function (state, d) {
    const ctl = App.ctl;
    const P = state.project;
    const k = d.k;
    const by = new Map(P.spaces.map((s) => [s.id, s]));
    const farStrong = new Set(d.score.pairs.filter((p) => p.type === 'strong' && !p.ok).map((p) => p.key));
    const badAvoid = new Set(d.score.pairs.filter((p) => p.type === 'avoid' && !p.ok).map((p) => p.key));
    const info = App.board.infoOf(P, d.score);

    const stat = App.board.staticPrims(info, { live: true }).map((p) => App.board.primToV(p));

    const lines = [];
    Object.keys(P.relations).forEach((key) => {
      const ids = key.split('|');
      const a = by.get(ids[0]), b = by.get(ids[1]);
      if (!a || !b) return;
      const type = P.relations[key];
      const prims = App.board.relLinePrims(a, b, type, geo.radius(a.area, k), geo.radius(b.area, k));
      const cls = type === 'strong' && farStrong.has(key) ? 'far-strong' : type === 'avoid' && badAvoid.has(key) ? 'far-avoid' : '';
      const label = a.name + ' ↔ ' + b.name + ': ' + App.REL[type].label + ' (tıkla: değiştir)';
      lines.push(h('g', { key: 'r' + key, class: 'rel ' + cls },
        prims.map((p, i) => App.board.primToV(p, i === 0 && cls ? { class: cls } : null)),
        h('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'rel-hit', stroke: 'transparent', 'stroke-width': 26, onclick: (e) => { e.stopPropagation(); ctl.dispatch({ type: 'CYCLE_RELATION', a: a.id, b: b.id }); } }, h('title', {}, label))));
    });

    const hl = state.ui.highlight;
    const rings = [];
    if (hl) [hl.a, hl.b].forEach((id) => {
      const s = by.get(id);
      if (s) rings.push(h('circle', { key: 'hl' + id, class: 'locate-ring', cx: s.x, cy: s.y, r: geo.radius(s.area, k) + 14, fill: 'none', stroke: App.PAL.red, 'stroke-width': 5, 'stroke-dasharray': '10 8' }));
    });

    const bubbles = P.spaces.map((s) => {
      const r = geo.radius(s.area, k);
      const sel = state.selectedId === s.id;
      return h('g', { key: 'b' + s.id, class: 'bubble' + (sel ? ' selected' : ''), role: 'button', tabindex: 0, 'aria-label': s.name + ', ' + App.util.fmt(s.area) + ' metrekare', onpointerdown: (e) => bubbleDown(e, s, r), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ctl.dispatch({ type: 'SELECT', id: s.id }); } } },
        sel ? h('circle', { class: 'sel-ring', cx: s.x, cy: s.y, r: r + 10, fill: 'none', stroke: App.PAL.ink, 'stroke-width': 3, 'stroke-dasharray': '7 6' }) : null,
        App.board.bubblePrims(s, r).map((p) => App.board.primToV(p)),
        h('title', {}, s.name + ' — ' + App.util.fmt(s.area) + ' m²'));
    });

    const svg = h('svg', {
      id: 'pafta', class: 'board-svg', viewBox: '0 0 ' + geo.W + ' ' + geo.H, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': 'Bubble diagram paftası',
      ref: (el) => { ui.svgEl = el; }, onpointermove: svgMove, onpointerup: svgUp, onpointercancel: svgUp,
      onpointerdown: () => { if (state.selectedId) ctl.dispatch({ type: 'SELECT', id: null }); },
    }, stat, h('g', { class: 'lines' }, lines), h('g', { class: 'bubbles' }, bubbles), h('g', { class: 'rings' }, rings));

    const needHelp = P.spaces.length >= 3 && d.score.percent != null && d.score.percent < 60;
    const empty = !P.spaces.length;
    const hint = state.ui.hintDismissed ? null : 'Daireleri sürükleyin · Çizgiye tıklayarak ilişkiyi değiştirin · Daireye tıklayıp soldan ilişkilerini düzenleyin';

    const attn = needHelp || P.meta.example;
    const stage = h('div', { class: 'board-stage' },
      svg,
      empty ? h('div', { class: 'empty-card' },
        h('h2', { class: 'empty-title' }, 'Pafta boş'),
        h('p', {}, 'Soldaki formdan mekân adı ve m² girin, ya da hazır bir bina programıyla başlayın.'),
        h('div', { class: 'empty-actions' },
          ui.btn('Örnek konutu yükle', { icon: 'newdoc', cls: 'btn-primary', onclick: () => ctl.loadTemplate('konut', '2+1') }),
          ui.btn('İlk mekânı ekle', { icon: 'plus', onclick: ctl.focusForm }))) : null);
    const hintEl = hint ? h('p', { class: 'board-hint' }, hint, h('button', { type: 'button', class: 'hint-x', 'aria-label': 'İpucunu kapat', onclick: () => ctl.dispatch({ type: 'UI', patch: { hintDismissed: true } }) }, ui.icon('close', 14))) : null;

    if (App.theme.name === 'glass') {
      return h('section', { class: 'board-wrap', 'aria-label': 'Pafta' },
        h('div', { class: 'gstrip' }, ui.glass.dial(state, d), ui.glass.dock(state, d, attn)),
        stage,
        h('div', { class: 'board-foot' }, hintEl, h('span', { class: 'board-scale', title: 'Daire alanı m² ile orantılıdır. Çok küçük mekânlar okunabilirlik için en az 24 birim yarıçapla çizilir.' }, 'daire alanı ∝ m²')));
    }

    return h('section', { class: 'board-wrap', 'aria-label': 'Pafta' },
      h('div', { class: 'board-bar' },
        ui.btn('Otomatik yerleştir', { icon: 'layout', onclick: ctl.autoLayout, cls: 'btn-yellow' + (attn ? ' attn' : ''), title: 'İlişkilere göre daireleri otomatik yerleştir', disabled: !P.spaces.length }),
        ui.btn('Geri al', { icon: 'undo', onclick: () => ctl.dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)', labelCls: 'lbl-hide' }),
        ui.btn('İleri al', { icon: 'redo', onclick: () => ctl.dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)', labelCls: 'lbl-hide' }),
        h('span', { class: 'board-scale', title: 'Daire alanı m² ile orantılıdır. Çok küçük mekânlar okunabilirlik için en az 24 birim yarıçapla çizilir.' }, 'Daire alanı ∝ m²')),

/* ==========================================================================
   48-ui-intro.js — açılış: marka simgesi çizilir, "archtools" harf harf belirir, sonra yumuşakça çözülür.
   Oturum başına bir kez gösterilir (?intro=1 ile zorlanır, ?intro=0 ile kapatılır).
   Herhangi bir tuş / tıklama / "Geç" ile atlanabilir. Hareket azaltma tercihinde kısa ve sakin.
   ========================================================================== */
(function () {
  const App = window.App;
  const KEY = 'archtools.intro.seen';

  function wantIntro() {
    try {
      const q = new URLSearchParams(location.search).get('intro');
      if (q === '0') return false;
      if (q === '1') return true;
      if (window.sessionStorage.getItem(KEY)) return false;
    } catch (e) {}
    return true;
  }

  App.intro = {
    active: false,
    // done: intro bitince çağrılır
    start: function (done) {
      const el = document.getElementById('intro');
      const root = document.getElementById('root');
      const finish = function () { if (typeof done === 'function') done(); };
      if (!el || !wantIntro()) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
        document.documentElement.removeAttribute('data-intro');
        finish();
        return;
      }
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const total = reduce ? 1500 : 4000;
      let closed = false, t1 = null, t2 = null;
      App.intro.active = true;
      el.classList.add('run');
      el.style.setProperty('--dur', total + 'ms');
      if (root) { root.setAttribute('inert', ''); root.setAttribute('aria-hidden', 'true'); }
      const skip = document.getElementById('intro-skip');
      if (skip) { try { skip.focus({ preventScroll: true }); } catch (e) {} }

      function close() {
        if (closed) return;
        closed = true;
        clearTimeout(t1);
        try { window.sessionStorage.setItem(KEY, '1'); } catch (e) {}
        document.removeEventListener('keydown', onKey, true);
        el.removeEventListener('pointerdown', close);
        el.classList.add('out');
        if (root) { root.removeAttribute('inert'); root.removeAttribute('aria-hidden'); }
        App.intro.active = false;
        t2 = setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
          finish();
        }, reduce ? 200 : 950);
      }
      function onKey(e) {
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ' || e.key === 'Tab') { e.preventDefault(); close(); }
      }
      document.addEventListener('keydown', onKey, true);
      el.addEventListener('pointerdown', close);
      t1 = setTimeout(close, total);
      App.intro.skip = close;
    },
  };
})();

/* ==========================================================================
   50-controller.js — yan etkiler: dışa aktarma, dosya yükleme, animasyon, asistan eylemleri
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const geo = App.geo;
  const ctl = (App.ctl = {});

  ctl.dispatch = (a) => App.store.dispatch(a);
  const get = () => App.store.get();
  const derived = () => App.state.derive(get());

  let toastTimer = null;
  ctl.toast = function (msg, kind) {
    ctl.dispatch({ type: 'TOAST', msg: msg, kind: kind });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ctl.dispatch({ type: 'CLEAR_TOAST' }), 3600);
  };

  ctl.toggleAssistant = () => ctl.dispatch({ type: 'UI', patch: { assistantOpen: !get().ui.assistantOpen } });
  ctl.openAnalysis = () => ctl.dispatch({ type: 'UI', patch: { assistantOpen: true, asTab: 'analysis' } });

  ctl.focusForm = function () {
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    setTimeout(() => { const el = document.getElementById('sp-name'); if (el) { el.scrollIntoView({ block: 'nearest' }); el.focus(); } }, 30);
  };

  /* ---------- tema: "Beni renklendir!" ↔ "Sadeleştir" ---------- */
  const STYLE_KEY = 'archtools.style';
  ctl.applyStyle = function (name) {
    App.theme.set(name);
    document.documentElement.setAttribute('data-style', name);
    try { window.localStorage.setItem(STYLE_KEY, name); } catch (e) {}
    ctl.dispatch({ type: 'UI', patch: { style: name } });
    if (App.paintNow) App.paintNow();
  };
  let switching = false;
  ctl.toggleStyle = function (e) {
    if (switching) return;
    const next = App.theme.name === 'glass' ? 'bauhaus' : 'glass';
    const root = document.documentElement;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const btn = e && e.currentTarget;
    if (!document.startViewTransition || reduce) { ctl.applyStyle(next); return; }
    // açılan daire: düğmenin olduğu yerden tüm sayfaya yayılır
    const r = btn && btn.getBoundingClientRect ? btn.getBoundingClientRect() : { left: innerWidth / 2, top: 0, width: 0, height: 0 };
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    root.style.setProperty('--vt-x', x + 'px');
    root.style.setProperty('--vt-y', y + 'px');
    root.style.setProperty('--vt-r', Math.ceil(rad) + 'px');
    root.classList.add('vt-reveal');
    switching = true;
    let vt;
    try { vt = document.startViewTransition(function () { ctl.applyStyle(next); }); } catch (err) { switching = false; root.classList.remove('vt-reveal'); ctl.applyStyle(next); return; }
    const done = function () {
      switching = false;
      root.classList.remove('vt-reveal');
      // renklenirken daireler sırayla "açılır"
      root.classList.add('bloom');
      setTimeout(function () { root.classList.remove('bloom'); }, 1400);
    };
    vt.finished.then(done, done);
  };

  /* ---------- mekân ekleme formu ---------- */
  ctl.onNameInput = function (value) {
    const f = get().ui.form;
    const patch = { name: value, error: '' };
    // bilgi tabanındaki bir ada denk gelirse tipik alanı öner
    if (!f.area || f.autoFilled) {
      const v = App.kb.variant(get().project.meta.buildingType, get().project.meta.variant);
      const hit = v.entries.find((e) => U.norm(e.name) === U.norm(value));
      if (hit) { patch.area = String(App.analyze.defaultArea(hit)); patch.autoFilled = true; }
      else if (f.autoFilled) { patch.area = ''; patch.autoFilled = false; }
    }
    ctl.dispatch({ type: 'FORM', patch: patch });
  };

  ctl.addFromForm = function () {
    const f = get().ui.form;
    const name = (f.name || '').trim();
    const area = parseFloat(String(f.area).replace(',', '.'));
    if (!name) { ctl.dispatch({ type: 'FORM', patch: { error: 'Mekân adını yazın.' } }); document.getElementById('sp-name').focus(); return; }
    if (!(area > 0)) { ctl.dispatch({ type: 'FORM', patch: { error: 'Alan 0’dan büyük bir sayı olmalı (m²).' } }); document.getElementById('sp-area').focus(); return; }
    if (area > 100000) { ctl.dispatch({ type: 'FORM', patch: { error: 'Alan en fazla 100.000 m² olabilir.' } }); return; }
    ctl.dispatch({ type: 'ADD_SPACES', list: [{ name: name, area: area }] });
    ctl.dispatch({ type: 'FORM', patch: { name: '', area: '', error: '', autoFilled: false } });
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    ctl.toast('“' + name + '” eklendi (' + U.fmt(area) + ' m²)', 'success');
    setTimeout(() => { const el = document.getElementById('sp-name'); if (el) el.focus(); }, 30);
  };

  ctl.newProject = function () {
    ctl.dispatch({ type: 'LOAD_PROJECT', project: App.state.emptyProject() });
    ctl.toast('Yeni proje açıldı. Önceki proje için Geri al’ı kullanabilirsiniz.');
  };

  ctl.loadTemplate = function (typeKey, variantKey) {
    const p = App.state.createFromTemplate(typeKey, variantKey, {});
    ctl.dispatch({ type: 'LOAD_PROJECT', project: p });
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    ctl.toast(p.meta.name + ' programı yüklendi · ' + p.spaces.length + ' mekân', 'success');
  };

  /* ---------- otomatik yerleştirme (animasyonlu) ---------- */
  let animating = false;
  ctl.autoLayout = function () {
    const st = get();
    if (!st.project.spaces.length || animating) return;
    const k = derived().k;
    const target = App.layout.auto(st.project.spaces, st.project.relations, k, {});
    const from = {};
    st.project.spaces.forEach((s) => (from[s.id] = { x: s.x, y: s.y }));
    ctl.dispatch({ type: 'SNAPSHOT' });
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dur = reduce ? 1 : 650;
    const t0 = performance.now();
    animating = true;
    (function step(now) {
      const t = U.clamp((now - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      const pos = {};
      Object.keys(target).forEach((id) => { if (from[id]) pos[id] = { x: from[id].x + (target[id].x - from[id].x) * e, y: from[id].y + (target[id].y - from[id].y) * e }; });
      ctl.dispatch({ type: 'SET_POSITIONS', positions: pos });
      if (t < 1) requestAnimationFrame(step);
      else {
        animating = false;
        const pc = derived().score.percent;
        ctl.toast(pc == null ? 'Daireler yerleştirildi. İlişki ekleyerek skoru başlatın.' : 'Otomatik yerleştirme tamamlandı · verimlilik %' + pc, 'success');
      }
    })(t0);
  };

  /* ---------- dışa aktarma / kaydet / yükle ---------- */
  function report(res, okMsg) {
    ctl.dispatch({ type: 'UI', patch: { busy: null } });
    if (res && res.ok) ctl.toast(okMsg, 'success');
    else if (res && res.code === 'declined') ctl.toast('İndirme iptal edildi.');
    else ctl.toast('Dosya indirilemedi' + (res && res.message ? ': ' + res.message : '.'), 'error');
  }
  ctl.report = report;
  // label: 'PNG' | 'PDF' · make(project, derived) → Promise<{ok}>
  ctl.runExport = function (label, make) {
    const st = get();
    if (!st.project.spaces.length) { ctl.toast('Önce İşlev Şeması’na en az bir mekân ekleyin.', 'error'); return; }
    ctl.dispatch({ type: 'UI', patch: { busy: label } });
    make(st.project, derived()).then((r) => report(r, label + ' hazır')).catch((e) => report({ ok: false, message: e && e.message }));
  };
  // modül başına dışa aktarıcı: ctl.exporters[modülKimliği](kind: 'png' | 'pdf')
  ctl.exporters = {
    islev: (kind) => ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (p, d) => (kind === 'png' ? App.files.exportPNG(p, d.k, d.score) : App.files.exportPDF(p, d.k, d.score))),
  };
  const exporter = (kind) => (ctl.exporters[get().ui.module] || ctl.exporters.islev)(kind);
  ctl.exportPNG = () => exporter('png');
  ctl.exportPDF = () => exporter('pdf');
  const JSON_SUFFIX = { islev: undefined, kat: 'kat-etudu', analiz: 'mekan-analizi', arsa: 'arsa-analizi', imar: 'imar-kapasite', yer: 'yer-secimi' };
  ctl.saveJSON = function () {
    const st = get();
    const d = derived();
    App.files.exportJSON(st.project, d.k, d.score, d.analysis.circ, JSON_SUFFIX[st.ui.module]).then((r) => report(r, 'Proje kaydedildi (JSON)'));
  };
  ctl.pickFile = function () { const el = document.getElementById('file-load'); if (el) el.click(); };
  ctl.onFile = function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = function () {
      try {
        const project = App.files.fromJSON(String(rd.result));
        ctl.dispatch({ type: 'LOAD_PROJECT', project: project });
        ctl.toast('“' + project.meta.name + '” yüklendi · ' + project.spaces.length + ' mekân', 'success');
      } catch (err) { ctl.toast(err.message, 'error'); }
    };
    rd.onerror = function () { ctl.toast('Dosya okunamadı.', 'error'); };
    rd.readAsText(file);
    e.target.value = '';
  };

  /* ---------- asistan ---------- */
  ctl.ask = function (q) {
    const st = get();
    ctl.dispatch({ type: 'UI', patch: { assistantOpen: true, asTab: 'ask' } });
    ctl.dispatch({ type: 'CHAT_ADD', msg: { role: 'user', text: q } });
    ctl.scrollChat();
    const d = derived();
    let res;
    try { res = App.assistant.answer(q, { project: st.project, k: d.k, score: d.score, analysis: d.analysis }); }
    catch (err) { res = { blocks: [{ t: 'p', text: 'Bu soruyu yanıtlarken bir sorun oluştu. Soruyu biraz farklı yazmayı deneyin.' }], src: [] }; }
    setTimeout(() => { ctl.dispatch({ type: 'CHAT_ADD', msg: { role: 'bot', blocks: res.blocks, src: res.src } }); ctl.scrollChat(); }, 120);
  };

  ctl.scrollChat = function () {
    setTimeout(() => { const el = document.querySelector('.msgs'); if (el) el.scrollTop = el.scrollHeight; }, 40);
  };

  let hlTimer = null;
  ctl.runAction = function (a) {
    if (a.type === 'addSpaces') {
      ctl.dispatch({ type: 'ADD_SPACES', list: a.list });
      ctl.toast(a.list.length === 1 ? '“' + a.list[0].name + '” eklendi' : a.list.length + ' mekân eklendi', 'success');
    } else if (a.type === 'setArea') {
      ctl.dispatch({ type: 'UPDATE_SPACE', id: a.id, patch: { area: a.area } });
      ctl.toast('Alan ' + U.fmt(a.area) + ' m² olarak güncellendi', 'success');
    } else if (a.type === 'select') {
      ctl.dispatch({ type: 'SELECT', id: a.id });
      ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
      setTimeout(() => { const el = document.getElementById('row-' + a.id); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 40);
    } else if (a.type === 'locate') {
      ctl.dispatch({ type: 'SELECT', id: a.a });
      ctl.dispatch({ type: 'HIGHLIGHT', pair: { a: a.a, b: a.b } });
      clearTimeout(hlTimer);
      hlTimer = setTimeout(() => ctl.dispatch({ type: 'HIGHLIGHT', pair: null }), 3800);
    } else if (a.type === 'autolayout') ctl.autoLayout();
    else if (a.type === 'openMatrix') ctl.dispatch({ type: 'UI', patch: { tab: 'matrix' } });
    else if (a.type === 'focusForm') ctl.focusForm();
    else if (a.type === 'loadTemplate') ctl.loadTemplate(a.typeKey, a.variantKey);
  };

  /* ---------- klavye ---------- */
  ctl.onKey = function (e) {
    const tag = (e.target && e.target.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); ctl.dispatch({ type: e.shiftKey ? 'REDO' : 'UNDO' }); }
    else if (mod && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); ctl.dispatch({ type: 'REDO' }); }
    else if (!typing && get().ui.module === 'islev' && (e.key === 'Delete' || e.key === 'Backspace') && get().selectedId) { e.preventDefault(); ctl.dispatch({ type: 'REMOVE_SPACE', id: get().selectedId }); }
    else if (e.key === 'Escape') { if (typing && tag === 'INPUT') e.target.blur(); else if (get().selectedId) ctl.dispatch({ type: 'SELECT', id: null }); }
  };
})();

/* ==========================================================================
   51-ui-welcome.js — ilk açılış soruları: "Çalışmanızı en iyi tanımlayan nedir?" ve "İlk olarak ne yapmak istersiniz?"
   Yanıtlar yalnızca bu tarayıcıda (archtools.profile) saklanır; rol varsayılan programı, hedef de açılacak modülü seçer.
   Intro bitince bir kez gösterilir; üst çubuktaki "?" ile yeniden açılır. ?welcome=0 kapatır, ?welcome=1 zorlar.
   ========================================================================== */
(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const KEY = 'archtools.profile';

  const ROLES = [
    { id: 'planlama', label: 'Şehir Planlama ve Tasarım', sub: 'Mahalle, kent ve çevre ölçeğinde çalışırım.', tpl: 'karma', icon: 'layers' },

    { id: 'kamu', label: 'Hükümet ve Kamu Sektörü', sub: 'Belediye, kurum ya da kamu yatırımları için çalışırım.', tpl: 'kamu', icon: 'pin' },
    { id: 'egitim', label: 'Öğrenci veya Eğitimci', sub: 'Okuyor, öğretiyor ya da araştırma yapıyorum.', tpl: 'serbest', icon: 'draw' },
    { id: 'mimar', label: 'Mimarlık ve Yapı Tasarımı', sub: 'Bina programı, plan ve kütle üzerinde çalışırım.', tpl: 'konut', icon: 'newdoc' },
  ];
  const GOALS = [
    { id: 'analiz', label: 'Bir siteyi analiz edin', sub: 'Konumu seçin; yürüme erişimi, ulaşım, yeşil alan ve gürültüyü görün.', icon: 'search' },
    { id: 'yer', label: 'Konumları bulun veya karşılaştırın', sub: 'Adayları aynı ölçütlerle sıralayın ya da çevrede en uygun noktayı tarayın.', icon: 'compare' },
    { id: 'sunum', label: 'Sunum için haritalar hazırlayın', sub: 'Katman katman izometrik pafta; PNG, PDF ve SVG olarak alın.', icon: 'image' },
    { id: 'cad', label: 'Verileri CAD veya GIS’e aktarın', sub: 'DXF, GeoJSON ve CSV: gerçek koordinatlı, metre birimli katmanlar.', icon: 'download' },
    { id: 'imar', label: 'Parselin imar kapasitesini hesaplayın', sub: 'TAKS, KAKS, çekmeler ve yençok ile kütleyi ve birim sayısını görün.', icon: 'parcel' },
    { id: 'bina', label: 'Bina programı kurgulayın', sub: 'İşlev şeması, kat etüdü ve mekân analizi ile bina içini tasarlayın.', icon: 'layout' },
    { id: 'kesif', label: 'Sadece keşfediyorum', sub: 'Örnek verilerle gezin; istediğiniz modülü üst çubuktan açın.', icon: 'spark' },
  ];

  const read = function () { try { const o = JSON.parse(window.localStorage.getItem(KEY) || 'null'); return o && typeof o === 'object' ? o : null; } catch (e) { return null; } };
  const write = function (o) { try { window.localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
  const get = () => App.store.get();
  const ctl = () => App.ctl;

  let opener = null;

  const W = (App.welcome = {
    ROLES: ROLES, GOALS: GOALS, profile: read,
    wanted: function () {
      try {
        const q = new URLSearchParams(location.search).get('welcome');
        if (q === '0') return false;
        if (q === '1') return true;
      } catch (e) {}
      return !read();
    },
    open: function (step) {
      opener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
      ctl().dispatch({ type: 'UI', patch: { welcome: { step: step || 1, role: (read() || {}).role || null } } });
      setTimeout(function () { const el = document.getElementById('wc-first'); if (el) el.focus(); }, 60);
    },
    close: function () {
      ctl().dispatch({ type: 'UI', patch: { welcome: null } });
      if (opener && document.body.contains(opener)) { try { opener.focus({ preventScroll: true }); } catch (e) {} }
      opener = null;
    },
    maybe: function () { if (W.wanted()) W.open(1); },
    pickRole: function (id) {
      const w = get().ui.welcome;
      if (!w) return;
      ctl().dispatch({ type: 'UI', patch: { welcome: { step: 2, role: id } } });
      setTimeout(function () { const el = document.getElementById('wc-first'); if (el) el.focus(); }, 60);
    },
    skip: function () {
      const w = get().ui.welcome;
      write(Object.assign({}, read() || {}, { role: (w && w.role) || (read() || {}).role || null, skipped: true, t: Date.now() }));
      W.close();
    },
    pickGoal: function (id) {
      const w = get().ui.welcome, c = ctl();
      const role = ROLES.find((r) => r.id === (w && w.role)) || null;
      write({ role: role ? role.id : null, goal: id, t: Date.now() });
      W.close();
      // rol → varsayılan program (ağırlıklar); yalnızca ilk kez ve geri alınabilir geçmişe girmeden
      if (role && c.dispatch && get().project.site && get().project.site.template !== role.tpl) c.dispatch({ type: 'SITE_SET_LIVE', patch: { template: role.tpl } });
      const later = (fn, ms) => setTimeout(fn, ms || 140);
      if (id === 'analiz') { c.go('arsa'); later(function () { const el = document.getElementById('site-q'); if (el) el.focus(); }, 260); }
      else if (id === 'yer') { c.go('yer'); later(function () { if (get().project.cand.list.length === 0) c.toast('Demo adaylarla başlayabilir ya da bir adres arayabilirsiniz.'); }, 260); }
      else if (id === 'sunum') { c.go('arsa'); later(function () { c.siteMode && c.siteMode('iso'); c.toast('Katmanlar “Görünüm” sekmesinden seçilir; “Dışa aktar” ile PNG, PDF ve SVG alın.'); }); }
      else if (id === 'cad') { c.go('arsa'); later(function () { c.xmenu && c.xmenu(true); }, 300); }
      else if (id === 'imar') { c.go('imar'); }
      else if (id === 'bina') { c.go('islev'); }
      else c.toast('İyi keşifler: üst çubuktan altı modül arasında gezinebilirsiniz.');
    },
  });
  ui.helpBtn = function () { W.open(1); };

  /* ---------------- bileşen ---------------- */
  function opt(o, i, on, onclick) {
    return h('button', { key: o.id, type: 'button', id: i === 0 ? 'wc-first' : null, class: 'wc-opt' + (on ? ' on' : ''), 'aria-pressed': on == null ? null : String(!!on), onclick: onclick },

  function trap(e) {
    if (e.key === 'Escape') { e.preventDefault(); W.skip(); return; }
    if (e.key !== 'Tab') return;

    const first = f[0], last = f[f.length - 1];

  }

  ui.welcome = function (state) {
    const w = state.ui.welcome;

    const prof = read() || {};
    const step = w.step === 2 ? 2 : 1;
    const q = step === 1 ? 'Çalışmalarınızı en iyi tanımlayan kelime nedir?' : 'İlk olarak ne yapmak istersiniz?';
    const list = step === 1

      : GOALS.map((g, i) => opt(g, i, null, () => W.pickGoal(g.id)));
    return h('div', { class: 'wc', key: 'welcome' },
      h('div', { class: 'wc-scrim', onclick: () => W.skip() }),
      h('section', { class: 'wc-card', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'wc-q', onkeydown: trap },
        h('div', { class: 'wc-head' },

          h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Kapat', title: 'Şimdilik geç', onclick: () => W.skip() }, ui.icon('close', 16))),
        h('p', { class: 'wc-hello' }, step === 1 ? 'archtools’a hoş geldiniz' : (ROLES.find((r) => r.id === w.role) || { label: 'Hoş geldiniz' }).label),
        h('h2', { id: 'wc-q', class: 'wc-q' }, q),
        h('div', { class: 'wc-list wc-list-' + step, role: 'group', 'aria-labelledby': 'wc-q' }, list),
        h('div', { class: 'wc-foot' },
          step === 2 ? h('button', { type: 'button', class: 'btn', onclick: () => ctl().dispatch({ type: 'UI', patch: { welcome: { step: 1, role: w.role } } }) }, h('span', { class: 'wc-flip' }, ui.icon('chevron', 14)), h('span', { class: 'wc-back' }, 'Geri')) : h('span', {}),
          h('button', { type: 'button', class: 'btn', onclick: () => W.skip() }, prof.role || prof.skipped ? 'Kapat' : 'Şimdilik geç')),
        h('p', { class: 'wc-note' }, 'Yanıtlar yalnızca bu tarayıcıda saklanır; varsayılan programı ve ilk açılan modülü seçmek için kullanılır.')));
  };
})();

        ui.zoneDot(s.zone),
        h('span', { class: 'row-name' }, s.name),
        h('span', { class: 'frow-area mono' }, fmt(s.area) + ' m²'),
        h('span', { class: 'frow-mv' },
          h('button', { type: 'button', class: 'icon-btn', title: s.name + ' bir üst kata', 'aria-label': s.name + ' bir üst kata taşı', disabled: idx >= n - 1, onclick: (e) => { e.stopPropagation(); ctl().studyMove(s.id, 1); } }, h('span', { class: 'rot-up' }, ui.icon('chevron', 16))),
          h('button', { type: 'button', class: 'icon-btn', title: s.name + ' bir alt kata', 'aria-label': s.name + ' bir alt kata taşı', disabled: idx <= 0, onclick: (e) => { e.stopPropagation(); ctl().studyMove(s.id, -1); } }, h('span', { class: 'rot-down' }, ui.icon('chevron', 16))))));
  }

  function floorsView(state, sd) {
    const plan = sd.plan;
    const P = state.project;
    const list = plan.floors.slice().reverse().map((f) => h('section', { key: f.id, class: 'flr' },
      h('div', { class: 'flr-head' },
        h('label', { class: 'sr', for: 'fn-' + f.id }, f.name + ' adı'),
        h('input', { id: 'fn-' + f.id, class: 'inp flr-name', type: 'text', maxlength: 24, value: f.name, keep: true, onchange: (e) => ctl().studyRename(f.id, e.target.value), onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); } }),
        h('span', { class: 'count mono' }, fmt(f.net) + ' m² · ' + f.spaces.length + ' mekân')),
      f.spaces.length
        ? h('ul', { class: 'rows' }, f.spaces.map((s) => rowView(state, f, s)))
        : h('p', { class: 'note flr-empty' }, 'Bu katta mekân yok. Bir mekânı buraya sürükleyin.')));
    const coreSp = P.spaces.filter((s) => st.isCore(s));
    return ui.section('Katlara göre mekânlar', h('div', { class: 'flr-list' }, list,
      plan.floors.length > 1 && coreSp.length ? h('p', { class: 'note' }, 'Dikey dolaşım mekânları (' + coreSp.map((s) => s.name).join(', ') + ') her katta ortak çekirdek bloğuna dönüşür.') : null),
      P.spaces.length + ' mekân', 'floors');
  }

  fl.sidebar = function (state, d) {
    const P = state.project;
    const sd = st.derive(P);
    const c = sd.findings.counts;
    const tab = state.ui.stTab || 'katlar';
    const tabs = ui.tabsBar([
      { id: 'katlar', label: 'Katlar', n: P.study.floors.length },
      { id: 'bulgular', label: 'Bulgular', n: c.hata + c.uyari + c.oneri, warn: c.hata + c.uyari > 0 },
    ], tab, (id) => ctl().dispatch({ type: 'UI', patch: { stTab: id } }));
    const body = tab === 'katlar'
      ? [setupView(state, sd), floorsView(state, sd)]
      : [ui.findingList(sd.findings, 'Kat dağılımının ilişkilere, ıslak hacim hizasına ve plak dengesine göre kontrolü.')];
    return ui.sideShell('sb-kat', 'Kat etüdü paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, sd) {
    const key = [sd.plan, P.spaces, P.meta.name, App.theme.name];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: st.scene(P, sd, true) };
    return memo.v;
  }

  function toWorld(e) {
    const svg = fl.svgEl;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function cellAt(L, w) {
    return L.cells.find((c) => w.x >= c.cx - 8 && w.x <= c.cx + c.cw + 8 && w.y >= c.cy - 8 && w.y <= c.cy + c.rh + 8) || null;
  }

  function blockDown(e, b, floorId, L, plan) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    const w = toWorld(e);
    drag = { id: b.spaceId, name: b.name, from: floorId, sx: e.clientX, sy: e.clientY, moved: false, bw: b.w * L.s, bh: b.h * L.s, zone: b.zone, area: b.area };
    try { fl.svgEl.setPointerCapture(e.pointerId); } catch (err) {}
    ctl().dispatch({ type: 'SELECT', id: b.spaceId });
  }
  function svgMove(e, L, plan) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
    }
    const w = toWorld(e);
    const cell = cellAt(L, w);
    const over = cell ? plan.floors[cell.index].id : null;
    ctl().dispatch({ type: 'UI', patch: { stDrag: { id: drag.id, x: w.x, y: w.y, bw: drag.bw, bh: drag.bh, name: drag.name, zone: drag.zone, from: drag.from, over: over } } });
  }
  function svgUp(e, L, plan) {
    if (!drag) return;
    try { fl.svgEl.releasePointerCapture(e.pointerId); } catch (err) {}
    const d = drag;
    drag = null;
    if (d.moved) {
      const cell = cellAt(L, toWorld(e));
      ctl().dispatch({ type: 'UI', patch: { stDrag: null } });
      if (cell) ctl().studyAssign(d.id, plan.floors[cell.index].id);
    }
  }

  fl.board = function (state, d) {
    const P = state.project;
    const sd = st.derive(P);
    const plan = sd.plan;
    const sc = sceneOf(P, sd);
    const L = sc.L;
    const dr = state.ui.stDrag;
    const sel = state.selectedId;

    const hits = [];
    plan.floors.forEach((f, i) => {
      const c = L.cells[i];
      const isOver = dr && dr.over === f.id && dr.from !== f.id;
      hits.push(h('g', { key: 'c' + f.id, class: 'fcell' + (isOver ? ' over' : '') },
        h('rect', { class: 'fcell-hit', x: c.cx, y: c.cy, width: c.cw, height: c.rh, rx: 14, fill: 'transparent' }),
        isOver ? h('rect', { class: 'fdrop sel-ring', x: c.ox - 10, y: c.oy - 10, width: c.pw + 20, height: c.ph + 20, rx: 12, fill: 'none', stroke: App.PAL.ink, 'stroke-width': 2.5, 'stroke-dasharray': '9 7' }) : null));
      f.blocks.forEach((b) => {
        if (b.kind !== 'space') return;
        const x = c.ox + b.x * L.s, y = c.oy + b.y * L.s, w = b.w * L.s, hh = b.h * L.s;
        const on = sel === b.spaceId;
        const dragging = dr && dr.id === b.spaceId;
        hits.push(h('g', { key: 'k' + b.id, class: 'fblock' + (on ? ' sel' : '') + (dragging ? ' dragging' : '') },
          dragging ? h('rect', { x: x, y: y, width: w, height: hh, fill: 'rgba(255,255,255,.62)', 'pointer-events': 'none' }) : null,
          on ? h('rect', { class: 'sel-ring', x: x - 3, y: y - 3, width: w + 6, height: hh + 6, rx: App.theme.name === 'glass' ? 6 : 0, fill: 'none', stroke: App.PAL.ink, 'stroke-width': 3, 'stroke-dasharray': '7 6', 'pointer-events': 'none' }) : null,
          h('rect', {
            class: 'fblock-hit', x: x, y: y, width: w, height: hh, fill: 'transparent', tabindex: 0, role: 'button',
            'aria-label': b.name + ', ' + fmt(b.area) + ' metrekare, ' + f.name + '. Yukarı ve aşağı ok tuşlarıyla kat değiştirin.',
            onpointerdown: (e) => blockDown(e, b, f.id, L, plan),
            onkeydown: (e) => {
              if (e.key === 'ArrowUp') { e.preventDefault(); ctl().studyMove(b.spaceId, 1); }
              else if (e.key === 'ArrowDown') { e.preventDefault(); ctl().studyMove(b.spaceId, -1); }
              else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ctl().dispatch({ type: 'SELECT', id: b.spaceId }); }
            },
          }, h('title', {}, b.name + ' — ' + fmt(b.area) + ' m² — ' + f.name))));
      });
    });

    let ghost = null;
    if (dr) {
      const z = App.ZONES[dr.zone] || App.ZONES.sosyal;
      const g = App.theme.name === 'glass';
      const gw = Math.max(54, dr.bw), gh = Math.max(30, dr.bh);
      ghost = h('g', { key: 'ghost', class: 'fghost', 'pointer-events': 'none', transform: 'translate(' + (dr.x - gw / 2) + ' ' + (dr.y - gh / 2) + ')' },
        h('rect', { width: gw, height: gh, rx: g ? 6 : 0, fill: z.fill, stroke: App.PAL.ink, 'stroke-width': g ? 1.6 : 3, opacity: 0.9 }),
        h('text', { x: gw / 2, y: gh / 2 + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: z.text, 'font-family': 'var(--f-body)' }, dr.name.length > 16 ? dr.name.slice(0, 15) + '…' : dr.name));
    }

    const svg = h('svg', {
      id: 'pafta-kat', class: 'board-svg board-svg-kat', viewBox: '0 0 ' + App.sheet.W + ' ' + App.sheet.H, preserveAspectRatio: 'xMidYMid meet', role: 'group', 'aria-label': 'Kat etüdü paftası: ' + plan.floors.length + ' kat planı',
      ref: (el) => { fl.svgEl = el; }, onpointermove: (e) => svgMove(e, L, plan), onpointerup: (e) => svgUp(e, L, plan), onpointercancel: (e) => svgUp(e, L, plan),
      onpointerdown: () => { if (state.selectedId) ctl().dispatch({ type: 'SELECT', id: null }); },
    }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'fhits' }, hits), ghost);

    const empty = !P.spaces.length;
    const stage = h('div', { class: 'board-stage' }, svg,
      empty ? ui.emptyCard('Kat etüdü için mekân gerekli', 'İşlev Şeması modülünde mekân ekleyin ya da hazır bir bina programı yükleyin. Mekânlar otomatik olarak katlara dağıtılır.', [
        ui.btn('Örnek konutu yükle', { icon: 'newdoc', cls: 'btn-primary', onclick: () => ctl().loadTemplate('konut', '2+1') }),
        ui.btn('İşlev Şeması’na git', { icon: 'chevron', onclick: () => ctl().go('islev') })]) : null);

    return ui.boardPage(state, d, {
      label: 'Kat etüdü paftası',
      stage: stage,
      scale: 'Bloklar m² ile orantılı · ölçekli plan',
      foot: h('p', { class: 'board-hint' }, 'Bir mekân bloğunu başka bir kata sürükleyin · seçili blokta ▲▼ ok tuşları katı değiştirir'),
      tools: [
        { k: 'btn', label: 'Otomatik dağıt', icon: 'layout', strong: true, onclick: () => ctl().studyAuto(), disabled: !P.spaces.length, title: 'Mekânları işlev bölgesine ve ilişkilere göre katlara dağıt' },
        { k: 'sep' },
        { k: 'icon', label: 'Geri al', icon: 'undo', onclick: () => ctl().dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)' },
        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => ctl().dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ],
    });
  };
})();

/* ==========================================================================
   62-ctl-floors.js — Kat Etüdü yan etkileri: canlı kaydırıcı, taşıma, dışa aktarma, eylem köprüsü
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const get = () => App.store.get();

  /* kaydırıcı sürükleme: ilk harekette tek bir geri-al noktası, sonrası canlı */
  let live = false;
  ctl.studyLive = function (patch) {
    if (!live) { live = true; ctl.dispatch({ type: 'SNAPSHOT' }); }
    ctl.dispatch({ type: 'STUDY_SET_LIVE', patch: patch });
  };
  ctl.studyLiveEnd = function () { live = false; };
  ctl.studySet = (patch) => ctl.dispatch({ type: 'STUDY_SET', patch: patch });
  ctl.studyFloors = (n) => ctl.dispatch({ type: 'STUDY_FLOORS', count: n });
  ctl.studyRename = (id, name) => ctl.dispatch({ type: 'STUDY_RENAME', id: id, name: name });
  ctl.studyMove = (id, dir) => ctl.dispatch({ type: 'STUDY_MOVE_BY', id: id, dir: dir });

  ctl.studyAuto = function () {
    if (!get().project.spaces.length) { ctl.toast('Önce İşlev Şeması’na mekân ekleyin.', 'error'); return; }
    ctl.dispatch({ type: 'STUDY_AUTO' });
    const m = App.study.derive(get().project).metrics;
    ctl.toast(m.score == null ? 'Mekânlar katlara dağıtıldı.' : 'Mekânlar katlara dağıtıldı · kat skoru %' + m.score, 'success');
  };

  ctl.studyAssign = function (id, floorId) {
    const P = get().project;
    const s = P.spaces.find((x) => x.id === id);
    const f = P.study.floors.find((x) => x.id === floorId);
    if (!s || !f || P.study.assign[id] === floorId) return;
    ctl.dispatch({ type: 'STUDY_ASSIGN', id: id, floorId: floorId });
    ctl.toast('“' + s.name + '” → ' + f.name, 'success');
  };

  /* dışa aktarma: aynı primitif sahne PNG / PDF olarak çizilir */
  ctl.exporters.kat = function (kind) {
    ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (P) => {
      const sd = App.study.derive(P);
      const sc = App.study.scene(P, sd, false);
      return App.sheet.exportScene(sc.prims, App.sheet.W, App.sheet.H, P.meta.name + '-kat-etudu', kind);
    });
  };

  /* asistan kartlarının eylemleri: modüller arası köprü */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    const mod = get().ui.module;
    if (a.type === 'goto') { ctl.go(a.module); return; }
    if (a.type === 'studyMove') { ctl.studyAssign(a.id, a.floorId); return; }
    if (a.type === 'studyAuto') { ctl.studyAuto(); return; }
    if (a.type === 'select' && mod !== 'islev') {
      ctl.dispatch({ type: 'SELECT', id: a.id });
      if (mod === 'kat') {
        ctl.dispatch({ type: 'UI', patch: { stTab: 'katlar' } });
        setTimeout(() => { const el = document.getElementById('frow-' + a.id); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 40);
      }
      return;
    }
    baseRun(a);
  };
})();

/* ==========================================================================
   63-ui-site.js — Modül 4 arayüzü: Arsa Analizi (+ Modül 4/5/6 ortak parçalar)
   Ortak: konum arama, durum satırı, dışa aktarma menüsü, türetilmiş bağlam (analiz / imar / yer seçimi) ve skor kadranları.
   Sol panel: Konum (arama, ayarlar) · Görünüm (kip, katmanlar, güneş, izometrik) · Bulgular.
   Pafta: App.siteScene.arsa primitifleri; izometrik kipte sürükle = döndür, levhaya tıkla = öne çıkar.
   ========================================================================== */
(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const U = App.util;
  const fmt = U.fmt;
  const site = App.site;
  const osm = App.osm;
  const sel = App.select;
  const Z = App.zoning;

  const ctl = () => App.ctl;
  const S = (ui.site = {});

  /* ---------------- görünüm varsayılanları (state.ui içinde) ---------------- */
  App.siteUi = {
    arsa: () => ({ mode: 'map', layers: ['erisim', 'yapi', 'yesil', 'ulasim', 'islev'], labels: true, sunDay: 'yaz', sunHour: 15, parcel: true, yaw: 35, pitch: 38, explode: 1, zx: 1.6, sel: null, tab: 'konum' }),
    imar: () => ({ mode: 'plan', shadow: true, labels: true, handles: true, yaw: 35, pitch: 45, zx: 1, tab: 'parsel', tool: null, draft: null, fixed: null }),
    yer: () => ({ tab: 'adaylar', pick: null, step: 120, n: 5 }),
  };
  S.GEO0 = { busy: null, msg: '', err: null, q: '', results: [], tick: 0 };

  const pc = (v) => (v == null ? '—' : '%' + Math.round(v * 100));
  const level = (p, msgs) => (p == null ? msgs[0] : p >= 85 ? msgs[1] : p >= 70 ? msgs[2] : p >= 40 ? msgs[3] : msgs[4]);

  /* ---------------- türetilmiş bağlam (bellekli) ---------------- */
  S.analysis = function (state) {
    const s = state.project.site;
    const e = site.entry(s);
    return e ? site.analyze(s, e) : null;
  };

  let mImar = { k: null, v: null };
  S.imarCtx = function (state) {
    const s = state.project.site;
    const e = site.entry(s);
    const A = e ? site.analyze(s, e) : null;
    const k = [s.parcel, s.imar, e, A];
    if (mImar.k && mImar.k.every((x, i) => x === k[i])) return mImar.v;
    let R;
    if (s.parcel) R = Z.compute(s.imar, s.parcel, e ? { data: e.data, A: A, lat: e.data.lat0, parcel: s.parcel } : null);
    else R = { ok: false, reason: 'parcel', edges: [], A: 0, Aenv: 0, im: s.imar, items: [], counts: { hata: 0, uyari: 0, oneri: 0 } };
    mImar = { k: k, v: { R: R, A: A, e: e } };
    return mImar.v;
  };

  let mYer = { k: null, v: null };
  S.yerCtx = function (state) {
    const P = state.project;
    const s = P.site;
    const g = state.ui.geo || S.GEO0;
    const k = [P.cand, s.radius, s.walkMin, s.template, g.tick];
    if (mYer.k && mYer.k.every((x, i) => x === k[i])) return mYer.v;
    const set = sel.settingsOf(s);
    const cmp = sel.compare(P.cand, set);
    mYer = { k: k, v: { cmp: cmp, set: set } };
    return mYer.v;
  };
  // tarama sonucu denetleyicide saklanır (hesap pahalı): anahtar eşleşirse döner
  S.scan = function (state) { return ctl().yerScanFor ? ctl().yerScanFor(state) : null; };

  /* ---------------- skor kadranları ---------------- */
  ui.meterOpts.arsa = function (state) {
    const A = S.analysis(state);
    const g = state.ui.geo || S.GEO0;
    if (!A) return { label: 'Konum skoru', percent: null, msg: g.busy ? 'Konum verisi alınıyor…' : 'Konum verisi bekleniyor', chips: [], issues: 0 };
    const p = A.score;
    return {
      label: 'Konum skoru', percent: p,
      msg: level(p, ['Konum seçin', 'Çok iyi bir konum', 'İyi, birkaç zayıf yön var', 'Orta: bazı ihtiyaçlara yürüyerek ulaşılamıyor', 'Zayıf: günlük yaşam araç gerektiriyor']),
      chips: A.parts.slice(0, 4).map((x) => ({ label: x.label, value: pc(x.v), cls: 'dot' })),
      issues: A.counts.hata + A.counts.uyari, issuesText: 'uyarı · bulgulara git',
      onIssues: () => ctl().siteView({ tab: 'bulgular' }),
    };
  };

  ui.meterOpts.imar = function (state) {
    const c = S.imarCtx(state);
    const R = c.R, im = state.project.site.imar;
    if (!R.ok) return { label: 'Emsal kullanımı', percent: null, msg: R.reason === 'parcel' ? 'Önce parsel çizin' : R.reason === 'cekme' ? 'Çekmeler parseli tüketiyor' : 'Yapılabilir alan çok küçük', chips: [], issues: R.counts ? R.counts.hata + R.counts.uyari : 0, issuesText: 'uyarı · bulgulara git', onIssues: () => ctl().imarView({ tab: 'bulgular' }) };
    const f = R.facts, p = Math.round(Math.min(1, f.emsalUse) * 100);
    const use = Z.use(im.use);
    return {
      label: 'Emsal kullanımı', percent: p,
      msg: level(p, ['—', 'Emsal neredeyse tam kullanılıyor', 'Emsalin büyük kısmı kullanılıyor', 'Emsalin bir bölümü açıkta kalıyor', 'Emsalin çoğu kullanılamıyor']),
      chips: [
        { label: 'TAKS', value: fmt(f.taksUsed, 2) + '/' + fmt(im.taks, 2), cls: 'dot' },
        { label: 'KAKS', value: fmt(f.kaksUsed, 2) + '/' + fmt(im.kaks, 2), cls: 'dot' },
        { label: 'Kat', value: R.floors + ' · ' + fmt(R.height, 1) + ' m', cls: 'dot' },
        { label: use.unitName.charAt(0).toLocaleUpperCase('tr') + use.unitName.slice(1), value: String(f.units), cls: 'dot' },
      ],
      issues: R.counts.hata + R.counts.uyari, issuesText: 'uyarı · bulgulara git',
      onIssues: () => ctl().imarView({ tab: 'bulgular' }),
    };
  };

  ui.meterOpts.yer = function (state) {
    const P = state.project;
    const c = S.yerCtx(state);
    const mode = P.cand.mode;
    const sc = S.scan(state);
    if (mode === 'bul') {
      if (!sc) return { label: 'En iyi nokta', percent: null, msg: 'Tarama için “Tara” düğmesine basın', chips: [], issues: 0 };
      const p = sc.peaks.length ? sc.peaks[0].score : sc.max;
      return {
        label: 'En iyi nokta', percent: p,
        msg: sc.peaks.length ? sc.peaks.length + ' öneri noktası · ' + sc.passN + '/' + sc.validN + ' hücre filtreleri geçti' : 'Filtreleri geçen nokta yok',
        chips: [{ label: 'Taranan hücre', value: String(sc.validN), cls: 'dot' }, { label: 'Geçen', value: String(sc.passN), cls: 'dot' }, { label: 'Skor aralığı', value: '%' + sc.min + '–%' + sc.max, cls: 'dot' }],
        issues: 0,
      };
    }
    const cmp = c.cmp, best = cmp.best || cmp.ranked[0];
    const items = sel.findings(cmp, P.cand);
    const n = items.filter((i) => i.level === 'hata' || i.level === 'uyari').length;
    if (!P.cand.list.length) return { label: 'Yer skoru', percent: null, msg: 'Aday konum ekleyerek başlayın', chips: [], issues: 0 };
    return {
      label: 'Yer skoru', percent: best ? best.score : null,
      msg: best ? best.c.name + (cmp.best ? ' önde' : ' en yüksek skorlu (filtreleri geçmiyor)') : 'Aday verileri bekleniyor',
      chips: [{ label: 'Aday', value: String(P.cand.list.length), cls: 'dot' }, { label: 'Filtreyi geçen', value: String(cmp.ranked.filter((r) => r.pass).length), cls: 'dot' }, { label: 'Veri bekleyen', value: String(cmp.rows.filter((r) => !r.ready).length), cls: 'dot' }],
      issues: n, issuesText: 'uyarı · bulgulara git',
      onIssues: () => ctl().yerView({ tab: 'bulgular' }),
    };
  };

    q = String(q || '').trim();
    const mod = get().ui.module;
    if (!q) { GEO({ q: '', results: [], err: null, searched: false, owner: mod }); return; }
    const tok = ++searchTok;
    GEO({ busy: 'search', msg: 'Aranıyor…', err: null, q: q, results: [], searched: false, owner: mod });
    osm.geocode(q).then(function (list) {
      if (tok !== searchTok) return;
      if (osm.parseCoord(q) && onPick) { GEO({ busy: null, msg: '', results: [], searched: false }); onPick(list[0]); return; }
      GEO({ busy: null, msg: '', results: list, searched: true });
    }).catch(function (e) {
      if (tok !== searchTok) return;
      GEO({ busy: null, msg: '', err: e && e.message ? (App.osm.netMsg ? 'Arama yapılamadı: ' + App.osm.netMsg(e) : e.message) : 'Arama yapılamadı.', searched: false });
    });
  };

  /* ---------------- veri çekme ---------------- */
  let fetchTok = 0;
  // c: { lat, lon } · Rf: yarıçap · done(entry) · hedef konum değişirse eski yanıt yok sayılır
  function fetchOne(c, Rf, say) { return osm.fetchAll(c.lat, c.lon, Rf, say); }

  ctl.siteFetch = function (force) {
    const s = get().project.site;
    if (s.loc.src === 'demo') return;
    const Rf = site.fetchRadius(s);
    if (!force && osm.cacheGet(s.loc.lat, s.loc.lon, Rf)) { bump(); return; }
    const tok = ++fetchTok;
    const key = osm.key(s.loc.lat, s.loc.lon);
    GEO({ busy: 'fetch', msg: 'OpenStreetMap’e bağlanılıyor…', err: null });
    fetchOne(s.loc, Rf, function (m) { if (tok === fetchTok) GEO({ msg: m }); }).then(function (ent) {
      if (tok !== fetchTok) return;
      GEO({ busy: null, msg: '', tick: (get().ui.geo.tick || 0) + 1 });
      const c = osm.counts(ent.data);
      const cur = get().project.site.loc;
      if (osm.key(cur.lat, cur.lon) === key) ctl.toast('Veri alındı: ' + c.bina + ' bina · ' + c.yol + ' yol · ' + c.isl + ' işlev noktası', 'success');
    }).catch(function (e) {
      if (tok !== fetchTok) return;
      GEO({ busy: null, msg: '', err: e && e.message ? App.osm.netMsg(e) : 'Veri alınamadı.' });
    });
  };
  function ensureData() {
    const s = get().project.site;
    if (s.loc.src !== 'demo' && !site.entry(s) && !get().ui.geo.busy) ctl.siteFetch(false);
  }
  ctl.siteEnsure = ensureData;

  /* ---------------- konum ve ayarlar (project.site) ---------------- */
  ctl.siteSetLoc = function (r) {
    if (!r || !(Math.abs(r.lat) <= 90 && Math.abs(r.lon) <= 180)) return;
    const had = !!get().project.site.parcel;
    const loc = { lat: r.lat, lon: r.lon, name: String(r.name || r.lat.toFixed(5) + ', ' + r.lon.toFixed(5)).slice(0, 120), src: r.kind ? 'osm' : 'koordinat' };
    ctl.dispatch({ type: 'SITE_SET', patch: { loc: loc, parcel: null } });
    GEO({ results: [], q: '', searched: false, err: null });
    if (had) ctl.toast('Konum değişti: parsel sıfırlandı. Geri al ile döndürebilirsiniz.');
    ctl.siteFetch(false);
    if (loc.src === 'koordinat') {
      osm.reverse(r.lat, r.lon).then(function (nm) {
        const cur = get().project.site.loc;
        if (nm && cur.lat === loc.lat && cur.lon === loc.lon && cur.src === 'koordinat') ctl.dispatch({ type: 'SITE_SET_LIVE', patch: { loc: Object.assign({}, cur, { name: nm.slice(0, 120) }) } });
      });
    }
  };
  ctl.siteDemo = function () {
    ctl.dispatch({ type: 'SITE_SET', patch: { loc: osm.demoLoc(0, 0), parcel: null } });
    GEO({ err: null });
  };
  ctl.siteSet = function (patch) { ctl.dispatch({ type: 'SITE_SET', patch: patch }); ensureData(); };

  // kaydırıcı: ilk harekette tek geri-al noktası; veri önbelleği yetmiyorsa yarıçap bırakınca uygulanır
  let live = false, pending = null;
  const covered = (s, patch) => s.loc.src === 'demo' || !!osm.cacheGet(s.loc.lat, s.loc.lon, site.fetchRadius(Object.assign({}, s, patch)));
  ctl.siteLive = function (patch) {
    if (!live) { live = true; ctl.dispatch({ type: 'SNAPSHOT' }); }
    pending = Object.assign(pending || {}, patch);
    if (covered(get().project.site, pending)) ctl.dispatch({ type: 'SITE_SET_LIVE', patch: patch });
  };
  ctl.siteLiveEnd = function () {
    live = false;
    if (pending) { ctl.dispatch({ type: 'SITE_SET_LIVE', patch: pending }); pending = null; ensureData(); }
  };

  /* ---------------- görünüm durumu: kalıcı ve animasyonlu ---------------- */
  const timers = {};
  function makeView(uiKey, storeKey, persist) {
    const save = function () {
      clearTimeout(timers[uiKey]);
      timers[uiKey] = setTimeout(function () {
        try {
          const v = get().ui[uiKey], o = {};
          persist.forEach((k) => { o[k] = v[k]; });
          window.localStorage.setItem(storeKey, JSON.stringify(o));
        } catch (e) {}
      }, 350);
    };
    const set = function (patch, silent) {
      ctl.dispatch({ type: 'UI', patch: { [uiKey]: Object.assign({}, get().ui[uiKey], patch) } });
      if (!silent) save();
    };
    const load = function (clean) {
      try {
        const o = JSON.parse(window.localStorage.getItem(storeKey) || 'null');
        if (!o || typeof o !== 'object') return;
        const p = clean(o);
        if (p) ctl.dispatch({ type: 'UI', patch: { [uiKey]: Object.assign({}, get().ui[uiKey], p) } });
      } catch (e) {}
    };
    return { set: set, load: load, save: save };
  }
  ctl.makeView = makeView;

  let raf = 0;
  function tween(setter, getter, props, dur, done) {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    const from = {}, cur = getter();
    Object.keys(props).forEach((k) => { from[k] = cur[k]; });
    if (reduced() || dur <= 0) { setter(props, true); if (done) done(); return; }
    const t0 = performance.now();
    (function step(now) {
      const t = U.clamp((now - t0) / dur, 0, 1), e = App.iso.easeInOut(t);
      const p = {};
      Object.keys(props).forEach((k) => { p[k] = from[k] + (props[k] - from[k]) * e; });
      setter(p, true);
      if (t < 1) raf = requestAnimationFrame(step); else { raf = 0; if (done) done(); }
    })(t0);
  }
  const cancel = function () { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  ctl.tweenView = tween;
  ctl.tweenCancel = cancel;

  /* ---------------- Arsa Analizi görünümü ---------------- */
  const AV = makeView('site', 'archtools.view.arsa', ['mode', 'layers', 'labels', 'sunDay', 'sunHour', 'parcel', 'yaw', 'pitch', 'explode', 'zx']);
  ctl.siteView = AV.set;
  ctl.siteCancel = cancel;
  const arsaTween = (props, dur, done) => tween(AV.set, () => get().ui.site, props, dur, done);

  ctl.loadSiteView = function () {
    AV.load(function (o) {
      const p = {};
      if (o.mode === 'map' || o.mode === 'iso') p.mode = o.mode;
      if (Array.isArray(o.layers)) { const ids = site.LAYERS.map((l) => l.id); const ls = o.layers.filter((x) => ids.indexOf(x) >= 0); if (ls.length) p.layers = ls; }
      ['labels', 'parcel'].forEach((k) => { if (typeof o[k] === 'boolean') p[k] = o[k]; });
      if (App.gis.SUN_DAYS.some((d) => d.id === o.sunDay)) p.sunDay = o.sunDay;
      if (typeof o.sunHour === 'number') p.sunHour = U.clamp(o.sunHour, 6, 19);
      if (typeof o.yaw === 'number') p.yaw = U.clamp(o.yaw, -85, 85);
      if (typeof o.pitch === 'number') p.pitch = U.clamp(o.pitch, 20, 70);
      if (typeof o.explode === 'number') p.explode = U.clamp(o.explode, 0, 1);
      if (typeof o.zx === 'number') p.zx = U.clamp(o.zx, 1, 4);
      return p;
    });
  };

  ctl.siteOrbit = function (dx, dy, base) {
    AV.set({ yaw: U.clamp(base.yaw + dx * 0.32, -85, 85), pitch: U.clamp(base.pitch - dy * 0.22, 20, 70) }, true);
  };
  ctl.siteMode = function (mode) {
    const v = get().ui.site;
    if (v.mode === mode) return;
    if (mode === 'iso' && !reduced()) {
      AV.set({ mode: 'iso', explode: 0, sel: null }, true);
      arsaTween({ explode: 1 }, 760, AV.save);
    } else AV.set({ mode: mode, sel: null, explode: mode === 'iso' ? 1 : v.explode });
  };
  ctl.siteToggleExplode = function () { arsaTween({ explode: get().ui.site.explode > 0.5 ? 0 : 1 }, 950, AV.save); };
  ctl.siteResetView = function () { const d = App.siteUi.arsa(); arsaTween({ yaw: d.yaw, pitch: d.pitch }, 450, AV.save); };
  ctl.siteLayer = function (id) {
    const v = get().ui.site;
    const on = v.layers.indexOf(id) >= 0;
    if (on && v.layers.length === 1) { ctl.toast('En az bir katman açık kalmalı.'); return; }
    const order = site.LAYERS.map((l) => l.id);
    AV.set({ layers: order.filter((x) => (x === id ? !on : v.layers.indexOf(x) >= 0)), sel: v.sel === id && on ? null : v.sel });
  };

  /* ---------------- dışa aktarma altyapısı ---------------- */
  ctl.xmenu = function (open) { ctl.dispatch({ type: 'UI', patch: { xmenu: !!open } }); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && get().ui.xmenu) ctl.xmenu(false); });

  const blob = (text, type) => new Blob([text], { type: type });
  ctl.saveText = function (filename, text, type) { return App.files.saveBlob(filename, blob(text, type)); };

  // fn(kind) → Promise<{ok}> | {ok} ; hata fırlatırsa kullanıcıya iletilir
  ctl.siteExporters = {};
  ctl.siteExport = function (mod, kind) {
    const fn = ctl.siteExporters[mod];
    if (!fn) return;
    const label = kind === 'geojson' ? 'GeoJSON' : kind.toUpperCase();
    ctl.dispatch({ type: 'UI', patch: { busy: label } });
    let p;
    try { p = Promise.resolve(fn(kind)); } catch (e) { p = Promise.reject(e); }
    p.then((r) => ctl.report(r, label + ' hazır')).catch((e) => ctl.report({ ok: false, message: e && e.message }));
  };

  // ortak biçim dağıtıcı: build() → { prims, W, H, features, lat0, lon0, csv, name }
  ctl.siteWrite = function (kind, o) {
    const slug = U.slug(o.name);
    if (kind === 'png' || kind === 'pdf') return App.sheet.exportScene(o.prims, o.W, o.H, o.name, kind);
    if (kind === 'svg') return ctl.saveText(slug + '.svg', GX.svg(o.prims, o.W, o.H, o.name), 'image/svg+xml');
    if (kind === 'dxf') return ctl.saveText(slug + '.dxf', GX.dxf(o.features()), 'application/dxf');
    if (kind === 'geojson') return ctl.saveText(slug + '.geojson', GX.geojson(o.features(), o.lat0, o.lon0, o.meta), 'application/geo+json');
    if (kind === 'csv') return ctl.saveText(slug + '.csv', o.csv(), 'text/csv;charset=utf-8');
    return Promise.reject(new Error('Bilinmeyen biçim.'));
  };

  ctl.siteExporters.arsa = function (kind) {
    const st = get(), P = st.project, s = P.site, e = site.entry(s);
    if (!e) throw new Error('Önce konum verisi gerekli.');
    const A = site.analyze(s, e);
    const sc = App.siteScene.arsa(P, A, Object.assign({}, st.ui.site, { sel: null, lod: false }), false);
    return ctl.siteWrite(kind, {
      name: P.meta.name + '-arsa-analizi', prims: sc.prims, W: sc.W, H: sc.H,
      features: () => GX.collectArsa(P, A), lat0: e.data.lat0, lon0: e.data.lon0,
      meta: { module: 'arsa-analizi', location: s.loc.name, source: A.demo ? 'demo (sentetik)' : 'OpenStreetMap', score: A.score },
      csv: () => GX.csvArsa(P, A),
    });
  };
  ctl.exporters.arsa = (kind) => ctl.siteExport('arsa', kind === 'png' ? 'png' : 'pdf');

  /* ---------------- paylaşım bağlantısı ---------------- */
  function copyText(t) {
    const fallback = function () {
      try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true, () => fallback());
    } catch (e) {}
    return Promise.resolve(fallback());
  }
  ctl.shareLink = function () {
    const st = get(), s = st.project.site, mod = st.ui.module;
    if (s.loc.src === 'demo') { ctl.toast('Demo bölge için bağlantı oluşturulmaz; gerçek bir konum arayın.'); return; }
    const q = new URLSearchParams({ lat: s.loc.lat.toFixed(5), lon: s.loc.lon.toFixed(5), r: String(s.radius), w: String(s.walkMin), t: s.template, n: s.loc.name.slice(0, 80) });
    const url = location.href.split('#')[0] + '#/' + mod + '?' + q.toString();
    try { history.replaceState(null, '', url); } catch (e) {}
    copyText(url).then((ok) => ctl.toast(ok ? 'Bağlantı kopyalandı: aynı konum, yarıçap ve program açılır.' : 'Bağlantı adres çubuğuna yazıldı; oradan kopyalayabilirsiniz.', ok ? 'success' : 'info'));
  };

  // #/arsa?lat=…&lon=… biçimindeki bağlantıyı uygula (yalnızca konum farklıysa)
  ctl.hashSite = function () {
    const m = /^#\/?[a-z]+\?(.*)$/.exec(location.hash || '');
    if (!m) return false;
    const q = new URLSearchParams(m[1]);
    const lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
    if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180) || (lat === 0 && lon === 0)) return false;
    const s = get().project.site;
    if (s.loc.src !== 'demo' && Math.abs(s.loc.lat - lat) < 1e-5 && Math.abs(s.loc.lon - lon) < 1e-5) return false;
    const patch = { loc: { lat: lat, lon: lon, name: String(q.get('n') || lat.toFixed(5) + ', ' + lon.toFixed(5)).slice(0, 120), src: 'koordinat' }, parcel: null };
    const r = parseInt(q.get('r'), 10), w = parseInt(q.get('w'), 10), t = q.get('t');
    if (r >= 250 && r <= 1000) patch.radius = r;
    if ([5, 10, 15].indexOf(w) >= 0) patch.walkMin = w;
    if (t && site.TEMPLATES.some((x) => x.id === t)) patch.template = t;
    ctl.dispatch({ type: 'SITE_SET_LIVE', patch: patch });
    ctl.siteFetch(false);
    return true;
  };

  /* ---------------- eylem köprüsü (bulgu kartları) ---------------- */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    if (a.type === 'siteLayer') {
      const v = get().ui.site;
      if (v.layers.indexOf(a.id) < 0) ctl.siteLayer(a.id);
      ctl.siteView({ tab: 'gorunum' });
      return;
    }
    if (a.type === 'siteTab') { ctl.siteView({ tab: a.tab }); return; }
    baseRun(a);
  };
})();

        ui.btn('Dikdörtgen', { icon: 'parcel', cls: v.tool === 'rect' ? 'btn-primary' : '', pressed: v.tool === 'rect', onclick: () => c.imarTool(v.tool === 'rect' ? null : 'rect'), title: 'Paftada köşeden köşeye sürükleyin' }),
        s.parcel ? ui.btn('Sil', { icon: 'trash', onclick: () => c.imarClear(), title: 'Parseli kaldır' }) : null),
      v.tool === 'draw' ? h('p', { class: 'note' }, 'Paftada köşelere tıklayın. Bitirmek için ilk noktaya tıklayın, çift tıklayın ya da Enter’a basın. Geri almak için Backspace, vazgeçmek için Esc.') : null,
      v.tool === 'rect' ? h('p', { class: 'note' }, 'Paftada bir köşeden karşı köşeye sürükleyin. Döndürmek için aşağıdaki açı alanını kullanın.') : null,
      !v.tool && !s.parcel ? h('p', { class: 'note' }, 'Parseli çizin ya da ölçülerini yazın. Ölçüler metre cinsindendir; parsel konumun merkezine yerleşir.') : null,
      rectForm(state),
      s.parcel ? h('div', { class: 'kv-grid' },
        h('div', {}, h('span', { class: 'kv-k' }, 'Alan'), h('b', { class: 'kv-v mono' }, fmt(area, 0) + ' m²')),
        h('div', {}, h('span', { class: 'kv-k' }, 'Çevre'), h('b', { class: 'kv-v mono' }, fmt((R.edges || []).reduce((t, e) => t + e.len, 0), 0) + ' m')),
        h('div', {}, h('span', { class: 'kv-k' }, 'Köşe'), h('b', { class: 'kv-v mono' }, String(s.parcel.length)))) : null,

  I.sidebar = function (state) {
    const cx = S.imarCtx(state);
    const R = cx.R;

    const tab = v.tab || 'parsel';
    const cn = R.counts || { hata: 0, uyari: 0, oneri: 0 };
    const tabs = ui.tabsBar([
      { id: 'parsel', label: 'Parsel' },
      { id: 'kurallar', label: 'Kurallar' },
      { id: 'senaryo', label: 'Senaryo', n: state.project.site.imar.scn.length || null },
      { id: 'bulgular', label: 'Bulgular', n: R.items && R.items.length ? cn.hata + cn.uyari + cn.oneri : null, warn: cn.hata + cn.uyari > 0 },
    ], tab, (id) => ctl().imarView({ tab: id }));
    let body;
    if (tab === 'parsel') body = parcelTab(state, cx);
    else if (tab === 'kurallar') body = rulesTab(state, cx);
    else if (tab === 'senaryo') body = scenarioTab(state, cx);
    else body = R.items && R.items.length ? [ui.findingList({ items: R.items, counts: cn }, 'Girdiğiniz imar koşullarının parsel, çevre ve kapasite açısından kontrolü.')] : [h('p', { class: 'note' }, 'Bulgular için önce bir parsel çizin.')];
    return ui.sideShell('sb-imar', 'İmar ve kapasite paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, A, R, v, orbiting) {
    const key = [P.site, P.meta.name, A, R, App.theme.name, v, orbiting];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: App.imarScene.scene(P, A, R, Object.assign({}, v, { lod: orbiting }), true) };
    return memo.v;
  }

  let geom = null;
  let drag = null; // { kind:'pv', i } | { kind:'orbit', ... }
  const planPt = function (e) {
    const g = geom, w = S.toWorld(I.svgEl, e);
    return [Math.round(((w.x - g.cx) / g.s + g.c[0]) * 10) / 10, Math.round((-(w.y - g.cy) / g.s + g.c[1]) * 10) / 10];
  };
  const scr = (p) => [geom.cx + (p[0] - geom.c[0]) * geom.s, geom.cy - (p[1] - geom.c[1]) * geom.s];

  function svgDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const v = App.store.get().ui.imar, c = ctl();
    if (v.mode === 'iso' && App.store.get().project.site.parcel) { drag = { kind: 'orbit', sx: e.clientX, sy: e.clientY, yaw: v.yaw, pitch: v.pitch, moved: false, id: e.pointerId }; return; }
    if (!geom || !v.tool) return;
    e.preventDefault();
    try { I.svgEl.setPointerCapture(e.pointerId); } catch (err) {}
    const p = planPt(e);
    if (v.tool === 'rect') { c.imarView({ draft: { a: p, b: p } }, true); drag = { kind: 'rect', id: e.pointerId }; return; }
    // çokgen
    const d = v.draft && v.draft.pts ? v.draft : { pts: [], cur: null };
    if (d.pts.length >= 3) {
      const f = scr(d.pts[0]), w = S.toWorld(I.svgEl, e);
      if (Math.hypot(f[0] - w.x, f[1] - w.y) < 14) { c.imarFinish(); return; }
    }
    c.imarView({ draft: { pts: d.pts.concat([p]), cur: p } }, true);
  }
  function svgMove(e) {
    const v = App.store.get().ui.imar, c = ctl();
    if (drag && drag.kind === 'orbit') {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved) {
        if (Math.hypot(dx, dy) < 5) return;
        drag.moved = true;
        try { I.svgEl.setPointerCapture(drag.id); } catch (err) {}
        I.orbiting = true;
      }
      c.imarView({ yaw: U.clamp(drag.yaw + dx * 0.32, -85, 85), pitch: U.clamp(drag.pitch - dy * 0.22, 20, 70) }, true);
      return;
    }
    if (!geom) return;
    if (drag && drag.kind === 'pv') { c.imarDragMove(drag.i, planPt(e)); return; }
    if (drag && drag.kind === 'rect' && v.draft && v.draft.a) { c.imarView({ draft: { a: v.draft.a, b: planPt(e) } }, true); return; }
    if (v.tool === 'draw' && v.draft && v.draft.pts && v.draft.pts.length) c.imarView({ draft: { pts: v.draft.pts, cur: planPt(e) } }, true);
  }
  function svgUp(e) {
    const c = ctl();
    const d = drag;
    drag = null;
    if (!d) return;
    try { I.svgEl.releasePointerCapture(d.id != null ? d.id : e.pointerId); } catch (err) {}
    if (d.kind === 'orbit') { I.orbiting = false; if (d.moved) c.imarView({}); return; }
    if (d.kind === 'pv') { c.imarDragEnd(); return; }
    if (d.kind === 'rect') {
      const v = App.store.get().ui.imar;
      if (v.draft && v.draft.a) c.imarRect(v.draft.a, planPt(e));
    }
  }
  function vertexDown(e, i) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const v = App.store.get().ui.imar;
    if (v.tool) return;
    e.stopPropagation();
    e.preventDefault();
    drag = { kind: 'pv', i: i, id: e.pointerId };
    try { I.svgEl.setPointerCapture(e.pointerId); } catch (err) {}
    ctl().imarDragStart(geom);
  }

  function draftNodes(v, C) {
    if (!geom || !v.draft) return null;
    const ink = App.PAL.ink, col = App.theme.name === 'glass' ? '#2A6BFF' : App.PAL.red;
    const out = [];
    if (v.draft.pts) {
      const pts = v.draft.pts.map(scr);
      const all = v.draft.cur && pts.length ? pts.concat([scr(v.draft.cur)]) : pts;
      if (all.length > 1) out.push(h('polyline', { key: 'dl', points: S.poly(all), fill: 'none', stroke: col, 'stroke-width': 2.4, 'stroke-dasharray': '7 5', 'stroke-linejoin': 'round', 'pointer-events': 'none' }));
      pts.forEach((q, i) => out.push(h('circle', { key: 'dc' + i, cx: q[0], cy: q[1], r: i === 0 && pts.length >= 3 ? 8 : 5, fill: i === 0 ? '#fff' : col, stroke: col, 'stroke-width': 2.2, 'pointer-events': 'none' })));
    } else if (v.draft.a) {
      const a = v.draft.a, b = v.draft.b;
      const p0 = scr(a), p1 = scr([b[0], b[1]]);
      out.push(h('rect', { key: 'dr', x: Math.min(p0[0], p1[0]), y: Math.min(p0[1], p1[1]), width: Math.abs(p1[0] - p0[0]), height: Math.abs(p1[1] - p0[1]), fill: 'rgba(42,107,255,.12)', stroke: col, 'stroke-width': 2.2, 'stroke-dasharray': '7 5', 'pointer-events': 'none' }));
      const w = Math.abs(b[0] - a[0]), d = Math.abs(b[1] - a[1]);
      out.push(h('text', { key: 'dt', x: (p0[0] + p1[0]) / 2, y: Math.min(p0[1], p1[1]) - 8, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: ink, 'font-family': 'var(--f-body)', 'pointer-events': 'none' }, fmt(w, 1) + ' × ' + fmt(d, 1) + ' m'));
    }
    void C;
    return h('g', { class: 'idraft' }, out);
  }

  I.board = function (state, d) {
    const P = state.project, s = P.site, v = state.ui.imar, c = ctl();
    const cx = S.imarCtx(state);

      },
    }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'ahits' }, hits), draftNodes(v));

    let overlay = null;
    if (!s.parcel && !tool) {
      overlay = ui.emptyCard('Parseli çizin', 'İmar ve kapasite hesabı için parsel gerekir. Paftada çizebilir ya da ölçülerini yazabilirsiniz; TAKS, KAKS, çekmeler ve yençok kütleyi otomatik oluşturur.', [
        ui.btn('Çokgen çiz', { icon: 'draw', cls: 'btn-primary', onclick: () => c.imarTool('draw') }),
        ui.btn('Dikdörtgen çiz', { icon: 'parcel', onclick: () => c.imarTool('rect') }),

    }
    const stage = h('div', { class: 'board-stage' + (tool ? ' tooling' : '') }, svg, overlay,
      noData && s.parcel && !overlay ? h('div', { class: 'an-chip warn' }, h('span', {}, 'Çevre verisi yok: yol cephesi ve gölge hesaplanamıyor'), ui.btn('Verileri çek', { icon: 'download', onclick: () => c.siteFetch(true) })) : null,
      S.exportMenu(state, S.EXPORTS.imar, (k) => c.siteExport('imar', k)));

    const hint = tool === 'draw' ? 'Köşelere tıklayın · ilk noktaya tıklayın, çift tıklayın ya da Enter ile bitirin · Backspace geri alır · Esc vazgeçer'
      : tool === 'rect' ? 'Bir köşeden karşı köşeye sürükleyin · Esc vazgeçer'
        : iso ? 'Sürükleyerek döndürün · ok tuşları da çalışır'
          : 'Yuvarlak köşe tutamaçlarını sürükleyerek parseli düzenleyin · kenar etiketine tıklayarak ön / yan / arka seçin';
    return ui.boardPage(state, d, {
      label: 'İmar ve kapasite paftası',
      stage: stage,
      scale: s.parcel ? 'Parsel ' + fmt(Math.abs(gis.area(s.parcel)), 0) + ' m² · ' + (cx.A && cx.A.demo ? 'demo veri' : cx.e ? 'OpenStreetMap' : 'çevre verisi yok') : 'Parsel bekleniyor',
      foot: h('p', { class: 'board-hint' }, hint),
      tools: [
        { k: 'btn', label: 'Çokgen', icon: 'draw', onclick: () => c.imarTool(tool === 'draw' ? null : 'draw'), pressed: tool === 'draw', strong: tool === 'draw', title: 'Parsel çiz (çokgen)' },
