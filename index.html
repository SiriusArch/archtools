(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;

  /* Parçalı düğme grubu: o = { value, options: [{ v, label, title }], onchange(v), label, wide } */
  ui.segmented = function (o) {
    return h('div', { class: 'sgm' + (o.wide ? ' sgm-wide' : ''), role: 'group', 'aria-label': o.label || null },
      o.options.map((x) => h('button', { key: String(x.v), type: 'button', class: 'sgm-b' + (x.v === o.value ? ' on' : ''), 'aria-pressed': String(x.v === o.value), title: x.title || null, onclick: () => { if (x.v !== o.value) o.onchange(x.v); } }, x.label)));
  };

  /* Kaydırıcı: o = { id, label, value, min, max, step, text (gösterilen değer), oninput(v), onchange(v), hint } */
  ui.range = function (o) {
    const parse = (e) => parseFloat(e.target.value);
    return h('div', { class: 'rng' },
      h('div', { class: 'rng-top' },
        h('label', { class: 'rng-lbl', for: o.id }, o.label),
        h('output', { class: 'rng-val mono', for: o.id }, o.text == null ? String(o.value) : o.text)),
      h('input', { id: o.id, class: 'rng-in', type: 'range', min: o.min, max: o.max, step: o.step || 1, value: o.value, keep: true, 'aria-valuetext': o.text == null ? null : String(o.text), oninput: o.oninput ? (e) => o.oninput(parse(e)) : null, onchange: o.onchange ? (e) => o.onchange(parse(e)) : null }),
      o.hint ? h('p', { class: 'rng-hint' }, o.hint) : null);
  };

  /* Artı / eksi adımlayıcı: o = { label, value, min, max, onchange(v), unit, id } */
  ui.stepper = function (o) {
    const set = (v) => { if (v >= o.min && v <= o.max && v !== o.value) o.onchange(v); };
    return h('div', { class: 'stp', role: 'group', 'aria-label': o.label },
      h('button', { type: 'button', class: 'stp-b', 'aria-label': o.label + ' azalt', disabled: o.value <= o.min, onclick: () => set(o.value - 1) }, '−'),
      h('span', { class: 'stp-v', id: o.id || null, 'aria-live': 'polite' }, h('b', { class: 'mono' }, String(o.value)), o.unit ? h('span', { class: 'stp-u' }, o.unit) : null),
      h('button', { type: 'button', class: 'stp-b', 'aria-label': o.label + ' artır', disabled: o.value >= o.max, onclick: () => set(o.value + 1) }, '+'));
  };

  /* Aç / kapa: o = { label, on, onclick, title } */
  ui.toggle = function (o) {
    return h('button', { type: 'button', class: 'tgl' + (o.on ? ' on' : ''), 'aria-pressed': String(!!o.on), title: o.title || null, onclick: o.onclick },
      h('i', { class: 'tgl-dot', 'aria-hidden': 'true' }), h('span', {}, o.label));
  };

  /* Etiket + kontrol: yan yana (dar), alt alta (geniş) */
  ui.fld2 = function (label, control, hint) {
    return h('div', { class: 'fld2' },
      h('span', { class: 'fld2-l' }, label),
      h('div', { class: 'fld2-c' }, control),
      hint ? h('p', { class: 'fld2-h' }, hint) : null);
  };

  /* Bölüm başlığı + gövde (sol panel kutusu) */
  ui.section = function (title, body, aside, key) {
    return h('section', { class: 'panel sec', key: key || title },
      h('div', { class: 'panel-head' }, h('h2', { class: 'panel-title' }, title), aside ? h('span', { class: 'count mono' }, aside) : null),
      body);
  };

  /* Sol panel sekmeleri: tabs = [{ id, label, n, warn }] */
  ui.tabsBar = function (tabs, cur, onpick) {
    return h('div', { class: 'tabs', role: 'tablist' },
      tabs.map((t) => h('button', { key: t.id, type: 'button', role: 'tab', id: 'tab-' + t.id, 'aria-selected': String(cur === t.id), class: 'tab' + (cur === t.id ? ' on' : ''), onclick: () => onpick(t.id) },
        t.label, t.n != null ? h('span', { class: 'tab-n' + (t.warn ? ' tab-n-warn' : '') }, String(t.n)) : null)));
  };

  /* Bulgu kartları listesi (Modül 1 asistanıyla aynı kart) */
  ui.findingList = function (res, intro) {
    const c = res.counts;
    return h('div', { class: 'panel find-panel' },
      intro ? h('p', { class: 'note' }, intro) : null,
      h('div', { class: 'as-counts' },
        h('span', { class: 'cnt cnt-hata' }, 'Uyarı ', h('b', {}, String(c.hata + c.uyari))),
        h('span', { class: 'cnt' }, 'Öneri ', h('b', {}, String(c.oneri)))),
      h('ul', { class: 'cards' }, res.items.map((it) => ui.findingCard(it))));
  };
})();

/* ==========================================================================
   50-controller.js — yan etkiler: dışa aktarma, dosya yükleme, animasyon, asistan eylemleri
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const geo = App.geo;
  const ctl = (App.ctl = {});

  ctl.dispatch = (a) => App.store.dispatch(a);
  const get = () => App.store.get();
  const derived = () => App.state.derive(get());

  let toastTimer = null;
  ctl.toast = function (msg, kind) {
    ctl.dispatch({ type: 'TOAST', msg: msg, kind: kind });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ctl.dispatch({ type: 'CLEAR_TOAST' }), 3600);
  };

  ctl.toggleAssistant = () => ctl.dispatch({ type: 'UI', patch: { assistantOpen: !get().ui.assistantOpen } });
  ctl.openAnalysis = () => ctl.dispatch({ type: 'UI', patch: { assistantOpen: true, asTab: 'analysis' } });

  ctl.focusForm = function () {
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    setTimeout(() => { const el = document.getElementById('sp-name'); if (el) { el.scrollIntoView({ block: 'nearest' }); el.focus(); } }, 30);
  };

  /* ---------- tema: "Beni renklendir!" ↔ "Sadeleştir" ---------- */
  const STYLE_KEY = 'archtools.style';
  ctl.applyStyle = function (name) {
    App.theme.set(name);
    document.documentElement.setAttribute('data-style', name);
    try { window.localStorage.setItem(STYLE_KEY, name); } catch (e) {}
    ctl.dispatch({ type: 'UI', patch: { style: name } });
    if (App.paintNow) App.paintNow();
  };
  let switching = false;
  ctl.toggleStyle = function (e) {
    if (switching) return;
    const next = App.theme.name === 'glass' ? 'bauhaus' : 'glass';
    const root = document.documentElement;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const btn = e && e.currentTarget;
    if (!document.startViewTransition || reduce) { ctl.applyStyle(next); return; }
    // açılan daire: düğmenin olduğu yerden tüm sayfaya yayılır
    const r = btn && btn.getBoundingClientRect ? btn.getBoundingClientRect() : { left: innerWidth / 2, top: 0, width: 0, height: 0 };
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    root.style.setProperty('--vt-x', x + 'px');
    root.style.setProperty('--vt-y', y + 'px');
    root.style.setProperty('--vt-r', Math.ceil(rad) + 'px');
    root.classList.add('vt-reveal');
    switching = true;
    let vt;
    try { vt = document.startViewTransition(function () { ctl.applyStyle(next); }); } catch (err) { switching = false; root.classList.remove('vt-reveal'); ctl.applyStyle(next); return; }
    const done = function () {
      switching = false;
      root.classList.remove('vt-reveal');
      // renklenirken daireler sırayla "açılır"
      root.classList.add('bloom');
      setTimeout(function () { root.classList.remove('bloom'); }, 1400);
    };
    vt.finished.then(done, done);
  };

  /* ---------- mekân ekleme formu ---------- */
  ctl.onNameInput = function (value) {
    const f = get().ui.form;
    const patch = { name: value, error: '' };
    // bilgi tabanındaki bir ada denk gelirse tipik alanı öner
    if (!f.area || f.autoFilled) {
      const v = App.kb.variant(get().project.meta.buildingType, get().project.meta.variant);
      const hit = v.entries.find((e) => U.norm(e.name) === U.norm(value));
      if (hit) { patch.area = String(App.analyze.defaultArea(hit)); patch.autoFilled = true; }
      else if (f.autoFilled) { patch.area = ''; patch.autoFilled = false; }
    }
    ctl.dispatch({ type: 'FORM', patch: patch });
  };

  ctl.addFromForm = function () {
    const f = get().ui.form;
    const name = (f.name || '').trim();
    const area = parseFloat(String(f.area).replace(',', '.'));
    if (!name) { ctl.dispatch({ type: 'FORM', patch: { error: 'Mekân adını yazın.' } }); document.getElementById('sp-name').focus(); return; }
    if (!(area > 0)) { ctl.dispatch({ type: 'FORM', patch: { error: 'Alan 0’dan büyük bir sayı olmalı (m²).' } }); document.getElementById('sp-area').focus(); return; }
    if (area > 100000) { ctl.dispatch({ type: 'FORM', patch: { error: 'Alan en fazla 100.000 m² olabilir.' } }); return; }
    ctl.dispatch({ type: 'ADD_SPACES', list: [{ name: name, area: area }] });
    ctl.dispatch({ type: 'FORM', patch: { name: '', area: '', error: '', autoFilled: false } });
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    ctl.toast('“' + name + '” eklendi (' + U.fmt(area) + ' m²)', 'success');
    setTimeout(() => { const el = document.getElementById('sp-name'); if (el) el.focus(); }, 30);
  };

  ctl.newProject = function () {
    ctl.dispatch({ type: 'LOAD_PROJECT', project: App.state.emptyProject() });
    ctl.toast('Yeni proje açıldı. Önceki proje için Geri al’ı kullanabilirsiniz.');
  };

  ctl.loadTemplate = function (typeKey, variantKey) {
    const p = App.state.createFromTemplate(typeKey, variantKey, {});
    ctl.dispatch({ type: 'LOAD_PROJECT', project: p });
    ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
    ctl.toast(p.meta.name + ' programı yüklendi · ' + p.spaces.length + ' mekân', 'success');
  };

  /* ---------- otomatik yerleştirme (animasyonlu) ---------- */
  let animating = false;
  ctl.autoLayout = function () {
    const st = get();
    if (!st.project.spaces.length || animating) return;
    const k = derived().k;
    const target = App.layout.auto(st.project.spaces, st.project.relations, k, {});
    const from = {};
    st.project.spaces.forEach((s) => (from[s.id] = { x: s.x, y: s.y }));
    ctl.dispatch({ type: 'SNAPSHOT' });
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dur = reduce ? 1 : 650;
    const t0 = performance.now();
    animating = true;
    (function step(now) {
      const t = U.clamp((now - t0) / dur, 0, 1);
      const e = 1 - Math.pow(1 - t, 3);
      const pos = {};
      Object.keys(target).forEach((id) => { if (from[id]) pos[id] = { x: from[id].x + (target[id].x - from[id].x) * e, y: from[id].y + (target[id].y - from[id].y) * e }; });
      ctl.dispatch({ type: 'SET_POSITIONS', positions: pos });
      if (t < 1) requestAnimationFrame(step);
      else {
        animating = false;
        const pc = derived().score.percent;
        ctl.toast(pc == null ? 'Daireler yerleştirildi. İlişki ekleyerek skoru başlatın.' : 'Otomatik yerleştirme tamamlandı · verimlilik %' + pc, 'success');
      }
    })(t0);
  };

  /* ---------- dışa aktarma / kaydet / yükle ---------- */
  function report(res, okMsg) {
    ctl.dispatch({ type: 'UI', patch: { busy: null } });
    if (res && res.ok) ctl.toast(okMsg, 'success');
    else if (res && res.code === 'declined') ctl.toast('İndirme iptal edildi.');
    else ctl.toast('Dosya indirilemedi' + (res && res.message ? ': ' + res.message : '.'), 'error');
  }
  ctl.report = report;
  // label: 'PNG' | 'PDF' · make(project, derived) → Promise<{ok}>
  ctl.runExport = function (label, make) {
    const st = get();
    if (!st.project.spaces.length) { ctl.toast('Önce İşlev Şeması’na en az bir mekân ekleyin.', 'error'); return; }
    ctl.dispatch({ type: 'UI', patch: { busy: label } });
    make(st.project, derived()).then((r) => report(r, label + ' hazır')).catch((e) => report({ ok: false, message: e && e.message }));
  };
  // modül başına dışa aktarıcı: ctl.exporters[modülKimliği](kind: 'png' | 'pdf')
  ctl.exporters = {
    islev: (kind) => ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (p, d) => (kind === 'png' ? App.files.exportPNG(p, d.k, d.score) : App.files.exportPDF(p, d.k, d.score))),
  };
  const exporter = (kind) => (ctl.exporters[get().ui.module] || ctl.exporters.islev)(kind);
  ctl.exportPNG = () => exporter('png');
  ctl.exportPDF = () => exporter('pdf');
  const JSON_SUFFIX = { islev: undefined, kat: 'kat-etudu', analiz: 'mekan-analizi' };
  ctl.saveJSON = function () {
    const st = get();
    const d = derived();
    App.files.exportJSON(st.project, d.k, d.score, d.analysis.circ, JSON_SUFFIX[st.ui.module]).then((r) => report(r, 'Proje kaydedildi (JSON)'));
  };
  ctl.pickFile = function () { const el = document.getElementById('file-load'); if (el) el.click(); };
  ctl.onFile = function (e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const rd = new FileReader();
    rd.onload = function () {
      try {
        const project = App.files.fromJSON(String(rd.result));
        ctl.dispatch({ type: 'LOAD_PROJECT', project: project });
        ctl.toast('“' + project.meta.name + '” yüklendi · ' + project.spaces.length + ' mekân', 'success');
      } catch (err) { ctl.toast(err.message, 'error'); }
    };
    rd.onerror = function () { ctl.toast('Dosya okunamadı.', 'error'); };
    rd.readAsText(file);
    e.target.value = '';
  };

  /* ---------- asistan ---------- */
  ctl.ask = function (q) {
    const st = get();
    ctl.dispatch({ type: 'UI', patch: { assistantOpen: true, asTab: 'ask' } });
    ctl.dispatch({ type: 'CHAT_ADD', msg: { role: 'user', text: q } });
    ctl.scrollChat();
    const d = derived();
    let res;
    try { res = App.assistant.answer(q, { project: st.project, k: d.k, score: d.score, analysis: d.analysis }); }
    catch (err) { res = { blocks: [{ t: 'p', text: 'Bu soruyu yanıtlarken bir sorun oluştu. Soruyu biraz farklı yazmayı deneyin.' }], src: [] }; }
    setTimeout(() => { ctl.dispatch({ type: 'CHAT_ADD', msg: { role: 'bot', blocks: res.blocks, src: res.src } }); ctl.scrollChat(); }, 120);
  };

  ctl.scrollChat = function () {
    setTimeout(() => { const el = document.querySelector('.msgs'); if (el) el.scrollTop = el.scrollHeight; }, 40);
  };

  let hlTimer = null;
  ctl.runAction = function (a) {
    if (a.type === 'addSpaces') {
      ctl.dispatch({ type: 'ADD_SPACES', list: a.list });
      ctl.toast(a.list.length === 1 ? '“' + a.list[0].name + '” eklendi' : a.list.length + ' mekân eklendi', 'success');
    } else if (a.type === 'setArea') {
      ctl.dispatch({ type: 'UPDATE_SPACE', id: a.id, patch: { area: a.area } });
      ctl.toast('Alan ' + U.fmt(a.area) + ' m² olarak güncellendi', 'success');
    } else if (a.type === 'select') {
      ctl.dispatch({ type: 'SELECT', id: a.id });
      ctl.dispatch({ type: 'UI', patch: { tab: 'spaces' } });
      setTimeout(() => { const el = document.getElementById('row-' + a.id); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 40);
    } else if (a.type === 'locate') {
      ctl.dispatch({ type: 'SELECT', id: a.a });
      ctl.dispatch({ type: 'HIGHLIGHT', pair: { a: a.a, b: a.b } });
      clearTimeout(hlTimer);
      hlTimer = setTimeout(() => ctl.dispatch({ type: 'HIGHLIGHT', pair: null }), 3800);
    } else if (a.type === 'autolayout') ctl.autoLayout();
    else if (a.type === 'openMatrix') ctl.dispatch({ type: 'UI', patch: { tab: 'matrix' } });
    else if (a.type === 'focusForm') ctl.focusForm();
    else if (a.type === 'loadTemplate') ctl.loadTemplate(a.typeKey, a.variantKey);
  };

  /* ---------- klavye ---------- */
  ctl.onKey = function (e) {
    const tag = (e.target && e.target.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    const mod = e.ctrlKey || e.metaKey;
    if (mod && !typing && e.key.toLowerCase() === 'z') { e.preventDefault(); ctl.dispatch({ type: e.shiftKey ? 'REDO' : 'UNDO' }); }
    else if (mod && !typing && e.key.toLowerCase() === 'y') { e.preventDefault(); ctl.dispatch({ type: 'REDO' }); }
    else if (!typing && get().ui.module === 'islev' && (e.key === 'Delete' || e.key === 'Backspace') && get().selectedId) { e.preventDefault(); ctl.dispatch({ type: 'REMOVE_SPACE', id: get().selectedId }); }
    else if (e.key === 'Escape') { if (typing && tag === 'INPUT') e.target.blur(); else if (get().selectedId) ctl.dispatch({ type: 'SELECT', id: null }); }
  };
})();

        ? h('ul', { class: 'rows' }, f.spaces.map((s) => rowView(state, f, s)))
        : h('p', { class: 'note flr-empty' }, 'Bu katta mekân yok. Bir mekânı buraya sürükleyin.')));
    const coreSp = P.spaces.filter((s) => st.isCore(s));
    return ui.section('Katlara göre mekânlar', h('div', { class: 'flr-list' }, list,
      plan.floors.length > 1 && coreSp.length ? h('p', { class: 'note' }, 'Dikey dolaşım mekânları (' + coreSp.map((s) => s.name).join(', ') + ') her katta ortak çekirdek bloğuna dönüşür.') : null),
      P.spaces.length + ' mekân', 'floors');
  }

  fl.sidebar = function (state, d) {
    const P = state.project;
    const sd = st.derive(P);
    const c = sd.findings.counts;
    const tab = state.ui.stTab || 'katlar';
    const tabs = ui.tabsBar([
      { id: 'katlar', label: 'Katlar', n: P.study.floors.length },
      { id: 'bulgular', label: 'Bulgular', n: c.hata + c.uyari + c.oneri, warn: c.hata + c.uyari > 0 },
    ], tab, (id) => ctl().dispatch({ type: 'UI', patch: { stTab: id } }));
    const body = tab === 'katlar'
      ? [setupView(state, sd), floorsView(state, sd)]
      : [ui.findingList(sd.findings, 'Kat dağılımının ilişkilere, ıslak hacim hizasına ve plak dengesine göre kontrolü.')];
    return ui.sideShell('sb-kat', 'Kat etüdü paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, sd) {
    const key = [sd.plan, P.spaces, P.meta.name, App.theme.name];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: st.scene(P, sd, true) };
    return memo.v;
  }

  function toWorld(e) {
    const svg = fl.svgEl;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function cellAt(L, w) {
    return L.cells.find((c) => w.x >= c.cx - 8 && w.x <= c.cx + c.cw + 8 && w.y >= c.cy - 8 && w.y <= c.cy + c.rh + 8) || null;
  }

  function blockDown(e, b, floorId, L, plan) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    const w = toWorld(e);
    drag = { id: b.spaceId, name: b.name, from: floorId, sx: e.clientX, sy: e.clientY, moved: false, bw: b.w * L.s, bh: b.h * L.s, zone: b.zone, area: b.area };
    try { fl.svgEl.setPointerCapture(e.pointerId); } catch (err) {}
    ctl().dispatch({ type: 'SELECT', id: b.spaceId });
  }
  function svgMove(e, L, plan) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
    }
    const w = toWorld(e);
    const cell = cellAt(L, w);
    const over = cell ? plan.floors[cell.index].id : null;
    ctl().dispatch({ type: 'UI', patch: { stDrag: { id: drag.id, x: w.x, y: w.y, bw: drag.bw, bh: drag.bh, name: drag.name, zone: drag.zone, from: drag.from, over: over } } });
  }
  function svgUp(e, L, plan) {
    if (!drag) return;
    try { fl.svgEl.releasePointerCapture(e.pointerId); } catch (err) {}
    const d = drag;
    drag = null;
    if (d.moved) {
      const cell = cellAt(L, toWorld(e));
      ctl().dispatch({ type: 'UI', patch: { stDrag: null } });
      if (cell) ctl().studyAssign(d.id, plan.floors[cell.index].id);
    }
  }

  fl.board = function (state, d) {
    const P = state.project;
    const sd = st.derive(P);
    const plan = sd.plan;
    const sc = sceneOf(P, sd);
    const L = sc.L;
    const dr = state.ui.stDrag;
    const sel = state.selectedId;

    const hits = [];
    plan.floors.forEach((f, i) => {
      const c = L.cells[i];
      const isOver = dr && dr.over === f.id && dr.from !== f.id;
      hits.push(h('g', { key: 'c' + f.id, class: 'fcell' + (isOver ? ' over' : '') },
        h('rect', { class: 'fcell-hit', x: c.cx, y: c.cy, width: c.cw, height: c.rh, rx: 14, fill: 'transparent' }),
        isOver ? h('rect', { class: 'fdrop sel-ring', x: c.ox - 10, y: c.oy - 10, width: c.pw + 20, height: c.ph + 20, rx: 12, fill: 'none', stroke: App.PAL.ink, 'stroke-width': 2.5, 'stroke-dasharray': '9 7' }) : null));
      f.blocks.forEach((b) => {
        if (b.kind !== 'space') return;
        const x = c.ox + b.x * L.s, y = c.oy + b.y * L.s, w = b.w * L.s, hh = b.h * L.s;
        const on = sel === b.spaceId;
        const dragging = dr && dr.id === b.spaceId;
        hits.push(h('g', { key: 'k' + b.id, class: 'fblock' + (on ? ' sel' : '') + (dragging ? ' dragging' : '') },
          dragging ? h('rect', { x: x, y: y, width: w, height: hh, fill: 'rgba(255,255,255,.62)', 'pointer-events': 'none' }) : null,
          on ? h('rect', { class: 'sel-ring', x: x - 3, y: y - 3, width: w + 6, height: hh + 6, rx: App.theme.name === 'glass' ? 6 : 0, fill: 'none', stroke: App.PAL.ink, 'stroke-width': 3, 'stroke-dasharray': '7 6', 'pointer-events': 'none' }) : null,
          h('rect', {
            class: 'fblock-hit', x: x, y: y, width: w, height: hh, fill: 'transparent', tabindex: 0, role: 'button',
            'aria-label': b.name + ', ' + fmt(b.area) + ' metrekare, ' + f.name + '. Yukarı ve aşağı ok tuşlarıyla kat değiştirin.',
            onpointerdown: (e) => blockDown(e, b, f.id, L, plan),
            onkeydown: (e) => {
              if (e.key === 'ArrowUp') { e.preventDefault(); ctl().studyMove(b.spaceId, 1); }
              else if (e.key === 'ArrowDown') { e.preventDefault(); ctl().studyMove(b.spaceId, -1); }
              else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ctl().dispatch({ type: 'SELECT', id: b.spaceId }); }
            },
          }, h('title', {}, b.name + ' — ' + fmt(b.area) + ' m² — ' + f.name))));
      });
    });

    let ghost = null;
    if (dr) {
      const z = App.ZONES[dr.zone] || App.ZONES.sosyal;
      const g = App.theme.name === 'glass';
      const gw = Math.max(54, dr.bw), gh = Math.max(30, dr.bh);
      ghost = h('g', { key: 'ghost', class: 'fghost', 'pointer-events': 'none', transform: 'translate(' + (dr.x - gw / 2) + ' ' + (dr.y - gh / 2) + ')' },
        h('rect', { width: gw, height: gh, rx: g ? 6 : 0, fill: z.fill, stroke: App.PAL.ink, 'stroke-width': g ? 1.6 : 3, opacity: 0.9 }),
        h('text', { x: gw / 2, y: gh / 2 + 4.5, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: z.text, 'font-family': 'var(--f-body)' }, dr.name.length > 16 ? dr.name.slice(0, 15) + '…' : dr.name));
    }

    const svg = h('svg', {
      id: 'pafta-kat', class: 'board-svg board-svg-kat', viewBox: '0 0 ' + App.sheet.W + ' ' + App.sheet.H, preserveAspectRatio: 'xMidYMid meet', role: 'group', 'aria-label': 'Kat etüdü paftası: ' + plan.floors.length + ' kat planı',
      ref: (el) => { fl.svgEl = el; }, onpointermove: (e) => svgMove(e, L, plan), onpointerup: (e) => svgUp(e, L, plan), onpointercancel: (e) => svgUp(e, L, plan),
      onpointerdown: () => { if (state.selectedId) ctl().dispatch({ type: 'SELECT', id: null }); },
    }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'fhits' }, hits), ghost);

    const empty = !P.spaces.length;
    const stage = h('div', { class: 'board-stage' }, svg,
      empty ? ui.emptyCard('Kat etüdü için mekân gerekli', 'İşlev Şeması modülünde mekân ekleyin ya da hazır bir bina programı yükleyin. Mekânlar otomatik olarak katlara dağıtılır.', [
        ui.btn('Örnek konutu yükle', { icon: 'newdoc', cls: 'btn-primary', onclick: () => ctl().loadTemplate('konut', '2+1') }),
        ui.btn('İşlev Şeması’na git', { icon: 'chevron', onclick: () => ctl().go('islev') })]) : null);

    return ui.boardPage(state, d, {
      label: 'Kat etüdü paftası',
      stage: stage,
      scale: 'Bloklar m² ile orantılı · ölçekli plan',
      foot: h('p', { class: 'board-hint' }, 'Bir mekân bloğunu başka bir kata sürükleyin · seçili blokta ▲▼ ok tuşları katı değiştirir'),
      tools: [
        { k: 'btn', label: 'Otomatik dağıt', icon: 'layout', strong: true, onclick: () => ctl().studyAuto(), disabled: !P.spaces.length, title: 'Mekânları işlev bölgesine ve ilişkilere göre katlara dağıt' },
        { k: 'sep' },
        { k: 'icon', label: 'Geri al', icon: 'undo', onclick: () => ctl().dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)' },
        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => ctl().dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ],
    });
  };
})();

/* ==========================================================================
   62-ctl-floors.js — Kat Etüdü yan etkileri: canlı kaydırıcı, taşıma, dışa aktarma, eylem köprüsü
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const get = () => App.store.get();

  /* kaydırıcı sürükleme: ilk harekette tek bir geri-al noktası, sonrası canlı */
  let live = false;
  ctl.studyLive = function (patch) {
    if (!live) { live = true; ctl.dispatch({ type: 'SNAPSHOT' }); }
    ctl.dispatch({ type: 'STUDY_SET_LIVE', patch: patch });
  };
  ctl.studyLiveEnd = function () { live = false; };
  ctl.studySet = (patch) => ctl.dispatch({ type: 'STUDY_SET', patch: patch });
  ctl.studyFloors = (n) => ctl.dispatch({ type: 'STUDY_FLOORS', count: n });
  ctl.studyRename = (id, name) => ctl.dispatch({ type: 'STUDY_RENAME', id: id, name: name });
  ctl.studyMove = (id, dir) => ctl.dispatch({ type: 'STUDY_MOVE_BY', id: id, dir: dir });

  ctl.studyAuto = function () {
    if (!get().project.spaces.length) { ctl.toast('Önce İşlev Şeması’na mekân ekleyin.', 'error'); return; }
    ctl.dispatch({ type: 'STUDY_AUTO' });
    const m = App.study.derive(get().project).metrics;
    ctl.toast(m.score == null ? 'Mekânlar katlara dağıtıldı.' : 'Mekânlar katlara dağıtıldı · kat skoru %' + m.score, 'success');
  };

  ctl.studyAssign = function (id, floorId) {
    const P = get().project;
    const s = P.spaces.find((x) => x.id === id);
    const f = P.study.floors.find((x) => x.id === floorId);
    if (!s || !f || P.study.assign[id] === floorId) return;
    ctl.dispatch({ type: 'STUDY_ASSIGN', id: id, floorId: floorId });
    ctl.toast('“' + s.name + '” → ' + f.name, 'success');
  };

  /* dışa aktarma: aynı primitif sahne PNG / PDF olarak çizilir */
  ctl.exporters.kat = function (kind) {
    ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (P) => {
      const sd = App.study.derive(P);
      const sc = App.study.scene(P, sd, false);
      return App.sheet.exportScene(sc.prims, App.sheet.W, App.sheet.H, P.meta.name + '-kat-etudu', kind);
    });
  };

  /* asistan kartlarının eylemleri: modüller arası köprü */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    const mod = get().ui.module;
    if (a.type === 'goto') { ctl.go(a.module); return; }
    if (a.type === 'studyMove') { ctl.studyAssign(a.id, a.floorId); return; }
    if (a.type === 'studyAuto') { ctl.studyAuto(); return; }
    if (a.type === 'select' && mod !== 'islev') {
      ctl.dispatch({ type: 'SELECT', id: a.id });
      if (mod === 'kat') {
        ctl.dispatch({ type: 'UI', patch: { stTab: 'katlar' } });
        setTimeout(() => { const el = document.getElementById('frow-' + a.id); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 40);
      }
      return;
    }
    baseRun(a);
  };
})();

/* ==========================================================================
   71-ui-analysis.js — Modül 3 arayüzü: Mekân Analizi (patlatılmış izometrik)
   Sol panel: görünüm (kip, patlatma, yön, eğim), kat / katman seçimi, ölçüler, bulgular.
   Pafta: App.analysis.scene primitifleri + etkileşim: sürükle = döndür, tıkla = kat seç.

(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const U = App.util;
  const fmt = U.fmt;

  const ctl = () => App.ctl;
  const an = (ui.analysis = {});
  let orbit = null;

  const pct = (v) => (v == null ? '—' : '%' + Math.round(v * 100));

  /* ---------------- sol panel ---------------- */
  function viewSection(state) {
    const v = state.ui.an;
    const c = ctl();
    return ui.section('Görünüm', h('div', { class: 'sec-box' },
      ui.fld2('Kip',
        ui.segmented({ label: 'Görünüm kipi', wide: true, value: v.mode, options: [{ v: 'floors', label: 'Katlar', title: 'Her kat bir levha' }, { v: 'layers', label: 'Katmanlar', title: 'Seçili katın analiz katmanları' }], onchange: (m) => c.anMode(m) }),
        v.mode === 'floors' ? 'Her kat ayrı bir levha olarak yukarı doğru açılır.' : 'Seçili katın plan, işlev, dolaşım gibi katmanları üst üste açılır.'),
      ui.range({ id: 'an-explode', label: 'Patlatma', min: 0, max: 100, step: 1, value: Math.round(v.explode * 100), text: '%' + Math.round(v.explode * 100), oninput: (x) => { c.anCancel(); c.an({ explode: x / 100 }); } }),
      ui.range({ id: 'an-yaw', label: 'Dönüş', min: -85, max: 85, step: 1, value: Math.round(v.yaw), text: Math.round(v.yaw) + '°', oninput: (x) => { c.anCancel(); c.an({ yaw: x }); } }),
      ui.range({ id: 'an-pitch', label: 'Bakış yüksekliği', min: 12, max: 75, step: 1, value: Math.round(v.pitch), text: Math.round(v.pitch) + '°', oninput: (x) => { c.anCancel(); c.an({ pitch: x }); } }),
      h('div', { class: 'tgl-row' },
        ui.toggle({ label: 'Etiketler', on: v.labels, onclick: () => c.an({ labels: !v.labels }) }),
        ui.toggle({ label: 'Oklar', on: v.arrows, onclick: () => c.an({ arrows: !v.arrows }), title: 'Düşey dolaşım ve ilişki okları' }),
        ui.toggle({ label: 'Kılavuzlar', on: v.guides, onclick: () => c.an({ guides: !v.guides }), title: 'Levhaları bağlayan köşe çizgileri' }),
        ui.toggle({ label: 'Hacim', on: v.volume, onclick: () => c.an({ volume: !v.volume }), title: 'Mekânları yükselti olarak çiz' }))));
  }

  function mixBar(m) {
    return h('span', { class: 'mixbar', 'aria-hidden': 'true' }, m.zones.map((z) => h('i', { key: z.zone, style: { width: (z.share * 100) + '%', background: (App.ZONES[z.zone] || App.ZONES.sosyal).fill }, title: (App.ZONES[z.zone] || App.ZONES.sosyal).label + ' %' + Math.round(z.share * 100) })));
  }

  function floorsSection(state, sd, A) {
    const v = state.ui.an;
    const plan = sd.plan;
    const rows = plan.floors.slice().reverse().map((f) => {
      const mix = A.mix.find((m) => m.id === f.id);
      const on = v.sel === f.id;
      return h('li', { key: f.id, class: 'row aflr' + (on ? ' sel' : '') },
        h('button', { type: 'button', class: 'row-main aflr-btn', 'aria-pressed': String(on), onclick: () => ctl().anSelect(f.id) },
          h('span', { class: 'aflr-top' },
            h('span', { class: 'row-name' }, f.name),
            h('span', { class: 'frow-area mono' }, fmt(f.net) + ' m² · ' + f.spaces.length + ' mekân')),
          mix ? mixBar(mix) : null));
    });
    return ui.section('Katlar', h('div', {}, h('ul', { class: 'rows' }, rows), h('p', { class: 'note aflr-note' }, 'Bir kata tıklayın: diğer katlar soluklaşır. Tekrar tıklayınca seçim kalkar.')), plan.floors.length + ' kat', 'afloors');
  }

  function layersSection(state, sd) {
    const v = state.ui.an;
    const plan = sd.plan;
    const cur = plan.floors.find((f) => f.id === v.floorId) || plan.floors[0];
    const c = ctl();
    return [
      ui.section('Kat', h('div', { class: 'sec-box' },
        ui.fld2('Analiz edilen kat', h('select', { id: 'an-floor', class: 'inp', value: cur.id, onchange: (e) => c.an({ floorId: e.target.value }, true) }, plan.floors.slice().reverse().map((f) => h('option', { key: f.id, value: f.id }, f.name + ' · ' + fmt(f.net) + ' m²')))))
      , null, 'afloor'),
      ui.section('Katmanlar', h('ul', { class: 'lyrs' }, App.analysis.LAYERS.map((l) => {
        const on = v.layers.indexOf(l.id) >= 0;
        return h('li', { key: l.id }, h('button', { type: 'button', class: 'lyr' + (on ? ' on' : ''), 'aria-pressed': String(on), onclick: () => c.anToggleLayer(l.id) },
          h('i', { class: 'lyr-box', 'aria-hidden': 'true' }, on ? ui.icon('check', 12) : null),
          h('span', { class: 'lyr-t' }, h('b', {}, l.name), h('small', {}, l.sub))));
      })), v.layers.length + '/' + App.analysis.LAYERS.length, 'alayers'),
    ];
  }

  function statsSection(A) {
    const s = A.stats;
    const rows = [
      ['Gün ışığı (cepheli yaşama mekânı)', s.nHab ? s.nHabExt + '/' + s.nHab + ' · ' + pct(s.daylight) : '—'],
      ['Sirkülasyon payı', pct(s.circShare)],
      ['Islak hacim hizası', pct(s.wetAlign)],
      ['Gürültü çakışması', String(s.conflicts)],
      ['Plak doluluğu', pct(s.fill)],
    ];
    return ui.section('Ölçüler', h('dl', { class: 'stats' }, rows.map((r) => [h('dt', { key: 'k' + r[0] }, r[0]), h('dd', { key: 'v' + r[0], class: 'mono' }, r[1])])), null, 'astats');
  }

  an.sidebar = function (state, d) {
    const P = state.project;
    const sd = App.study.derive(P);
    const A = App.analysis.analyze(P, sd);
    const v = state.ui.an;
    const tab = state.ui.anTab || 'gorunum';
    const c = A.counts;
    const tabs = ui.tabsBar([
      { id: 'gorunum', label: 'Görünüm' },
      { id: 'bulgular', label: 'Bulgular', n: c.hata + c.uyari + c.oneri, warn: c.hata + c.uyari > 0 },
    ], tab, (id) => ctl().dispatch({ type: 'UI', patch: { anTab: id } }));
    const body = tab === 'gorunum'
      ? [viewSection(state), v.mode === 'floors' ? floorsSection(state, sd, A) : layersSection(state, sd), statsSection(A)]
      : [ui.findingList({ items: A.items, counts: A.counts }, 'Düşey düzen, cephe teması, gürültü ve dolaşım kontrolleri. Bilgi tabanı: işlev şeması bina tipi.')];
    return ui.sideShell('sb-analiz', 'Mekân analizi paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, sd, v) {
    const key = [sd.plan, P.spaces, P.meta.name, App.theme.name, v];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: App.analysis.scene(P, sd, v, true) };
    return memo.v;
  }

  function orbitDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const v = App.store.get().ui.an;
    orbit = { sx: e.clientX, sy: e.clientY, yaw: v.yaw, pitch: v.pitch, moved: false, id: e.pointerId };
  }
  function orbitMove(e) {
    if (!orbit) return;
    const dx = e.clientX - orbit.sx, dy = e.clientY - orbit.sy;
    if (!orbit.moved) {
      if (Math.hypot(dx, dy) < 5) return;
      orbit.moved = true;
      ctl().anCancel();
      try { an.svgEl.setPointerCapture(orbit.id); } catch (err) {}
      ui.orbiting = true;
    }
    ctl().anOrbit(dx, dy, orbit);
  }
  function orbitUp(e) {
    if (!orbit) return;
    const o = orbit;
    orbit = null;
    ui.orbiting = false;
    try { an.svgEl.releasePointerCapture(o.id); } catch (err) {}
    if (o.moved) ctl().an({}); // kalıcı kaydet
  }

  const poly = (pts) => pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');

  an.board = function (state, d) {
    const P = state.project;
    const sd = App.study.derive(P);
    const v = state.ui.an;
    const sc = sceneOf(P, sd, v);
    const c = ctl();
    const floors = v.mode === 'floors';
    const sel = state.selectedId;

    const hits = sc.hits.map((hi, i) => {
      if (hi.kind === 'slab') {
        return h('polygon', { key: 'h' + i, class: 'ahit ahit-slab' + (floors ? ' click' : ''), points: poly(hi.pts), fill: 'transparent', onclick: floors ? () => c.anSelect(hi.id) : null });

      return h('polygon', {
        key: 'h' + i, class: 'ahit ahit-block' + (on ? ' sel' : ''), points: poly(hi.pts), fill: 'transparent',
        onclick: (e) => { e.stopPropagation(); c.dispatch({ type: 'SELECT', id: on ? null : hi.id }); if (floors) c.an({ sel: hi.floorId }, true); },
      }, h('title', {}, hi.name + ' — ' + fmt(hi.area) + ' m²'));
    });

    const plan = sd.plan;
    const selFloor = floors && v.sel ? plan.floors.find((f) => f.id === v.sel) : null;

    const svg = h('svg', {
      id: 'pafta-analiz', class: 'board-svg board-svg-analiz', viewBox: '0 0 ' + sc.W + ' ' + sc.H, preserveAspectRatio: 'xMidYMid meet', role: 'group', tabindex: 0,
      'aria-label': 'Mekân analizi paftası. Ok tuşları döndürür, artı ve eksi tuşları patlatmayı değiştirir.',
      ref: (el) => { an.svgEl = el; },
      onpointerdown: orbitDown, onpointermove: orbitMove, onpointerup: orbitUp, onpointercancel: orbitUp,
      onkeydown: (e) => {
        const a = App.store.get().ui.an;
        const k = e.key;
        if (k === 'ArrowLeft') { e.preventDefault(); c.an({ yaw: U.clamp(a.yaw - 4, -85, 85) }); }
        else if (k === 'ArrowRight') { e.preventDefault(); c.an({ yaw: U.clamp(a.yaw + 4, -85, 85) }); }
        else if (k === 'ArrowUp') { e.preventDefault(); c.an({ pitch: U.clamp(a.pitch + 3, 12, 75) }); }
        else if (k === 'ArrowDown') { e.preventDefault(); c.an({ pitch: U.clamp(a.pitch - 3, 12, 75) }); }
        else if (k === '+' || k === '=') { e.preventDefault(); c.anCancel(); c.an({ explode: U.clamp(a.explode + 0.08, 0, 1) }); }
        else if (k === '-' || k === '_') { e.preventDefault(); c.anCancel(); c.an({ explode: U.clamp(a.explode - 0.08, 0, 1) }); }
      },
    }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'ahits' }, hits));

    const empty = !P.spaces.length;
    const stage = h('div', { class: 'board-stage' + (floors ? '' : ' is-layers') }, svg,
      selFloor ? h('div', { class: 'an-chip' }, h('b', {}, selFloor.name), h('span', { class: 'mono' }, fmt(selFloor.net) + ' m² · ' + selFloor.spaces.length + ' mekân'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Seçimi kaldır', onclick: () => c.an({ sel: null }, true) }, ui.icon('close', 14))) : null,
      empty ? ui.emptyCard('Analiz için mekân gerekli', 'İşlev Şeması’nda mekân ekleyin; Kat Etüdü katlara dağıtır, burada patlatılmış izometrik olarak incelersiniz.', [
        ui.btn('Örnek konutu yükle', { icon: 'newdoc', cls: 'btn-primary', onclick: () => c.loadTemplate('konut', '2+1') }),
        ui.btn('İşlev Şeması’na git', { icon: 'chevron', onclick: () => c.go('islev') })]) : null);

    return ui.boardPage(state, d, {
      label: 'Mekân analizi paftası',
      stage: stage,
      scale: 'Patlatılmış izometrik · plan ölçekli',
      foot: h('p', { class: 'board-hint' }, 'Sürükleyerek döndürün · bir kata tıklayarak öne çıkarın · ok ve +/− tuşları da çalışır'),
      tools: [
        { k: 'seg', label: 'Görünüm kipi', value: v.mode, options: [{ v: 'floors', label: 'Katlar' }, { v: 'layers', label: 'Katmanlar' }], onchange: (m) => c.anMode(m) },
        { k: 'sep' },
        { k: 'btn', label: v.explode > 0.5 ? 'Topla' : 'Patlat', icon: 'layers', strong: true, onclick: () => c.anToggleExplode(), title: 'Levhaları aç / kapat (animasyonlu)' },
        { k: 'icon', label: 'Görünümü sıfırla', icon: 'reset', onclick: () => c.anResetView(), title: 'Dönüş ve eğimi varsayılana al' },
        { k: 'sep' },
        { k: 'icon', label: 'Geri al', icon: 'undo', onclick: () => c.dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)' },
        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => c.dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ],
    });
  };
})();

/* ==========================================================================
   72-ctl-analysis.js — Mekân Analizi yan etkileri: görünüm durumu, animasyonlar, dışa aktarma
   Görünüm (kip, patlatma, yön, eğim, anahtarlar) state.ui.an içinde durur ve tarayıcıda hatırlanır.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const get = () => App.store.get();
  const VIEW_KEY = 'archtools.analysis.view';
  const PERSIST = ['mode', 'explode', 'yaw', 'pitch', 'labels', 'arrows', 'guides', 'volume', 'layers'];
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- görünüm durumu ---------- */
  let saveTimer = null;
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        const an = get().ui.an, o = {};
        PERSIST.forEach((k) => { o[k] = an[k]; });
        window.localStorage.setItem(VIEW_KEY, JSON.stringify(o));
      } catch (e) {}
    }, 350);
  }
  ctl.an = function (patch, silent) {
    ctl.dispatch({ type: 'UI', patch: { an: Object.assign({}, get().ui.an, patch) } });
    if (!silent) saveSoon();
  };
  ctl.loadAnView = function () {
    try {
      const o = JSON.parse(window.localStorage.getItem(VIEW_KEY) || 'null');
      if (!o || typeof o !== 'object') return;
      const def = App.analysisDefaults(), p = {};
      if (o.mode === 'floors' || o.mode === 'layers') p.mode = o.mode;
      if (typeof o.explode === 'number') p.explode = U.clamp(o.explode, 0, 1);
      if (typeof o.yaw === 'number') p.yaw = U.clamp(o.yaw, -85, 85);
      if (typeof o.pitch === 'number') p.pitch = U.clamp(o.pitch, 12, 75);
      ['labels', 'arrows', 'guides', 'volume'].forEach((k) => { if (typeof o[k] === 'boolean') p[k] = o[k]; });
      const ids = App.analysis.LAYERS.map((l) => l.id);
      if (Array.isArray(o.layers)) { const ls = o.layers.filter((x) => ids.indexOf(x) >= 0); if (ls.length) p.layers = ls; }
      ctl.dispatch({ type: 'UI', patch: { an: Object.assign({}, def, p) } });
    } catch (e) {}
  };

  /* ---------- animasyon ---------- */
  let raf = 0;
  ctl.anCancel = function () { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  // props: { anahtar: hedef } → süre boyunca yumuşak geçiş; done: bitince
  function tween(props, dur, done) {
    ctl.anCancel();
    const an0 = get().ui.an, from = {};
    Object.keys(props).forEach((k) => { from[k] = an0[k]; });
    if (reduced() || dur <= 0) { ctl.an(props, true); if (done) done(); return; }
    const t0 = performance.now();
    (function step(now) {
      const t = U.clamp((now - t0) / dur, 0, 1), e = App.iso.easeInOut(t);
      const p = {};
      Object.keys(props).forEach((k) => { p[k] = from[k] + (props[k] - from[k]) * e; });
      ctl.an(p, true);
      if (t < 1) raf = requestAnimationFrame(step); else { raf = 0; if (done) done(); }
    })(t0);
  }

  ctl.anExplode = function (to) { tween({ explode: to }, 950, saveSoon); };
  ctl.anToggleExplode = function () { ctl.anExplode(get().ui.an.explode > 0.5 ? 0 : 1); };
  ctl.anResetView = function () { const d = App.analysisDefaults(); tween({ yaw: d.yaw, pitch: d.pitch }, 450, saveSoon); };

  // kip değişimi: levhalar toplanır, yeni küme açılır
  ctl.anMode = function (mode) {
    const an = get().ui.an;
    if (an.mode === mode) return;
    const target = an.explode < 0.1 ? 1 : an.explode;
    if (reduced()) { ctl.an({ mode: mode, sel: null }); return; }
    tween({ explode: 0 }, 360, function () {
      ctl.an({ mode: mode, sel: null }, true);
      tween({ explode: target }, 620, saveSoon);
    });
  };

  ctl.anSelect = function (floorId) { const an = get().ui.an; ctl.an({ sel: an.sel === floorId ? null : floorId }, true); };
  ctl.anToggleLayer = function (id) {
    const an = get().ui.an;
    const on = an.layers.indexOf(id) >= 0;
    if (on && an.layers.length === 1) { ctl.toast('En az bir katman açık kalmalı.'); return; }
    const order = App.analysis.LAYERS.map((l) => l.id);
    ctl.an({ layers: order.filter((x) => (x === id ? !on : an.layers.indexOf(x) >= 0)) });
  };
  ctl.anOrbit = function (dx, dy, base) {
    ctl.an({ yaw: U.clamp(base.yaw + dx * 0.32, -85, 85), pitch: U.clamp(base.pitch + dy * 0.22, 12, 75) }, true);
  };

  /* ---------- dışa aktarma ---------- */
  ctl.exporters.analiz = function (kind) {
    ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (P) => {
      const sd = App.study.derive(P);
      const view = Object.assign({}, get().ui.an, { sel: null });
      const sc = App.analysis.scene(P, sd, view, false);
      return App.sheet.exportScene(sc.prims, sc.W, sc.H, P.meta.name + '-mekan-analizi', kind);
    });
  };

  /* bulgu kartından seçim: ilgili katı da öne çıkar */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    if (a.type === 'select' && get().ui.module === 'analiz') {
      const P = get().project;
      const f = P.study && P.study.floors.find((x) => x.id === P.study.assign[a.id]);
      if (f && get().ui.an.mode === 'floors') ctl.an({ sel: f.id }, true);
    }
    baseRun(a);
  };
})();

/* ==========================================================================
   90-router.js — modül gezintisi: #/islev · #/kat · #/analiz
   Geçiş: View Transitions varsa yumuşak çapraz solma, yoksa anında.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const IDS = ['islev', 'kat', 'analiz'];
  const get = () => App.store.get();

  const fromHash = function () {
    const m = /^#\/?([a-z]+)/.exec(location.hash || '');
    return m && IDS.indexOf(m[1]) >= 0 ? m[1] : null;
  };
  App.route = { fromHash: fromHash, IDS: IDS };

  function setTitle(id) {
    document.title = 'archtools · ' + App.ui.moduleInfo(id).label;
  }
  App.route.setTitle = setTitle;

  function apply(id) {
    ctl.dispatch({ type: 'UI', patch: { module: id } });
    setTitle(id);
    window.scrollTo(0, 0);
    if (App.paintNow) App.paintNow();
  }

  function switchTo(id) {
    if (get().ui.module === id) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!document.startViewTransition || reduce || (App.intro && App.intro.active)) { apply(id); return; }
    const root = document.documentElement;
    root.classList.add('vt-fade');
    const done = function () { root.classList.remove('vt-fade'); };
    try {
      const vt = document.startViewTransition(function () { apply(id); });
      vt.finished.then(done, done);
    } catch (e) { done(); apply(id); }
  }

  ctl.go = function (id) {
    if (IDS.indexOf(id) < 0 || get().ui.module === id) return;
    if (fromHash() !== id) { try { location.hash = '#/' + id; return; } catch (e) {} }
    switchTo(id);
  };

  window.addEventListener('hashchange', function () {
    switchTo(fromHash() || 'islev'); // boş adres = işlev şeması (geri düğmesiyle ilk sayfaya dönüş)
  });
})();

/* ==========================================================================
   99-main.js — archtools'u başlat: tema, ortak store, modül rotası, intro
   ========================================================================== */
(function () {
  const App = window.App;
  const h = App.h;

  // tema: URL (?style=bauhaus) > kayıtlı tercih > glass
  (function () {
    let name = 'glass';
    try {
      const q = new URLSearchParams(location.search).get('style');
      const sv = window.localStorage.getItem('archtools.style') || window.localStorage.getItem('archtools.bubble.style');
      name = q || sv || 'glass';
    } catch (e) {}
    if (!App.THEMES[name]) name = 'glass';
    App.theme.set(name);
    document.documentElement.setAttribute('data-style', name);
  })();

  App.store = App.createStore(App.state.reducer, App.state.initialState());

  // ilk modül: adres çubuğundaki rota (#/kat ...)
  const first = App.route.fromHash();
  if (first && first !== App.store.get().ui.module) App.store.dispatch({ type: 'UI', patch: { module: first } });
  App.route.setTitle(App.store.get().ui.module);
  App.ctl.loadAnView();

  function view() {
    const state = App.store.get();
    const d = App.state.derive(state);
    const t = state.ui.toast;
    const mod = state.ui.module;
    return h('div', { class: 'app s-' + App.theme.name + ' m-' + mod + (mod === 'islev' && state.ui.assistantOpen ? ' as-open' : '') },
      App.ui.header(state, d),
      App.ui.scorebar(state, d),
      App.ui.pageMain(state, d),
      h('div', { class: 'toast-zone', 'aria-live': 'polite', role: 'status' },
        t ? h('div', { key: t.id, class: 'toast toast-' + t.kind }, t.msg) : null));
  }

  const paint = App.mount(document.getElementById('root'), view);
  App.paintNow = paint;
  const schedule = App.raf(paint);

  let lastPct = null;
  let lastProject = App.store.get().project;
  let saveTimer = null;
  App.store.subscribe(function (state) {
    schedule();
    if (state.project === lastProject) return;
    lastProject = state.project;
    // otomatik kayıt (kişisel kolaylık): proje + kat etüdü ayarları birlikte
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { App.state.persist(state.project); }, 500);
    // skor eşiği kutlaması (işlev şeması)
    if (state.ui.module !== 'islev') return;
    const pc = App.state.derive(state).score.percent;
    if (lastPct != null && pc != null && lastPct < 90 && pc >= 90 && state.project.spaces.length >= 3 && !state.project.meta.example) App.ctl.toast('Harika yerleşim: verimlilik %' + pc, 'success');
    lastPct = pc;
  });

  document.addEventListener('keydown', App.ctl.onKey);
  // odak halkası yalnızca klavye gezintisinde görünür (paftada fareyle tıklayınca çerçeve çıkmasın)
  const rootEl = document.body;
  document.addEventListener('keydown', function (e) { if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) rootEl.classList.add('kbd'); }, true);
  document.addEventListener('pointerdown', function () { rootEl.classList.remove('kbd'); }, true);
  paint();
  lastPct = App.state.derive(App.store.get()).score.percent;

  // açılış animasyonu: uygulama altta hazır, intro yumuşakça çözülür
  App.intro.start(function () {
    if (App.store.get().restored) setTimeout(function () { App.ctl.toast('Son çalışmanız geri yüklendi.'); }, 250);
  });
})();

</script>
