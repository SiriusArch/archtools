        { k: 'btn', label: 'Gölge', icon: 'sun', onclick: () => c.imarView({ shadow: !v.shadow }), pressed: !!v.shadow, title: 'Gölgeyi göster / gizle' },
        { k: 'btn', label: 'Dışa aktar', icon: 'download', onclick: () => c.xmenu(!state.ui.xmenu), disabled: !s.parcel, pressed: !!state.ui.xmenu, title: 'PNG, PDF, SVG, DXF, GeoJSON, CSV' },
        { k: 'icon', label: 'Bağlantıyı kopyala', icon: 'share', onclick: () => c.shareLink(), title: 'Bu konuma giden bağlantıyı kopyala' },
        { k: 'sep' },
        { k: 'icon', label: 'Geri al', icon: 'undo', onclick: () => c.dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)' },
        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => c.dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ].filter(Boolean),
    });
  };
})();

/* ==========================================================================
   66-ctl-imar.js — İmar ve Kapasite yan etkileri: parsel çizimi / düzenleme, parametre kaydırıcıları,
   senaryolar, hazır değerler, dışa aktarma.
   Parsel koordinatları konum merkezine göre metredir (x doğu, y kuzey); proje JSON'una bu biçimle yazılır.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const Z = App.zoning;
  const site = App.site;
  const gis = App.gis;
  const GX = App.geoExport;
  const get = () => App.store.get();
  const S = () => App.ui.site;

  /* ---------------- görünüm ---------------- */
  const IV = ctl.makeView('imar', 'archtools.view.imar', ['mode', 'shadow', 'labels', 'handles', 'yaw', 'pitch', 'zx']);
  ctl.imarView = IV.set;
  ctl.loadImarView = function () {
    IV.load(function (o) {
      const p = {};
      if (o.mode === 'plan' || o.mode === 'iso') p.mode = o.mode;
      ['shadow', 'labels', 'handles'].forEach((k) => { if (typeof o[k] === 'boolean') p[k] = o[k]; });
      if (typeof o.yaw === 'number') p.yaw = U.clamp(o.yaw, -85, 85);
      if (typeof o.pitch === 'number') p.pitch = U.clamp(o.pitch, 20, 70);
      if (typeof o.zx === 'number') p.zx = U.clamp(o.zx, 1, 3);
      return p;
    });
  };

  /* ---------------- parsel ---------------- */
  const fmt = U.fmt;
  function setParcel(pts, verb) {
    const raw = Z.cleanParcel(pts);
    if (!raw) { ctl.toast('Parsel geçersiz: alan en az 20 m² olmalı ve köşeler üst üste binmemeli.', 'error'); return false; }
    if (Z.selfIntersects(raw)) { ctl.toast('Parselin kenarları birbirini kesiyor. Köşeleri sırayla, çizgiler çaprazlanmadan işaretleyin.', 'error'); return false; }
    const im = get().project.site.imar;
    ctl.dispatch({ type: 'SITE_SET', patch: { parcel: raw, imar: Z.clampImar(Object.assign({}, im, { ek: {} })) } });
    ctl.imarView({ tool: null, draft: null, tab: 'parsel' }, true);
    ctl.toast('Parsel ' + verb + ' · ' + fmt(Math.abs(gis.area(raw)), 0) + ' m²', 'success');
    return true;
  }
  ctl.imarTool = function (tool) {
    ctl.imarView({ tool: tool, draft: null, mode: tool ? 'plan' : get().ui.imar.mode }, true);
    if (tool) ctl.imarView({ tab: 'parsel' }, true);
    setTimeout(function () { const el = document.getElementById('pafta-imar'); if (tool && el) el.focus({ preventScroll: true }); }, 30);
  };
  ctl.imarFinish = function () {
    const d = get().ui.imar.draft;
    if (!d || !d.pts || d.pts.length < 3) { ctl.toast('Çokgen için en az üç köşe işaretleyin.'); return; }
    setParcel(d.pts, 'oluşturuldu');
  };
  ctl.imarUndoPoint = function () {
    const d = get().ui.imar.draft;
    if (!d || !d.pts) return;
    ctl.imarView({ draft: d.pts.length > 1 ? { pts: d.pts.slice(0, -1), cur: d.cur } : null }, true);
  };
  ctl.imarRect = function (a, b) {
    const w = Math.abs(b[0] - a[0]), d = Math.abs(b[1] - a[1]);
    if (w < 3 || d < 3 || w * d < 20) { ctl.imarView({ draft: null }, true); ctl.toast('Dikdörtgen çok küçük: sürükleyerek daha büyük bir alan seçin.'); return; }
    setParcel(Z.rectParcel(w, d, 0, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2), 'oluşturuldu');
  };
  ctl.imarParcelRect = function (w, d, rot) {
    const p = get().project.site.parcel;
    const c = p ? gis.centroid(p) : [0, 0];
    setParcel(Z.rectParcel(w, d, rot, c[0], c[1]), p ? 'güncellendi' : 'oluşturuldu');
  };
  ctl.imarRectForm = function () {
    const f = get().ui.imar.rect || { w: 20, d: 30, rot: 0 };
    ctl.imarParcelRect(f.w, f.d, f.rot);
  };
  ctl.imarClear = function () {
    ctl.dispatch({ type: 'SITE_SET', patch: { parcel: null } });
    ctl.imarView({ draft: null }, true);
    ctl.toast('Parsel kaldırıldı. Geri al ile döndürebilirsiniz.');
  };
  ctl.imarEdge = function (i) {
    const im = get().project.site.imar;
    const order = [undefined, 'on', 'yan', 'arka'];
    const nxt = order[(order.indexOf(im.ek[i]) + 1) % order.length];
    ctl.dispatch({ type: 'IMAR_EDGE', i: i, kind: nxt || null });
  };

  /* köşe sürükleme: görünüm donar (parsel kayarken pafta yeniden ölçeklenmez), tek geri-al noktası */
  ctl.imarDragStart = function (geom) {
    ctl.dispatch({ type: 'SNAPSHOT' });
    ctl.imarView({ fixed: { c: geom.c.slice(), Rv: geom.Rv } }, true);
  };
  ctl.imarDragMove = function (i, pt) {
    const st = get(), p = st.project.site.parcel, fx = st.ui.imar.fixed;
    if (!p || !fx || !p[i]) return;
    let q = pt;
    const dx = q[0] - fx.c[0], dy = q[1] - fx.c[1], lim = fx.Rv * 0.97, dl = Math.hypot(dx, dy);
    if (dl > lim) q = [Math.round((fx.c[0] + (dx / dl) * lim) * 10) / 10, Math.round((fx.c[1] + (dy / dl) * lim) * 10) / 10];
    if (p[i][0] === q[0] && p[i][1] === q[1]) return;
    const np = p.map((x, k) => (k === i ? q : x));
    if (Z.selfIntersects(np)) return;
    const cl = Z.cleanParcel(np);
    if (!cl || cl.length !== np.length) return;
    ctl.dispatch({ type: 'SITE_SET_LIVE', patch: { parcel: np } });
  };
  ctl.imarDragEnd = function () { ctl.imarView({ fixed: null }, true); };

  /* ---------------- parametreler ---------------- */
  ctl.imarSet = (patch) => ctl.dispatch({ type: 'IMAR_SET', patch: patch });
  let live = false;
  ctl.imarLive = function (patch) {
    if (!live) { live = true; ctl.dispatch({ type: 'SNAPSHOT' }); }
    ctl.dispatch({ type: 'IMAR_SET_LIVE', patch: patch });
  };
  ctl.imarLiveEnd = function () { live = false; };

  ctl.imarUse = function (id) {
    const u = Z.use(id);
    ctl.imarSet({ use: u.id, floorH: u.floorH, eff: u.eff, unit: u.unit, cars: u.cars, per: u.per });
  };
  ctl.imarPreset = function (id) {
    const P = Z.PRESETS.find((x) => x.id === id);
    if (!P) return;
    const st = get(), im = st.project.site.imar;
    if (P.ctx) {
      const cx = S().imarCtx(st), A = cx.A, f = cx.R && cx.R.facts;
      if (!A || !A.built.count) { ctl.toast('Çevre ortalaması için konum verisi gerekli.', 'error'); return; }
      const hh = f && f.ctxH ? f.ctxH : A.built.avgLevels ? A.built.avgLevels * im.floorH : null;
      const patch = { taks: Math.round(U.clamp(A.built.coverage, 0.1, 0.9) * 20) / 20, kaks: Math.round(U.clamp(A.built.far, 0.2, 8) * 10) / 10 };
      if (hh) patch.hmax = Math.max(3, Math.round(hh * 2) / 2);
      ctl.dispatch({ type: 'IMAR_PRESET', patch: patch });
      ctl.toast('Çevre ortalaması uygulandı · TAKS ' + fmt(patch.taks, 2) + ' · KAKS ' + fmt(patch.kaks, 2) + (patch.hmax ? ' · ' + fmt(patch.hmax, 1) + ' m' : ''), 'success');
      return;
    }
    const patch = Object.assign({}, P.v);
    if (P.v.use !== im.use) { const u = Z.use(P.v.use); Object.assign(patch, { eff: u.eff, unit: u.unit, cars: u.cars, per: u.per }); }
    ctl.dispatch({ type: 'IMAR_PRESET', patch: patch });
    ctl.toast(P.label + ' değerleri uygulandı', 'success');
  };

  /* ---------------- senaryolar ---------------- */
  ctl.imarScnSave = function (name) {
    const st = get(), s = st.project.site, im = s.imar;
    const cx = S().imarCtx(st);
    if (!cx.R.ok) { ctl.toast('Önce geçerli bir parsel ve kütle gerekli.', 'error'); return; }
    if (im.scn.length >= 4) { ctl.toast('En çok dört senaryo saklanır; birini silin.', 'error'); return; }
    const p = { use: im.use, taks: im.taks, kaks: im.kaks, hmax: im.hmax, floorH: im.floorH, setback: im.setback, ek: im.ek, form: im.form, eff: im.eff, unit: im.unit, cars: im.cars, per: im.per, basement: im.basement };
    const nm = String(name || '').trim() || 'Senaryo ' + (im.scn.length + 1);
    ctl.dispatch({ type: 'IMAR_SCN_SAVE', name: nm, p: p, sum: Z.summary(cx.R, im) });
    ctl.toast('“' + nm + '” kaydedildi', 'success');
  };
  ctl.imarScnApply = function (id) { ctl.dispatch({ type: 'IMAR_SCN_APPLY', id: id }); ctl.toast('Senaryo uygulandı', 'success'); };
  ctl.imarScnDel = function (id) { ctl.dispatch({ type: 'IMAR_SCN_DEL', id: id }); };

  /* ---------------- dışa aktarma ---------------- */
  ctl.siteExporters.imar = function (kind) {
    const st = get(), P = st.project, s = P.site;
    if (!s.parcel) throw new Error('Önce bir parsel çizin.');
    const cx = S().imarCtx(st), R = cx.R, A = cx.A, e = cx.e;
    const view = Object.assign({}, st.ui.imar, { mode: st.ui.imar.mode === 'iso' ? 'iso' : 'plan', fixed: null, tool: null, draft: null, lod: false });
    const sc = App.imarScene.scene(P, A, R, view, false);
    return ctl.siteWrite(kind, {
      name: P.meta.name + '-imar-kapasite', prims: sc.prims, W: sc.W, H: sc.H,
      features: () => GX.collectImar(P, A, R), lat0: e ? e.data.lat0 : s.loc.lat, lon0: e ? e.data.lon0 : s.loc.lon,
      meta: { module: 'imar-kapasite', location: s.loc.name, note: 'İmar değerleri kullanıcı girdisidir.' },
      csv: () => GX.csvImar(P, R),
    });
  };
  ctl.exporters.imar = (kind) => ctl.siteExport('imar', kind === 'png' ? 'png' : 'pdf');

  /* ---------------- eylemler ve klavye ---------------- */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    if (a.type === 'imarTab') { ctl.imarView({ tab: a.tab }); return; }
    if (a.type === 'imarShadow') { ctl.imarView({ shadow: true, tab: 'parsel' }); return; }
    baseRun(a);
  };
  document.addEventListener('keydown', function (e) {
    const st = get();
    if (st.ui.module !== 'imar' || !st.ui.imar.tool) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'Escape') { e.preventDefault(); ctl.imarTool(null); }
    else if (st.ui.imar.tool === 'draw' && e.key === 'Enter') { e.preventDefault(); ctl.imarFinish(); }
    else if (st.ui.imar.tool === 'draw' && e.key === 'Backspace') { e.preventDefault(); ctl.imarUndoPoint(); }
  });
})();

/* ==========================================================================
   67-ui-yer.js — Modül 6 arayüzü: Yer Seçimi
   İki kip (project.cand.mode):
     Karşılaştır — aday konumlar Arsa Analizi ölçütleriyle sıralanır; filtre ve ağırlıkla elenir/ağırlanır.
     Konum bul   — seçili konumun çevresinde ızgara taraması: skor ısı haritası ve en iyi noktalar.
   Sol panel: Adaylar · Ölçütler · Bulgular. Pafta: App.selScene (çoklu harita + sıralama ya da ısı haritası).
   ========================================================================== */
(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const U = App.util;
  const fmt = U.fmt;
  const site = App.site;
  const sel = App.select;
  const ctl = () => App.ctl;
  const S = ui.site;
  const Y = (ui.yer = {});

  const NOISE = { sessiz: 'Sessiz', orta: 'Orta', gurultulu: 'Gürültülü' };
  const srcLabel = (c) => (c.src === 'demo' ? 'demo' : c.src === 'tarama' ? 'tarama önerisi' : c.src === 'osm' ? 'adres' : 'koordinat');

  /* ---------------- aday kartı ---------------- */
  function candCard(state, row) {
    const P = state.project, c = row.c, on = P.cand.sel === c.id;
    const rank = row.rank;
    const body = row.ready
      ? h('div', { class: 'cc-res' },
        h('b', { class: 'cc-score mono' }, '%' + row.score),
        h('span', { class: 'cc-state ' + (row.pass ? 'ok' : 'bad') }, row.pass ? 'Filtreleri geçti' : 'Elendi'),
        row.fail.length ? h('p', { class: 'cc-fail' }, row.fail.join(' · ')) : null,
        row.strong && row.strong.length ? h('p', { class: 'cc-sw good' }, '▲ ' + row.strong.map((x) => x.label).join(', ')) : null,
        row.weak && row.weak.length ? h('p', { class: 'cc-sw weak' }, '▼ ' + row.weak.map((x) => x.label).join(', ')) : null)
      : h('div', { class: 'cc-res' }, h('span', { class: 'cc-state wait' }, 'Veri bekliyor'),
        ui.btn('Verileri çek', { icon: 'download', onclick: () => ctl().selFetch([c.id]), disabled: !!(state.ui.geo && state.ui.geo.busy) }));
    return h('li', { key: c.id, class: 'cc' + (on ? ' sel' : '') + (row.ready && !row.pass ? ' out' : '') },
      h('div', { class: 'cc-top' },
        h('span', { class: 'cc-rank mono' + (rank === 1 && row.pass ? ' first' : '') }, rank ? String(rank) : '–'),
        h('label', { class: 'sr', for: 'cn-' + c.id }, 'Aday adı'),
        h('input', { id: 'cn-' + c.id, class: 'inp cc-name', type: 'text', maxlength: 60, value: c.name, keep: true, onfocus: () => ctl().candSelect(c.id), onchange: (e) => ctl().candRename(c.id, e.target.value), onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); } }),
        h('button', { type: 'button', class: 'icon-btn', title: 'Adayı sil', 'aria-label': c.name + ' adayını sil', onclick: () => ctl().candRemove(c.id) }, ui.icon('trash', 15))),
      h('p', { class: 'cc-sub mono' }, c.lat.toFixed(4) + ', ' + c.lon.toFixed(4) + ' · ' + srcLabel(c)),
      body,
      h('div', { class: 'cc-act' }, ui.btn('Arsa analizinde aç', { icon: 'chevron', onclick: () => ctl().candOpen(c.id), title: 'Bu adayı Arsa Analizi’nde ayrıntılı incele' })));
  }

  function candidatesSection(state, cx) {
    const P = state.project, rows = cx.cmp.rows;
    const g = state.ui.geo || S.GEO0;
    return ui.section('Adaylar', h('div', { class: 'sec-box' },
      rows.length ? h('ul', { class: 'cands' }, rows.map((r) => candCard(state, r))) : h('p', { class: 'note' }, 'Henüz aday yok. Bir adres arayın, mevcut konumu ekleyin ya da demo adaylarla deneyin.'),
      rows.length && rows.some((r) => !r.ready) ? ui.btn('Eksik verileri çek', { icon: 'download', cls: 'btn-wide', onclick: () => ctl().selFetch(), disabled: !!g.busy }) : null,
      rows.length >= 2 ? ui.btn('Tümünü temizle', { icon: 'trash', cls: 'btn-wide', onclick: () => ctl().candClear() }) : null), rows.length + '/8', 'ycands');
  }

  function addSection(state) {
    const P = state.project, s = P.site, c = ctl();
    const full = P.cand.list.length >= 8;
    const already = P.cand.list.some((x) => (s.loc.src === 'demo' ? x.src === 'demo' && x.dx === s.loc.dx && x.dy === s.loc.dy : Math.abs(x.lat - s.loc.lat) < 1e-4 && Math.abs(x.lon - s.loc.lon) < 1e-4));
    return ui.section('Aday ekle', h('div', { class: 'sec-box' },
      S.searchBox(state, { id: 'yer-q', pickLabel: full ? 'Dolu' : 'Aday ekle', placeholder: 'Aday adres ya da koordinat', onPick: (r) => c.candAdd(r) }),
      h('div', { class: 'tool-row' },
        ui.btn('Arsa konumunu ekle', { icon: 'pin', onclick: () => c.candAddSite(), disabled: full || already, title: 'Arsa Analizi’ndeki geçerli konum: ' + s.loc.name }),
        ui.btn('Demo adaylar', { icon: 'layers', onclick: () => c.candDemo(), disabled: full, title: 'Sentetik kentte üç aday ekle' })),
      full ? h('p', { class: 'note' }, 'En çok sekiz aday karşılaştırılır.') : null), null, 'yadd');
  }

  function scanSection(state, cx) {
    const P = state.project, s = P.site, c = ctl();
    const e = site.entry(s);
    const g = state.ui.geo || S.GEO0;
    const sc = c.yerScanFor(state), stale = c.yerScanStale(state);
    const peaks = sc ? sc.peaks : [];
    return ui.section('Konum tarama', h('div', { class: 'sec-box' },
      h('p', { class: 'note' }, 'Tarama, “' + s.loc.name + '” çevresinde ızgara hücrelerinin yaklaşık skorunu hesaplar (yürüme ağına dayalı). Merkezi değiştirmek için Arsa Analizi’nde konum seçin.'),
      ui.range({ id: 'yer-step', label: 'Izgara aralığı', min: 60, max: 250, step: 10, value: P.cand.scan.step, text: P.cand.scan.step + ' m', oninput: (x) => c.candScanLive({ step: x }), onchange: () => c.candLiveEnd(), hint: 'Küçük aralık daha ayrıntılı, daha yavaş.' }),
      ui.range({ id: 'yer-n', label: 'Öneri sayısı', min: 1, max: 8, step: 1, value: P.cand.scan.n, text: String(P.cand.scan.n), oninput: (x) => c.candScanLive({ n: x }), onchange: () => c.candLiveEnd() }),
      ui.btn(sc && !stale ? 'Yeniden tara' : 'Tara', { icon: 'target', cls: 'btn-primary btn-wide', onclick: () => c.yerRun(), disabled: !e || !!g.busy, title: e ? 'Izgara taramasını başlat' : 'Önce konum verisi gerekli' }),
      stale ? h('p', { class: 'note warn' }, 'Ayarlar değişti; sonuç eski. Yeniden tarayın.') : null,
      sc && !stale ? h('div', { class: 'kv-grid' },
        h('div', {}, h('span', { class: 'kv-k' }, 'Hücre'), h('b', { class: 'kv-v mono' }, String(sc.validN))),
        h('div', {}, h('span', { class: 'kv-k' }, 'Filtreyi geçen'), h('b', { class: 'kv-v mono' }, String(sc.passN))),
        h('div', {}, h('span', { class: 'kv-k' }, 'Skor'), h('b', { class: 'kv-v mono' }, '%' + sc.min + '–%' + sc.max))) : null,
      sc && !stale ? (peaks.length ? h('ul', { class: 'peaks' }, peaks.map((p, i) => h('li', { key: i, class: 'peak' },
        h('span', { class: 'cc-rank mono' + (i === 0 ? ' first' : '') }, String(i + 1)),
        h('span', { class: 'peak-s mono' }, '%' + p.score),
        h('span', { class: 'peak-xy mono' }, Math.round(p.x) + ', ' + Math.round(p.y) + ' m'),
        h('button', { type: 'button', class: 'btn', onclick: () => c.yerPick({ x: p.x, y: p.y }), title: 'Haritada ayrıntıyı göster' }, 'Göster'),
        h('button', { type: 'button', class: 'btn', onclick: () => c.yerPeakToCand(i), disabled: P.cand.list.length >= 8, title: 'Aday olarak ekle ve karşılaştırmaya al' }, 'Aday yap')))) : h('p', { class: 'note' }, 'Filtreleri geçen nokta yok. “Ölçütler” sekmesinden eşikleri gevşetin.')) : null), null, 'yscan');
  }

  function adaylarTab(state, cx) {
    const P = state.project, c = ctl();
    const out = [ui.section('Kip', h('div', { class: 'sec-box' },
      ui.segmented({ label: 'Yer seçimi kipi', wide: true, value: P.cand.mode, options: [{ v: 'karsilastir', label: 'Karşılaştır', title: 'Aday konumları sırala' }, { v: 'bul', label: 'Konum bul', title: 'Çevrede en uygun noktayı tara' }], onchange: (m) => c.candMode(m) }),
      h('p', { class: 'note' }, P.cand.mode === 'bul' ? 'Seçili konumun çevresini tarar; en uygun noktaları ısı haritasında gösterir.' : 'Aday konumların aynı ölçütlerle puanlanıp sıralanmasını sağlar.')), null, 'ymode')];
    if (P.cand.mode === 'bul') out.push(scanSection(state, cx));
    out.push(addSection(state));
    out.push(candidatesSection(state, cx));
    return out;
  }

  /* ---------------- ölçütler ---------------- */
  function olcutTab(state, cx) {
    const P = state.project, s = P.site, c = ctl(), cand = P.cand;
    const w = cx.cmp.w;
    const T = site.template(s.template);
    const out = [];
    out.push(ui.section('Analiz ayarları', h('div', { class: 'sec-box' },
      ui.fld2('Program', h('select', { id: 'yer-tpl', class: 'inp', value: s.template, onchange: (e) => c.siteSet({ template: e.target.value }) }, site.TEMPLATES.map((t) => h('option', { key: t.id, value: t.id }, t.label))), T.desc),
      ui.range({ id: 'yer-r', label: 'Yarıçap', min: 250, max: 1000, step: 50, value: s.radius, text: s.radius + ' m', oninput: (x) => c.siteLive({ radius: x }), onchange: () => c.siteLiveEnd() }),
      ui.fld2('Yürüme süresi', ui.segmented({ label: 'Yürüme süresi', wide: true, value: s.walkMin, options: [{ v: 5, label: '5 dk' }, { v: 10, label: '10 dk' }, { v: 15, label: '15 dk' }], onchange: (v) => c.siteSet({ walkMin: v }) })),
      h('p', { class: 'note' }, 'Bu ayarlar Arsa Analizi ile ortaktır; tüm adaylara aynı ölçüde uygulanır.')), null, 'yset'));
    out.push(ui.section('Ağırlıklar', h('div', { class: 'sec-box' },
      site.PARTS.map((p) => ui.range({ id: 'yw-' + p.id, label: p.label, min: 0, max: 100, step: 5, value: Math.round((w[p.id] || 0) * 100), text: '%' + Math.round((w[p.id] || 0) * 100), hint: null, oninput: (x) => c.candWeightLive(p.id, x / 100), onchange: () => c.candLiveEnd() })),
      h('p', { class: 'note' }, 'Ağırlıklar toplamı otomatik 1’e oranlanır. ' + (cand.w ? 'Özel ağırlıklar kullanılıyor.' : '“' + T.label + '” programının ağırlıkları kullanılıyor.')),
      cand.w ? ui.btn('Programdan al', { icon: 'reset', cls: 'btn-wide', onclick: () => c.candWeightReset() }) : null), cand.w ? 'özel' : null, 'yw'));
    out.push(ui.section('Filtreler', h('div', { class: 'sec-box' },
      h('p', { class: 'note' }, 'Açık filtreler eşiği geçemeyen adayları (ve tarama hücrelerini) eler.'),
      sel.FILTERS.map((fl) => {
        const on = !!cand.f.on[fl.id], v = cand.f.v[fl.id];
        const text = fl.ord ? NOISE[sel.NOISE_ORD[Math.round(v)]] : fl.id === 'skor' ? '%' + Math.round(v) : Math.round(v) + ' dk';
        return h('div', { key: fl.id, class: 'flt' + (on ? ' on' : '') },
          ui.toggle({ label: fl.label, on: on, onclick: () => c.candFilter(fl.id, { on: !on }), title: fl.sub }),
          on ? ui.range({ id: 'yf-' + fl.id, label: fl.id === 'skor' ? 'En az' : 'En çok', min: fl.id === 'gurultu' ? 0 : fl.id === 'skor' ? 0 : 1, max: fl.max, step: fl.step, value: v, text: text, hint: null, oninput: (x) => c.candFilterLive(fl.id, x), onchange: () => c.candLiveEnd() }) : null);
      })), null, 'yflt'));
    return out;
  }

  Y.sidebar = function (state) {
    const cx = S.yerCtx(state);
    const P = state.project;
    const items = sel.findings(cx.cmp, P.cand);
    const cn = { hata: 0, uyari: 0, oneri: 0 };
    items.forEach((i) => { if (cn[i.level] != null) cn[i.level]++; });
    const tab = state.ui.yer.tab || 'adaylar';
    const tabs = ui.tabsBar([
      { id: 'adaylar', label: 'Adaylar', n: P.cand.list.length || null },
      { id: 'olcut', label: 'Ölçütler' },
      { id: 'bulgular', label: 'Bulgular', n: P.cand.list.length ? cn.hata + cn.uyari + cn.oneri : null, warn: cn.hata + cn.uyari > 0 },
    ], tab, (id) => ctl().yerView({ tab: id }));
    let body;
    if (tab === 'adaylar') body = adaylarTab(state, cx);
    else if (tab === 'olcut') body = olcutTab(state, cx);
    else body = [ui.findingList({ items: items, counts: cn }, 'Aday konumların sıralaması, filtre sonuçları ve karar için dikkat edilecek noktalar.')];
    return ui.sideShell('sb-yer', 'Yer seçimi paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, cx, scan, entry, view) {
    const key = [P.site, P.cand, P.meta.name, cx.cmp, scan, entry, App.theme.name, view];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: App.selScene.scene(P, { cmp: cx.cmp, scan: scan, entry: entry }, view, true) };
    return memo.v;
  }

  Y.board = function (state, d) {
    const P = state.project, s = P.site, cand = P.cand, c = ctl();
    const cx = S.yerCtx(state);
    const mode = cand.mode;
    const entry = site.entry(s);
    const scan = mode === 'bul' ? c.yerScanFor(state) : null;
    const g = state.ui.geo || S.GEO0;
    let stage;
    if (mode === 'bul' && !entry) stage = h('div', { class: 'board-stage' }, h('div', { class: 'board-ghost' }), S.noData(state, 'Tarama için konum verisi gerekli'));
    else {
      const view = { mode: mode, pick: state.ui.yer.pick };
      const sc = sceneOf(P, cx, scan, entry, view);
      Y.geom = sc.geom;
      const hits = (sc.hits || []).map((hi, i) => {
        if (hi.kind === 'cand') return h('rect', { key: 'c' + i, class: 'ahit click', x: hi.x0, y: hi.y0, width: hi.x1 - hi.x0, height: hi.y1 - hi.y0, fill: 'transparent', onclick: () => c.candSelect(hi.id) });
        if (hi.kind === 'peak') return h('circle', { key: 'p' + i, class: 'ahit click', cx: hi.x, cy: hi.y, r: Math.max(hi.r, 10), fill: 'transparent', onclick: (e) => { e.stopPropagation(); c.yerPick({ x: hi.cx, y: hi.cy }); } });
        return null;
      });
      const svg = h('svg', {
        id: 'pafta-yer', class: 'board-svg board-svg-yer', viewBox: '0 0 ' + sc.W + ' ' + sc.H, preserveAspectRatio: 'xMidYMid meet', role: 'group', tabindex: 0,
        'aria-label': mode === 'bul' ? 'Yer seçimi paftası: ' + s.loc.name + ' çevresinde konum taraması' : 'Yer seçimi paftası: ' + cand.list.length + ' aday karşılaştırması',
        ref: (el) => { Y.svgEl = el; },
        onclick: (e) => {
          if (mode !== 'bul' || !scan || !sc.geom) return;
          const w = S.toWorld(Y.svgEl, e), gm = sc.geom;
          const px = (w.x - gm.cx) / gm.s, py = -(w.y - gm.cy) / gm.s;
          if (Math.hypot(px, py) > gm.R) { if (state.ui.yer.pick) c.yerPick(null); return; }
          const half = scan.step / 2;
          const cell = scan.cells.find((q) => q.score != null && Math.abs(q.x - px) <= half && Math.abs(q.y - py) <= half);
          c.yerPick(cell ? { x: cell.x, y: cell.y } : null);
        },
      }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'ahits' }, hits));
      let overlay = null;
      if (mode === 'karsilastir' && !cand.list.length) {
        overlay = ui.emptyCard('Karşılaştırılacak aday yok', 'Aday konumları adres ya da koordinatla ekleyin; aynı ölçütlerle puanlanıp sıralanır. Hemen denemek için demo adaylar da var.', [
          ui.btn('Demo adayları ekle', { icon: 'layers', cls: 'btn-primary', onclick: () => c.candDemo() }),
          ui.btn('Arsa konumunu ekle', { icon: 'pin', onclick: () => c.candAddSite() })], 'at-map');
      } else if (mode === 'bul' && !scan && !g.busy) {
        overlay = ui.emptyCard('Konum taraması', '“' + s.loc.name + '” çevresinde ızgara hücrelerinin skorunu hesaplar; en uygun noktaları ısı haritasında gösterir.', [
          ui.btn('Taramayı başlat', { icon: 'target', cls: 'btn-primary', onclick: () => c.yerRun() })], 'at-map');
      } else if (g.busy === 'scan') {
        overlay = ui.emptyCard('Taranıyor', g.msg || 'Hücreler hesaplanıyor…', [], 'at-map');
      }
      stage = h('div', { class: 'board-stage' }, svg, overlay, S.exportMenu(state, S.EXPORTS.yer, (k) => c.siteExport('yer', k)));
    }
    const best = cx.cmp.best || cx.cmp.ranked[0];
    return ui.boardPage(state, d, {
      label: 'Yer seçimi paftası',
      stage: stage,
      scale: mode === 'bul' ? (scan ? 'Izgara ' + scan.step + ' m · ' + scan.validN + ' hücre' : 'Tarama bekleniyor') : cand.list.length + ' aday' + (best ? ' · en iyi %' + best.score : ''),
      foot: h('p', { class: 'board-hint' }, mode === 'bul' ? 'Haritada bir hücreye tıklayarak ayrıntısını görün · numaralı noktalar en uygun öneriler' : 'Bir aday kartına tıklayarak vurgulayın · sıralama ağırlık ve filtrelere göre güncellenir'),
      tools: [
        { k: 'seg', label: 'Yer seçimi kipi', value: mode, options: [{ v: 'karsilastir', label: 'Karşılaştır' }, { v: 'bul', label: 'Konum bul' }], onchange: (m) => c.candMode(m) },
        { k: 'sep' },
        mode === 'bul' ? { k: 'btn', label: scan ? 'Yeniden tara' : 'Tara', icon: 'target', strong: true, onclick: () => c.yerRun(), disabled: !entry || !!g.busy, title: 'Izgara taramasını çalıştır' } : { k: 'btn', label: 'Aday ekle', icon: 'plus', strong: true, onclick: () => { c.yerView({ tab: 'adaylar' }); setTimeout(() => { const el = document.getElementById('yer-q'); if (el) el.focus(); }, 40); }, title: 'Aday konum ekle' },
        { k: 'btn', label: 'Dışa aktar', icon: 'download', onclick: () => c.xmenu(!state.ui.xmenu), disabled: mode === 'bul' ? !scan : !cx.cmp.ranked.length, pressed: !!state.ui.xmenu, title: 'PNG, PDF, SVG, GeoJSON, CSV' },
        { k: 'icon', label: 'Bağlantıyı kopyala', icon: 'share', onclick: () => c.shareLink(), title: 'Bu konuma giden bağlantıyı kopyala' },
        { k: 'sep' },
        { k: 'icon', label: 'Geri al', icon: 'undo', onclick: () => c.dispatch({ type: 'UNDO' }), disabled: !state.past.length, title: 'Geri al (Ctrl+Z)' },
        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => c.dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ],
    });
  };
})();

/* ==========================================================================
   68-ctl-yer.js — Yer Seçimi yan etkileri: aday yönetimi, ağırlık / filtre kaydırıcıları, ızgara taraması,
   eksik veri çekme, dışa aktarma.
   Tarama sonucu (pahalı) denetleyicide saklanır; ayarlar değişince "eski" sayılır, yeniden tara denir.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const site = App.site;
  const osm = App.osm;
  const sel = App.select;
  const GX = App.geoExport;
  const get = () => App.store.get();
  const S = () => App.ui.site;

  const YV = ctl.makeView('yer', 'archtools.view.yer', []);
  ctl.yerView = YV.set;
  ctl.yerPick = (p) => YV.set({ pick: p }, true);

  /* ---------------- aday yönetimi ---------------- */
  ctl.candMode = function (m) { ctl.dispatch({ type: 'CAND_SET', patch: { mode: m } }); ctl.yerView({ pick: null }, true); };
  ctl.candSelect = function (id) { if (get().project.cand.sel !== id) ctl.dispatch({ type: 'CAND_SET', patch: { sel: id } }); };
  ctl.candRename = function (id, name) { const n = String(name || '').trim(); if (n) ctl.dispatch({ type: 'CAND_UPDATE', id: id, patch: { name: n.slice(0, 60) } }); };
  ctl.candRemove = function (id) { ctl.dispatch({ type: 'CAND_REMOVE', id: id }); };
  ctl.candClear = function () { ctl.dispatch({ type: 'CAND_CLEAR' }); ctl.toast('Adaylar temizlendi. Geri al ile döndürebilirsiniz.'); };

  function newCand(o) { return { id: U.uid(), name: o.name, lat: o.lat, lon: o.lon, src: o.src, dx: o.dx || 0, dy: o.dy || 0, note: '' }; }

  ctl.candAdd = function (r) {
    const P = get().project;
    if (P.cand.list.length >= 8) { ctl.toast('En çok sekiz aday eklenebilir.', 'error'); return; }
    const before = P.cand.list.length;
    ctl.dispatch({ type: 'CAND_ADD', c: { name: String(r.name || '').split(',').slice(0, 2).join(',').trim() || r.lat.toFixed(4) + ', ' + r.lon.toFixed(4), lat: r.lat, lon: r.lon, src: r.kind ? 'osm' : 'koordinat' } });
    ctl.geo({ results: [], q: '', searched: false, err: null });
    const list = get().project.cand.list;
    if (list.length === before) { ctl.toast('Bu konum zaten aday olarak ekli.'); return; }
    ctl.toast('Aday eklendi', 'success');
    ctl.selFetch([list[list.length - 1].id]);
  };
  ctl.candAddSite = function () {
    const s = get().project.site, loc = s.loc;
    if (get().project.cand.list.length >= 8) { ctl.toast('En çok sekiz aday eklenebilir.', 'error'); return; }
    ctl.dispatch({ type: 'CAND_ADD', c: { name: loc.name.split(',').slice(0, 2).join(',').trim(), lat: loc.lat, lon: loc.lon, src: loc.src === 'demo' ? 'demo' : loc.src, dx: loc.dx || 0, dy: loc.dy || 0 } });
    const list = get().project.cand.list, last = list[list.length - 1];
    if (last && loc.src !== 'demo') ctl.selFetch([last.id]);
  };
  ctl.candDemo = function () {
    const P = get().project;
    const room = 8 - P.cand.list.length;
    if (room <= 0) { ctl.toast('En çok sekiz aday eklenebilir.', 'error'); return; }
    const spots = [[0, 0, 'Merkez'], [420, 300, 'Kuzeydoğu'], [-380, -260, 'Güneybatı'], [-340, 330, 'Kuzeybatı']].filter((p) => !P.cand.list.some((x) => x.src === 'demo' && x.dx === p[0] && x.dy === p[1])).slice(0, Math.min(3, room));
    if (!spots.length) { ctl.toast('Demo adaylar zaten ekli.'); return; }
    const add = spots.map((p) => { const l = osm.demoLoc(p[0], p[1], p[2]); return newCand({ name: 'Demo · ' + p[2], lat: l.lat, lon: l.lon, src: 'demo', dx: p[0], dy: p[1] }); });
    ctl.dispatch({ type: 'CAND_SET', patch: { list: P.cand.list.concat(add), sel: add[0].id, mode: 'karsilastir' }, history: true });
    ctl.toast(add.length + ' demo aday eklendi', 'success');
  };
  // adayı Arsa Analizi'nde aç: aday konum, projenin konumu olur
  ctl.candOpen = function (id) {
    const c = get().project.cand.list.find((x) => x.id === id);
    if (!c) return;
    const loc = c.src === 'demo' ? osm.demoLoc(c.dx, c.dy, c.name) : { lat: c.lat, lon: c.lon, name: c.name, src: c.src === 'tarama' ? 'koordinat' : c.src };
    ctl.dispatch({ type: 'SITE_SET', patch: { loc: loc, parcel: null } });
    ctl.go('arsa');
    ctl.siteFetch(false);
  };
  ctl.yerPeakToCand = function (i) {
    const st = get(), P = st.project, sc = ctl.yerScanFor(st);
    if (!sc || !sc.peaks[i]) return;
    if (P.cand.list.length >= 8) { ctl.toast('En çok sekiz aday eklenebilir.', 'error'); return; }
    const p = sc.peaks[i], loc = P.site.loc;
    const ll = sc.proj.inv(p.x, p.y);
    const name = 'Öneri ' + (i + 1) + ' (%' + p.score + ')';
    let c;
    if (loc.src === 'demo') { const dl = osm.demoLoc((loc.dx || 0) + p.x, (loc.dy || 0) + p.y, name); c = newCand({ name: name, lat: dl.lat, lon: dl.lon, src: 'demo', dx: Math.round((loc.dx || 0) + p.x), dy: Math.round((loc.dy || 0) + p.y) }); }
    else c = newCand({ name: name, lat: Math.round(ll[0] * 1e6) / 1e6, lon: Math.round(ll[1] * 1e6) / 1e6, src: 'tarama' });
    ctl.dispatch({ type: 'CAND_SET', patch: { list: P.cand.list.concat([c]), sel: c.id }, history: true });
    ctl.toast('Öneri aday olarak eklendi; karşılaştırma kipinde sıralanır.', 'success');
    if (c.src !== 'demo') ctl.selFetch([c.id]);
  };

  /* ---------------- eksik veriyi çek (sırayla) ---------------- */
  let fetching = false;
  ctl.selFetch = function (ids) {
    if (fetching) return;
    const st = get(), P = st.project, set = sel.settingsOf(P.site);
    const todo = P.cand.list.filter((c) => c.src !== 'demo' && (!ids || ids.indexOf(c.id) >= 0) && !sel.entryOf(c, set));
    if (!todo.length) { ctl.geo({ tick: (get().ui.geo.tick || 0) + 1 }); return; }
    fetching = true;
    const Rf = osm.needRadius(set.radius, set.walkMin);
    let i = 0;
    const next = function () {
      if (i >= todo.length) { fetching = false; ctl.geo({ busy: null, msg: '', tick: (get().ui.geo.tick || 0) + 1 }); ctl.toast('Aday verileri hazır', 'success'); return; }
      const c = todo[i++];
      ctl.geo({ busy: 'fetch', msg: 'Aday ' + i + '/' + todo.length + ': ' + c.name.slice(0, 28) + ' verisi alınıyor…', err: null });
      osm.fetchAll(c.lat, c.lon, Rf, (m) => ctl.geo({ msg: 'Aday ' + i + '/' + todo.length + ': ' + m })).then(function () {
        ctl.geo({ tick: (get().ui.geo.tick || 0) + 1 });
        next();
      }).catch(function (e) {
        fetching = false;
        ctl.geo({ busy: null, msg: '', err: (e && e.message && App.osm.netMsg(e)) || 'Veri alınamadı.', tick: (get().ui.geo.tick || 0) + 1 });
      });
    };
    next();
  };

  /* ---------------- ağırlık ve filtre ---------------- */
  let live = false;
  const liveStart = function () { if (!live) { live = true; ctl.dispatch({ type: 'SNAPSHOT' }); } };
  ctl.candLiveEnd = function () { live = false; };
  ctl.candWeightLive = function (id, v) {
    liveStart();
    const P = get().project;
    const w = Object.assign({}, sel.weights(P.cand, P.site.template));
    w[id] = v;
    ctl.dispatch({ type: 'CAND_SET_LIVE', patch: { w: w } });
  };
  ctl.candWeightReset = function () { ctl.dispatch({ type: 'CAND_SET', patch: { w: null }, history: true }); };
  ctl.candFilter = function (id, o) {
    const f = get().project.cand.f;
    ctl.dispatch({ type: 'CAND_SET', patch: { f: { on: Object.assign({}, f.on, 'on' in o ? { [id]: o.on } : {}), v: Object.assign({}, f.v, 'v' in o ? { [id]: o.v } : {}) } }, history: true });
  };
  ctl.candFilterLive = function (id, v) {
    liveStart();
    const f = get().project.cand.f;
    ctl.dispatch({ type: 'CAND_SET_LIVE', patch: { f: { on: f.on, v: Object.assign({}, f.v, { [id]: v }) } } });
  };
  ctl.candScanLive = function (patch) {
    liveStart();
    ctl.dispatch({ type: 'CAND_SET_LIVE', patch: { scan: Object.assign({}, get().project.cand.scan, patch) } });
  };

  /* ---------------- ızgara taraması ---------------- */
  let scanRes = null; // { key, res }
  const scanKey = function (st) {
    const P = st.project, s = P.site;
    return JSON.stringify([s.loc.lat, s.loc.lon, s.loc.src, s.loc.dx || 0, s.loc.dy || 0, s.radius, s.walkMin, s.template, P.cand.f, P.cand.w, P.cand.scan.step, P.cand.scan.n]);
  };
  // tarama yalnızca anahtarı eşleşirse geçerli (ayar değişince eski sonuç gösterilmez)
  ctl.yerScanFor = function (st) {
    if (!scanRes) return null;
    // yalnızca "veri tick"i değil ayarlar da eşleşmeli; tick, tarama sonrası değişmediyse aynıdır
    return scanRes.key === scanKey(st) ? scanRes.res : null;
  };
  ctl.yerScanStale = (st) => !!scanRes && scanRes.key !== scanKey(st);
  ctl.yerRun = function () {
    const st = get(), P = st.project, s = P.site;
    const e = site.entry(s);
    if (!e) { ctl.toast('Önce konum verisi gerekli.', 'error'); return; }
    if (st.ui.geo.busy) return;
    ctl.geo({ busy: 'scan', msg: 'Hücreler hesaplanıyor…', err: null });
    ctl.yerPick(null);
    setTimeout(function () {
      try {
        const cur = get();
        const set = sel.settingsOf(cur.project.site);
        const res = sel.scan(e, set, { step: cur.project.cand.scan.step, n: cur.project.cand.scan.n, w: sel.weights(cur.project.cand, set.template), f: cur.project.cand.f });
        ctl.geo({ busy: null, msg: '' });
        scanRes = { key: scanKey(get()), res: res };
        ctl.geo({ tick: (get().ui.geo.tick || 0) }); // yeniden çiz
        ctl.toast(res.peaks.length ? 'Tarama tamamlandı · ' + res.peaks.length + ' öneri noktası' : 'Tarama tamamlandı · filtreleri geçen nokta yok', res.peaks.length ? 'success' : 'info');
      } catch (err) {
        ctl.geo({ busy: null, msg: '', err: 'Tarama yapılamadı: ' + (err && err.message ? err.message : 'beklenmeyen hata') });
      }
    }, 40);
  };

  /* ---------------- dışa aktarma ---------------- */
  ctl.siteExporters.yer = function (kind) {
    const st = get(), P = st.project, s = P.site;
    const cx = S().yerCtx(st);
    const mode = P.cand.mode;
    const scan = ctl.yerScanFor(st);
    if (mode === 'bul' && !scan) throw new Error('Önce taramayı çalıştırın.');
    if (mode !== 'bul' && !cx.cmp.ranked.length) throw new Error('Karşılaştırma için en az bir adayın verisi hazır olmalı.');
    const entry = site.entry(s);
    const sc = App.selScene.scene(P, { cmp: cx.cmp, scan: mode === 'bul' ? scan : null, entry: entry }, { mode: mode, pick: null }, false);
    const fctx = { cmp: cx.cmp, scan: scan };
    const ref = GX.yerRef(P, fctx);
    return ctl.siteWrite(kind, {
      name: P.meta.name + '-yer-secimi', prims: sc.prims, W: sc.W, H: sc.H,
      features: () => GX.collectYer(P, fctx), lat0: ref[0], lon0: ref[1],
      meta: { module: 'yer-secimi', program: site.template(s.template).label },
      csv: () => GX.csvYer(P, fctx),
    });
  };
  ctl.exporters.yer = (kind) => ctl.siteExport('yer', kind === 'png' ? 'png' : 'pdf');

  /* ---------------- eylemler ---------------- */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    if (a.type === 'selFetch') { ctl.selFetch(); return; }
    if (a.type === 'selTab') { ctl.yerView({ tab: a.tab }); return; }
    baseRun(a);
  };
})();

/* ==========================================================================
   71-ui-analysis.js — Modül 3 arayüzü: Mekân Analizi (patlatılmış izometrik)

(function () {
  const App = window.App;
  const h = App.h;
  const ui = App.ui;
  const U = App.util;
  const fmt = U.fmt;

  const ctl = () => App.ctl;
  const an = (ui.analysis = {});

  const pct = (v) => (v == null ? '—' : '%' + Math.round(v * 100));

        v.mode === 'floors' ? 'Her kat ayrı bir levha olarak yukarı doğru açılır.' : 'Seçili katın plan, işlev, dolaşım gibi katmanları üst üste açılır.'),

        ui.toggle({ label: 'Hacim', on: v.volume, onclick: () => c.an({ volume: !v.volume }), title: 'Mekânları yükselti olarak çiz' }))));

  function mixBar(m) {
    return h('span', { class: 'mixbar', 'aria-hidden': 'true' }, m.zones.map((z) => h('i', { key: z.zone, style: { width: (z.share * 100) + '%', background: (App.ZONES[z.zone] || App.ZONES.sosyal).fill }, title: (App.ZONES[z.zone] || App.ZONES.sosyal).label + ' %' + Math.round(z.share * 100) })));

    return ui.section('Katlar', h('div', {}, h('ul', { class: 'rows' }, rows), h('p', { class: 'note aflr-note' }, 'Bir kata tıklayın: diğer katlar soluklaşır. Tekrar tıklayınca seçim kalkar.')), plan.floors.length + ' kat', 'afloors');
  }

  function layersSection(state, sd) {
    const v = state.ui.an;
    const plan = sd.plan;
    const cur = plan.floors.find((f) => f.id === v.floorId) || plan.floors[0];

    return [
      ui.section('Kat', h('div', { class: 'sec-box' },

  function statsSection(A) {

      ['Gün ışığı (cepheli yaşama mekânı)', s.nHab ? s.nHabExt + '/' + s.nHab + ' · ' + pct(s.daylight) : '—'],

  an.sidebar = function (state, d) {

    const sd = App.study.derive(P);

    const v = state.ui.an;

    const tabs = ui.tabsBar([

    ], tab, (id) => ctl().dispatch({ type: 'UI', patch: { anTab: id } }));
    const body = tab === 'gorunum'
      ? [viewSection(state), v.mode === 'floors' ? floorsSection(state, sd, A) : layersSection(state, sd), statsSection(A)]
      : [ui.findingList({ items: A.items, counts: A.counts }, 'Düşey düzen, cephe teması, gürültü ve dolaşım kontrolleri. Bilgi tabanı: işlev şeması bina tipi.')];
    return ui.sideShell('sb-analiz', 'Mekân analizi paneli', tabs, body);
  };

  /* ---------------- pafta ---------------- */
  let memo = { k: null, v: null };
  function sceneOf(P, sd, v) {
    const key = [sd.plan, P.spaces, P.meta.name, App.theme.name, v];
    if (memo.k && memo.k.every((x, i) => x === key[i])) return memo.v;
    memo = { k: key, v: App.analysis.scene(P, sd, v, true) };
    return memo.v;
  }

  function orbitDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const v = App.store.get().ui.an;
    orbit = { sx: e.clientX, sy: e.clientY, yaw: v.yaw, pitch: v.pitch, moved: false, id: e.pointerId };
  }
  function orbitMove(e) {
    if (!orbit) return;
    const dx = e.clientX - orbit.sx, dy = e.clientY - orbit.sy;
    if (!orbit.moved) {
      if (Math.hypot(dx, dy) < 5) return;
      orbit.moved = true;
      ctl().anCancel();
      try { an.svgEl.setPointerCapture(orbit.id); } catch (err) {}
      ui.orbiting = true;
    }
    ctl().anOrbit(dx, dy, orbit);
  }
  function orbitUp(e) {
    if (!orbit) return;
    const o = orbit;
    orbit = null;
    ui.orbiting = false;
    try { an.svgEl.releasePointerCapture(o.id); } catch (err) {}
    if (o.moved) ctl().an({}); // kalıcı kaydet
  }

  const poly = (pts) => pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');

  an.board = function (state, d) {
    const P = state.project;

      }, h('title', {}, hi.name + ' — ' + fmt(hi.area) + ' m²'));
    });

    const plan = sd.plan;
    const selFloor = floors && v.sel ? plan.floors.find((f) => f.id === v.sel) : null;

    const svg = h('svg', {
      id: 'pafta-analiz', class: 'board-svg board-svg-analiz', viewBox: '0 0 ' + sc.W + ' ' + sc.H, preserveAspectRatio: 'xMidYMid meet', role: 'group', tabindex: 0,
      'aria-label': 'Mekân analizi paftası. Ok tuşları döndürür, artı ve eksi tuşları patlatmayı değiştirir.',
      ref: (el) => { an.svgEl = el; },
      onpointerdown: orbitDown, onpointermove: orbitMove, onpointerup: orbitUp, onpointercancel: orbitUp,
      onkeydown: (e) => {
        const a = App.store.get().ui.an;
        const k = e.key;
        if (k === 'ArrowLeft') { e.preventDefault(); c.an({ yaw: U.clamp(a.yaw - 4, -85, 85) }); }
        else if (k === 'ArrowRight') { e.preventDefault(); c.an({ yaw: U.clamp(a.yaw + 4, -85, 85) }); }
        else if (k === 'ArrowUp') { e.preventDefault(); c.an({ pitch: U.clamp(a.pitch + 3, 12, 75) }); }
        else if (k === 'ArrowDown') { e.preventDefault(); c.an({ pitch: U.clamp(a.pitch - 3, 12, 75) }); }
        else if (k === '+' || k === '=') { e.preventDefault(); c.anCancel(); c.an({ explode: U.clamp(a.explode + 0.08, 0, 1) }); }
        else if (k === '-' || k === '_') { e.preventDefault(); c.anCancel(); c.an({ explode: U.clamp(a.explode - 0.08, 0, 1) }); }
      },
    }, sc.prims.map((p) => App.board.primToV(p)), h('g', { class: 'ahits' }, hits));

    const empty = !P.spaces.length;
    const stage = h('div', { class: 'board-stage' + (floors ? '' : ' is-layers') }, svg,
      selFloor ? h('div', { class: 'an-chip' }, h('b', {}, selFloor.name), h('span', { class: 'mono' }, fmt(selFloor.net) + ' m² · ' + selFloor.spaces.length + ' mekân'),
        h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Seçimi kaldır', onclick: () => c.an({ sel: null }, true) }, ui.icon('close', 14))) : null,
      empty ? ui.emptyCard('Analiz için mekân gerekli', 'İşlev Şeması’nda mekân ekleyin; Kat Etüdü katlara dağıtır, burada patlatılmış izometrik olarak incelersiniz.', [
        ui.btn('Örnek konutu yükle', { icon: 'newdoc', cls: 'btn-primary', onclick: () => c.loadTemplate('konut', '2+1') }),
        ui.btn('İşlev Şeması’na git', { icon: 'chevron', onclick: () => c.go('islev') })]) : null);

    return ui.boardPage(state, d, {
      label: 'Mekân analizi paftası',

      scale: 'Patlatılmış izometrik · plan ölçekli',

        { k: 'icon', label: 'Görünümü sıfırla', icon: 'reset', onclick: () => c.anResetView(), title: 'Dönüş ve eğimi varsayılana al' },

        { k: 'icon', label: 'İleri al', icon: 'redo', onclick: () => c.dispatch({ type: 'REDO' }), disabled: !state.future.length, title: 'İleri al (Ctrl+Shift+Z)' },
      ],
    });
  };
})();

/* ==========================================================================
   72-ctl-analysis.js — Mekân Analizi yan etkileri: görünüm durumu, animasyonlar, dışa aktarma
   Görünüm (kip, patlatma, yön, eğim, anahtarlar) state.ui.an içinde durur ve tarayıcıda hatırlanır.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const U = App.util;
  const get = () => App.store.get();
  const VIEW_KEY = 'archtools.analysis.view';
  const PERSIST = ['mode', 'explode', 'yaw', 'pitch', 'labels', 'arrows', 'guides', 'volume', 'layers'];
  const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- görünüm durumu ---------- */
  let saveTimer = null;
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        const an = get().ui.an, o = {};
        PERSIST.forEach((k) => { o[k] = an[k]; });
        window.localStorage.setItem(VIEW_KEY, JSON.stringify(o));
      } catch (e) {}
    }, 350);
  }
  ctl.an = function (patch, silent) {
    ctl.dispatch({ type: 'UI', patch: { an: Object.assign({}, get().ui.an, patch) } });
    if (!silent) saveSoon();
  };
  ctl.loadAnView = function () {
    try {
      const o = JSON.parse(window.localStorage.getItem(VIEW_KEY) || 'null');
      if (!o || typeof o !== 'object') return;
      const def = App.analysisDefaults(), p = {};
      if (o.mode === 'floors' || o.mode === 'layers') p.mode = o.mode;
      if (typeof o.explode === 'number') p.explode = U.clamp(o.explode, 0, 1);
      if (typeof o.yaw === 'number') p.yaw = U.clamp(o.yaw, -85, 85);
      if (typeof o.pitch === 'number') p.pitch = U.clamp(o.pitch, 12, 75);
      ['labels', 'arrows', 'guides', 'volume'].forEach((k) => { if (typeof o[k] === 'boolean') p[k] = o[k]; });
      const ids = App.analysis.LAYERS.map((l) => l.id);
      if (Array.isArray(o.layers)) { const ls = o.layers.filter((x) => ids.indexOf(x) >= 0); if (ls.length) p.layers = ls; }
      ctl.dispatch({ type: 'UI', patch: { an: Object.assign({}, def, p) } });
    } catch (e) {}
  };

  /* ---------- animasyon ---------- */
  let raf = 0;
  ctl.anCancel = function () { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  // props: { anahtar: hedef } → süre boyunca yumuşak geçiş; done: bitince
  function tween(props, dur, done) {
    ctl.anCancel();
    const an0 = get().ui.an, from = {};
    Object.keys(props).forEach((k) => { from[k] = an0[k]; });
    if (reduced() || dur <= 0) { ctl.an(props, true); if (done) done(); return; }
    const t0 = performance.now();
    (function step(now) {
      const t = U.clamp((now - t0) / dur, 0, 1), e = App.iso.easeInOut(t);
      const p = {};
      Object.keys(props).forEach((k) => { p[k] = from[k] + (props[k] - from[k]) * e; });
      ctl.an(p, true);
      if (t < 1) raf = requestAnimationFrame(step); else { raf = 0; if (done) done(); }
    })(t0);
  }

  ctl.anExplode = function (to) { tween({ explode: to }, 950, saveSoon); };
  ctl.anToggleExplode = function () { ctl.anExplode(get().ui.an.explode > 0.5 ? 0 : 1); };
  ctl.anResetView = function () { const d = App.analysisDefaults(); tween({ yaw: d.yaw, pitch: d.pitch }, 450, saveSoon); };

  // kip değişimi: levhalar toplanır, yeni küme açılır
  ctl.anMode = function (mode) {
    const an = get().ui.an;
    if (an.mode === mode) return;
    const target = an.explode < 0.1 ? 1 : an.explode;
    if (reduced()) { ctl.an({ mode: mode, sel: null }); return; }
    tween({ explode: 0 }, 360, function () {
      ctl.an({ mode: mode, sel: null }, true);
      tween({ explode: target }, 620, saveSoon);
    });
  };

  ctl.anSelect = function (floorId) { const an = get().ui.an; ctl.an({ sel: an.sel === floorId ? null : floorId }, true); };
  ctl.anToggleLayer = function (id) {
    const an = get().ui.an;
    const on = an.layers.indexOf(id) >= 0;
    if (on && an.layers.length === 1) { ctl.toast('En az bir katman açık kalmalı.'); return; }
    const order = App.analysis.LAYERS.map((l) => l.id);
    ctl.an({ layers: order.filter((x) => (x === id ? !on : an.layers.indexOf(x) >= 0)) });
  };
  ctl.anOrbit = function (dx, dy, base) {
    ctl.an({ yaw: U.clamp(base.yaw + dx * 0.32, -85, 85), pitch: U.clamp(base.pitch + dy * 0.22, 12, 75) }, true);
  };

  /* ---------- dışa aktarma ---------- */
  ctl.exporters.analiz = function (kind) {
    ctl.runExport(kind === 'png' ? 'PNG' : 'PDF', (P) => {
      const sd = App.study.derive(P);
      const view = Object.assign({}, get().ui.an, { sel: null });
      const sc = App.analysis.scene(P, sd, view, false);
      return App.sheet.exportScene(sc.prims, sc.W, sc.H, P.meta.name + '-mekan-analizi', kind);
    });
  };

  /* bulgu kartından seçim: ilgili katı da öne çıkar */
  const baseRun = ctl.runAction;
  ctl.runAction = function (a) {
    if (a.type === 'select' && get().ui.module === 'analiz') {
      const P = get().project;
      const f = P.study && P.study.floors.find((x) => x.id === P.study.assign[a.id]);
      if (f && get().ui.an.mode === 'floors') ctl.an({ sel: f.id }, true);
    }
    baseRun(a);
  };
})();

/* ==========================================================================
   90-router.js — modül gezintisi: #/islev · #/kat · #/analiz · #/arsa · #/imar · #/yer
   Geçiş: View Transitions varsa yumuşak çapraz solma, yoksa anında.
   ========================================================================== */
(function () {
  const App = window.App;
  const ctl = App.ctl;
  const IDS = ['islev', 'kat', 'analiz', 'arsa', 'imar', 'yer'];
  const get = () => App.store.get();

  const fromHash = function () {
    const m = /^#\/?([a-z]+)/.exec(location.hash || '');
    return m && IDS.indexOf(m[1]) >= 0 ? m[1] : null;
  };
  App.route = { fromHash: fromHash, IDS: IDS };

  function setTitle(id) {
    document.title = 'archtools · ' + App.ui.moduleInfo(id).label;
  }
  App.route.setTitle = setTitle;

  function apply(id) {
    ctl.dispatch({ type: 'UI', patch: { module: id, xmenu: false } });
    setTitle(id);
    window.scrollTo(0, 0);
    if (App.paintNow) App.paintNow();
  }

  function switchTo(id) {
    if (get().ui.module === id) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!document.startViewTransition || reduce || (App.intro && App.intro.active)) { apply(id); return; }
    const root = document.documentElement;
    root.classList.add('vt-fade');
    const done = function () { root.classList.remove('vt-fade'); };
    try {
      const vt = document.startViewTransition(function () { apply(id); });
      vt.finished.then(done, done);
    } catch (e) { done(); apply(id); }
  }

  ctl.go = function (id) {
    if (IDS.indexOf(id) < 0 || get().ui.module === id) return;
    if (fromHash() !== id) { try { location.hash = '#/' + id; return; } catch (e) {} }
    switchTo(id);
  };

  window.addEventListener('hashchange', function () {
    switchTo(fromHash() || 'islev'); // boş adres = işlev şeması (geri düğmesiyle ilk sayfaya dönüş)
    if (ctl.hashSite) ctl.hashSite(); // #/arsa?lat=…&lon=… paylaşım bağlantısı
  });
})();

/* ==========================================================================
   99-main.js — archtools'u başlat: tema, ortak store, modül rotası, intro
   ========================================================================== */
(function () {
  const App = window.App;
  const h = App.h;

  // tema: URL (?style=bauhaus) > kayıtlı tercih > glass
  (function () {
    let name = 'glass';
    try {
      const q = new URLSearchParams(location.search).get('style');
      const sv = window.localStorage.getItem('archtools.style') || window.localStorage.getItem('archtools.bubble.style');
      name = q || sv || 'glass';
    } catch (e) {}
    if (!App.THEMES[name]) name = 'glass';
    App.theme.set(name);
    document.documentElement.setAttribute('data-style', name);
  })();

  App.store = App.createStore(App.state.reducer, App.state.initialState());

  // ilk modül: adres çubuğundaki rota (#/kat ...)
  const first = App.route.fromHash();
  if (first && first !== App.store.get().ui.module) App.store.dispatch({ type: 'UI', patch: { module: first } });
  App.route.setTitle(App.store.get().ui.module);
  App.ctl.loadAnView();
  App.ctl.loadSiteView();
  App.ctl.loadImarView();
  const fromLink = App.ctl.hashSite(); // #/arsa?lat=…&lon=… paylaşım bağlantısı

  function view() {
    const state = App.store.get();
    const d = App.state.derive(state);
    const t = state.ui.toast;
    const mod = state.ui.module;
    return h('div', { class: 'app s-' + App.theme.name + ' m-' + mod + (mod === 'islev' && state.ui.assistantOpen ? ' as-open' : '') },
      App.ui.header(state, d),
      App.ui.scorebar(state, d),
      App.ui.pageMain(state, d),
      h('div', { class: 'toast-zone', 'aria-live': 'polite', role: 'status' },
        t ? h('div', { key: t.id, class: 'toast toast-' + t.kind }, t.msg) : null),
      App.ui.welcome ? App.ui.welcome(state) : null);
  }

  const paint = App.mount(document.getElementById('root'), view);
  App.paintNow = paint;
  const schedule = App.raf(paint);

  let lastPct = null;
  let lastProject = App.store.get().project;
  let saveTimer = null;
  App.store.subscribe(function (state) {
    schedule();
    if (state.project === lastProject) return;
    lastProject = state.project;
    // otomatik kayıt (kişisel kolaylık): proje + kat etüdü ayarları birlikte
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { App.state.persist(state.project); }, 500);
    // skor eşiği kutlaması (işlev şeması)
    if (state.ui.module !== 'islev') return;
    const pc = App.state.derive(state).score.percent;
    if (lastPct != null && pc != null && lastPct < 90 && pc >= 90 && state.project.spaces.length >= 3 && !state.project.meta.example) App.ctl.toast('Harika yerleşim: verimlilik %' + pc, 'success');
    lastPct = pc;
  });

  document.addEventListener('keydown', App.ctl.onKey);
  // odak halkası yalnızca klavye gezintisinde görünür (paftada fareyle tıklayınca çerçeve çıkmasın)
  const rootEl = document.body;
  document.addEventListener('keydown', function (e) { if (e.key === 'Tab' || e.key.indexOf('Arrow') === 0) rootEl.classList.add('kbd'); }, true);
  document.addEventListener('pointerdown', function () { rootEl.classList.remove('kbd'); }, true);
  paint();
  lastPct = App.state.derive(App.store.get()).score.percent;

  // açılış animasyonu: uygulama altta hazır, intro yumuşakça çözülür
  App.intro.start(function () {
    if (App.store.get().restored) setTimeout(function () { App.ctl.toast('Son çalışmanız geri yüklendi.'); }, 250);
    if (!fromLink && App.welcome) App.welcome.maybe(); // ilk açılış soruları
  });
})();

</script>
</body>
</html>
