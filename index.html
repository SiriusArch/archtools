      const out = [];
      segs.forEach((q) => {
        const in1 = q[0] * q[0] + q[1] * q[1] <= R * R, in2 = q[2] * q[2] + q[3] * q[3] <= R * R;
        if (in1 && in2) out.push(q);
        else gis.clipLineToCircle([[q[0], q[1]], [q[2], q[3]]], R).forEach((p) => out.push([p[0][0], p[0][1], p[1][0], p[1][1]]));
      });
      return out;
    };
    A.iso = [5, 10, 15].map((min) => {
      if (!dist) return { min: min, D: min * 80, segs: [], km: 0, ha: 0, clipped: false };
      const raw = gis.bandSegments(g, dist, min * 80);
      let km = 0;
      raw.forEach((q) => { km += Math.hypot(q[2] - q[0], q[3] - q[1]); });
      const segs = clipSegs(raw);
      return { min: min, D: min * 80, segs: segs, km: km / 1000, ha: gis.bufferArea(raw, 40, Math.min(d.R, 1250)) / 1e4, clipped: min * 80 * 0.92 > R };
    });

    /* --- işlevler --- */
    const pois = [];
    d.poi.forEach((p) => {
      if (Math.hypot(p.x, p.y) > Math.min(d.R, 1250)) return;
      const w = walkM(p.x, p.y, p.park ? p.r : 0);
      pois.push(Object.assign({}, p, { m: w, min: isFinite(w) ? w / 80 : null, inR: p.x * p.x + p.y * p.y <= R * R }));
    });
    pois.sort((a, b) => (a.min == null ? 1e9 : a.min) - (b.min == null ? 1e9 : b.min));
    A.pois = pois;
    A.cats = osm.CATS.map((c) => {
      const list = pois.filter((p) => p.cat === c.id && p.min != null);
      const c5 = list.filter((p) => p.min <= 5).length, c10 = list.filter((p) => p.min <= 10).length, c15 = list.filter((p) => p.min <= 15).length;
      const near = list[0] || null;
      const dens = Math.min(1, c10 / (DENS_TARGET[c.id] || 3));
      return { id: c.id, label: c.label, short: c.short, color: c.color, c5: c5, c10: c10, c15: c15, total: pois.filter((p) => p.cat === c.id && p.inR).length, nearest: near, nearMin: near ? near.min : null, score: 0.65 * timeScore(near && near.min) + 0.35 * dens };
    });
    const cw = T.cw;
    let cws = 0, cs = 0;
    A.cats.forEach((c) => { const w = cw[c.id] != null ? cw[c.id] : 1; cs += w * c.score; cws += w; });
    const vErisim = cws ? cs / cws : 0;

    /* --- toplu taşıma --- */
    const stops = d.transit.filter((t) => Math.hypot(t.x, t.y) <= Math.min(d.R, 1250)).map((t) => { const w = walkM(t.x, t.y, 0); return Object.assign({}, t, { m: w, min: isFinite(w) ? w / 80 : null }); }).filter((t) => t.min != null);
    stops.sort((a, b) => a.min - b.min);
    const nearBus = stops.find((t) => t.kind === 'otobus') || null;
    const nearRail = stops.find((t) => t.kind !== 'otobus') || null;
    const st10 = stops.filter((t) => t.min <= 10).length;
    const vUlasim = Math.min(1, Math.max(timeScore(nearBus && nearBus.min), 0.85 * timeScore(nearRail && nearRail.min)) * 0.75 + Math.min(1, st10 / 6) * 0.25 + (nearRail && nearRail.min <= 15 ? 0.08 : 0));
    A.transit = { stops: stops, nearBus: nearBus, nearRail: nearRail, in5: stops.filter((t) => t.min <= 5).length, in10: st10, byKind: {} };
    stops.forEach((t) => { A.transit.byKind[t.kind] = (A.transit.byKind[t.kind] || 0) + 1; });

    /* --- yeşil --- */
    let greenArea = 0, pubArea = 0;
    cl.green.forEach((q) => { const a = Math.abs(gis.area(q.pts)); greenArea += a; if (q.pub) pubArea += a; });
    const parks = pois.filter((p) => p.park && p.min != null);
    const nearPark = parks[0] || null;
    const greenShare = Math.min(1, greenArea / area);
    const vYesil = Math.min(1, 0.6 * timeScore(nearPark && nearPark.min) + 0.4 * Math.min(1, greenShare / 0.12));
    A.green = { area: greenArea, pubArea: pubArea, share: greenShare, nearPark: nearPark, parkCount: parks.length };

    /* --- gürültü --- */
    A.noiseSrc = noiseSources(d);
    const nc = noiseAt(A.noiseSrc, 0, 0);
    A.noise = { v: nc.v, cls: site.noiseClass(nc.v), src: nc.src, d: nc.d };
    const vSes = Math.max(0, 1 - Math.min(1, nc.v * 1.15));
    {
      // ısı hücreleri: büyük yollar ve ray için ızgara
      const N = 44, cs2 = (2 * R) / N, cells = [];
      const major = A.noiseSrc.filter((q) => q.w >= 0.3);
      const grid = new Float32Array(N * N);
      major.forEach((q) => {
        for (let k = 1; k < q.pts.length; k++) {
          const a = q.pts[k - 1], b = q.pts[k];
          const x0 = Math.max(0, Math.floor((Math.min(a[0], b[0]) - q.dm + R) / cs2)), x1 = Math.min(N - 1, Math.floor((Math.max(a[0], b[0]) + q.dm + R) / cs2));
          const y0 = Math.max(0, Math.floor((Math.min(a[1], b[1]) - q.dm + R) / cs2)), y1 = Math.min(N - 1, Math.floor((Math.max(a[1], b[1]) + q.dm + R) / cs2));
          for (let iy = y0; iy <= y1; iy++) for (let ix = x0; ix <= x1; ix++) {
            const cx = -R + (ix + 0.5) * cs2, cy = -R + (iy + 0.5) * cs2;
            const dd = gis.nearestOnSeg(cx, cy, a[0], a[1], b[0], b[1]).d;
            if (dd >= q.dm) continue;
            const v = q.w * Math.pow(1 - dd / q.dm, 1.2);
            if (v > grid[iy * N + ix]) grid[iy * N + ix] = v;
          }
        }
      });
      for (let iy = 0; iy < N; iy++) for (let ix = 0; ix < N; ix++) {
        const cx = -R + (ix + 0.5) * cs2, cy = -R + (iy + 0.5) * cs2;
        if (cx * cx + cy * cy > R * R) continue;
        cells.push({ x: cx - cs2 / 2, y: cy - cs2 / 2, s: cs2, v: grid[iy * N + ix], c: site.noiseClass(grid[iy * N + ix]).id });
      }
      A.noiseCells = cells;
    }

    /* --- yapı formu --- */
    const bs = cl.buildings;
    let fp = 0, known = 0, flo = 0, sumLv = 0, nLv = 0, maxH = 0, maxB = null;
    const use = { konut: 0, ticari: 0, kamu: 0, sanayi: 0, diger: 0 };
    const hist = [0, 0, 0, 0, 0];
    bs.forEach((b) => {
      fp += b.area;
      const h = osm.heightOf(b);
      const lvEst = h / 3.1;
      flo += b.area * lvEst;
      if (b.h || b.lv) { known++; sumLv += b.lv || h / 3.1; nLv++; }
      if (h > maxH) { maxH = h; maxB = b; }
      use[site.useOf(b.kind)] += b.area;
      hist[h <= 4 ? 0 : h <= 10 ? 1 : h <= 16 ? 2 : h <= 30 ? 3 : 4]++;
    });
    A.built = { count: bs.length, footprint: fp, coverage: fp / area, far: flo / area, levelKnown: bs.length ? known / bs.length : 0, avgLevels: nLv ? sumLv / nLv : null, maxH: maxH, maxB: maxB, hist: hist, use: use, floorArea: flo };
    const useTot = Object.keys(use).reduce((t, k) => t + use[k], 0) || 1;
    const sh = ['konut', 'ticari', 'kamu', 'sanayi'].map((k) => use[k] / useTot).filter((x) => x > 0);
    const ent = sh.length > 1 ? -sh.reduce((t, x) => t + x * Math.log(x), 0) / Math.log(4) : 0;
    const catsPresent = A.cats.filter((c) => c.c10 > 0).length / A.cats.length;
    const vKar = Math.min(1, 0.45 * Math.min(1, ent / 0.6) + 0.55 * catsPresent);

    /* --- ulaşım ağı --- */
    let roadLen = 0;
    const byCls = {};
    cl.roads.forEach((r) => { let l = 0; for (let k = 1; k < r.pts.length; k++) l += Math.hypot(r.pts[k][0] - r.pts[k - 1][0], r.pts[k][1] - r.pts[k - 1][1]); roadLen += l; byCls[r.cls] = (byCls[r.cls] || 0) + l; });
    let inter = 0, dead = 0;
    g.nodes.forEach((q, i) => { if (q[0] * q[0] + q[1] * q[1] > R * R) return; const dg = new Set(g.adj[i].map((e) => e[0])).size; if (dg >= 3) inter++; else if (dg === 1) dead++; });
    const km2 = area / 1e6;
    const pedCls = ['pedestrian', 'footway', 'path', 'living', 'cycleway', 'steps'];
    const pedLen = pedCls.reduce((t, k) => t + (byCls[k] || 0), 0);
    A.mob = { roadKm: roadLen / 1000, density: roadLen / 1000 / km2, inter: inter, interDensity: inter / km2, dead: dead, byCls: byCls, pedShare: roadLen ? pedLen / roadLen : 0 };
    const vBag = Math.min(1, 0.6 * Math.min(1, A.mob.interDensity / 110) + 0.4 * Math.min(1, A.mob.density / 14));

    /* --- topografya, güneş, iklim --- */
    A.topo = topo(entry, R);
    A.sun = sunInfo(d.lat0);
    A.climate = entry.climate;

    /* --- skor --- */
    const vals = { erisim: vErisim, ulasim: vUlasim, yesil: vYesil, sessizlik: vSes, karisim: vKar, baglanti: vBag };
    A.parts = site.PARTS.map((p) => ({ id: p.id, label: p.label, sub: p.sub, v: vals[p.id], w: T.w[p.id] }));
    const wsum = A.parts.reduce((t, p) => t + p.w, 0) || 1;
    A.score = Math.round((A.parts.reduce((t, p) => t + p.v * p.w, 0) / wsum) * 100);

    A.items = findings(s, A);
    const LEVEL = { hata: 0, uyari: 1, oneri: 2, ok: 3 };
    A.items.sort((a, b) => LEVEL[a.level] - LEVEL[b.level]);
    A.counts = { hata: 0, uyari: 0, oneri: 0 };
    A.items.forEach((i) => { if (A.counts[i.level] != null) A.counts[i.level]++; });
    return A;
  }

  /* ---------------- bulgular ---------------- */
  const fm = (m) => (m == null || !isFinite(m) ? '—' : U.fmt(m, m < 10 ? 1 : 0) + ' dk');
  function findings(s, A) {
    const it = [];
    const add = (id, level, title, detail, src, actions) => it.push({ id: id, level: level, title: title, detail: detail, src: src || ['OSM', 'S'], actions: actions || [] });
    if (A.demo) add('demo', 'oneri', 'Demo veri kullanılıyor', 'Gösterilen bölge sentetiktir ve gerçek bir yeri temsil etmez. Gerçek veriyle çalışmak için bir adres arayın ya da koordinat girin.', ['S'], []);
    if (!A.snap) add('graf', 'uyari', 'Yürüme ağı kurulamadı', 'Çalışma noktasının 250 m çevresinde yürünebilir yol verisi bulunamadı; süre hesapları devre dışı. Noktayı bir sokağa yaklaştırın ya da OpenStreetMap’te yol eksik olabilir.', ['OSM'], []);
    const gun = A.cats.find((c) => c.id === 'gunluk');
    if (A.snap) {
      if (gun.nearMin == null || gun.nearMin > 10) add('gunluk', 'uyari', 'Günlük ihtiyaçlar uzak: en yakın ' + (gun.nearest ? gun.nearest.kind.toLowerCase() + ' ' + fm(gun.nearMin) : 'nokta bulunamadı'), '15 dakikalık kent yaklaşımında market, fırın ve eczane 10 dakikada erişilebilir olmalı. Konut programı için bu bir dezavantajdır.', ['15dk', 'OSM'], [{ type: 'siteLayer', id: 'islev', label: 'İşlevleri göster' }]);
      else if (gun.nearMin <= 5) add('gunluk-ok', 'ok', 'Günlük ihtiyaçlar 5 dakika içinde', gun.nearest.kind + ' ' + fm(gun.nearMin) + ' · 10 dk içinde ' + gun.c10 + ' nokta.', ['15dk', 'OSM'], []);
      const par = A.green.nearPark;
      if (!par || par.min > 15) add('park', 'uyari', 'Park çok uzak' + (par ? ' (' + fm(par.min) + ')' : ' ya da bulunamadı'), 'Kullanıcıların günlük yeşil alana erişimi için 10 dakikalık yürüme mesafesi hedeflenir. Açık alan ya da avlu önerisini programa taşıyın.', ['15dk', 'OSM'], [{ type: 'siteLayer', id: 'yesil', label: 'Yeşili göster' }]);
      else if (par.min > 10) add('park', 'oneri', 'En yakın park ' + fm(par.min), '10 dakikalık eşiğin biraz üstünde; parsel içinde yeşil alan kazanmak değerlidir.', ['15dk', 'OSM'], []);
      else add('park-ok', 'ok', 'Park ' + fm(par.min) + ' uzaklıkta', (par.name || par.kind) + ' · çevredeki yeşil oranı %' + Math.round(A.green.share * 100) + '.', ['OSM'], []);
      const nb = A.transit.nearBus;
      if (!nb || nb.min > 10) add('durak', 'uyari', 'Toplu taşıma zayıf' + (nb ? ': en yakın otobüs durağı ' + fm(nb.min) : ': yakında durak bulunamadı'), 'Araç sahibi olmayan kullanıcılar için ulaşım güçlük yaratır; otopark ve servis kararlarını buna göre düşünün.', ['15dk', 'OSM'], [{ type: 'siteLayer', id: 'ulasim', label: 'Ulaşımı göster' }]);
      else if (!A.transit.nearRail) add('raylı', 'oneri', 'Raylı sistem 15 dakika içinde yok', 'Otobüs erişimi var (' + fm(nb.min) + ') ancak raylı sistem ya da iskele yürüme mesafesinde değil.', ['OSM'], []);
      else add('durak-ok', 'ok', 'Toplu taşıma erişilebilir', 'Otobüs ' + fm(nb.min) + (A.transit.nearRail ? ' · ' + TRANSIT_LABEL[A.transit.nearRail.kind] + ' ' + fm(A.transit.nearRail.min) : '') + '.', ['OSM'], []);
    }
    if (A.noise.v >= 0.45) add('gurultu', 'uyari', 'Gürültü kaynağına yakın: ' + (A.noise.src && A.noise.src.name ? A.noise.src.name : A.noise.src && A.noise.src.cls === 'rail' ? 'demiryolu' : 'ana yol') + ' (~' + Math.round(A.noise.d) + ' m)', 'Yol ve ray yakınlığına dayalı gösterge yüksek. Yaşama mekânlarını yoldan uzağa, servis ve merdiveni yola bakacak yerleştirin; ölçüm yerine geçmez.', ['S'], [{ type: 'siteLayer', id: 'gurultu', label: 'Gürültüyü göster' }]);
    else if (A.noise.v >= 0.18) add('gurultu', 'oneri', 'Orta düzey gürültü göstergesi', 'Çevredeki yol hiyerarşisi orta düzey bir baskı oluşturuyor; yatak odalarını sessiz cepheye alın.', ['S'], []);
    else add('gurultu-ok', 'ok', 'Gürültü göstergesi düşük', 'Yakında ana yol ya da ray hattı görünmüyor.', ['S'], []);
    if (A.mob.interDensity < 60) add('baglanti', 'oneri', 'Ağ bağlantısı düşük (' + Math.round(A.mob.interDensity) + ' kesişim/km²)', 'Seyrek kesişim yürüme mesafelerini uzatır; parsel içinden yaya geçişi açmak değerlendirilebilir.', ['S'], []);
    if (A.cats.filter((c) => c.c10 === 0).length >= 4) add('karisim', 'oneri', 'İşlev çeşitliliği düşük', '10 dakikalık yürüme içinde ' + A.cats.filter((c) => c.c10 === 0).map((c) => c.short.toLowerCase()).join(', ') + ' hizmeti yok.', ['OSM'], []);
    if (A.built.count && A.built.levelKnown < 0.3) add('kat-bilgisi', 'oneri', 'Bina yükseklikleri çoğunlukla tahmini', 'OpenStreetMap’te binaların yalnızca %' + Math.round(A.built.levelKnown * 100) + '’inde kat ya da yükseklik bilgisi var; gölge ve yoğunluk (KAKS) değerleri bu yüzden yaklaşıktır.', ['OSM'], []);
    if (A.topo && A.topo.slope >= 8) add('egim', 'oneri', 'Arazi eğimli (%' + Math.round(A.topo.slope) + ')', 'Yamaç ' + (A.topo.aspect != null ? gis.compass(A.topo.aspect) + ' yönüne bakıyor. ' : '') + 'Kot farkını kütle ve bodrum kararlarında kullanın.', ['Open-Meteo'], [{ type: 'siteLayer', id: 'topo', label: 'Topografyayı göster' }]);
    const win = A.sun.find((x) => x.id === 'kis');
    if (win) add('gunes', 'oneri', 'Kış güneşi öğlen ' + Math.round(win.noonAlt) + '° yükseklikte', 'Gün uzunluğu 21 Aralık’ta ' + U.fmt(win.len, 1) + ' saat. Güney cephesini yaşama mekânlarına ayırmak ve kuzey komşu gölgesini kontrol etmek için “Güneş ve gölge” katmanını kullanın.', ['S'], [{ type: 'siteLayer', id: 'gunes', label: 'Gölgeyi göster' }]);
    if (!it.some((x) => x.level === 'hata' || x.level === 'uyari')) it.unshift({ id: 'ok', level: 'ok', title: 'Kritik bir olumsuzluk görünmüyor', detail: 'Konum skoru %' + A.score + '.', src: ['S'], actions: [] });
    return it;
  }

  /* Modül 6 için özet: ham veriyi saklamadan skorlanabilir sonuç */
  site.summary = function (A) {
    const catScores = {};
    A.cats.forEach((c) => { catScores[c.id] = Math.round(c.score * 100) / 100; });
    return {
      t: Date.now(), score: A.score,
      parts: A.parts.reduce((o, p) => { o[p.id] = Math.round(p.v * 1000) / 1000; return o; }, {}),
      cats: catScores,
      nearMin: A.cats.reduce((o, c) => { o[c.id] = c.nearMin == null ? null : Math.round(c.nearMin * 10) / 10; return o; }, {}),
      counts: A.cats.reduce((o, c) => { o[c.id] = c.c10; return o; }, {}),
      noise: Math.round(A.noise.v * 100) / 100, green: Math.round(A.green.share * 1000) / 1000,
      far: Math.round(A.built.far * 100) / 100, cover: Math.round(A.built.coverage * 1000) / 1000,
      interDensity: Math.round(A.mob.interDensity), stops10: A.transit.in10, demo: A.demo,
    };
  };

  /* Modül 4 JSON uzantısı: extensions.siteAnalysis */
  site.toExt = function (project) {
    const s = project.site;
    if (!s) return {};
    const out = { version: 1, location: { lat: s.loc.lat, lon: s.loc.lon, name: s.loc.name, source: s.loc.src }, radiusM: s.radius, walkMinutes: s.walkMin, template: s.template };
    const e = site.entry(s);
    if (e) {
      const A = site.analyze(s, e);
      out.demo = !!e.demo;
      out.score = A.score;
      out.parts = A.parts.map((p) => ({ id: p.id, value: Math.round(p.v * 1000) / 1000, weight: p.w }));
      out.metrics = {
        buildings: A.built.count, footprintCoverage: Math.round(A.built.coverage * 1000) / 1000, estimatedFAR: Math.round(A.built.far * 100) / 100,
        greenShare: Math.round(A.green.share * 1000) / 1000, streetDensityKmPerKm2: Math.round(A.mob.density * 10) / 10, intersectionsPerKm2: Math.round(A.mob.interDensity),
        noiseIndex: Math.round(A.noise.v * 100) / 100, transitStopsIn10min: A.transit.in10,
      };
      out.categories = A.cats.map((c) => ({ id: c.id, nearestWalkMin: c.nearMin == null ? null : Math.round(c.nearMin * 10) / 10, in5: c.c5, in10: c.c10, in15: c.c15 }));
    }
    return { siteAnalysis: out };
  };
  site.fromExt = function (x, project) {
    try {
      const d = site.defaults();
      const lat = Number(x.location && x.location.lat), lon = Number(x.location && x.location.lon);
      if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180) || (lat === 0 && lon === 0)) return d;
      d.loc = { lat: lat, lon: lon, name: String(x.location.name || lat.toFixed(5) + ', ' + lon.toFixed(5)).slice(0, 120), src: x.location.source === 'demo' ? 'demo' : x.location.source || 'koordinat' };
      d.radius = U.clamp(Math.round(Number(x.radiusM) || 500), 250, 1000);
      d.walkMin = [5, 10, 15].indexOf(Number(x.walkMinutes)) >= 0 ? Number(x.walkMinutes) : 10;
      d.template = site.TEMPLATES.some((t) => t.id === x.template) ? x.template : 'konut';
      return d;
    } catch (e) { return site.defaults(); }
  };
  App.extProviders.push(site.toExt);
})();

/* ==========================================================================
   39-lib-b-zoning.js — İmar ve kapasite hesapları (Modül 5)
   Parsel (yerel metre halkası) + imar parametreleri (TAKS, KAKS/emsal, yençok, çekmeler) →
   yapılabilir zarf, kütle, kat sayısı, alanlar, birim / otopark / nüfus tahmini, güneş gölgesi, bulgular.
   Not: imar değerleri kullanıcıdan alınır; hazır değerler yalnızca başlangıç önerisidir.
   Saf mantık: arayüz bilmez.
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = App.gis;
  const U = App.util;
  const Z = (App.zoning = {});

  Object.assign(App.KB.SOURCES, {
    'imar': { label: 'Planlı Alanlar İmar Yönetmeliği ve parselin imar planı notları — değerleri kendi imar durumunuza göre girin', kind: 'Mevzuat', trust: 'kullanıcı girdisi' },
  });

  /* ---------------- program türleri ---------------- */
  Z.USES = [
    { id: 'konut', label: 'Konut', eff: 0.8, unit: 110, floorH: 3.0, cars: 1, per: 3.2, unitName: 'daire', perName: 'kişi' },
    { id: 'karma', label: 'Karma (zemin ticari + konut)', eff: 0.78, unit: 100, floorH: 3.2, cars: 1, per: 3.0, unitName: 'birim', perName: 'kişi' },
    { id: 'ofis', label: 'Ofis', eff: 0.85, unit: 60, floorH: 3.4, cars: 0.8, per: 4.5, unitName: 'ofis birimi', perName: 'çalışan' },
    { id: 'ticari', label: 'Ticari / perakende', eff: 0.72, unit: 80, floorH: 4.0, cars: 0.8, per: 2.0, unitName: 'dükkân', perName: 'çalışan' },
    { id: 'otel', label: 'Otel', eff: 0.7, unit: 32, floorH: 3.2, cars: 0.4, per: 1.9, unitName: 'oda', perName: 'konuk' },
    { id: 'kamu', label: 'Kamu / eğitim', eff: 0.65, unit: 55, floorH: 3.6, cars: 0.3, per: 12, unitName: 'derslik / birim', perName: 'kullanıcı' },
  ];
  Z.use = (id) => Z.USES.find((u) => u.id === id) || Z.USES[0];

  Z.FORMS = [
    { id: 'blok', label: 'Tek blok', sub: 'Zarfın içinde tek kütle' },
    { id: 'L', label: 'L kütle', sub: 'Yol ve yan sınır boyunca iki kanat' },
    { id: 'U', label: 'U kütle', sub: 'Üç kanat, arka bahçeye açılan avlu' },
    { id: 'avlu', label: 'Avlulu', sub: 'Dört kanat, kapalı iç avlu' },
    { id: 'cift', label: 'İki paralel blok', sub: 'Ön ve arka blok, ortada aralık' },
  ];

  Z.PRESETS = [
    { id: 'dusuk', label: 'Düşük yoğunluk konut', v: { use: 'konut', taks: 0.25, kaks: 0.75, hmax: 9.5, floorH: 3.0 } },
    { id: 'orta', label: 'Orta yoğunluk konut', v: { use: 'konut', taks: 0.35, kaks: 1.4, hmax: 15.5, floorH: 3.0 } },
    { id: 'yuksek', label: 'Yüksek yoğunluk konut', v: { use: 'konut', taks: 0.4, kaks: 2.4, hmax: 24.5, floorH: 3.0 } },
    { id: 'ticaret', label: 'Ticaret alanı', v: { use: 'ticari', taks: 0.6, kaks: 3.0, hmax: 30, floorH: 4.0 } },
    { id: 'cevre', label: 'Çevre ortalaması', v: null, ctx: true },
  ];

  Z.defaults = function () {
    return {
      use: 'konut', taks: 0.35, kaks: 1.4, hmax: 15.5, floorH: 3.0,
      setback: { on: 5, yan: 3, arka: 3 }, ek: {}, form: 'blok',
      eff: 0.8, unit: 110, cars: 1, per: 3.2, basement: 1,
      day: 'kis', hour: 12, scn: [],
    };
  };
  Z.clampImar = function (x) {
    const d = Z.defaults();
    const o = Object.assign({}, d, x || {});
    const n = (v, a, b, def) => U.clamp(Number.isFinite(Number(v)) ? Number(v) : def, a, b);
    o.use = Z.USES.some((u) => u.id === o.use) ? o.use : d.use;
    o.taks = n(o.taks, 0.05, 1, d.taks); o.kaks = n(o.kaks, 0.1, 12, d.kaks);
    o.hmax = n(o.hmax, 3, 150, d.hmax); o.floorH = n(o.floorH, 2.4, 6, d.floorH);
    const sb = Object.assign({}, d.setback, o.setback || {});
    o.setback = { on: n(sb.on, 0, 30, 5), yan: n(sb.yan, 0, 30, 3), arka: n(sb.arka, 0, 30, 3) };
    o.ek = {};
    Object.keys((x && x.ek) || {}).forEach((k) => { if (['on', 'yan', 'arka'].indexOf(x.ek[k]) >= 0) o.ek[k] = x.ek[k]; });
    o.form = Z.FORMS.some((f) => f.id === o.form) ? o.form : 'blok';
    o.eff = n(o.eff, 0.4, 0.95, d.eff); o.unit = n(o.unit, 15, 600, d.unit); o.cars = n(o.cars, 0, 4, d.cars); o.per = n(o.per, 0.5, 40, d.per);
    o.basement = Math.round(n(o.basement, 0, 4, 1));
    o.day = gis.SUN_DAYS.some((s) => s.id === o.day) ? o.day : 'kis';
    o.hour = n(o.hour, 8, 17, 12);
    o.scn = Array.isArray(x && x.scn) ? x.scn.slice(0, 4) : [];
    return o;
  };

  /* ---------------- parsel üretimi ---------------- */
  Z.rectParcel = function (w, d, rotDeg, cx, cy) {
    const a = ((rotDeg || 0) * Math.PI) / 180, c = Math.cos(a), s = Math.sin(a);
    return [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map((q) => [Math.round((cx + q[0] * c - q[1] * s) * 10) / 10, Math.round((cy + q[0] * s + q[1] * c) * 10) / 10]);
  };
  Z.cleanParcel = function (pts) {
    if (!Array.isArray(pts)) return null;
    let p = pts.map((q) => [Math.round(Number(q[0]) * 10) / 10, Math.round(Number(q[1]) * 10) / 10]).filter((q) => Number.isFinite(q[0]) && Number.isFinite(q[1]));
    const o = [];
    p.forEach((q) => { const l = o[o.length - 1]; if (!l || Math.hypot(l[0] - q[0], l[1] - q[1]) > 0.3) o.push(q); });
    if (o.length > 1 && Math.hypot(o[0][0] - o[o.length - 1][0], o[0][1] - o[o.length - 1][1]) <= 0.3) o.pop();
    if (o.length < 3 || o.length > 40) return null;
    const ccw = gis.ccw(o);
    const a = Math.abs(gis.area(ccw));
    if (!(a >= 20 && a <= 250000)) return null;
    return ccw;
  };
  // basit kendini kesme denetimi (O(n²), n ≤ 40)
  Z.selfIntersects = function (p) {
    const n = p.length;
    const X = (a, b, c, d) => {
      const o = (p1, p2, p3) => (p2[0] - p1[0]) * (p3[1] - p1[1]) - (p2[1] - p1[1]) * (p3[0] - p1[0]);
      return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
    };
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (Math.abs(i - j) <= 1 || (i === 0 && j === n - 1)) continue;
      if (X(p[i], p[(i + 1) % n], p[j], p[(j + 1) % n])) return true;
    }
    return false;
  };

  /* ---------------- kenar sınıflaması: ön / yan / arka ---------------- */
  const DRIVE = { motorway: 1, trunk: 1, primary: 1, secondary: 1, tertiary: 1, residential: 1, living: 1, service: 1 };
  Z.edges = function (parcel, roads, ek) {
    const n = parcel.length;
    const E = [];
    for (let i = 0; i < n; i++) {
      const a = parcel[i], b = parcel[(i + 1) % n];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-6;
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      let rd = Infinity, rname = null, rcls = null;
      (roads || []).forEach((r) => {
        if (!DRIVE[r.cls] || r.tn) return;
        let m = Infinity;
        for (let k = 1; k < r.pts.length; k++) {
          const p0 = r.pts[k - 1], p1 = r.pts[k];
          const dm = gis.nearestOnSeg(mid[0], mid[1], p0[0], p0[1], p1[0], p1[1]).d;
          if (dm < m) m = dm;
        }
        if (m < rd) { rd = m; rname = r.name || null; rcls = r.cls; }
      });
      E.push({ i: i, a: a, b: b, len: len, mid: mid, dir: [(b[0] - a[0]) / len, (b[1] - a[1]) / len], road: rd, roadName: rname, roadCls: rcls });
    }
    // ön: yola en yakın kenar(lar) — köşe parselde birden çok kenar ön sayılır
    const minRoad = Math.min.apply(null, E.map((e) => e.road));
    const hasRoad = isFinite(minRoad) && minRoad < 60;
    E.forEach((e) => { e.kind = null; });
    if (hasRoad) E.forEach((e) => { if (e.road <= Math.max(minRoad + 4, 0) && e.road < 40) e.kind = 'on'; });
    else { const lg = E.reduce((m, e) => (e.len > m.len ? e : m), E[0]); lg.kind = 'on'; }
    const fronts = E.filter((e) => e.kind === 'on');
    const ref = fronts.reduce((m, e) => (e.len > m.len ? e : m), fronts[0]);
    // arka: ön kenarın tersine bakan ve en uzak kenar
    const nrm = [-ref.dir[1], ref.dir[0]];
    let rear = null, bestD = -1;
    E.forEach((e) => {
      if (e.kind) return;
      const dd = (e.mid[0] - ref.mid[0]) * nrm[0] + (e.mid[1] - ref.mid[1]) * nrm[1];
      const anti = e.dir[0] * ref.dir[0] + e.dir[1] * ref.dir[1] < -0.45;
      const sc = dd + (anti ? 1000 : 0);
      if (dd > 0 && sc > bestD) { bestD = sc; rear = e; }
    });
    if (rear) rear.kind = 'arka';
    E.forEach((e) => { if (!e.kind) e.kind = 'yan'; });
    // kullanıcı düzeltmeleri
    Object.keys(ek || {}).forEach((k) => { const e = E[Number(k)]; if (e && ek[k]) e.kind = ek[k]; });
    return { edges: E, front: ref, hasRoad: hasRoad };
  };

  /* ---------------- kütle: zarf içinde kanatlar ---------------- */
  function rectPoly(u0, v0, u1, v1) { return [[u0, v0], [u1, v0], [u1, v1], [u0, v1]]; }
  function shapeRects(form, B, t) {
    const u0 = B.u0, u1 = B.u1, v0 = B.v0, v1 = B.v1, W = u1 - u0, D = v1 - v0;
    const cu = (u0 + u1) / 2, cv = (v0 + v1) / 2;
    if (form === 'blok') { const s = t; return [rectPoly(cu - (s * W) / 2, cv - (s * D) / 2, cu + (s * W) / 2, cv + (s * D) / 2)]; }
    if (form === 'L') return [rectPoly(u0, v0, u1, v0 + t), rectPoly(u0, v0 + t, u0 + t, v1)];
    if (form === 'U') return [rectPoly(u0, v0, u1, v0 + t), rectPoly(u0, v0 + t, u0 + t, v1), rectPoly(u1 - t, v0 + t, u1, v1)];
    if (form === 'avlu') return [rectPoly(u0, v0, u1, v0 + t), rectPoly(u0, v1 - t, u1, v1), rectPoly(u0, v0 + t, u0 + t, v1 - t), rectPoly(u1 - t, v0 + t, u1, v1 - t)];
    return [rectPoly(u0, v0, u1, v0 + t), rectPoly(u0, v1 - t, u1, v1)]; // cift
  }
  function tRange(form, B) {
    const W = B.u1 - B.u0, D = B.v1 - B.v0;
    if (form === 'blok') return [0.05, 1];
    if (form === 'L') return [0.5, Math.min(W, D)];
    if (form === 'U') return [0.5, Math.min(W / 2, D)];
    if (form === 'avlu') return [0.5, Math.min(W, D) / 2];
    return [0.5, D / 2];
  }

  Z.massing = function (env, form, target, frontDir) {
    if (!env || env.length < 3) return { pieces: [], t: 0, area: 0 };
    const O = gis.centroid(env);
    const d = frontDir, nrm = [-d[1], d[0]];
    const toUV = (p) => [(p[0] - O[0]) * d[0] + (p[1] - O[1]) * d[1], (p[0] - O[0]) * nrm[0] + (p[1] - O[1]) * nrm[1]];
    const fromUV = (q) => [O[0] + q[0] * d[0] + q[1] * nrm[0], O[1] + q[0] * d[1] + q[1] * nrm[1]];
    const E = env.map(toUV);
    const bb = gis.bbox(E);
    const B = { u0: bb.x0, u1: bb.x1, v0: bb.y0, v1: bb.y1 };
    const Aenv = Math.abs(gis.area(E));
    const build = (t) => {
      const out = [];
      shapeRects(form, B, t).forEach((r) => {
        const c = gis.clipPoly(E, r);
        if (c.length >= 3 && Math.abs(gis.area(c)) > 0.5) out.push(c);
      });
      return out;
    };
    const areaOf = (ps) => ps.reduce((s, p) => s + Math.abs(gis.area(p)), 0);
    const tr = tRange(form, B);
    let lo = tr[0], hi = tr[1], pieces = build(hi);
    if (target >= areaOf(pieces) - 0.5 || target >= Aenv - 0.5) {
      const full = areaOf(pieces);
      return { pieces: pieces.map((p) => p.map(fromUV)), t: hi, area: full, full: true };
    }
    for (let k = 0; k < 28; k++) {
      const mid = (lo + hi) / 2;
      const a = areaOf(build(mid));
      if (a < target) lo = mid; else hi = mid;
    }
    const t = hi;
    pieces = build(t);
    const thick = form === 'blok' ? null : t;
    return { pieces: pieces.map((p) => p.map(fromUV)), t: thick, area: areaOf(pieces), full: false, scale: form === 'blok' ? t : null };
  };

  /* ---------------- ana hesap ---------------- */
  Z.compute = function (im, parcel, ctx) {
    const R = { ok: false, im: im };
    if (!parcel || parcel.length < 3) return R;
    const A = Math.abs(gis.area(parcel));
    const roads = ctx && ctx.data ? ctx.data.roads : [];
    const ed = Z.edges(parcel, roads, im.ek);
    const dists = ed.edges.map((e) => (e.kind === 'on' ? im.setback.on : e.kind === 'arka' ? im.setback.arka : im.setback.yan));
    const env = gis.offsetPoly(parcel, dists);
    const Aenv = env ? Math.abs(gis.area(env)) : 0;
    const use = Z.use(im.use);
    const Nh = Math.max(1, Math.floor(im.hmax / im.floorH + 1e-6));
    const emsal = im.kaks * A;
    const taksArea = im.taks * A;
    const Fcap = Math.min(taksArea, Aenv);
    R.A = A; R.edges = ed.edges; R.front = ed.front; R.hasRoad = ed.hasRoad; R.env = env; R.Aenv = Aenv; R.dists = dists;
    R.emsal = emsal; R.taksArea = taksArea; R.Nmax = Nh; R.use = use;
    if (!env || Fcap < 8) { R.ok = false; R.reason = !env ? 'cekme' : 'kucuk'; R.footprint = 0; R.floors = 0; R.pieces = []; R.built = 0; R.facts = Z.facts(R, im, ctx); R.items = Z.findings(R, im, ctx); R.counts = countOf(R.items); return R; }
    let N = Math.min(Nh, Math.max(1, Math.ceil(emsal / Fcap - 1e-9)));
    const Ft = Math.min(Fcap, emsal / N);
    const m = Z.massing(env, im.form, Ft, R.front.dir);
    R.pieces = m.pieces; R.wing = m.t; R.scale = m.scale; R.footprint = m.area;
    N = Math.min(Nh, Math.max(1, Math.ceil(emsal / Math.max(1, m.area) - 1e-9)));
    R.floors = N;
    R.height = N * im.floorH;
    R.built = m.area * N;
    R.ok = true;
    R.facts = Z.facts(R, im, ctx);
    R.shadow = Z.shadow(R, im, ctx);
    R.items = Z.findings(R, im, ctx);
    R.counts = countOf(R.items);
    return R;
  };
  const countOf = (items) => { const c = { hata: 0, uyari: 0, oneri: 0 }; items.forEach((i) => { if (c[i.level] != null) c[i.level]++; }); return c; };

  /* türetilmiş sayılar */
  Z.facts = function (R, im, ctx) {
    const f = {};
    const A = R.A;
    f.taksUsed = R.footprint / A;
    f.kaksUsed = R.built / A;
    f.emsalUse = R.emsal ? Math.min(1.5, R.built / R.emsal) : 0;
    f.heightUsed = R.height || 0;
    f.free = A - R.footprint;
    f.freeShare = f.free / A;
    f.net = R.built * im.eff;
    f.units = Math.max(0, Math.floor(f.net / im.unit));
    f.people = Math.round(f.units * im.per);
    f.density = f.people / (A / 1e4);
    f.carsNeed = Math.ceil(f.units * im.cars);
    const bAreaEach = Math.min(R.Aenv * 0.92, A * 0.8);
    f.carsCap = Math.floor((im.basement * bAreaEach) / 28);
    f.basementNeed = im.cars > 0 && f.carsNeed > 0 && bAreaEach > 0 ? Math.ceil((f.carsNeed * 28) / bAreaEach) : 0;
    // çevre karşılaştırması
    if (ctx && ctx.A) { f.ctxFar = ctx.A.built.far; f.ctxCover = ctx.A.built.coverage; }
    if (ctx && ctx.data) {
      const c = gis.centroid(R.pieces && R.pieces.length ? R.pieces[0] : R.env || [[0, 0]]);
      let s = 0, n = 0;
      ctx.data.buildings.forEach((b) => { if (Math.hypot(b.cx - c[0], b.cy - c[1]) <= 120) { s += App.osm.heightOf(b); n++; } });
      f.ctxH = n >= 3 ? s / n : null; f.ctxN = n;
    }
    return f;
  };

  /* güneş gölgesi (yeni kütlenin) ve komşu yapılara etkisi */
  Z.shadow = function (R, im, ctx) {
    if (!ctx || !ctx.lat) return null;
    const day = gis.SUN_DAYS.find((s) => s.id === im.day) || gis.SUN_DAYS[0];
    const sp = gis.sunPos(ctx.lat, day.doy, im.hour);
    if (sp.alt <= 1.5) return { polys: [], alt: sp.alt, az: sp.az, hit: 0, len: 0, day: day };
    const polys = gis.shadows(R.pieces.map((p) => ({ pts: p, hgt: R.height })), sp.alt, sp.az);
    const len = Math.min(R.height / Math.tan((sp.alt * Math.PI) / 180), 160);
    let hit = 0, tot = 0;
    const pset = polys.filter((p) => p.length >= 3);
    const parcelPoly = ctx.parcel;
    if (ctx.data) {
      const c0 = gis.centroid(parcelPoly);
      ctx.data.buildings.forEach((b) => {
        if (Math.hypot(b.cx - c0[0], b.cy - c0[1]) > 160) return;
        if (parcelPoly && gis.pointInPoly([b.cx, b.cy], parcelPoly)) return;
        tot++;
        for (let i = 0; i < pset.length; i++) { if (gis.pointInPoly([b.cx, b.cy], pset[i])) { hit++; break; } }
      });
    }
    return { polys: polys, alt: sp.alt, az: sp.az, hit: hit, tot: tot, len: len, day: day };
  };

  /* ---------------- bulgular ---------------- */
  const pc = (v) => '%' + Math.round(v * 100);
  Z.findings = function (R, im, ctx) {
    const it = [];
    const add = (id, level, title, detail, src, actions) => it.push({ id: id, level: level, title: title, detail: detail, src: src || ['imar'], actions: actions || [] });
    if (!R.ok) {
      if (R.reason === 'cekme') add('cekme', 'hata', 'Çekme mesafeleri parseli tüketiyor', 'Ön ' + U.fmt(im.setback.on, 1) + ' m, yan ' + U.fmt(im.setback.yan, 1) + ' m ve arka ' + U.fmt(im.setback.arka, 1) + ' m çekme sonrası yapılabilir alan kalmıyor. Çekmeleri küçültün ya da parseli büyütün.', ['imar'], [{ type: 'imarTab', tab: 'parametre', label: 'Parametreleri aç' }]);
      else add('kucuk', 'hata', 'Yapılabilir alan çok küçük', 'Zarf alanı ' + U.fmt(R.Aenv) + ' m². Bu parselde anlamlı bir kütle kurulamıyor.', ['imar'], []);
      return it;
    }
    const f = R.facts;
    const eps = 0.002;
    if (f.taksUsed > im.taks + eps) add('taks', 'hata', 'TAKS aşılıyor: ' + U.fmt(f.taksUsed, 2) + ' > ' + U.fmt(im.taks, 2), 'Taban alanı izin verilenden fazla.', ['imar'], []);
    if (f.kaksUsed > im.kaks + eps) add('kaks', 'hata', 'Emsal aşılıyor: ' + U.fmt(f.kaksUsed, 2) + ' > ' + U.fmt(im.kaks, 2), 'Toplam inşaat alanı izin verilenden fazla.', ['imar'], []);
    // kapasite neden dolmadı
    if (f.emsalUse < 0.97) {
      const byH = R.floors >= R.Nmax;
      if (byH) add('hlim', 'uyari', 'Emsalin %' + Math.round((1 - f.emsalUse) * 100) + '’i yükseklik sınırı yüzünden kullanılamıyor', 'En çok ' + R.Nmax + ' kat (' + U.fmt(im.hmax, 1) + ' m) yapılabiliyor; ' + U.fmt(R.emsal - R.built) + ' m² emsal açıkta kalıyor. Yençok artırılabilirse ya da taban alanı büyütülebilirse kapasite tamamlanır.', ['imar'], [{ type: 'imarTab', tab: 'parametre', label: 'Parametreleri aç' }]);
      else add('zarf', 'uyari', 'Zarf emsali karşılamaya yetmiyor', 'Çekmeler sonrası ' + U.fmt(R.Aenv) + ' m² alan kalıyor; ' + U.fmt(R.emsal - R.built) + ' m² emsal kullanılamıyor.', ['imar'], []);
    } else add('kap-ok', 'ok', 'Emsalin tamamı kullanılıyor', U.fmt(R.built) + ' m² · ' + R.floors + ' kat · taban ' + U.fmt(R.footprint) + ' m².', ['imar'], []);
    const envShare = R.Aenv / R.A;
    if (envShare < 0.4) add('envshare', 'uyari', 'Yapılabilir alan parselin yalnızca ' + pc(envShare) + '’i', 'Parsel dar ya da çekmeler büyük; kütle seçeneklerini bu zarfa göre değerlendirin.', ['imar'], []);
    if (R.wing != null && im.form !== 'blok') {
      if (R.wing < 8) add('kanat-ince', 'oneri', 'Kanat derinliği ' + U.fmt(R.wing, 1) + ' m: ince', 'Tipik konut kanadı 10–14 m derinliktedir; daha az kanat (L, tek blok) ya da daha çok kat düşünün.', ['S'], []);
      else if (R.wing > 16) add('kanat-derin', 'uyari', 'Kanat derinliği ' + U.fmt(R.wing, 1) + ' m: derin plan', 'İki cepheli doğal aydınlatma için 16 m’yi aşan derinlik zordur; avlu ya da çift blok denenebilir.', ['S'], []);
      else add('kanat-ok', 'ok', 'Kanat derinliği ' + U.fmt(R.wing, 1) + ' m', 'Çift cepheli yerleşim ve doğal aydınlatma için kabul edilebilir aralıkta.', ['S'], []);
    }
    if (im.form === 'cift') {
      const D = (R.pieces.length === 2) ? Math.abs(gis.centroid(R.pieces[0])[1] - gis.centroid(R.pieces[1])[1]) : 0;
      if (D && R.height > 0 && (D - (R.wing || 0)) < R.height * 0.5) add('aralik', 'uyari', 'Bloklar arası aralık dar', 'İki blok arası mesafe yüksekliğin yarısından az; karşılıklı gölge ve mahremiyet sorunu çıkar.', ['S'], []);
    }
    // otopark
    if (f.carsNeed > 0) {
      if (f.carsNeed > f.carsCap) add('otopark', 'uyari', 'Otopark gereksinimi: ' + f.carsNeed + ' araç, ' + im.basement + ' bodrumda ~' + f.carsCap, 'Yaklaşık ' + f.basementNeed + ' bodrum kat gerekir (28 m²/araç, rampa ve sirkülasyon dahil). Bodrum sayısını artırın ya da araç oranını düşürün.', ['S'], [{ type: 'imarTab', tab: 'parametre', label: 'Parametreleri aç' }]);
      else add('otopark-ok', 'ok', 'Otopark yeterli: ' + f.carsNeed + ' / ' + f.carsCap + ' araç', im.basement + ' bodrum kat ile karşılanıyor.', ['S'], []);
    }
    // açık alan
    if (f.freeShare < 0.3) add('acik', 'oneri', 'Açık alan oranı ' + pc(f.freeShare), 'Bahçe ve yeşil için ayrılan alan az; çevresel konfor ve yağmur suyu için ağaçlandırma ve geçirgen yüzey değerlendirin.', ['S'], []);
    // çevre ile karşılaştırma
    if (f.ctxFar != null && f.ctxFar > 0.2 && f.kaksUsed > f.ctxFar * 1.6) add('ctxfar', 'uyari', 'Çevreden belirgin yoğun: emsal ' + U.fmt(f.kaksUsed, 2) + ' · çevre ~' + U.fmt(f.ctxFar, 2), 'Önerilen yoğunluk çevrenin yaklaşık ' + U.fmt(f.kaksUsed / f.ctxFar, 1) + ' katı. Silüet ve altyapı kapasitesi açısından gerekçelendirin.', ['OSM'], []);
    if (f.ctxH != null && R.height > f.ctxH * 1.8 && R.height > 12) add('ctxh', 'oneri', 'Komşu binalardan ' + U.fmt(R.height / f.ctxH, 1) + ' kat daha yüksek', 'Yakın çevredeki binalar ortalama ' + U.fmt(f.ctxH, 1) + ' m; önerilen ' + U.fmt(R.height, 1) + ' m. Geçiş için kademeli kütle ya da cephe geri çekmesi düşünülebilir.', ['OSM'], []);
    // gölge
    const sh = R.shadow;
    if (sh && sh.alt > 1.5 && sh.tot > 0) {
      if (sh.hit > 0) add('golge', sh.hit >= 4 ? 'uyari' : 'oneri', sh.hit + ' komşu yapı ' + sh.day.label + ' saat ' + U.fmt(im.hour, 0) + ':00’te gölgede kalıyor', 'Gölge uzunluğu ~' + Math.round(sh.len) + ' m (güneş ' + Math.round(sh.alt) + '° yükseklikte). Kuzeydeki komşular kış güneşinden etkilenir; kütleyi güney sınırından uzaklaştırmak ya da yüksekliği azaltmak gölgeyi kısaltır.', ['S'], [{ type: 'imarShadow', label: 'Gölgeyi göster' }]);
      else add('golge-ok', 'ok', 'Komşulara gölge düşmüyor (' + sh.day.label + ', ' + U.fmt(im.hour, 0) + ':00)', 'Gölge ~' + Math.round(sh.len) + ' m uzunlukta; yakın yapılara ulaşmıyor.', ['S'], []);
    }
    if (!ed2(R)) add('on-yok', 'oneri', 'Yola cephe bulunamadı', 'Parselin yakınında araç yolu görünmüyor; ön cephe en uzun kenar olarak varsayıldı. Kenarlara tıklayarak ön / yan / arka olarak değiştirebilirsiniz.', ['OSM'], []);
    return it;
  };
  const ed2 = (R) => R.hasRoad;

  /* ---------------- özet (JSON uzantısı + senaryo karşılaştırma) ---------------- */
  Z.summary = function (R, im) {
    const r2 = (v) => Math.round(v * 100) / 100;
    if (!R || !R.ok) return { ok: false };
    const f = R.facts;
    return {
      ok: true, parcelArea: r2(R.A), buildableArea: r2(R.Aenv), footprint: r2(R.footprint), floors: R.floors, height: r2(R.height), built: r2(R.built),
      taks: r2(f.taksUsed), kaks: r2(f.kaksUsed), netArea: r2(f.net), units: f.units, people: f.people, cars: f.carsNeed, carsCapacity: f.carsCap,
      openShare: r2(f.freeShare), wing: R.wing == null ? null : r2(R.wing), form: im.form,
    };
  };
})();

/* ==========================================================================
   39-lib-c-select.js — Yer Seçimi hesapları (Modül 6)
   · Karşılaştır: aday konumların Arsa Analizi sonuçlarını ortak ağırlıklarla sıralar, filtreler, nedenini söyler.
   · Konum bul: tek bir veri kümesi üzerinde ızgara taraması (yaklaşık skor) → ısı haritası + en iyi noktalar.
   Saf mantık: arayüz bilmez.
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = App.gis;
  const osm = App.osm;
  const site = App.site;
  const U = App.util;
  const sel = (App.select = {});

  /* ---------------- filtre tanımları ---------------- */
  sel.FILTERS = [
    { id: 'park', label: 'Parka yürüme', unit: 'dk', max: 20, step: 1, def: 10, sub: 'en yakın park en çok' },
    { id: 'durak', label: 'Toplu taşıma', unit: 'dk', max: 20, step: 1, def: 10, sub: 'en yakın durak en çok' },
    { id: 'gunluk', label: 'Günlük ihtiyaç', unit: 'dk', max: 20, step: 1, def: 10, sub: 'market / fırın / eczane en çok' },
    { id: 'gurultu', label: 'Gürültü göstergesi', unit: '', max: 2, step: 1, def: 2, sub: 'en çok: 0 sessiz · 1 orta · 2 gürültülü', ord: true },
    { id: 'skor', label: 'Asgari skor', unit: '%', max: 100, step: 5, def: 60, sub: 'ağırlıklı konum skoru en az' },
  ];
  sel.NOISE_ORD = ['sessiz', 'orta', 'gurultulu'];

  sel.defaults = function () {
    return { list: [], w: null, f: { on: {}, v: {} }, sel: null, mode: 'karsilastir', scan: { step: 120, n: 5 } };
  };
  sel.clamp = function (x) {
    const d = sel.defaults();
    if (!x || typeof x !== 'object') return d;
    const list = (Array.isArray(x.list) ? x.list : []).slice(0, 8).map((c, i) => {
      const lat = Number(c.lat), lon = Number(c.lon);
      if (!(Math.abs(lat) <= 90 && Math.abs(lon) <= 180)) return null;
      return { id: String(c.id || 'c' + i), name: String(c.name || 'Aday ' + (i + 1)).slice(0, 60), lat: lat, lon: lon, src: String(c.src || 'koordinat'), dx: Number(c.dx) || 0, dy: Number(c.dy) || 0, note: String(c.note || '').slice(0, 140) };
    }).filter(Boolean);
    const w = x.w && typeof x.w === 'object' ? {} : null;
    if (w) site.PARTS.forEach((p) => { w[p.id] = U.clamp(Number(x.w[p.id]), 0, 1); if (!Number.isFinite(w[p.id])) w[p.id] = 0.5; });
    const f = { on: {}, v: {} };
    sel.FILTERS.forEach((fl) => { f.on[fl.id] = !!(x.f && x.f.on && x.f.on[fl.id]); const v = Number(x.f && x.f.v && x.f.v[fl.id]); f.v[fl.id] = Number.isFinite(v) ? U.clamp(v, 0, fl.max) : fl.def; });
    return { list: list, w: w, f: f, sel: list.some((c) => c.id === x.sel) ? x.sel : null, mode: x.mode === 'bul' ? 'bul' : 'karsilastir', scan: { step: U.clamp(Number(x.scan && x.scan.step) || 120, 60, 250), n: U.clamp(Math.round(Number(x.scan && x.scan.n) || 5), 1, 8) } };
  };

  /* aday → veri girdisi */
  sel.entryOf = function (c, set) {
    if (c.src === 'demo') return osm.demo(c.dx, c.dy);
    return osm.cacheGet(c.lat, c.lon, osm.needRadius(set.radius, set.walkMin));
  };
  sel.settingsOf = (s) => ({ radius: s.radius, walkMin: s.walkMin, template: s.template });

  sel.weights = function (cand, templateId) {
    if (cand.w) return cand.w;
    return site.template(templateId).w;
  };
  sel.weightedScore = function (parts, w) {
    let t = 0, ws = 0;
    parts.forEach((p) => { const x = w[p.id] != null ? w[p.id] : 0; t += p.v * x; ws += x; });
    return ws > 0 ? Math.round((t / ws) * 100) : 0;
  };

  /* ---------------- karşılaştırma ---------------- */
  sel.compare = function (cand, set) {
    const w = sel.weights(cand, set.template);
    const rows = cand.list.map((c) => {
      const e = sel.entryOf(c, set);
      const A = e ? site.analyze({ loc: c, radius: set.radius, walkMin: set.walkMin, template: set.template }, e) : null;
      const row = { id: c.id, c: c, e: e, A: A, ready: !!A };
      if (A) {
        row.parts = A.parts.map((p) => ({ id: p.id, label: p.label, v: p.v }));
        row.score = sel.weightedScore(A.parts, w);
        const g = A.cats.find((x) => x.id === 'gunluk');
        row.m = {
          park: A.green.nearPark ? A.green.nearPark.min : null,
          durak: A.transit.nearBus ? Math.min(A.transit.nearBus.min, A.transit.nearRail ? A.transit.nearRail.min : 1e9) : (A.transit.nearRail ? A.transit.nearRail.min : null),
          gunluk: g ? g.nearMin : null,
          gurultu: sel.NOISE_ORD.indexOf(A.noise.cls.id),
        };
      }
      return row;
    });
    // filtreler
    rows.forEach((r) => {
      r.fail = [];
      if (!r.ready) return;
      sel.FILTERS.forEach((fl) => {
        if (!cand.f.on[fl.id]) return;
        const lim = cand.f.v[fl.id];
        if (fl.id === 'skor') { if (r.score < lim) r.fail.push('Skor %' + r.score + ' < %' + lim); return; }
        const v = r.m[fl.id];
        if (fl.id === 'gurultu') { if (v > lim) r.fail.push('Gürültü: ' + sel.NOISE_ORD[v]); return; }
        if (v == null || v > lim) r.fail.push(fl.label + ': ' + (v == null ? 'yok' : U.fmt(v, 1) + ' dk') + ' > ' + lim + ' dk');
      });
      r.pass = r.fail.length === 0;
    });
    const ready = rows.filter((r) => r.ready);
    ready.sort((a, b) => (b.pass - a.pass) || (b.score - a.score));
    ready.forEach((r, i) => { r.rank = i + 1; });
    // neden: ölçüt bazında ortalamadan sapma
    if (ready.length > 1) {
      const mean = {};
      site.PARTS.forEach((p) => { mean[p.id] = ready.reduce((t, r) => t + r.parts.find((x) => x.id === p.id).v, 0) / ready.length; });
      ready.forEach((r) => {
        const dev = r.parts.map((p) => ({ id: p.id, label: p.label, d: (p.v - mean[p.id]) * (w[p.id] != null ? w[p.id] : 0) / (Math.max(0.001, Object.keys(w).reduce((t, k) => t + w[k], 0))) * 6, raw: p.v - mean[p.id] }));
        r.strong = dev.filter((x) => x.raw >= 0.1).sort((a, b) => b.d - a.d).slice(0, 3);
        r.weak = dev.filter((x) => x.raw <= -0.1).sort((a, b) => a.d - b.d).slice(0, 3);
      });
    } else ready.forEach((r) => { r.strong = []; r.weak = []; });
    return { rows: rows, ranked: ready, w: w, best: ready.length && ready[0].pass ? ready[0] : null };
  };

  sel.findings = function (cmp, cand) {
    const it = [];
    const add = (id, level, title, detail, src, actions) => it.push({ id: id, level: level, title: title, detail: detail, src: src || ['OSM', 'S'], actions: actions || [] });
    if (!cand.list.length) { add('bos', 'oneri', 'Aday konum yok', 'Bir adres arayın ya da koordinat girin; en az iki aday karşılaştırmayı anlamlı kılar.', ['S'], []); return it; }
    const miss = cmp.rows.filter((r) => !r.ready);
    if (miss.length) add('veri', 'uyari', miss.length + ' adayın verisi yok', miss.map((r) => r.c.name).join(', ') + ' için harita verisi tarayıcıda bulunamadı (ilk kez ya da önbellek temizlenmiş). “Verileri çek” ile yeniden alın.', ['OSM'], [{ type: 'selFetch', label: 'Verileri çek' }]);
    if (cmp.ranked.length >= 2) {
      const a = cmp.ranked[0], b = cmp.ranked[1];
      const d = a.score - b.score;
      if (a.pass) add('kazanan', 'ok', a.c.name + ' önde (%' + a.score + ')', 'İkinci ' + b.c.name + ' %' + b.score + '. ' + (a.strong.length ? 'Öne çıkan: ' + a.strong.map((x) => x.label.toLowerCase()).join(', ') + '. ' : '') + (d <= 3 ? 'Fark küçük; ağırlıkları değiştirerek sağlamlığı sınayın.' : ''), ['S'], []);
      else add('kazanan-yok', 'uyari', 'Filtreleri geçen aday yok', 'En yüksek skorlu ' + a.c.name + ' (%' + a.score + ') ' + a.fail.join('; ') + '. Eşikleri gevşetin ya da aday ekleyin.', ['S'], [{ type: 'selTab', tab: 'olcut', label: 'Ölçütleri aç' }]);
      if (d <= 3 && a.pass && b.pass) add('yakin', 'oneri', 'Birinci ve ikinci aday çok yakın', 'Aradaki fark %' + d + '. Karar için ağırlıkları ya da filtreleri netleştirin; ölçü dışı ölçütler (maliyet, mülkiyet, imar) belirleyici olabilir.', ['S'], []);
    }
    cmp.ranked.forEach((r) => {
      if (!r.pass) add('fail-' + r.id, 'oneri', r.c.name + ' filtrelerden elendi', r.fail.join('; ') + '.', ['S'], []);
    });
    cmp.ranked.filter((r) => r.A.demo).slice(0, 1).forEach(() => add('demo', 'oneri', 'Demo veri kullanılıyor', 'Demo adaylar sentetik bir kentten üretilir; gerçek yerler için adres arayın.', ['S'], []));
    if (cmp.ranked.length === 1) add('tek', 'oneri', 'Karşılaştırma için ikinci aday ekleyin', 'Tek adayla yalnızca skor görülür; sıralama ve neden analizi en az iki aday ister.', ['S'], []);
    return it;
  };

  /* ---------------- ızgara taraması (konum bul) ---------------- */
  const SCORE_T = [[5, 1], [10, 0.75], [15, 0.45], [20, 0.15]];
  const timeScore = (m) => { if (m == null || !isFinite(m)) return 0; for (let i = 0; i < SCORE_T.length; i++) if (m <= SCORE_T[i][0]) return SCORE_T[i][1]; return 0; };
  const DENS = { gunluk: 4, yeme: 6, egitim: 2, saglik: 2, rekreasyon: 2, kultur: 2, hizmet: 2, alisveris: 4 };

  sel.scanRadius = function (data, walkMin) { return Math.max(150, Math.min(700, Math.floor(data.R - walkMin * 80 * 0.6))); };

  sel.scan = function (entry, set, opts) {
    opts = opts || {};
    const d = entry.data;
    const T = site.template(set.template);
    const step = opts.step || 120;
    const Rs = sel.scanRadius(d, set.walkMin);
    const g = gis.buildGraph(d.roads, (r) => !r.nf && r.cls !== 'motorway' && r.cls !== 'trunk');
    const noiseSrc = (function () {
      const NR = { motorway: [1, 260], trunk: [0.95, 240], primary: [0.85, 200], secondary: [0.65, 150], tertiary: [0.42, 100], residential: [0.14, 35], service: [0.05, 20], living: [0.05, 20] };
      const NL = { rail: [0.75, 230], light_rail: [0.5, 140], subway: [0.1, 40], tram: [0.3, 60], narrow_gauge: [0.4, 100] };
      const out = [];
      d.roads.forEach((r) => { if (r.tn) return; const c = NR[r.cls]; if (c) out.push({ pts: r.pts, w: c[0], dm: c[1] }); });
      d.rails.forEach((r) => { const c = NL[r.kind]; if (c) out.push({ pts: r.pts, w: c[0], dm: c[1] }); });
      return out;
    })();
    const noiseAt = (x, y) => {
      let best = 0;
      noiseSrc.forEach((s) => {
        let near = Infinity;
        for (let k = 1; k < s.pts.length; k++) { const q = gis.nearestOnSeg(x, y, s.pts[k - 1][0], s.pts[k - 1][1], s.pts[k][0], s.pts[k][1]); if (q.d < near) near = q.d; }
        if (near < s.dm) { const v = s.w * Math.pow(1 - near / s.dm, 1.2); if (v > best) best = v; }
      });
      return best;
    };
    // hedeflerin kenar bağlantıları bir kez hesaplanır
    const snapPts = (list, rad) => list.map((p) => { const sn = gis.snap(g, p.x, p.y, 140); return { p: p, sn: sn, r: rad ? rad(p) : 0 }; });
    const poiS = snapPts(d.poi, (p) => (p.park ? p.r || 0 : 0));
    const trS = snapPts(d.transit);
    const walkTo = (dist, o) => {
      if (!o.sn) return Infinity;
      const e = g.edges[o.sn.e];
      let w = Math.min(dist[e.a] + o.sn.t * e.len, dist[e.b] + (1 - o.sn.t) * e.len) + o.sn.d;
      if (dist.src && dist.src.e === o.sn.e) w = Math.min(w, Math.abs(o.sn.t - dist.src.t) * e.len + dist.src.d + o.sn.d);
      return Math.max(0, w - o.r);
    };
    // kesişim düğümleri
    const inter = [];
    g.nodes.forEach((q, i) => { if (new Set(g.adj[i].map((e) => e[0])).size >= 3) inter.push(q); });
    const midE = g.edges.map((e) => [(g.nodes[e.a][0] + g.nodes[e.b][0]) / 2, (g.nodes[e.a][1] + g.nodes[e.b][1]) / 2, e.len]);
    const bs = d.buildings;
    const cells = [];
    const maxWalk = 15 * 80 + 40;
    for (let gy = -Rs; gy <= Rs + 1e-6; gy += step) for (let gx = -Rs; gx <= Rs + 1e-6; gx += step) {
      if (gx * gx + gy * gy > Rs * Rs) continue;
      const sn = gis.snap(g, gx, gy, 120);
      const cell = { x: gx, y: gy, s: step, ok: !!sn };
      if (!sn) { cell.score = null; cells.push(cell); continue; }
      const dist = gis.shortest(g, sn, maxWalk);
      // işlevler
      const near = {};
      osm.CATS.forEach((c) => { near[c.id] = { min: null, c10: 0 }; });
      let parkMin = null, parks = 0;
      poiS.forEach((o) => {
        const w = walkTo(dist, o);
        if (!isFinite(w)) return;
        const m = w / 80, n = near[o.p.cat];
        if (n.min == null || m < n.min) n.min = m;
        if (m <= 10) n.c10++;
        if (o.p.park) { if (parkMin == null || m < parkMin) parkMin = m; if (m <= 10) parks++; }
      });
      let cs = 0, cws = 0, present = 0;
      osm.CATS.forEach((c) => {
        const n = near[c.id], wt = T.cw[c.id] != null ? T.cw[c.id] : 1;
        cs += wt * (0.65 * timeScore(n.min) + 0.35 * Math.min(1, n.c10 / (DENS[c.id] || 3)));
        cws += wt;
        if (n.c10 > 0) present++;
      });
      const vEr = cws ? cs / cws : 0;
      // toplu taşıma
      let nb = null, nr = null, st10 = 0;
      trS.forEach((o) => { const w = walkTo(dist, o); if (!isFinite(w)) return; const m = w / 80; if (o.p.kind === 'otobus') { if (nb == null || m < nb) nb = m; } else if (nr == null || m < nr) nr = m; if (m <= 10) st10++; });
      const vUl = Math.min(1, Math.max(timeScore(nb), 0.85 * timeScore(nr)) * 0.75 + Math.min(1, st10 / 6) * 0.25 + (nr != null && nr <= 15 ? 0.08 : 0));
      // yeşil
      const vYe = Math.min(1, 0.6 * timeScore(parkMin) + 0.4 * Math.min(1, parks / 2));
      // gürültü
      const nv = noiseAt(gx, gy);
      const vSe = Math.max(0, 1 - Math.min(1, nv * 1.15));
      // karışım: yakın yapı kullanımı
      const use = { konut: 0, ticari: 0, kamu: 0, sanayi: 0 };
      for (let i = 0; i < bs.length; i++) { const b = bs[i]; if (Math.abs(b.cx - gx) > 220 || Math.abs(b.cy - gy) > 220) continue; const u = site.useOf(b.kind); if (use[u] != null) use[u] += b.area; }
      const tot = use.konut + use.ticari + use.kamu + use.sanayi;
      const sh = ['konut', 'ticari', 'kamu', 'sanayi'].map((k) => (tot ? use[k] / tot : 0)).filter((x) => x > 0);
      const ent = sh.length > 1 ? -sh.reduce((t, x) => t + x * Math.log(x), 0) / Math.log(4) : 0;
      const vKa = Math.min(1, 0.45 * Math.min(1, ent / 0.6) + 0.55 * (present / osm.CATS.length));
      // bağlantı: 400 m içindeki kesişim ve yol yoğunluğu
      let ni = 0, rl = 0;
      for (let i = 0; i < inter.length; i++) { if (Math.hypot(inter[i][0] - gx, inter[i][1] - gy) <= 400) ni++; }
      for (let i = 0; i < midE.length; i++) { if (Math.hypot(midE[i][0] - gx, midE[i][1] - gy) <= 400) rl += midE[i][2]; }
      const km2 = (Math.PI * 0.4 * 0.4);
      const vBa = Math.min(1, 0.6 * Math.min(1, ni / km2 / 110) + 0.4 * Math.min(1, rl / 1000 / km2 / 14));
      const vals = { erisim: vEr, ulasim: vUl, yesil: vYe, sessizlik: vSe, karisim: vKa, baglanti: vBa };
      const parts = site.PARTS.map((p) => ({ id: p.id, label: p.label, v: vals[p.id] }));
      const w = opts.w || T.w;
      cell.parts = vals;
      cell.score = sel.weightedScore(parts, w);
      cell.m = { park: parkMin, durak: nb != null && nr != null ? Math.min(nb, nr) : nb != null ? nb : nr, gunluk: near.gunluk.min, gurultu: sel.NOISE_ORD.indexOf(site.noiseClass(nv).id) };
      cells.push(cell);
    }
    // filtre
    const cand = { f: opts.f || { on: {}, v: {} } };
    cells.forEach((c) => {
      c.pass = false;
      if (c.score == null) return;
      c.pass = true;
      sel.FILTERS.forEach((fl) => {
        if (!cand.f.on[fl.id]) return;
        const lim = cand.f.v[fl.id];
        if (fl.id === 'skor') { if (c.score < lim) c.pass = false; return; }
        const v = c.m[fl.id];
        if (fl.id === 'gurultu') { if (v > lim) c.pass = false; return; }
        if (v == null || v > lim) c.pass = false;
      });
    });
    const valid = cells.filter((c) => c.score != null);
    const sc = valid.map((c) => c.score);
    const mn = sc.length ? Math.min.apply(null, sc) : 0, mx = sc.length ? Math.max.apply(null, sc) : 0;
    // en iyi noktalar: yerel baskılama (en az 1,6 adım uzaklık)
    const peaks = [];
    valid.filter((c) => c.pass).sort((a, b) => b.score - a.score).forEach((c) => {
      if (peaks.length >= (opts.n || 5)) return;

  /* ---------------- güneş ve gölge ---------------- */
  // her bina için ayak izi ile ötelenmiş ayak izinin dışbükey zarfı (hızlı; çoğu bina için yeterince doğru)
  D.shadowPolys = function (buildings, alt, az, zx) {
    if (alt <= 1.5) return [];
    const t = Math.tan((alt * Math.PI) / 180);
    const ux = -Math.sin((az * Math.PI) / 180), uy = -Math.cos((az * Math.PI) / 180);
    const out = [];
    buildings.forEach((b) => {
      const L = Math.min(b.hgt / t, 160);
      if (L < 0.8) return;
      const dx = ux * L, dy = uy * L;
      const pts = b.pts.concat(b.pts.map((q) => [q[0] + dx, q[1] + dy]));
      out.push(gis.hull(pts));
    });
    void zx;
    return out;
  };
  D.sunState = function (A, o) {
    const day = gis.SUN_DAYS.find((s) => s.id === o.sunDay) || gis.SUN_DAYS[0];
    const sp = gis.sunPos(A.entry.data.lat0, day.doy, o.sunHour);
    return { day: day, hour: o.sunHour, alt: sp.alt, az: sp.az };
  };
  D.shadows = function (T, A, C, z, sun, o) {
    o = o || {};
    const P = [];
    if (sun.alt <= 1.5) return P;
    const bl = A.clip.buildings.map((b) => ({ pts: b.pts, hgt: osm.heightOf(b) }));
    const polys = D.shadowPolys(bl, sun.alt, sun.az);
    let d = '';
    polys.forEach((p) => { if (p.length >= 3) d += ringD(T, p, z); });
    if (d) P.push({ t: 'path', d: d, fill: C.shadow, opacity: o.opacity });
    return P;
  };
  // rim üzerinde güneş simgesi
  D.sunMark = function (T, R, C, sun, z) {
    const P = [];
    if (sun.alt <= 0) return P;
    const a = (sun.az * Math.PI) / 180;
    const rim = [Math.sin(a) * (R * 1.06), Math.cos(a) * (R * 1.06)];
    const q = T.P(rim[0], rim[1], z), q2 = T.P(Math.sin(a) * R * 0.82, Math.cos(a) * R * 0.82, z);
    P.push({ t: 'line', x1: q[0], y1: q[1], x2: q2[0], y2: q2[1], stroke: C.sun, sw: 1.6, dash: [4, 4] });
    P.push({ t: 'circle', cx: q[0], cy: q[1], r: 9, fill: C.glass ? C.disc : '#EAAE1B', stroke: C.ink, sw: 2 });
    for (let i = 0; i < 8; i++) { const b = (Math.PI / 4) * i; P.push({ t: 'line', x1: q[0] + Math.cos(b) * 12, y1: q[1] + Math.sin(b) * 12, x2: q[0] + Math.cos(b) * 16.5, y2: q[1] + Math.sin(b) * 16.5, stroke: C.ink, sw: 1.8, cap: 'round' }); }
    return P;
  };

  /* ---------------- çalışma noktası ve halkalar ---------------- */
  D.center = function (T, C, z, label) {
    const q = T.P(0, 0, z);
    const P = [];
    P.push({ t: 'circle', cx: q[0], cy: q[1], r: 11, fill: C.glass ? C.disc : C.paper, stroke: C.ink, sw: C.glass ? 2 : 3 });
    P.push({ t: 'circle', cx: q[0], cy: q[1], r: 4.5, fill: C.accent });
    if (label) P.push({ t: 'text', x: q[0] + 15, y: q[1] + 4, s: label, size: 12, weight: 700, fam: 'b', fill: C.ink, pe: false });
    return P;
  };
  D.rings = function (T, A, C, z, mins) {
    const P = [];
    (mins || [5, 10, 15]).forEach((m) => {
      const r = m * 80;
      if (r > A.R * 1.02) return;
      P.push({ t: 'path', d: ringD(T, gis.circlePoly(r, 90), z), stroke: C.mid, sw: 1, dash: [3, 5], fill: undefined });
      const q = T.P(0, r, z);
      P.push({ t: 'text', x: q[0] + 4, y: q[1] - 4, s: m + ' dk', size: 10.5, weight: 700, fam: 'b', fill: C.ink, opacity: 0.7, pe: false });
    });
    return P;
  };

  /* ---------------- yön oku ve ölçek çubuğu (düz plan) ---------------- */
  D.north = function (x, y, C, size) {
    const s = size || 22;
    const P = [];
    P.push({ t: 'circle', cx: x, cy: y, r: s, fill: C.glass ? C.disc : C.paper, stroke: C.ink, sw: C.glass ? 1.2 : 2.5 });
    P.push({ t: 'poly', pts: [[x, y - s * 0.78], [x + s * 0.34, y + s * 0.5], [x, y + s * 0.2], [x - s * 0.34, y + s * 0.5]], fill: C.ink });
    P.push({ t: 'text', x: x, y: y - s - 6, s: 'K', size: 13, weight: 800, fam: 'b', fill: C.ink, anchor: 'middle', pe: false });
    return P;
  };
  D.scaleBar = function (x, y, s, C, lenHint) {
    const target = lenHint || 100;
    const L = gis.niceLen(target);
    const px = L * s;
    const P = [];
    P.push({ t: 'rect', x: x, y: y, w: px / 2, h: 6, fill: C.ink, stroke: C.ink, sw: 1 });
    P.push({ t: 'rect', x: x + px / 2, y: y, w: px / 2, h: 6, fill: C.disc, stroke: C.ink, sw: 1 });
    P.push({ t: 'text', x: x, y: y - 5, s: '0', size: 11, weight: 700, fam: 'b', fill: C.ink, anchor: 'middle', pe: false });
    P.push({ t: 'text', x: x + px, y: y - 5, s: (L >= 1000 ? L / 1000 + ' km' : L + ' m'), size: 11, weight: 700, fam: 'b', fill: C.ink, anchor: 'middle', pe: false });
    return P;
  };

  /* ---------------- etiketler: çakışmasız yerleştirme ---------------- */
  D.labeler = function () {
    const placed = [];
    const hit = (b) => placed.some((p) => !(b.x1 < p.x0 || b.x0 > p.x1 || b.y1 < p.y0 || b.y0 > p.y1));
    return {
      // x, y: ekran konumu · s: yazı · size · o: { anchor, rot (radyan), weight, fill, opacity, halo }
      try: function (x, y, s, size, o) {
        o = o || {};
        const w = s.length * size * 0.56, hgt = size * 1.1;
        const rot = o.rot || 0;
        const ex = Math.abs(Math.cos(rot)) * w + Math.abs(Math.sin(rot)) * hgt, ey = Math.abs(Math.sin(rot)) * w + Math.abs(Math.cos(rot)) * hgt;
        const ax = o.anchor === 'middle' ? x - ex / 2 : o.anchor === 'end' ? x - ex : x;
        const b = { x0: ax - 2, x1: ax + ex + 2, y0: y - ey / 2 - 2, y1: y + ey / 2 + 2 };
        if (o.bounds && (b.x0 < o.bounds.x0 || b.x1 > o.bounds.x1 || b.y0 < o.bounds.y0 || b.y1 > o.bounds.y1)) return null;
        if (hit(b)) return null;
        placed.push(b);
        const prim = { t: 'text', x: x, y: y + size * 0.34, s: s, size: size, weight: o.weight || 600, fam: o.fam || 'b', fill: o.fill, anchor: o.anchor || 'middle', opacity: o.opacity, pe: false };
        if (rot) prim.xf = [Math.cos(rot), Math.sin(rot), -Math.sin(rot), Math.cos(rot)];
        return prim;
      },
      reserve: function (b) { placed.push(b); },
    };
  };

  /* ana yol adları (düz plan): yolun en uzun düz parçasına paralel */
  D.roadNames = function (T, cl, C, lab, bounds) {
    const out = [];
    const seen = new Set();
    const roads = cl.roads.filter((r) => r.name && !seen.has(r.name) && ['primary', 'secondary', 'tertiary', 'residential', 'pedestrian'].indexOf(r.cls) >= 0);
    // ada göre en uzun parça
    const best = new Map();
    roads.forEach((r) => {
      for (let i = 1; i < r.pts.length; i++) {
        const a = r.pts[i - 1], b = r.pts[i];
        const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const k = r.name;
        const rank = ['primary', 'secondary', 'tertiary', 'pedestrian', 'residential'].indexOf(r.cls);
        const cur = best.get(k);
        if (!cur || l > cur.l + 1e-6) best.set(k, { l: l, a: a, b: b, rank: rank, name: r.name });
      }
    });
    Array.from(best.values()).filter((e) => e.l * T.s > e.name.length * 6.5 + 10).sort((x, y) => x.rank - y.rank || y.l - x.l).slice(0, 14).forEach((e) => {
      const p0 = T.P(e.a[0], e.a[1]), p1 = T.P(e.b[0], e.b[1]);
      let ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;
      const t = lab.try((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2, e.name, 10, { anchor: 'middle', rot: ang, weight: 600, fill: C.ink, opacity: 0.78, bounds: bounds });
      if (t) out.push(t);
    });
    return out;
  };
  D.poiNames = function (T, A, C, lab, bounds) {
    const out = [];
    const list = A.pois.filter((p) => p.name && p.inR && (p.park || p.cat === 'egitim' || p.cat === 'saglik' || p.cat === 'kultur' || p.cat === 'hizmet')).slice(0, 40);
    list.forEach((p) => {
      const q = T.P(p.x, p.y);
      const t = lab.try(q[0] + 7, q[1] - 7, p.name.length > 22 ? p.name.slice(0, 21) + '…' : p.name, 10, { anchor: 'start', weight: 700, fill: C.ink, bounds: bounds });
      if (t) out.push(t);
    });
    return out;
  };

  /* ---------------- parsel ---------------- */
  D.parcel = function (T, parcel, C, z, o) {
    o = o || {};
    const P = [];
    if (!parcel) return P;
    P.push({ t: 'path', d: ringD(T, parcel, z), fill: C.parcelFill, stroke: C.accent, sw: o.sw || 2.4, dash: o.dash });
    return P;
  };

  /* ---------------- iklim: aylık sıcaklık/yağış + rüzgâr gülü ---------------- */
  D.windRose = function (x, y, r, climate, C) {
    const P = [];
    P.push({ t: 'circle', cx: x, cy: y, r: r, stroke: C.faint, sw: 1 });
    P.push({ t: 'circle', cx: x, cy: y, r: r * 0.5, stroke: C.faint, sw: 1, opacity: 0.8 });
    if (!climate) return P;
    const mx = Math.max.apply(null, climate.wind.map((w) => w.share)) || 1;
    climate.wind.forEach((w) => {
      const len = (w.share / mx) * r * 0.96;
      if (len < 1) return;
      const a0 = ((w.dir - 9) * Math.PI) / 180, a1 = ((w.dir + 9) * Math.PI) / 180;
      const p0 = [x + Math.sin(a0) * len, y - Math.cos(a0) * len], p1 = [x + Math.sin(a1) * len, y - Math.cos(a1) * len];
      P.push({ t: 'poly', pts: [[x, y], p0, p1], fill: C.glass ? C.ink : C.accent2, opacity: 0.78 });
    });
    ['K', 'D', 'G', 'B'].forEach((l, i) => { const a = (Math.PI / 2) * i; P.push({ t: 'text', x: x + Math.sin(a) * (r + 10), y: y - Math.cos(a) * (r + 10) + 4, s: l, size: 10, weight: 700, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'middle', pe: false }); });
    return P;
  };
  D.monthly = function (x, y, w, h, climate, C) {
    const P = [];
    if (!climate) return P;
    const M = climate.monthly;
    const bw = w / 12;
    const rmax = Math.max.apply(null, M.map((m) => m.rad)) || 1;
    const ts = M.map((m) => m.t).filter((v) => v != null);
    const tmin = Math.min.apply(null, ts), tmax = Math.max.apply(null, ts);
    M.forEach((m, i) => {
      const bh = (m.rad / rmax) * h * 0.9;
      P.push({ t: 'rect', x: x + i * bw + 2, y: y + h - bh, w: bw - 4, h: bh, fill: C.glass ? C.bTone[1] : C.isoBand[2], opacity: 0.9 });
    });
    let d = '';
    M.forEach((m, i) => {
      if (m.t == null) return;
      const px = x + i * bw + bw / 2, py = y + h - ((m.t - tmin) / Math.max(1, tmax - tmin)) * h * 0.82 - h * 0.08;
      d += (d ? 'L' : 'M') + f1(px) + ' ' + f1(py);
    });
    if (d) P.push({ t: 'path', d: d, stroke: C.glass ? C.ink : C.accent, sw: 2, cap: 'round' });
    ['O', 'Ş', 'M', 'N', 'M', 'H', 'T', 'A', 'E', 'E', 'K', 'A'].forEach((l, i) => P.push({ t: 'text', x: x + i * bw + bw / 2, y: y + h + 12, s: l, size: 10, weight: 600, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'middle', pe: false }));
    return P;
  };

  /* ---------------- küçük grafik parçaları ---------------- */
  D.bar = function (x, y, w, h, v, C, o) {
    o = o || {};
    const P = [];
    P.push({ t: 'rect', x: x, y: y, w: w, h: h, rx: C.glass ? h / 2 : 0, fill: C.glass ? 'rgba(23,24,27,.09)' : 'rgba(38,29,17,.12)' });
    const bw = Math.max(0, Math.min(1, v)) * w;
    if (bw > 0.5) P.push({ t: 'rect', x: x, y: y, w: bw, h: h, rx: C.glass ? h / 2 : 0, fill: o.fill || (C.glass ? C.ink : v >= 0.7 ? C.good : v >= 0.4 ? C.warn : C.bad) });
    return P;
  };

  /* zemin: daire + su + yeşil + yollar + (isteğe bağlı) bina izleri */
  D.ground = function (T, A, C, z, o) {
    o = o || {};
    const P = [];
    D.disc(T, A.R, C, z).forEach((p) => P.push(p));
    D.green(T, A.clip, C, z, { opacity: o.greenOpacity != null ? o.greenOpacity : 0.55 }).forEach((p) => P.push(p));
    D.water(T, A.clip, C, z).forEach((p) => P.push(p));
    if (o.buildings) D.buildings(T, A.clip, C, z, { mode: 'faint', opacity: o.bOpacity }).forEach((p) => P.push(p));
    D.roads(T, A.clip, C, z, { emph: !!o.emphRoads, opacity: o.roadOpacity }).forEach((p) => P.push(p));
    return P;
  };
})();

   39-lib-e-sitescene.js — Arsa Analizi paftası (Modül 4)

(function () {

  /* ---------------- ortak parçalar ---------------- */

      { t: 'text', x: x + w, y: y, s: v, size: 13, weight: 700, fam: C.glass ? 'b' : 'm', fill: o.fill || C.ink, anchor: 'end' },
    ];
  };

  const pctS = (v) => '%' + Math.round(v * 100);
  const minS = (m) => (m == null || !isFinite(m) ? '—' : (m < 10 ? fmt(m, 1) : String(Math.round(m))) + ' dk');

  function legendFor(layers, C) {
    const L = [];
    const sw = (label, fill) => L.push({ label: label, fill: fill });
    layers.forEach((id) => {
      if (id === 'erisim') { sw('5 dk yürüme', C.isoBand[0]); sw('10 dk', C.isoBand[1]); sw('15 dk', C.isoBand[2]); }
      else if (id === 'yapi') { sw('Alçak bina', C.bTone[1]); sw('Orta', C.bTone[2]); sw('Yüksek', C.bTone[4]); }
      else if (id === 'yesil') { sw('Yeşil alan', C.green); sw('Su', C.water); }
      else if (id === 'gurultu') { sw('Orta gürültü', C.noiseSolid[0]); sw('Gürültülü', C.noiseSolid[1]); }
      else if (id === 'ulasim') sw('Durak', C.glass ? C.ink : C.accent);
      else if (id === 'gunes') sw('Bina gölgesi', C.shadow);
      else if (id === 'topo') sw('Yükselti', C.topo[5]);

  function layerNote(id, A, sun) {

    if (id === 'erisim') return A.iso.map((b) => fmt(b.ha, 0)).join(' / ') + ' ha (5 / 10 / 15 dk)';
    if (id === 'islev') return A.pois.filter((p) => p.inR).length + ' işlev noktası';
    if (id === 'gurultu') return 'Çalışma noktasında: ' + A.noise.cls.label.toLowerCase();
    if (id === 'gunes') return sun.day.label + ' ' + fmt(sun.hour, 0) + ':00 · ' + Math.round(sun.alt) + '° yükseklik';
    return '';
  }

  /* ---------------- sağ sütun ---------------- */
  function rightColumn(A, C, view, sun) {

    SS.panelTitle(X, 56, W, 'Konum skoru bileşenleri', C).forEach((p) => P.push(p));

      D.bar(X + 128, y - 9, 150, 8, p.v, C).forEach((q) => P.push(q));
      P.push({ t: 'text', x: X + W, y: y, s: pctS(p.v), size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
    });
    // 2. erişim tablosu

    A.cats.forEach((c, i) => {

      P.push({ t: 'text', x: X + 20, y: y, s: c.label, size: 12.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
      P.push({ t: 'text', x: X + 214, y: y, s: minS(c.nearMin), size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
      P.push({ t: 'text', x: X + W, y: y, s: c.c10 + ' adet', size: 12, weight: 500, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'end' });
    });
    // 3. çevre ölçüleri
