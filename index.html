    const cap = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
    return Promise.resolve(cap).catch(function () { return null; }).then(function (dl) {
      if (dl && dl.save) {
        return dl.save({ filename: filename, data: blob }).then(
          function (r) { return { ok: true, status: r.status }; },
          function (e) { return { ok: false, code: e && e.code, message: e && e.message }; }
        );
      }
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        return { ok: true, status: 'saved' };
      } catch (e) { return { ok: false, code: 'unavailable', message: String(e) }; }
    });
  }

  /* ---------------- JSON ---------------- */
  function toJSON(project, k, score, circ) {
    const now = new Date().toISOString();
    const ext = {};
    (App.extProviders || []).forEach((fn) => { try { Object.assign(ext, fn(project)); } catch (e) { /* bir modülün uzantısı hatalıysa dosya yine de yazılır */ } });
    return {
      schema: SCHEMA,
      version: VERSION,
      platform: 'archtools',
      meta: {
        name: project.meta.name,
        buildingType: project.meta.buildingType,
        variant: project.meta.variant,
        createdAt: project.meta.createdAt || now,
        updatedAt: now,
      },
      world: { width: geo.W, height: geo.H, unit: 'px', scalePxPerSqrtM2: Math.round(k * 1000) / 1000 },
      spaces: project.spaces.map((s) => ({ id: s.id, name: s.name, area: s.area, zone: s.zone, x: Math.round(s.x * 10) / 10, y: Math.round(s.y * 10) / 10 })),
      relations: Object.keys(project.relations).map((key) => { const ids = key.split('|'); return { a: ids[0], b: ids[1], type: project.relations[key] }; }),
      metrics: {
        efficiencyScore: score ? score.percent : null,
        totalArea: Math.round(U.sum(project.spaces, (s) => s.area) * 100) / 100,
        circulationShare: circ ? Math.round(circ.share * 1000) / 1000 : null,
      },
      // diğer modüllerin verisi: App.extProviders'a eklenen her işlev { anahtar: veri } döndürür
      //   floorStudy (Modül 2): kat ataması + hesaplanan plan blokları · spaceAnalysis (Modül 3): uyum skoru ve ölçüler
      //   siteAnalysis (Modül 4): konum, parsel, skorlar · zoning (Modül 5): imar parametreleri ve kapasite · siteSelection (Modül 6): adaylar ve sıralama
      extensions: ext,
    };
  }

  function fromJSON(text) {
    let o;
    try { o = JSON.parse(text); } catch (e) { throw new Error('Dosya geçerli bir JSON değil.'); }
    if (!o || o.schema !== SCHEMA) throw new Error('Bu dosya bir İşlev Şeması projesi değil (şema: ' + SCHEMA + ').');
    if (!Array.isArray(o.spaces)) throw new Error('Dosyada mekân listesi bulunamadı.');
    const ids = new Set();
    const spaces = o.spaces.map((s, i) => {
      const id = String(s.id || U.uid() + i);
      ids.add(id);
      const area = Number(s.area);
      if (!(area > 0)) throw new Error('“' + (s.name || i + 1) + '” için geçersiz alan.');
      const zone = App.ZONES[s.zone] ? s.zone : App.match.zoneFor(String(s.name || ''), o.meta && o.meta.buildingType, o.meta && o.meta.variant);
      return { id: id, name: String(s.name || 'Mekân ' + (i + 1)).slice(0, 60), area: area, zone: zone, x: Number(s.x) || geo.W / 2, y: Number(s.y) || geo.H / 2 };
    });
    const relations = {};
    (o.relations || []).forEach((r) => {
      if (!ids.has(r.a) || !ids.has(r.b) || r.a === r.b) return;
      if (r.type === 'strong' || r.type === 'weak' || r.type === 'avoid') relations[U.pairKey(r.a, r.b)] = r.type;
    });
    const m = o.meta || {};
    const typeKey = App.KB.TYPES.some((t) => t.key === m.buildingType) ? m.buildingType : 'genel';
    const variant = App.kb.variant(typeKey, m.variant).key;
    const project = { meta: { name: String(m.name || 'İçe aktarılan proje').slice(0, 80), buildingType: typeKey, variant: variant, createdAt: m.createdAt || null, example: false }, spaces: spaces, relations: relations };
    if (App.study && o.extensions && o.extensions.floorStudy) project.study = App.study.fromExt(o.extensions.floorStudy, project);
    // arsa / imar / yer seçimi gibi sonradan eklenen modüller: App.extImporters (ext, project) → { alan: değer }
    if (o.extensions) (App.extImporters || []).forEach((fn) => { try { Object.assign(project, fn(o.extensions, project) || {}); } catch (e) { /* bozuk uzantı projeyi engellemez */ } });
    return project;
  }

  /* ---------------- PNG / PDF ---------------- */
  function canvasToBlob(cv, type, q) {
    return new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error('Görüntü oluşturulamadı.'))), type, q));
  }

  function buildPdf(jpeg, iw, ih, title) {
    const enc = new TextEncoder();
    const parts = [];
    let len = 0;
    const offs = [];
    const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    const pw = 1190.55, ph = 841.89; // A3 yatay (pt)
    push('%PDF-1.4\n');
    push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
    offs[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    offs[3] = len; push('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
    offs[4] = len; push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + iw + ' /Height ' + ih + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n');
    push(jpeg); push('\nendstream\nendobj\n');
    const content = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q';
    offs[5] = len; push('5 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
    const t = U.norm(title).replace(/[()\\]/g, '') || 'islev-semasi';
    offs[6] = len; push('6 0 obj\n<< /Title (' + t + ') /Producer (Islev Semasi Simulasyonu) >>\nendobj\n');
    const xref = len;
    let x = 'xref\n0 7\n0000000000 65535 f \n';
    for (let i = 1; i <= 6; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x);
    push('trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    return new Blob(parts, { type: 'application/pdf' });
  }

  function exportPNG(project, k, score) {
    return App.board.toCanvas(project, k, score, 2).then((cv) => canvasToBlob(cv, 'image/png')).then((blob) => saveBlob(U.slug(project.meta.name) + '-islev-semasi.png', blob));
  }
  function exportPDF(project, k, score) {
    return App.board.toCanvas(project, k, score, 2.5).then((cv) =>
      canvasToBlob(cv, 'image/jpeg', 0.93).then((b) => b.arrayBuffer()).then((buf) => buildPdf(new Uint8Array(buf), cv.width, cv.height, project.meta.name))
    ).then((blob) => saveBlob(U.slug(project.meta.name) + '-islev-semasi.pdf', blob));
  }
  function exportJSON(project, k, score, circ, suffix) {
    const text = JSON.stringify(toJSON(project, k, score, circ), null, 2);
    return saveBlob(U.slug(project.meta.name) + '-' + (suffix || 'islev-semasi') + '.json', new Blob([text], { type: 'application/json' }));
  }

  App.files = { SCHEMA: SCHEMA, toJSON: toJSON, fromJSON: fromJSON, exportPNG: exportPNG, exportPDF: exportPDF, exportJSON: exportJSON, saveBlob: saveBlob, buildPdf: buildPdf };
})();

/* ==========================================================================
   28-lib-sheet.js — ortak pafta çerçevesi ve etiket sığdırma (Modül 2 ve 3 kullanır)
   Çerçeve: levha + nokta ızgara + künye (başlık, gösterge, istatistik, skor).
   Çıktı primitif listesidir; ekranda SVG, dışa aktarmada Canvas aynı listeden çizilir.
   ========================================================================== */
(function () {
  const App = window.App;
  const PAL = App.PAL;
  const geo = App.geo;
  const fmt = App.util.fmt;

  const sheet = (App.sheet = { W: geo.W, H: geo.H, F: geo.FRAME, tb: geo.titleBlock });

  /* ---------- etiket sığdırma: kutuya (px) ad satırları + boyut ---------- */
  sheet.fitLabel = function (name, w, h, o) {
    o = o || {};
    const T = App.theme.cur().label;
    const text = T.upper ? String(name || '').toLocaleUpperCase('tr') : String(name || '');
    const words = text.split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    const extra = o.withArea ? 1 : 0;
    const maxFs = Math.min(o.max || 17, h * 0.34);
    for (let fs = maxFs; fs >= (o.min || 8); fs -= 0.5) {
      const cap = Math.max(2, Math.floor((w * 0.92) / (fs * T.cw)));
      const lines = [];
      let cur = '', ok = true;
      for (let i = 0; i < words.length; i++) {
        const wd = words[i];
        if (wd.length > cap) { ok = false; break; }
        const next = cur ? cur + ' ' + wd : wd;
        if (next.length <= cap) cur = next; else { lines.push(cur); cur = wd; }
      }
      if (!ok) continue;
      if (cur) lines.push(cur);
      const need = lines.length * fs * 1.16 + extra * fs * 0.95;
      if (need <= h * 0.9) return { lines: lines, fs: fs, ls: T.upper ? 0.4 : 0 };
    }
    return null;
  };

  sheet.dimText = (m) => fmt(m, m < 10 ? 2 : 1) + ' m';

  /* ---------- çerçeve ---------- */
  function baseGlass(live) {
    const P = [];
    const W = sheet.W, H = sheet.H, F = sheet.F, tb = sheet.tb, ink = PAL.ink;
    if (!live) P.push({ t: 'rect', x: 0, y: 0, w: W, h: H, fill: '#E9EAEE' });
    const fill = live ? 'rgba(249,250,252,.9)' : '#F6F7F9';
    P.push({ t: 'rect', x: F, y: F, w: W - F * 2, h: H - F * 2, rx: 40, fill: fill, shadow: { dx: 10, dy: 14, blur: 30, color: 'rgba(46,52,68,.22)', css: 'var(--sheet-lo, rgba(46,52,68,.22))' } });
    P.push({ t: 'rect', x: F, y: F, w: W - F * 2, h: H - F * 2, rx: 40, fill: fill, shadow: { dx: -8, dy: -8, blur: 20, color: 'rgba(255,255,255,.9)', css: 'var(--sheet-hi, rgba(255,255,255,.9))' } });
    for (let x = F + 50; x < W - F; x += 50) for (let y = F + 50; y < tb.y; y += 50) P.push({ t: 'circle', cx: x, cy: y, r: 1.5, fill: ink, opacity: 0.1 });
    P.push({ t: 'rect', x: F, y: F, w: W - F * 2, h: H - F * 2, rx: 40, stroke: ink, sw: 1.5, opacity: 0.1 });
    P.push({ t: 'line', x1: tb.x + 30, y1: tb.y, x2: tb.x + tb.w - 30, y2: tb.y, stroke: ink, sw: 1.5, opacity: 0.14 });
    return P;
  }

  function frameGlass(info, live) {
    const P = baseGlass(live);
    const tb = sheet.tb, ink = PAL.ink;
    let name = String(info.name || 'Adsız proje');
    const fs = name.length > 26 ? 18 : name.length > 20 ? 22 : 27;
    const maxCh = Math.floor(500 / (fs * 0.82));
    if (name.length > maxCh) name = name.slice(0, maxCh - 1) + '…';
    const x0 = tb.x + 36;
    P.push({ t: 'text', x: x0, y: tb.y + 56, s: name, size: fs, weight: 400, fam: 'd', fill: ink });
    P.push({ t: 'text', x: x0, y: tb.y + 84, s: info.subtitle || '', size: 15, weight: 600, fam: 'b', fill: ink, opacity: 0.5 });
    // gösterge (bölge renkleri): iki sütun
    const lg = (info.legend || []).slice(0, 8);
    lg.forEach((it, i) => {
      const col = i < 4 ? 0 : 1, row = i % 4;
      const x = 560 + col * 215, y = tb.y + 29 + row * 21;
      P.push({ t: 'circle', cx: x, cy: y - 4.5, r: 6.5, fill: it.fill, stroke: 'rgba(23,24,27,.28)', sw: 1.2 });
      P.push({ t: 'text', x: x + 16, y: y, s: it.label, size: 13, weight: 600, fam: 'b', fill: ink, opacity: 0.82 });
    });
    // istatistik
    const sx = 1000, ex = 1170;
    (info.stats || []).slice(0, 3).forEach((r, i) => {
      const y = tb.y + 40 + i * 25;
      P.push({ t: 'text', x: sx, y: y, s: r[0], size: 13, weight: 500, fam: 'b', fill: ink, opacity: 0.5 });
      P.push({ t: 'text', x: ex, y: y, s: r[1], size: 15, weight: 700, fam: 'b', fill: ink, anchor: 'end' });
    });
    const rx = tb.x + tb.w - 36;
    P.push({ t: 'text', x: rx, y: tb.y + 36, s: info.scoreLabel || 'Skor', size: 13, weight: 600, fam: 'b', fill: ink, opacity: 0.5, anchor: 'end' });
    P.push({ t: 'text', x: rx, y: tb.y + 84, s: info.percent == null ? '—' : '%' + info.percent, size: 50, weight: 300, fam: 'd', fill: ink, anchor: 'end' });
    return P;
  }

  function frameBauhaus(info, live) {
    const P = [];
    const W = sheet.W, H = sheet.H, F = sheet.F, tb = sheet.tb;
    P.push({ t: 'rect', x: 0, y: 0, w: W, h: H, fill: PAL.paper });
    for (let x = F + 50; x < W - F; x += 50) P.push({ t: 'line', x1: x, y1: F, x2: x, y2: tb.y, stroke: PAL.ink, sw: 1, opacity: 0.07 });
    for (let y = F + 50; y < tb.y; y += 50) P.push({ t: 'line', x1: F, y1: y, x2: W - F, y2: y, stroke: PAL.ink, sw: 1, opacity: 0.07 });
    P.push({ t: 'rect', x: F, y: F, w: W - F * 2, h: H - F * 2, stroke: PAL.ink, sw: 6 });
    P.push({ t: 'line', x1: F, y1: tb.y, x2: W - F, y2: tb.y, stroke: PAL.ink, sw: 5 });
    P.push({ t: 'rect', x: tb.x, y: tb.y, w: tb.h, h: tb.h, fill: PAL.blue });
    P.push({ t: 'circle', cx: tb.x + 36, cy: tb.y + 36, r: 20, fill: PAL.yellow, stroke: PAL.ink, sw: 3 });
    P.push({ t: 'rect', x: tb.x + 54, y: tb.y + 50, w: 36, h: 36, fill: PAL.red, stroke: PAL.ink, sw: 3 });
    P.push({ t: 'poly', pts: [[tb.x + 14, tb.y + 90], [tb.x + 46, tb.y + 90], [tb.x + 30, tb.y + 58]], fill: PAL.paper, stroke: PAL.ink, sw: 3 });
    const xs = [tb.x + tb.h, 700, 1000, 1190];
    xs.forEach((x) => P.push({ t: 'line', x1: x, y1: tb.y, x2: x, y2: tb.y + tb.h, stroke: PAL.ink, sw: 4 }));
    let name = String(info.name || 'Adsız proje').toLocaleUpperCase('tr');
    const fs = name.length > 26 ? 24 : name.length > 20 ? 30 : 36;
    const maxCh = Math.floor(540 / (fs * 0.66));
    if (name.length > maxCh) name = name.slice(0, maxCh - 1) + '…';
    P.push({ t: 'text', x: xs[0] + 22, y: tb.y + 54, s: name, size: fs, weight: 700, fam: 'd', fill: PAL.ink, ls: 1 });
    P.push({ t: 'text', x: xs[0] + 22, y: tb.y + 84, s: String(info.subtitle || '').toLocaleUpperCase('tr'), size: 15, weight: 600, fam: 'b', fill: PAL.ink, ls: 2.5, opacity: 0.8 });
    (info.legend || []).slice(0, 8).forEach((it, i) => {
      const col = i < 4 ? 0 : 1, row = i % 4;
      const x = xs[1] + 20 + col * 140, y = tb.y + 26 + row * 22;
      P.push({ t: 'rect', x: x, y: y - 12, w: 14, h: 14, fill: it.fill, stroke: PAL.ink, sw: 2 });
      P.push({ t: 'text', x: x + 22, y: y, s: String(it.label).toLocaleUpperCase('tr'), size: 11.5, weight: 600, fam: 'b', fill: PAL.ink, ls: 1 });
    });
    const sx = xs[2] + 20, ex = xs[3] - 20;
    (info.stats || []).slice(0, 3).forEach((r, i) => {
      const y = tb.y + 34 + i * 28;
      P.push({ t: 'text', x: sx, y: y, s: String(r[0]).toLocaleUpperCase('tr'), size: 12, weight: 500, fam: 'm', fill: PAL.ink, ls: 1.5, opacity: 0.7 });
      P.push({ t: 'text', x: ex, y: y, s: r[1], size: 17, weight: 700, fam: 'd', fill: PAL.ink, anchor: 'end' });
    });
    const pc = info.percent;
    const bg = pc == null ? PAL.paperDark : pc >= 70 ? PAL.green : pc >= 40 ? PAL.yellow : PAL.red;
    const fg = pc == null ? PAL.ink : pc >= 70 ? PAL.paper : pc >= 40 ? PAL.ink : PAL.paper;
    P.push({ t: 'rect', x: xs[3], y: tb.y, w: tb.x + tb.w - xs[3], h: tb.h, fill: bg });
    P.push({ t: 'text', x: xs[3] + 20, y: tb.y + 30, s: String(info.scoreLabel || 'Skor').toLocaleUpperCase('tr'), size: 13, weight: 500, fam: 'm', fill: fg, ls: 2 });
    P.push({ t: 'text', x: xs[3] + 20, y: tb.y + 88, s: pc == null ? '—' : '%' + pc, size: 58, weight: 700, fam: 'd', fill: fg });
    P.push({ t: 'rect', x: tb.x, y: tb.y, w: tb.w, h: tb.h, stroke: PAL.ink, sw: 4 });
    return P;
  }

  sheet.frame = function (info, live) { return App.theme.name === 'glass' ? frameGlass(info, live) : frameBauhaus(info, live); };

  // Bölge göstergesi: yalnızca projede bulunan bölgeler
  sheet.zoneLegend = function (zones) {
    return App.ZONE_ORDER.filter((z) => zones.indexOf(z) >= 0).map((z) => ({ label: App.ZONES[z].label, fill: App.ZONES[z].fill }));
  };

  // Sahneyi (primitifler) PNG / PDF olarak indir
  sheet.exportScene = function (prims, W, H, baseName, kind) {
    const U = App.util;
    if (kind === 'png') return App.board.primsToCanvas(prims, W, H, 2).then((cv) => new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error('Görüntü oluşturulamadı.'))), 'image/png'))).then((blob) => App.files.saveBlob(U.slug(baseName) + '.png', blob));
    return App.board.primsToCanvas(prims, W, H, 2.5).then((cv) => new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error('Görüntü oluşturulamadı.'))), 'image/jpeg', 0.93)).then((b) => b.arrayBuffer()).then((buf) => App.files.buildPdf(new Uint8Array(buf), cv.width, cv.height, baseName))).then((blob) => App.files.saveBlob(U.slug(baseName) + '.pdf', blob));
  };
})();

/* ==========================================================================
   30-state.js — proje modeli, reducer (geri al/ileri al), türetilmiş veriler, otomatik kayıt
   Proje modeli: { meta, spaces: [{id,name,area,zone,x,y}], relations: {"idA|idB": "strong|weak|avoid"} }
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const geo = App.geo;

  const STORE_KEY = 'islev-semasi:v1:autosave';

  /* ---------------- proje üretimi ---------------- */
  function createFromTemplate(typeKey, variantKey, opts) {
    opts = opts || {};
    const type = App.kb.type(typeKey);
    const v = App.kb.variant(typeKey, variantKey);
    const entries = v.entries.filter((e) => e.req);
    const idByKey = {};
    const spaces = entries.map((e) => {
      const id = U.uid() + e.key;
      idByKey[e.key] = id;
      return { id: id, name: e.name, area: App.analyze.defaultArea(e), zone: e.zone, x: geo.W / 2, y: geo.H / 2 };
    });
    const relations = {};
    v.relations.forEach((r) => {
      if (idByKey[r[0]] && idByKey[r[1]]) relations[U.pairKey(idByKey[r[0]], idByKey[r[1]])] = r[2];
    });
    const k = geo.scale(spaces);
    const pos = App.layout.auto(spaces, relations, k, {});
    spaces.forEach((s) => { if (pos[s.id]) { s.x = pos[s.id].x; s.y = pos[s.id].y; } });
    if (opts.messy && spaces.length > 3) {
      // örnek proje: bilerek dağınık başlar → "Otomatik yerleştir" farkı hemen gösterir
      const pts = spaces.map((s) => ({ x: s.x, y: s.y }));
      const n = spaces.length;
      let best = null;
      for (let shift = 1; shift < n; shift++) {
        const moved = spaces.map((s, i) => Object.assign({}, s, pts[(i + shift) % n]));
        const pc = App.score.evaluate(moved, relations, k).percent;
        if (pc != null && (best === null || pc < best.pc)) best = { pc: pc, shift: shift };
      }
      if (best) spaces.forEach((s, i) => { const q = pts[(i + best.shift) % n]; s.x = q.x; s.y = q.y; });
    }
    return {
      meta: { name: opts.name || (opts.messy ? 'Örnek: ' : '') + v.label + ' ' + type.label, buildingType: type.key, variant: v.key, createdAt: new Date().toISOString(), example: !!opts.messy },
      spaces: spaces,
      relations: relations,
    };
  }

  function emptyProject() {
    return { meta: { name: 'Yeni proje', buildingType: 'konut', variant: '2+1', createdAt: new Date().toISOString(), example: false }, spaces: [], relations: {} };
  }

  /* ---------------- otomatik kayıt (kişisel kolaylık) ---------------- */
  function loadSaved() {
    try {
      const raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      return App.files.fromJSON(raw);
    } catch (e) { return null; }
  }
  function persist(project) {
    try {
      const k = geo.scale(project.spaces);
      window.localStorage.setItem(STORE_KEY, JSON.stringify(App.files.toJSON(project, k, null, null)));
    } catch (e) { /* depolama yoksa sessizce atla */ }
  }
  function clearSaved() { try { window.localStorage.removeItem(STORE_KEY); } catch (e) {} }

  /* ---------------- başlangıç durumu ---------------- */
  function initialState() {
    const saved = loadSaved();
    let project = saved || createFromTemplate('konut', '2+1', { messy: true });
    if (App.study && !project.study) project = Object.assign({}, project, { study: App.study.init(project) });
    if (App.site && !project.site) project = Object.assign({}, project, App.site.init());
    return {
      project: project,
      past: [], future: [],
      selectedId: null,
      restored: !!saved,
      ui: {
        module: 'islev', tab: 'spaces', assistantOpen: false, asTab: 'analysis', messages: [], toast: null, highlight: null,
        stTab: 'katlar', anTab: 'gorunum', an: App.analysisDefaults ? App.analysisDefaults() : {},
        site: App.siteUi ? App.siteUi.arsa() : {}, imar: App.siteUi ? App.siteUi.imar() : {}, yer: App.siteUi ? App.siteUi.yer() : {}, geo: { busy: null, msg: '', err: null },
        form: { name: '', area: '' }, tplType: project.meta.buildingType, tplVariant: project.meta.variant,
        busy: null, hintDismissed: false, style: App.theme.name,
      },
    };
  }

  /* ---------------- reducer ---------------- */
  const HISTORY = 60;
  // geri al/ileri al: kat etüdü (study), arsa / imar (site) ve aday konumlar (cand) da projeyle birlikte geri alınır
  function snap(project) { return { meta: project.meta, spaces: project.spaces, relations: project.relations, study: project.study, site: project.site, cand: project.cand }; }
  function withHistory(state, project) {
    const meta = project.meta.example ? Object.assign({}, project.meta, { example: false }) : project.meta;
    return Object.assign({}, state, {
      project: Object.assign({}, project, { meta: meta }),
      past: state.past.concat([snap(state.project)]).slice(-HISTORY),
      future: [],
    });
  }
  const setUi = (state, patch) => Object.assign({}, state, { ui: Object.assign({}, state.ui, patch) });

  function reducer(state, a) {
    const P = state.project;
    switch (a.type) {
      case 'ADD_SPACES': {
        const spaces = P.spaces.slice();
        const ids = [];
        a.list.forEach((it) => {
          const area = U.clamp(Number(it.area) || 10, 0.5, 100000);
          const item = { id: U.uid(), name: String(it.name || 'Mekân').slice(0, 60), area: area, zone: App.ZONES[it.zone] ? it.zone : App.match.zoneFor(it.name, P.meta.buildingType, P.meta.variant), x: geo.W / 2, y: geo.H / 2 };
          const k = geo.scale(spaces.concat(item));
          const pos = App.layout.freeSpot(spaces, area, k);
          item.x = pos.x; item.y = pos.y;
          spaces.push(item);
          ids.push(item.id);
        });
        if (a.list.length > 2) {
          const k = geo.scale(spaces);
          const pos = App.layout.auto(spaces, P.relations, k, { keep: true, iter: 260 });
          spaces.forEach((s) => { if (pos[s.id]) { s.x = pos[s.id].x; s.y = pos[s.id].y; } });
        }
        const next = withHistory(state, Object.assign({}, P, { spaces: spaces }));
        next.selectedId = ids[ids.length - 1];
        return next;
      }
      case 'UPDATE_SPACE': {
        const spaces = P.spaces.map((s) => {
          if (s.id !== a.id) return s;
          const patch = {};
          if (a.patch.name != null) patch.name = String(a.patch.name).slice(0, 60);
          if (a.patch.area != null) { const v = Number(a.patch.area); if (v > 0) patch.area = U.clamp(v, 0.5, 100000); }
          if (a.patch.zone != null && App.ZONES[a.patch.zone]) patch.zone = a.patch.zone;
          return Object.assign({}, s, patch);
        });
        return withHistory(state, Object.assign({}, P, { spaces: spaces }));
      }
      case 'REMOVE_SPACE': {
        const spaces = P.spaces.filter((s) => s.id !== a.id);
        const rel = {};
        Object.keys(P.relations).forEach((key) => { if (key.split('|').indexOf(a.id) < 0) rel[key] = P.relations[key]; });
        const next = withHistory(state, Object.assign({}, P, { spaces: spaces, relations: rel }));
        if (state.selectedId === a.id) next.selectedId = null;
        return next;
      }
      case 'DRAG_START': return Object.assign({}, state, { past: state.past.concat([snap(P)]).slice(-HISTORY), future: [], project: P.meta.example ? Object.assign({}, P, { meta: Object.assign({}, P.meta, { example: false }) }) : P });
      case 'SNAPSHOT': return Object.assign({}, state, { past: state.past.concat([snap(P)]).slice(-HISTORY), future: [] });
      case 'MOVE': {
        const spaces = P.spaces.map((s) => (s.id === a.id ? Object.assign({}, s, { x: a.x, y: a.y }) : s));
        return Object.assign({}, state, { project: Object.assign({}, P, { spaces: spaces }) });
      }
      case 'SET_POSITIONS': {
        const spaces = P.spaces.map((s) => (a.positions[s.id] ? Object.assign({}, s, { x: a.positions[s.id].x, y: a.positions[s.id].y }) : s));
        return Object.assign({}, state, { project: Object.assign({}, P, { spaces: spaces }) });
      }
      case 'SET_RELATION': {
        const key = U.pairKey(a.a, a.b);
        if (a.a === a.b) return state;
        const rel = Object.assign({}, P.relations);
        if (a.rel === 'none') delete rel[key]; else rel[key] = a.rel;
        if ((P.relations[key] || 'none') === a.rel) return state;
        return withHistory(state, Object.assign({}, P, { relations: rel }));
      }
      case 'CYCLE_RELATION': {
        const key = U.pairKey(a.a, a.b);
        const cur = P.relations[key] || 'none';
        const nxt = App.REL_CYCLE[(App.REL_CYCLE.indexOf(cur) + 1) % App.REL_CYCLE.length];
        return reducer(state, { type: 'SET_RELATION', a: a.a, b: a.b, rel: nxt });
      }
      case 'SET_META': return withHistory(state, Object.assign({}, P, { meta: Object.assign({}, P.meta, a.patch) }));
      case 'LOAD_PROJECT': {
        const next = withHistory(state, a.project);
        next.project = a.project;
        next.selectedId = null;
        next.ui = Object.assign({}, state.ui, { tplType: a.project.meta.buildingType, tplVariant: a.project.meta.variant });
        return next;
      }
      case 'UNDO': {
        if (!state.past.length) return state;
        const prev = state.past[state.past.length - 1];
        return Object.assign({}, state, { project: Object.assign({}, prev), past: state.past.slice(0, -1), future: [snap(P)].concat(state.future), selectedId: prev.spaces.some((s) => s.id === state.selectedId) ? state.selectedId : null });
      }
      case 'REDO': {
        if (!state.future.length) return state;
        const nx = state.future[0];
        return Object.assign({}, state, { project: Object.assign({}, nx), past: state.past.concat([snap(P)]), future: state.future.slice(1) });
      }
      case 'SELECT': return state.selectedId === a.id ? state : Object.assign({}, state, { selectedId: a.id });
      case 'UI': return setUi(state, a.patch);
      case 'FORM': return setUi(state, { form: Object.assign({}, state.ui.form, a.patch) });
      case 'TOAST': return setUi(state, { toast: { msg: a.msg, kind: a.kind || 'info', id: Date.now() } });
      case 'CLEAR_TOAST': return state.ui.toast ? setUi(state, { toast: null }) : state;
      case 'CHAT_ADD': return setUi(state, { messages: state.ui.messages.concat([a.msg]).slice(-30) });
      case 'HIGHLIGHT': return setUi(state, { highlight: a.pair });
      default: return state;
    }
  }

  /* ---------------- modül eklentileri ----------------
     Diğer modüller (kat etüdü vb.) kendi eylemlerini hook ile ekler: fn(next, action, prev) → yeni state | undefined */
  const hooks = [];
  function rootReducer(state, a) {
    let next = reducer(state, a);
    for (let i = 0; i < hooks.length; i++) { const r = hooks[i](next, a, state); if (r) next = r; }
    return next;
  }

  /* ---------------- türetilmiş veriler (önbellekli) ---------------- */
  let memo = { project: null, out: null };
  function derive(state) {
    if (memo.project === state.project) return memo.out;
    const k = geo.scale(state.project.spaces);
    const score = App.score.evaluate(state.project.spaces, state.project.relations, k);
    const analysis = App.analyze.run(state.project, k, score);
    memo = { project: state.project, out: { k: k, score: score, analysis: analysis } };
    return memo.out;
  }

  App.state = { createFromTemplate: createFromTemplate, emptyProject: emptyProject, initialState: initialState, reducer: rootReducer, derive: derive, persist: persist, clearSaved: clearSaved, hooks: hooks, withHistory: withHistory, snap: snap, setUi: setUi, HISTORY: HISTORY };
})();

/* ==========================================================================
   31-lib-floors.js — Modül 2 mantığı: kat etüdü (saf fonksiyonlar, arayüzden bağımsız)
   Girdi : Modül 1 projesi (mekânlar, m², bölge, ilişkiler, balon konumları) + project.study
   Çıktı : kat başına ölçekli plan blokları (metre), skor, bulgular
   Birim : plan koordinatları metredir. x = plan genişliği (u), y = plan derinliği (v, aşağı doğru).
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const N = U.norm;
  const fmt = U.fmt;

  const CORE_RE = /merdiven|asansor|cekirdek/;
  const isCore = (s) => CORE_RE.test(N(s.name));
  const floorName = (i) => (i === 0 ? 'Zemin kat' : i + '. kat');
  const CORRIDOR_W = 1.5; // m
  const MIN_CORE = 12;    // m² (merdiven + asansör + şaft)

  function makeFloors(n, old) {
    const out = [];
    for (let i = 0; i < n; i++) out.push({ id: 'f' + i, name: old && old[i] ? old[i].name : floorName(i) });
    return out;
  }

  /* ---------- kat tercihi: 0 = zemin, 1 = üst kat ---------- */
  function pref0(s) {
    const nm = N(s.name);
    if (/yatak holu|ust hol/.test(nm)) return 0.9;
    if (/ebeveyn banyo|ensuit|en suite/.test(nm)) return 1;
    if (/banyo/.test(nm)) return 0.8;
    if (/\bwc\b|tuvalet/.test(nm)) return 0.1;
    if (/garaj|otopark|kazan|teknik|depo|kiler|siginak|mal kabul|yukleme/.test(nm)) return 0;
    if (/yatak|ebeveyn|cocuk|uyku|giyinme|misafir odasi/.test(nm)) return 1;
    if (/derslik|sinif|atolye|laboratuvar|\blab\b|kutuphane|toplanti|studyo|studuyo|ofis|mudur|yonetici|idare|rehberlik|muayene|calisma/.test(nm)) return 0.7;
    const zp = { sosyal: 0.05, servis: 0.25, sirkulasyon: 0.1, ozel: 0.95, calisma: 0.7, teknik: 0, acik: 0.5 };
    return zp[s.zone] != null ? zp[s.zone] : 0.5;
  }

  function suggestCount(project) {
    const mov = project.spaces.filter((s) => !isCore(s)).length;
    return U.clamp(Math.ceil(mov / 6), 1, 5);
  }

  /* ---------- otomatik kat ataması ----------
     Kural: bölge/anahtar kelimeden kat tercihi → güçlü ilişkili komşuların tercihiyle yumuşatma →
     tercihe göre sırala → alan dengesine göre katlara böl. */
  function autoAssign(spaces, relations, floors) {
    const n = floors.length;
    const out = {};
    if (n <= 1) { spaces.forEach((s) => (out[s.id] = floors[0].id)); return out; }
    const mov = spaces.filter((s) => !isCore(s));
    const p0 = {}, adj = {};
    mov.forEach((s) => { p0[s.id] = pref0(s); adj[s.id] = []; });
    Object.keys(relations).forEach((key) => {
      const ids = key.split('|');
      if (!(ids[0] in adj) || !(ids[1] in adj)) return;
      const w = relations[key] === 'strong' ? 3 : relations[key] === 'weak' ? 1 : 0;
      if (!w) return;
      adj[ids[0]].push([ids[1], w]); adj[ids[1]].push([ids[0], w]);
    });
    let p = Object.assign({}, p0);
    for (let it = 0; it < 3; it++) {
      const q = {};
      mov.forEach((s) => {
        let ws = 0, acc = 0;
        adj[s.id].forEach((e) => { ws += e[1]; acc += e[1] * p[e[0]]; });
        q[s.id] = ws ? 0.65 * p0[s.id] + 0.35 * (acc / ws) : p0[s.id];
      });
      p = q;
    }
    const order = mov.map((s, i) => ({ s: s, i: i })).sort((a, b) => p[a.s.id] - p[b.s.id] || a.i - b.i);
    const total = U.sum(mov, (s) => s.area) || 1;
    const cap = total / n;
    let cum = 0;
    order.forEach((o) => {
      const mid = cum + o.s.area / 2;
      out[o.s.id] = floors[Math.min(n - 1, Math.floor(mid / cap))].id;
      cum += o.s.area;
    });
    return out;
  }

  function init(project) {
    const n = suggestCount(project);
    const floors = makeFloors(n);
    return { floors: floors, assign: autoAssign(project.spaces, project.relations, floors), typology: 'serbest', ratio: 1.5, core: { auto: true, area: 16 }, auto: true };
  }

  /* ---------- geometri yardımcıları ---------- */
  const rectGap = (a, b) => {
    const dx = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w));
    const dy = Math.max(0, Math.max(a.y, b.y) - Math.min(a.y + a.h, b.y + b.h));
    return Math.hypot(dx, dy);
  };
  const overlapLen = (a0, a1, b0, b1) => Math.min(a1, b1) - Math.max(a0, b0);
  function touching(a, b) {
    if (rectGap(a, b) > 0.2) return false;
    return overlapLen(a.x, a.x + a.w, b.x, b.x + b.w) > 0.3 || overlapLen(a.y, a.y + a.h, b.y, b.y + b.h) > 0.3;
  }
  const overlapArea = (a, b) => Math.max(0, overlapLen(a.x, a.x + a.w, b.x, b.x + b.w)) * Math.max(0, overlapLen(a.y, a.y + a.h, b.y, b.y + b.h));

  /* ---------- bant bazlı yerleşim: balon konumlarını koruyarak kutuları dizer ---------- */
  function packBands(items, x0, y0, W, H, vertical) {
    const n = items.length;
    if (!n) return { rects: [], cost: 0 };
    const prim = vertical ? (it) => it.bx : (it) => it.by;
    const sec = vertical ? (it) => it.by : (it) => it.bx;
    const sorted = items.slice().sort((p, q) => prim(p) - prim(q));
    const total = U.sum(sorted, (it) => it.a);
    let best = null;
    for (let k = 1; k <= Math.min(n, 7); k++) {
      const groups = [];
      let cum = 0;
      sorted.forEach((it) => {
        const b = Math.min(k - 1, Math.floor(((cum + it.a / 2) / total) * k));
        (groups[b] = groups[b] || []).push(it);
        cum += it.a;
      });
      const rects = [];
      let off = 0;
      groups.filter(Boolean).forEach((g) => {
        const ag = U.sum(g, (it) => it.a);
        const thick = vertical ? ag / H : ag / W;
        let run = 0;
        g.sort((p, q) => sec(p) - sec(q)).forEach((it) => {
          const len = it.a / thick;
          rects.push(vertical
            ? { it: it, x: x0 + off, y: y0 + run, w: thick, h: len }
            : { it: it, x: x0 + run, y: y0 + off, w: len, h: thick });
          run += len;
        });
        off += thick;
      });
      let cost = 0;
      rects.forEach((r) => { cost += r.w * r.h * (Math.max(r.w / r.h, r.h / r.w) - 1); });
      if (!best || cost < best.cost) best = { rects: rects, cost: cost };
    }
    return best;
  }
  function packFree(items, x0, y0, W, H) {
    const a = packBands(items, x0, y0, W, H, false);
    const b = packBands(items, x0, y0, W, H, true);
    return b.cost < a.cost * 0.92 ? b.rects : a.rects;
  }
  function packRow(items, x0, y0, len, h) {
    const rects = [];
    let run = 0;
    items.slice().sort((p, q) => p.bx - q.bx).forEach((it) => {
      const w = h > 0 ? it.a / h : 0;
      rects.push({ it: it, x: x0 + run, y: y0, w: w, h: h });
      run += w;
    });
    return rects;
  }

  function spaceBlock(r) {
    const s = r.it.s;
    const side = Math.min(r.w, r.h);
    return { id: 'b' + s.id, kind: 'space', spaceId: s.id, name: s.name, zone: s.zone, area: s.area, x: r.x, y: r.y, w: r.w, h: r.h, minSide: side, aspect: Math.max(r.w, r.h) / Math.max(side, 0.001) };
  }

  /* ---------- kat planı üretimi ---------- */
  const memo = { key: null, plan: null };
  function layout(project) {
    const st = project.study;
    if (memo.key && memo.key[0] === project.spaces && memo.key[1] === project.relations && memo.key[2] === st) return memo.plan;
    const floors = st.floors;
    const n = floors.length;
    const useCore = n > 1;
    const coreSpaces = useCore ? project.spaces.filter(isCore) : [];
    const mov = project.spaces.filter((s) => coreSpaces.indexOf(s) < 0);
    const coreArea = useCore ? (st.core.auto ? Math.max(MIN_CORE, U.sum(coreSpaces, (s) => s.area)) : Math.max(4, st.core.area)) : 0;
    const typ = st.typology === 'koridor' ? 'koridor' : 'serbest';
    const cw = typ === 'koridor' ? CORRIDOR_W : 0;
    const r = U.clamp(st.ratio || 1.5, 1, 3);

    const fdata = floors.map((f, i) => {
      const list = mov.filter((s) => (st.assign[s.id] && floors.some((x) => x.id === st.assign[s.id]) ? st.assign[s.id] : floors[0].id) === f.id);
      return { floor: f, index: i, spaces: list, net: U.sum(list, (s) => s.area) };
    });
    const Nmax = Math.max(1, Math.max.apply(null, fdata.map((f) => f.net)));

    // ortak kat plağı: en dolu katın alanına ve istenen oran r'ye göre derinlik (bisection)
    const Dof = (D) => (coreArea / D + Nmax / (D - cw)) / D - r;
    let lo = cw + 1.5, hi = 90;
    let Dp;
    if (Dof(lo) <= 0) Dp = lo;
    else { for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (Dof(mid) > 0) lo = mid; else hi = mid; } Dp = (lo + hi) / 2; }
    const cwid = coreArea / Dp;
    const Wp = cwid + Nmax / (Dp - cw);

    const pos = new Map(project.spaces.map((s) => [s.id, s]));
    const out = fdata.map((fd) => {
      const blocks = [];
      if (useCore) blocks.push({ id: 'core' + fd.index, kind: 'core', name: 'Çekirdek', zone: 'sirkulasyon', area: coreArea, x: 0, y: 0, w: cwid, h: Dp, minSide: Math.min(cwid, Dp), aspect: 1 });
      const items = fd.spaces.map((s) => ({ s: s, a: s.area, bx: pos.get(s.id).x, by: pos.get(s.id).y }));
      const len = fd.net / (Dp - cw);
      const x0 = cwid;
      if (typ === 'koridor') {
        const sorted = items.slice().sort((p, q) => p.by - q.by);
        const total = U.sum(sorted, (it) => it.a);
        const north = [], south = [];
        let cum = 0;
        sorted.forEach((it) => { (cum + it.a / 2 < total / 2 ? north : south).push(it); cum += it.a; });
        if (!north.length && south.length) north.push(south.shift());
        const A1 = U.sum(north, (it) => it.a);
        const d1 = len > 0 ? A1 / len : 0;
        packRow(north, x0, 0, len, d1).forEach((rc) => blocks.push(spaceBlock(rc)));
        blocks.push({ id: 'cor' + fd.index, kind: 'corridor', name: 'Koridor', zone: 'sirkulasyon', area: len * cw, x: x0, y: d1, w: len, h: cw, minSide: cw, aspect: len / cw });
        const d2 = len > 0 ? U.sum(south, (it) => it.a) / len : 0;
        packRow(south, x0, d1 + cw, len, d2).forEach((rc) => blocks.push(spaceBlock(rc)));
      } else {
        packFree(items, x0, 0, len, Dp).forEach((rc) => blocks.push(spaceBlock(rc)));
      }
      const used = x0 + len;
      const voidW = Wp - used;
      if (voidW > 0.05) blocks.push({ id: 'void' + fd.index, kind: 'void', name: 'Boş / teras', zone: 'acik', area: voidW * Dp, x: used, y: 0, w: voidW, h: Dp, minSide: Math.min(voidW, Dp), aspect: 1 });
      const voidArea = voidW > 0.05 ? voidW * Dp : 0;
      return { id: fd.floor.id, name: fd.floor.name, index: fd.index, blocks: blocks, net: fd.net, void: voidArea, spaces: fd.spaces };
    });

    const plan = { Wp: Wp, Dp: Dp, plateArea: Wp * Dp, coreArea: coreArea, cwid: cwid, typology: typ, ratio: r, useCore: useCore, coreSpaces: coreSpaces, corridorW: cw, floors: out };
    memo.key = [project.spaces, project.relations, st];
    memo.plan = plan;
    return plan;
  }

  /* ---------- ölçüler ve skor ---------- */
  function metricsOf(project, plan) {
    const blockOf = new Map();
    plan.floors.forEach((f) => f.blocks.forEach((b) => { if (b.spaceId) blockOf.set(b.spaceId, { b: b, fi: f.index }); }));
    const strongCross = [], strongNear = [], avoidTouch = [];
    let wSum = 0, acc = 0, nPairs = 0, strongTotal = 0, strongSame = 0;
    Object.keys(project.relations).forEach((key) => {
      const ids = key.split('|');
      const A = blockOf.get(ids[0]), B = blockOf.get(ids[1]);
      if (!A || !B) return;
      const type = project.relations[key];
      const same = A.fi === B.fi;
      const gap = same ? rectGap(A.b, B.b) : null;
      const touch = same && touching(A.b, B.b);
      const adjFloor = Math.abs(A.fi - B.fi) === 1;
      const stack = !same && adjFloor && overlapArea(A.b, B.b) > 0;
      let sc = 1, w = 1;
      if (type === 'strong') {
        w = 3; strongTotal++;
        if (same) { strongSame++; sc = touch ? 1 : gap <= 1.8 ? 0.85 : 0.55; if (!touch && gap > 1.8) strongNear.push({ a: ids[0], b: ids[1], gap: gap }); }
        else { sc = stack ? 0.5 : adjFloor ? 0.35 : 0.15; strongCross.push({ a: ids[0], b: ids[1], fa: A.fi, fb: B.fi }); }
      } else if (type === 'weak') {
        w = 1; sc = same ? 1 : adjFloor ? 0.6 : 0.35;
      } else if (type === 'avoid') {
        w = 2; sc = touch ? 0 : same ? 0.75 : 1;
        if (touch) avoidTouch.push({ a: ids[0], b: ids[1] });
      } else return;
      nPairs++; wSum += w; acc += w * sc;
    });
    const nets = plan.floors.map((f) => f.net);
    const maxN = Math.max.apply(null, nets), minN = Math.min.apply(null, nets);
    const balance = maxN > 0 ? 1 - (maxN - minN) / maxN : 1;
    const totalNet = U.sum(nets);
    const totalGross = plan.plateArea * plan.floors.length;

    // ıslak hacimlerin düşey hizası
    let upperWet = 0, alignedWet = 0;
    for (let i = 1; i < plan.floors.length; i++) {
      const lower = plan.floors[i - 1].blocks.filter((b) => b.kind === 'space' && b.zone === 'servis');
      plan.floors[i].blocks.filter((b) => b.kind === 'space' && b.zone === 'servis').forEach((b) => {
        upperWet += b.w * b.h;
        lower.forEach((lb) => { alignedWet += overlapArea(b, lb); });
      });
    }
    const wetAlign = upperWet > 0 ? Math.min(1, alignedWet / upperWet) : null;

    return {
      score: nPairs ? Math.round((acc / wSum) * 100) : null,
      pairs: nPairs, strongTotal: strongTotal, strongSame: strongSame,
      strongCross: strongCross, strongNear: strongNear, avoidTouch: avoidTouch,
      balance: balance, totalNet: totalNet, totalGross: totalGross,
      fill: totalGross ? totalNet / totalGross : 0,
      wetAlign: wetAlign, nFloors: plan.floors.length,
    };
  }

  /* ---------- bulgular (kart biçimi: Modül 1 asistanıyla aynı) ---------- */
  const LEVEL_ORDER = { hata: 0, uyari: 1, oneri: 2, ok: 3 };
  function findings(project, plan, m) {
    const items = [];
    const name = new Map(project.spaces.map((s) => [s.id, s.name]));
    const area = new Map(project.spaces.map((s) => [s.id, s.area]));
    const fl = (i) => plan.floors[i].name;
    const floorOf = new Map();
    plan.floors.forEach((f) => f.blocks.forEach((b) => { if (b.spaceId) floorOf.set(b.spaceId, f); }));

    if (!project.spaces.length) {
      items.push({ id: 'empty', level: 'oneri', title: 'Önce işlev şemasında mekân ekleyin', detail: 'Kat etüdü, İşlev Şeması modülündeki mekânları katlara dağıtır.', src: [], actions: [{ type: 'goto', module: 'islev', label: 'İşlev Şeması’na git' }] });
      return { items: items, counts: { hata: 0, uyari: 0, oneri: 1 } };
    }
    m.strongCross.slice(0, 6).forEach((p) => {
      const small = area.get(p.a) <= area.get(p.b) ? p.a : p.b;
      const other = small === p.a ? p.b : p.a;
      items.push({
        id: 'cross-' + p.a + p.b, level: 'uyari',
        title: name.get(p.a) + ' ile ' + name.get(p.b) + ' farklı katlarda',
        detail: 'Güçlü ilişkili iki mekân ' + fl(p.fa) + ' ve ' + fl(p.fb) + ' katlarında; aralarındaki bağ merdivenle kurulur. Aynı kata almak dolaşımı kısaltır.',
        src: ['White'],
        actions: [{ type: 'studyMove', id: small, floorId: floorOf.get(other).id, label: name.get(small) + ' → ' + floorOf.get(other).name }, { type: 'select', id: small, label: 'Göster' }],
      });
    });
    m.avoidTouch.slice(0, 4).forEach((p) => {
      items.push({ id: 'avoid-' + p.a + p.b, level: 'uyari', title: name.get(p.a) + ' ile ' + name.get(p.b) + ' bitişik ama ayrı tutulmalı', detail: 'Bu çift “ayrı tut” olarak işaretli (gürültü, koku, mahremiyet). Farklı katlara ya da planın karşı uçlarına alın.', src: ['White'], actions: [{ type: 'select', id: p.a, label: 'Göster' }] });
    });
    m.strongNear.slice(0, 4).forEach((p) => {
      items.push({ id: 'near-' + p.a + p.b, level: 'oneri', title: name.get(p.a) + ' ile ' + name.get(p.b) + ' aynı katta ama bitişik değil', detail: 'Aralarında yaklaşık ' + fmt(p.gap, 1) + ' m var. Bitişik yerleştirin ya da kısa bir sirkülasyonla bağlayın.', src: ['White'], actions: [{ type: 'select', id: p.a, label: 'Göster' }] });
    });
    // dar kutular
    const thin = [];
    plan.floors.forEach((f) => f.blocks.forEach((b) => { if (b.kind === 'space' && b.zone !== 'sirkulasyon' && (b.minSide < 1.4 || b.aspect > 4)) thin.push(b); }));
    thin.slice(0, 3).forEach((b) => {
      items.push({ id: 'thin-' + b.id, level: 'oneri', title: b.name + ' plana sığarken çok dar kalıyor (' + fmt(Math.min(b.w, b.h), 1) + ' × ' + fmt(Math.max(b.w, b.h), 1) + ' m)', detail: 'Bu oranda mekân kullanışlı olmaz. Plan oranını değiştirin ya da mekânı başka bir kata alın.', src: ['S'], actions: [{ type: 'select', id: b.spaceId, label: 'Göster' }] });
    });
    if (plan.floors.length > 1) {
      plan.floors.forEach((f) => {
        const share = plan.plateArea ? f.void / (plan.plateArea - plan.coreArea || 1) : 0;
        if (share > 0.3 && f.net > 0) items.push({ id: 'void-' + f.id, level: 'oneri', title: f.name + ' plağın %' + Math.round(share * 100) + '’ini boş bırakıyor', detail: 'Katlar arasındaki alan dağılımı dengesiz. Mekânları dengeleyin ya da boş kısmı teras / çatı bahçesi olarak kullanın.', src: ['S'], actions: [{ type: 'studyAuto', label: 'Otomatik dağıt' }] });
        if (!f.net) items.push({ id: 'empty-' + f.id, level: 'uyari', title: f.name + ' boş', detail: 'Bu kata hiç mekân atanmadı. Kat sayısını azaltın ya da mekânları taşıyın.', src: [], actions: [{ type: 'studyAuto', label: 'Otomatik dağıt' }] });
      });
      if (m.wetAlign != null && m.wetAlign < 0.5) items.push({ id: 'wet', level: 'oneri', title: 'Islak hacimler düşeyde hizalı değil (%' + Math.round(m.wetAlign * 100) + ')', detail: 'Mutfak, banyo ve WC’leri üst üste getirmek tesisat şaftını kısaltır ve maliyeti düşürür.', src: ['S'], actions: [] });
    }
    items.sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]);
    const counts = { hata: 0, uyari: 0, oneri: 0 };
    items.forEach((i) => { if (counts[i.level] != null) counts[i.level]++; });
    if (!counts.hata && !counts.uyari) items.unshift({ id: 'ok', level: 'ok', title: 'Kat dağılımında kritik sorun görünmüyor', detail: m.score != null ? 'Kat etüdü skoru %' + m.score + '. Kalan önerileri gözden geçirin.' : 'İlişkileri tanımlayarak skoru başlatın.', src: [], actions: [] });
    return { items: items, counts: counts };
  }

  const derivedMemo = { plan: null, out: null };
  function derive(project) {
    const plan = layout(project);
    if (derivedMemo.plan === plan) return derivedMemo.out;
    const m = metricsOf(project, plan);
    const f = findings(project, plan, m);
    derivedMemo.plan = plan;
    derivedMemo.out = { plan: plan, metrics: m, findings: f };
    return derivedMemo.out;
  }

  App.study = App.study || {};
  Object.assign(App.study, {
    init: init, isCore: isCore, floorName: floorName, makeFloors: makeFloors, autoAssign: autoAssign, suggestCount: suggestCount,
    layout: layout, metrics: metricsOf, findings: findings, derive: derive, touching: touching, rectGap: rectGap, overlapArea: overlapArea, MIN_CORE: MIN_CORE, CORRIDOR_W: CORRIDOR_W,
  });
})();

/* ==========================================================================
   32-state-floors.js — kat etüdü eylemleri (reducer eklentisi) ve JSON uzantısı
   Kat etüdü verisi proje içinde project.study olarak durur; böylece geri al/ileri al,
   otomatik kayıt ve JSON içe/dışa aktarma Modül 1 ile aynı akışı kullanır.
   Eylemler: STUDY_FLOORS {count} · STUDY_SET / STUDY_SET_LIVE {patch} · STUDY_ASSIGN {id, floorId}
             STUDY_MOVE_BY {id, dir} · STUDY_AUTO · STUDY_RENAME {id, name}
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const S = App.state;
  const st = App.study;

  /* ---------- mekân listesi değişince atamaları eşitle ---------- */
  function needsSync(P) {
    const a = P.study.assign;
    const floorIds = P.study.floors.map((f) => f.id);
    const one = floorIds.length === 1;
    let count = 0;
    for (let i = 0; i < P.spaces.length; i++) {
      const s = P.spaces[i];
      const has = s.id in a;
      if (!one && st.isCore(s)) { if (has) return true; continue; }
      if (!has || floorIds.indexOf(a[s.id]) < 0) return true;
      count++;
    }
    return Object.keys(a).length !== count;
  }

  function syncProject(P) {
    const study = P.study;
    const floors = study.floors;
    const one = floors.length === 1;
    const ids = new Set(P.spaces.map((s) => s.id));
    const assign = {};
    Object.keys(study.assign).forEach((id) => { if (ids.has(id) && floors.some((f) => f.id === study.assign[id])) assign[id] = study.assign[id]; });
    if (one) P.spaces.forEach((s) => { assign[s.id] = floors[0].id; });
    else {
      P.spaces.forEach((s) => { if (st.isCore(s)) delete assign[s.id]; });
      const fresh = P.spaces.filter((s) => !(s.id in assign) && !st.isCore(s));
      if (fresh.length) {
        const all = st.autoAssign(P.spaces, P.relations, floors);
        fresh.forEach((s) => { assign[s.id] = all[s.id]; });
      }
    }
    return Object.assign({}, P, { study: Object.assign({}, study, { assign: assign }) });
  }

  const withStudy = (P, patch) => Object.assign({}, P, { study: Object.assign({}, P.study, patch) });

  S.hooks.push(function (next, a, prev) {
    let P = next.project;
    let state = next;
    if (!P.study) { P = Object.assign({}, P, { study: st.init(P) }); state = Object.assign({}, state, { project: P }); }
    const apply = (project, history) => (history ? Object.assign(S.withHistory(state, project), { selectedId: state.selectedId }) : Object.assign({}, state, { project: project }));

    switch (a.type) {
      case 'STUDY_FLOORS': {
        const n = U.clamp(Math.round(a.count), 1, 6);
        if (n === P.study.floors.length) return state === next ? undefined : state;
        const floors = st.makeFloors(n, P.study.floors);
        return apply(withStudy(P, { floors: floors, assign: st.autoAssign(P.spaces, P.relations, floors), auto: false }), true);
      }
      case 'STUDY_SET': return apply(withStudy(P, a.patch), true);
      case 'STUDY_SET_LIVE': return apply(withStudy(P, a.patch), false);
      case 'STUDY_AUTO': return apply(withStudy(P, { assign: st.autoAssign(P.spaces, P.relations, P.study.floors) }), true);
      case 'STUDY_ASSIGN': {
        if (!P.study.floors.some((f) => f.id === a.floorId) || P.study.assign[a.id] === a.floorId) return state === next ? undefined : state;
        return apply(withStudy(P, { assign: Object.assign({}, P.study.assign, { [a.id]: a.floorId }) }), true);
      }
      case 'STUDY_MOVE_BY': {
        const fl = P.study.floors;
        const cur = fl.findIndex((f) => f.id === P.study.assign[a.id]);
        const to = U.clamp(cur + a.dir, 0, fl.length - 1);
        if (to === cur) return state === next ? undefined : state;
        return apply(withStudy(P, { assign: Object.assign({}, P.study.assign, { [a.id]: fl[to].id }) }), true);
      }
      case 'STUDY_RENAME': {
        const name = String(a.name || '').trim().slice(0, 24);
        return apply(withStudy(P, { floors: P.study.floors.map((f) => (f.id === a.id ? Object.assign({}, f, { name: name || st.floorName(P.study.floors.indexOf(f)) }) : f)) }), true);
      }
      default:
    }
    if (needsSync(P)) { P = syncProject(P); return Object.assign({}, state, { project: P }); }
    return state === next ? undefined : state;
  });

  /* ---------- JSON uzantısı: extensions.floorStudy ---------- */
  const r2 = (v) => Math.round(v * 100) / 100;
  st.toExt = function (project) {
    if (!project.study) return {};
    const d = st.derive(project);
    const p = d.plan, m = d.metrics;
    return {
      floorStudy: {
        version: 1,
        floors: project.study.floors.map((f) => ({ id: f.id, name: f.name })),
        assignments: Object.keys(project.study.assign).map((id) => ({ spaceId: id, floorId: project.study.assign[id] })),
        typology: project.study.typology, plateRatio: project.study.ratio,
        core: { auto: !!project.study.core.auto, area: r2(project.study.core.area) },
        plan: {
          unit: 'm', width: r2(p.Wp), depth: r2(p.Dp), plateArea: r2(p.plateArea), coreArea: r2(p.coreArea),
          floors: p.floors.map((f) => ({
            id: f.id, name: f.name, netArea: r2(f.net), voidArea: r2(f.void),
            blocks: f.blocks.map((b) => ({ id: b.id, kind: b.kind, spaceId: b.spaceId || null, name: b.name, zone: b.zone, area: r2(b.area), x: r2(b.x), y: r2(b.y), w: r2(b.w), h: r2(b.h) })),
          })),
        },
        metrics: { floorStudyScore: m.score, floorBalance: r2(m.balance), fillRatio: r2(m.fill), wetStackAlignment: m.wetAlign == null ? null : r2(m.wetAlign), strongRelationsSameFloor: m.strongSame, strongRelationsTotal: m.strongTotal },
      },
    };
  };

  App.extProviders.push(st.toExt);

  st.fromExt = function (x, project) {
    try {
      const fl = Array.isArray(x.floors) ? x.floors.slice(0, 6) : [];
      if (!fl.length) throw new Error('kat yok');
      const floors = fl.map((f, i) => ({ id: String(f.id || 'f' + i), name: String(f.name || st.floorName(i)).slice(0, 24) }));
      if (new Set(floors.map((f) => f.id)).size !== floors.length) throw new Error('kat kimlikleri tekrarlı');
      const assign = {};
      (x.assignments || []).forEach((q) => { if (floors.some((f) => f.id === q.floorId)) assign[String(q.spaceId)] = q.floorId; });
      return {
        floors: floors, assign: assign,
        typology: x.typology === 'koridor' ? 'koridor' : 'serbest',
        ratio: U.clamp(Number(x.plateRatio) || 1.5, 1, 3),
        core: { auto: x.core ? x.core.auto !== false : true, area: U.clamp(Number(x.core && x.core.area) || 16, 4, 200) },
        auto: false,
      };
    } catch (e) { return st.init(project); }
  };
})();

/* ==========================================================================
   33-lib-iso.js — izometrik / aksonometrik izdüşüm motoru (Modül 3)
   Plan koordinatı (u, v, z) metre → ekran (X, Y) piksel.
   Dönüş (yaw) planı z ekseni etrafında çevirir, eğim (pitch) bakış yüksekliğidir.
   Metin düzleme oturur: izdüşüm matrisi ile eğik çizilir, her dönüşte okunur kalır.
   Çıktı primitif listesidir (poly, line, path, text); SVG ve Canvas aynı listeden çizer.
   ========================================================================== */
(function () {
  const App = window.App;
  const iso = (App.iso = {});

  /* ---------- renk ---------- */
  function hex2rgb(h) {
    const m = /^#?([0-9a-f]{6})$/i.exec(h || '');
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  // f < 1 koyulaştırır, f > 1 açar
  iso.shade = function (color, f) {
    const c = hex2rgb(color);
    if (!c) return color;
    const t = f < 1 ? 0 : 255, a = f < 1 ? 1 - f : f - 1;
    const o = c.map((v) => Math.round(v + (t - v) * Math.min(1, a)));
    return 'rgb(' + o.join(',') + ')';
  };

  /* ---------- izdüşüm ---------- */
  // opts: yaw, pitch (derece), s (px / m), cx, cy (ekranda plak merkezinin zemin noktası), center: [u, v] plan merkezi
  iso.make = function (o) {
    const th = (o.yaw * Math.PI) / 180, ph = (o.pitch * Math.PI) / 180;
    const c = Math.cos(th), sn = Math.sin(th), sp = Math.sin(ph), cp = Math.cos(ph);
    const cu = o.center ? o.center[0] : 0, cv = o.center ? o.center[1] : 0;
    const I = { s: o.s, c: c, sn: sn, sp: sp, cp: cp, eye: [sn, c] };
    I.proj = (u, v, z) => {
      const du = u - cu, dv = v - cv;
      const ur = du * c - dv * sn, vr = du * sn + dv * c;
      return [o.cx + o.s * ur, o.cy + o.s * (vr * sp - (z || 0) * cp)];
    };
    I.dir = (du, dv) => [du * c - dv * sn, (du * sn + dv * c) * sp]; // birim vektörün (ölçeksiz) izdüşümü
    I.depth = (u, v) => (u - cu) * sn + (v - cv) * c;
    return I;
  };

  /* ---------- katı (prizma): yalnızca görünen yüzler ---------- */
  const EDGES = [
    { a: 0, b: 1, n: [0, -1] }, { a: 1, b: 2, n: [1, 0] }, { a: 2, b: 3, n: [0, 1] }, { a: 3, b: 0, n: [-1, 0] },
  ];
  // o: stroke, sw, opacity, topFill
  iso.prism = function (I, x, y, w, h, z0, z1, fill, o) {
    o = o || {};
    const P = [];
    const cs = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
    const stroke = o.stroke || 'rgba(23,24,27,.28)';
    const sw = o.sw || 1;
    const op = o.opacity;
    if (z1 > z0 + 1e-6) {
      EDGES.forEach((e) => {
        if (e.n[0] * I.eye[0] + e.n[1] * I.eye[1] <= 1e-6) return;
        const nxs = e.n[0] * I.c - e.n[1] * I.sn;
        const f = Math.abs(nxs) < 0.02 ? 0.84 : nxs > 0 ? 0.72 : 0.9;
        const a = cs[e.a], b = cs[e.b];
        P.push({ t: 'poly', pts: [I.proj(a[0], a[1], z1), I.proj(b[0], b[1], z1), I.proj(b[0], b[1], z0), I.proj(a[0], a[1], z0)], fill: iso.shade(fill, f), stroke: stroke, sw: sw, opacity: op });
      });
    }
    P.push({ t: 'poly', pts: cs.map((q) => I.proj(q[0], q[1], z1)), fill: o.topFill || fill, stroke: stroke, sw: sw, opacity: op });
    return P;
  };


  /* ---------- çokgen katı (herhangi bir halka): görünen yan yüzler + çatı ---------- */
  // ring: plan koordinatında (u, v) halka · dönüş: { walls: [{ pts, f }], roof } — f: yüz parlaklık çarpanı
  iso.extrudeFaces = function (I, ring, z0, z1) {
    const n = ring.length;
    let a = 0;
    for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
    const sgn = a >= 0 ? 1 : -1;
    const walls = [];
    if (z1 > z0 + 1e-6) {
      for (let i = 0; i < n; i++) {
        const p = ring[i], q = ring[(i + 1) % n];
        const dx = q[0] - p[0], dy = q[1] - p[1];
        const l = Math.hypot(dx, dy);
        if (l < 1e-6) continue;
        const nx = (sgn * dy) / l, ny = (-sgn * dx) / l;
        if (nx * I.eye[0] + ny * I.eye[1] <= 1e-6) continue;
        const nxs = nx * I.c - ny * I.sn;
        const f = Math.abs(nxs) < 0.02 ? 0.84 : nxs > 0 ? 0.72 : 0.9;
        walls.push({ pts: [I.proj(p[0], p[1], z1), I.proj(q[0], q[1], z1), I.proj(q[0], q[1], z0), I.proj(p[0], p[1], z0)], f: f });
      }
    }
    return { walls: walls, roof: ring.map((q) => I.proj(q[0], q[1], z1)) };
  };
  iso.extrude = function (I, ring, z0, z1, fill, o) {
    o = o || {};
    const F = iso.extrudeFaces(I, ring, z0, z1);
    const stroke = o.stroke || 'rgba(23,24,27,.28)', sw = o.sw || 1;
    const P = F.walls.map((w) => ({ t: 'poly', pts: w.pts, fill: iso.shade(fill, w.f), stroke: stroke, sw: sw, opacity: o.opacity }));
    P.push({ t: 'poly', pts: F.roof, fill: o.topFill || fill, stroke: stroke, sw: sw, opacity: o.opacity });
    return P;
  };

  /* ---------- düzlemde çizgi, tarama, ızgara ---------- */
  iso.seg = function (I, u0, v0, u1, v1, z, st) {
    const a = I.proj(u0, v0, z), b = I.proj(u1, v1, z);
    return Object.assign({ t: 'line', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, st);
  };

  iso.grid = function (I, W, D, z, step, st) {
    const P = [];
    for (let u = step; u < W - 1e-6; u += step) P.push(iso.seg(I, u, 0, u, D, z, st));
    for (let v = step; v < D - 1e-6; v += step) P.push(iso.seg(I, 0, v, W, v, z, st));
    return P;
  };

  // 45° tarama (dikdörtgene kırpılmış)
  iso.hatch = function (I, x, y, w, h, z, gap, st) {
    const P = [];
    for (let k = gap; k < w + h; k += gap) {
      // doğru: u - x + v - y = k  (u + v = const)
      const u0 = Math.max(x, x + k - h), u1 = Math.min(x + w, x + k);
      if (u1 <= u0) continue;
      P.push(iso.seg(I, u0, y + k - (u0 - x), u1, y + k - (u1 - x), z, st));
    }
    return P;
  };

  /* ---------- düzleme oturan yazı ---------- */
  // (u, v): satır bloğunun merkezi · fsM: yazı boyu (metre) · lines: satırlar · o.dir 'u' | 'v'
  iso.planText = function (I, u, v, z, lines, fsM, o) {
    o = o || {};
    let b = o.dir === 'v' ? [0, -1] : [1, 0];
    let dn = [-b[1], b[0]];
    let bx = I.dir(b[0], b[1]);
    if (bx[0] < 0) { b = [-b[0], -b[1]]; dn = [-dn[0], -dn[1]]; bx = I.dir(b[0], b[1]); }
    const dx = I.dir(dn[0], dn[1]);
    const k = (fsM * I.s) / 20;
    const xf = [bx[0] * k, bx[1] * k, dx[0] * k, dx[1] * k];
    const lh = fsM * (o.lh || 1.18);
    const P = [];
    lines.forEach((ln, i) => {
      const off = (i - (lines.length - 1) / 2) * lh + fsM * 0.34 + (o.shift || 0);
      const q = I.proj(u + dn[0] * off, v + dn[1] * off, z);
      const s = typeof ln === 'string' ? { s: ln } : ln;
      P.push(Object.assign({ t: 'text', x: q[0], y: q[1], size: 20, weight: o.weight || 700, fam: o.fam || 'l', fill: o.fill, anchor: o.anchor || 'middle', xf: xf, opacity: o.opacity, ls: o.ls, pe: false }, s));
    });
    return P;
  };

  /* ---------- ok: düzlemde ikinci derece eğri + ok başı ---------- */
  // p0, p1 (kontrol), p2: plan noktaları [u, v]; afin dönüşüm Bezier'i koruduğu için kontrol noktaları doğrudan izdüşürülür
  iso.arrow = function (I, p0, p1, p2, z, st) {
    const a = I.proj(p0[0], p0[1], z), c = I.proj(p1[0], p1[1], z), b = I.proj(p2[0], p2[1], z);
    const P = [];
    const tx = b[0] - c[0], ty = b[1] - c[1];
    const len = Math.hypot(tx, ty) || 1;
    const ux = tx / len, uy = ty / len;
    const hl = st.head || 11, hw = hl * 0.62;
    const bx = b[0] - ux * hl * 0.4, by = b[1] - uy * hl * 0.4;
    P.push({ t: 'path', d: 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' Q' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ' + bx.toFixed(1) + ' ' + by.toFixed(1), stroke: st.stroke, sw: st.sw, cap: 'round', dash: st.dash, opacity: st.opacity });
    P.push({ t: 'poly', pts: [[b[0], b[1]], [b[0] - ux * hl - uy * hw, b[1] - uy * hl + ux * hw], [b[0] - ux * hl + uy * hw, b[1] - uy * hl - ux * hw]], fill: st.stroke, opacity: st.opacity });
    return P;
  };

  // ekran noktaları arasında oklu eğri (kat arası bağlar için)
  iso.arrowScreen = function (a, c, b, st) {
    const P = [];
    const tx = b[0] - c[0], ty = b[1] - c[1];
    const len = Math.hypot(tx, ty) || 1;
    const ux = tx / len, uy = ty / len;
    const hl = st.head || 10, hw = hl * 0.6;
    const bx = b[0] - ux * hl * 0.4, by = b[1] - uy * hl * 0.4;
    P.push({ t: 'path', d: 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' Q' + c[0].toFixed(1) + ' ' + c[1].toFixed(1) + ' ' + bx.toFixed(1) + ' ' + by.toFixed(1), stroke: st.stroke, sw: st.sw, cap: 'round', dash: st.dash, opacity: st.opacity });
    P.push({ t: 'poly', pts: [[b[0], b[1]], [b[0] - ux * hl - uy * hw, b[1] - uy * hl + ux * hw], [b[0] - ux * hl + uy * hw, b[1] - uy * hl - ux * hw]], fill: st.stroke, opacity: st.opacity });
    return P;
  };

  iso.easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
})();

/* ==========================================================================
   34-lib-analysis.js — Modül 3: mekân analizi (patlatılmış izometrik simülasyon)
   Veri : Modül 2'nin kat planı (App.study.derive) + Modül 1'in ilişkileri / bilgi tabanı
   Mod  : 'floors'  → her kat bir levha, işlev renkli, düşey çizgiler, kat göstergesi
          'layers'  → seçili katın analiz katmanları (taban, işlev, sirkülasyon, doluluk, ilişki, gürültü)
   Çıktı: primitif listesi (SVG + PNG/PDF aynı listeden) + etkileşim bölgeleri + bulgular
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const fmt = U.fmt;
  const iso = App.iso;
  const sheet = App.sheet;

  const LAYERS = [
    { id: 'taban', name: 'Taban', sub: 'Kat planı ve ölçüler' },
    { id: 'islev', name: 'İşlev', sub: 'Bölgelere göre mekânlar' },
    { id: 'sirk', name: 'Sirkülasyon', sub: 'Çekirdek, koridor, akış' },
    { id: 'doluluk', name: 'Doluluk · Boşluk', sub: 'Dolu hacim ve boşluk' },
    { id: 'iliski', name: 'İlişkiler', sub: 'Güçlü, zayıf, ayrı tut' },
    { id: 'gurultu', name: 'Gürültü', sub: 'Gürültülü ve sessiz mekânlar' },
  ];

  App.analysisDefaults = function () {
    return { mode: 'floors', explode: 1, yaw: -34, pitch: 36, labels: true, arrows: true, guides: true, volume: true, floorId: null, sel: null, layers: ['taban', 'islev', 'sirk', 'doluluk', 'iliski'] };
  };

  /* ---------- tema renkleri ---------- */
  function cols() {
    const PAL = App.PAL;
    if (App.theme.name === 'glass') {
      return {
        glass: true, ink: PAL.ink, slabTop: '#F5F6F9', slabStroke: 'rgba(23,24,27,.30)', blockStroke: 'rgba(23,24,27,.26)', sw: 1,
        accent: PAL.ink, core: '#2A2B30', coreText: '#F6F7F9', corridor: '#D9DBE1', flat: '#ECEDF1', dolu: '#2A2B30', guide: 'rgba(23,24,27,.42)',
        noise: { loud: '#2A2B30', mid: '#8E9199', quiet: '#E3E4E9' }, noiseText: { loud: '#F6F7F9', mid: '#F6F7F9', quiet: '#17181B' },
        numBg: [PAL.ink], numFg: ['#F6F7F9'], strongLine: PAL.ink,
      };
    }
    return {
      glass: false, ink: PAL.ink, slabTop: PAL.paper, slabStroke: PAL.ink, blockStroke: PAL.ink, sw: 1.6,
      accent: PAL.red, core: PAL.ink, coreText: PAL.paper, corridor: PAL.paperDark, flat: '#E9DDBC', dolu: PAL.ink, guide: PAL.ink,
      noise: { loud: PAL.red, mid: PAL.yellow, quiet: PAL.blueBright }, noiseText: { loud: PAL.paper, mid: PAL.ink, quiet: PAL.paper },
      numBg: [PAL.blue, PAL.yellow, PAL.red], numFg: [PAL.paper, PAL.ink, PAL.paper], strongLine: PAL.blue,
    };
  }

  /* ---------- gürültü sınıfı: bilgi tabanı → bölge ---------- */
  function noiseMap(project) {
    const variant = App.kb.variant(project.meta.buildingType, project.meta.variant);
    const m = App.match.spaces(project.spaces, variant.entries);
    const zoneNoise = { servis: 'mid', teknik: 'loud', sosyal: 'mid', ozel: 'quiet', calisma: 'quiet', sirkulasyon: 'mid', acik: 'mid' };
    const out = new Map();
    project.spaces.forEach((s) => {
      const e = m.bySpace.get(s.id);
      out.set(s.id, e && e.noise ? e.noise : zoneNoise[s.zone] || 'mid');
    });
    return out;
  }
  const NOISE_LABEL = { loud: 'Gürültülü', mid: 'Orta', quiet: 'Sessiz' };

  /* ---------- plan üzerinde dış cephe teması ---------- */
  function exterior(b, plan) {
    const e = 0.05;
    return b.x < e || b.y < e || b.x + b.w > plan.Wp - e || b.y + b.h > plan.Dp - e || false;
  }
  function touchesVoid(b, f) {
    const v = f.blocks.find((q) => q.kind === 'void');
    return !!(v && App.study.rectGap(b, v) < 0.1 && App.study.touching(b, v));
  }

  /* ---------- analiz: ölçüler + bulgular ---------- */
  const amemo = { plan: null, noise: null, out: null };
  function analyze(project, d) {
    if (amemo.plan === d.plan && amemo.noise === project.spaces) return amemo.out;
    const plan = d.plan, m = d.metrics;
    const noise = noiseMap(project);
    const items = [];
    const nameOf = new Map(project.spaces.map((s) => [s.id, s.name]));
    const zoneOf = new Map(project.spaces.map((s) => [s.id, s.zone]));
    const habZones = { sosyal: 1, ozel: 1, calisma: 1 };

    // 1) gün ışığı / cephe teması
    let hab = 0, habExt = 0;
    const dark = [];
    plan.floors.forEach((f) => f.blocks.forEach((b) => {
      if (b.kind !== 'space' || !habZones[b.zone]) return;
      hab++;
      if (exterior(b, plan) || touchesVoid(b, f)) habExt++; else dark.push({ b: b, f: f });
    }));
    const daylight = hab ? habExt / hab : 1;
    dark.slice(0, 4).forEach((q) => items.push({ id: 'dark-' + q.b.id, level: 'uyari', title: q.b.name + ' dış cepheye açılmıyor (' + q.f.name + ')', detail: 'Yaşama mekânı plan içinde kalmış; doğal ışık ve havalandırma için cepheye almayı ya da plan oranını değiştirmeyi deneyin.', src: ['S'], actions: [{ type: 'select', id: q.b.spaceId, label: 'Göster' }] }));

    // 2) ıslak hacim hizası
    if (m.wetAlign != null) {
      if (m.wetAlign < 0.5) items.push({ id: 'wet', level: 'uyari', title: 'Islak hacimler düşeyde hizalı değil (%' + Math.round(m.wetAlign * 100) + ')', detail: 'Üst kattaki mutfak, banyo ve WC’lerin yarısından fazlası altında ıslak hacim yok; tesisat şaftı uzar. Katları yeniden dağıtın ya da ıslak hacimleri üst üste getirin.', src: ['S'], actions: [{ type: 'studyAuto', label: 'Otomatik dağıt' }] });
      else if (m.wetAlign < 0.8) items.push({ id: 'wet', level: 'oneri', title: 'Islak hacim hizası %' + Math.round(m.wetAlign * 100), detail: 'Kısmen hizalı. Kalan ıslak hacimleri alt kattakilerle çakıştırın.', src: ['S'], actions: [] });
    }

    // 3) gürültülü mekânın sessiz mekânın üstünde / altında olması
    let conflicts = 0, vpairs = 0;
    const conflictList = [];
    for (let i = 1; i < plan.floors.length; i++) {
      const lo = plan.floors[i - 1].blocks.filter((b) => b.kind === 'space');
      plan.floors[i].blocks.filter((b) => b.kind === 'space').forEach((ub) => lo.forEach((lb) => {
        if (App.study.overlapArea(ub, lb) < 2) return;
        const nu = noise.get(ub.spaceId), nl = noise.get(lb.spaceId);
        if (nu === 'mid' || nl === 'mid') return;
        vpairs++;
        if (nu !== nl) { conflicts++; conflictList.push({ loud: nu === 'loud' ? ub : lb, quiet: nu === 'loud' ? lb : ub, above: nu === 'loud' }); }
      }));
    }
    conflictList.slice(0, 3).forEach((c) => items.push({ id: 'noise-' + c.loud.id + c.quiet.id, level: 'oneri', title: 'Gürültülü ' + c.loud.name + ', sessiz ' + c.quiet.name + (c.above ? ' üstünde' : ' altında'), detail: 'Kat döşemesi darbe ve hava sesini iletir; gürültülü mekânı sessizin üstüne almaktan kaçının ya da araya depo / servis mekânı koyun.', src: ['MEB15', 'S'], actions: [{ type: 'select', id: c.loud.spaceId, label: 'Göster' }] }));

    // 4) sirkülasyon payı (çekirdek + koridor + sirkülasyon bölgesi mekânları)
    let circ = 0, occ = 0;
    plan.floors.forEach((f) => f.blocks.forEach((b) => {
      if (b.kind === 'void') return;
      occ += b.w * b.h;
      if (b.kind === 'core' || b.kind === 'corridor' || b.zone === 'sirkulasyon') circ += b.w * b.h;
    }));
    const circShare = occ ? circ / occ : 0;
    const type = App.kb.type(project.meta.buildingType);
    if (type.circ && occ) {
      if (circShare > type.circ[1] * 1.35) items.push({ id: 'circ-hi', level: 'oneri', title: 'Sirkülasyon payı yüksek (%' + Math.round(circShare * 100) + ')', detail: type.label + ' için tipik aralık %' + Math.round(type.circ[0] * 100) + '–' + Math.round(type.circ[1] * 100) + '. Çekirdek ve koridor alanlarını sıkılaştırmayı düşünün.', src: ['GSA', 'S'], actions: [] });
      else if (circShare < type.circ[0] * 0.5 && plan.floors.length > 1) items.push({ id: 'circ-lo', level: 'oneri', title: 'Sirkülasyon payı düşük (%' + Math.round(circShare * 100) + ')', detail: 'Antre, hol ya da koridor eksik olabilir; mekânlar arası geçişi nasıl kuracağınızı kontrol edin.', src: ['GSA', 'S'], actions: [] });
    }

    // 5) çekirdeğe en uzak mekân
    let far = null;
    plan.floors.forEach((f) => f.blocks.forEach((b) => {
      if (b.kind !== 'space') return;
      const dist = (b.x + b.w / 2 - plan.cwid) + Math.abs(b.y + b.h / 2 - plan.Dp / 2);
      if (!far || dist > far.dist) far = { dist: dist, b: b, f: f };
    }));
    if (far && plan.useCore && far.dist > 24) items.push({ id: 'far', level: 'oneri', title: far.b.name + ' çekirdeğe yaklaşık ' + fmt(far.dist, 0) + ' m uzakta', detail: 'Uzun dolaşım yolu hem kaçış hem günlük kullanım için dezavantajdır. Plan oranını kısaltın ya da ikinci bir çekirdek düşünün.', src: ['S'], actions: [{ type: 'select', id: far.b.spaceId, label: 'Göster' }] });

    // 6) plak doluluğu
    if (plan.floors.length > 1 && m.fill < 0.7) items.push({ id: 'fill', level: 'oneri', title: 'Plak doluluğu %' + Math.round(m.fill * 100), detail: 'Katların toplam net alanı brüt plak alanının %' + Math.round(m.fill * 100) + '’i. Kat sayısını azaltmak ya da mekânları dengelemek plak boşluğunu kapatır.', src: ['S'], actions: [{ type: 'studyAuto', label: 'Otomatik dağıt' }] });

    // kat başına program karışımı
    const mix = plan.floors.map((f) => {
      const tot = U.sum(f.spaces, (s) => s.area) || 1;
      const by = {};
      f.spaces.forEach((s) => { by[s.zone] = (by[s.zone] || 0) + s.area; });
      return { id: f.id, name: f.name, total: tot, zones: App.ZONE_ORDER.filter((z) => by[z]).map((z) => ({ zone: z, area: by[z], share: by[z] / tot })) };
    });

    // bileşik skor: ıslak hacim hizası · gün ışığı · gürültü uyumu · plak doluluğu
    const parts = [
      { k: 'Islak hacim hizası', v: m.wetAlign == null ? 1 : m.wetAlign, w: 0.3 },
      { k: 'Gün ışığı (cephe teması)', v: daylight, w: 0.3 },
      { k: 'Gürültü uyumu', v: vpairs ? 1 - conflicts / vpairs : 1, w: 0.2 },
      { k: 'Plak doluluğu', v: Math.min(1, m.fill / 0.9), w: 0.2 },
    ];
    const score = project.spaces.length ? Math.round(parts.reduce((t, p) => t + p.v * p.w, 0) * 100) : null;

    const LEVEL = { hata: 0, uyari: 1, oneri: 2, ok: 3 };
    items.sort((a, b) => LEVEL[a.level] - LEVEL[b.level]);
    const counts = { hata: 0, uyari: 0, oneri: 0 };
    items.forEach((i) => { if (counts[i.level] != null) counts[i.level]++; });
    if (!project.spaces.length) items.push({ id: 'empty', level: 'oneri', title: 'Önce işlev şemasında mekân ekleyin', detail: 'Analiz, Kat Etüdü’ndeki kat planlarından üretilir.', src: [], actions: [{ type: 'goto', module: 'islev', label: 'İşlev Şeması’na git' }] });
    else if (!counts.hata && !counts.uyari) items.unshift({ id: 'ok', level: 'ok', title: 'Düşey ve çevresel analizde kritik sorun görünmüyor', detail: 'Uyum skoru %' + score + '.', src: [], actions: [] });

    const out = {
      items: items, counts: counts, score: score, parts: parts, mix: mix, noise: noise,
      stats: { daylight: daylight, circShare: circShare, wetAlign: m.wetAlign, conflicts: conflicts, fill: m.fill, nHab: hab, nHabExt: habExt },
    };
    amemo.plan = d.plan; amemo.noise = project.spaces; amemo.out = out;
    return out;
  }

  /* ---------- blok etiketi (düzleme oturan) ---------- */
  function blockLabel(I, b, z, color, o) {
    o = o || {};
    const vertical = b.h > b.w * 1.5 && b.h * I.s > 46;
    const L = vertical ? b.h : b.w, T = vertical ? b.w : b.h;
    const fit = sheet.fitLabel(b.name, L * I.s, T * I.s, { withArea: o.area !== false, max: o.max || 17, min: 8 });
    if (!fit) return [];
    const fsM = fit.fs / I.s;
    const lh = 1.18;
    const hn = fit.lines.length * lh * fsM, ha = o.area !== false ? 0.95 * fsM * 0.82 : 0;
    const total = hn + ha;
    const cu = b.x + b.w / 2, cv = b.y + b.h / 2;
    const dir = vertical ? 'v' : 'u';
    const P = iso.planText(I, cu, cv, z, fit.lines, fsM, { dir: dir, fill: color, fam: 'l', weight: 700, ls: fit.ls, shift: -total / 2 + hn / 2, lh: lh });
    if (o.area !== false) P.push.apply(P, iso.planText(I, cu, cv, z, [fmt(b.area) + ' m²'], fsM * 0.82, { dir: dir, fill: color, fam: 'm', weight: 500, opacity: 0.75, shift: -total / 2 + hn + ha / 2 }));
    return P;
  }

  /* ---------- bir levhanın (kat veya katman) içeriği ---------- */
  function sortByDepth(I, blocks) {
    return blocks.slice().sort((a, b) => I.depth(a.x + a.w / 2, a.y + a.h / 2) - I.depth(b.x + b.w / 2, b.y + b.h / 2));
  }

  function dimOp(P, k) { if (k >= 1) return P; P.forEach((p) => { p.opacity = (p.opacity == null ? 1 : p.opacity) * k; }); return P; }

  function slabBase(I, plan, z, C, thick) {
    return iso.prism(I, 0, 0, plan.Wp, plan.Dp, z - thick, z, C.slabTop, { stroke: C.slabStroke, sw: C.sw });
  }

  function relCenter(b) { return [b.x + b.w / 2, b.y + b.h / 2]; }
  function curve(a, b, sign) {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const k = 0.16 * len * (sign || 1);
    return [mx - (dy / len) * k, my + (dx / len) * k];
  }

  // Kat modu: işlev renkli hacimler
  function floorSlab(I, project, plan, f, z, view, C, hW, noise) {
    const P = [];
    iso.prism(I, 0, 0, plan.Wp, plan.Dp, z - 0.45, z, C.slabTop, { stroke: C.slabStroke, sw: C.sw }).forEach((p) => P.push(p));
    const flat = f.blocks.filter((b) => b.kind === 'void' || b.kind === 'corridor');
    const solid = sortByDepth(I, f.blocks.filter((b) => b.kind === 'space' || b.kind === 'core'));
    flat.forEach((b) => {
      if (b.kind === 'void') {
        const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map((q) => I.proj(q[0], q[1], z + 0.02));
        P.push({ t: 'poly', pts: pts, stroke: C.ink, sw: 1, opacity: 0.4 });
        iso.hatch(I, b.x, b.y, b.w, b.h, z + 0.02, Math.max(1.2, plan.Dp / 9), { stroke: C.ink, sw: 0.8, opacity: 0.16 }).forEach((p) => P.push(p));
      } else {
        iso.prism(I, b.x, b.y, b.w, b.h, z, z + 0.04, C.corridor, { stroke: C.blockStroke, sw: 0.8 }).forEach((p) => P.push(p));
        if (view.arrows) P.push(iso.seg(I, b.x + 0.4, b.y + b.h / 2, b.x + b.w - 0.4, b.y + b.h / 2, z + 0.06, { stroke: C.accent, sw: 2, dash: [7, 6], opacity: 0.8 }));
      }
    });
    solid.forEach((b) => {
      if (b.kind === 'core') {
        iso.prism(I, b.x, b.y, b.w, b.h, z, z + hW * 1.1, C.core, { stroke: C.blockStroke, sw: C.sw }).forEach((p) => P.push(p));
        return;
      }
      const zn = App.ZONES[b.zone] || App.ZONES.sosyal;
      iso.prism(I, b.x, b.y, b.w, b.h, z, z + (view.volume ? hW : 0.12), zn.fill, { stroke: C.blockStroke, sw: C.sw }).forEach((p) => P.push(p));
    });
    const top = z + (view.volume ? hW : 0.12) + 0.02;
    if (view.labels) solid.forEach((b) => {
      if (b.kind === 'core') { iso.planText(I, b.x + b.w / 2, b.y + b.h / 2, z + hW * 1.1 + 0.02, ['Çekirdek'], Math.min(0.8, b.w * 0.34), { dir: 'v', fill: C.coreText, fam: 'l', weight: 700, opacity: 0.9 }).forEach((p) => P.push(p)); return; }
      const zn = App.ZONES[b.zone] || App.ZONES.sosyal;
      blockLabel(I, b, top, zn.text).forEach((p) => P.push(p));
    });
    // kat adı: levhanın ön kenarında
    iso.planText(I, plan.Wp / 2, plan.Dp + 1.5, z, [App.theme.name === 'glass' ? f.name.toLocaleUpperCase('tr') : f.name.toLocaleUpperCase('tr')], Math.min(1.5, plan.Dp * 0.12), { dir: 'u', fill: C.ink, fam: 'd', weight: C.glass ? 400 : 700, opacity: 0.55, ls: 3 }).forEach((p) => P.push(p));
    // aynı kattaki güçlü ilişkiler: eğri oklar
    if (view.arrows) {
      const by = new Map();
      f.blocks.forEach((b) => { if (b.spaceId) by.set(b.spaceId, b); });
      Object.keys(project.relations).forEach((key, i) => {
        if (project.relations[key] !== 'strong') return;
        const ids = key.split('|');
        const A = by.get(ids[0]), B = by.get(ids[1]);
        if (!A || !B) return;
        const a = relCenter(A), b = relCenter(B);
        // ok, sirkülasyon bölgesindeki mekândan çıkar
        const from = zoneOfBlock(A) === 'sirkulasyon' || zoneOfBlock(B) !== 'sirkulasyon' ? a : b;
        const to = from === a ? b : a;
        iso.arrow(I, from, curve(from, to, i % 2 ? 1 : -1), to, top + 0.04, { stroke: C.accent, sw: 2.2, opacity: 0.9, head: 11 }).forEach((p) => P.push(p));
      });
    }

  }
  const zoneOfBlock = (b) => b.zone;

  function layerSlab(I, project, plan, f, z, layerId, view, C, hW, A) {

    add(slabBase(I, plan, z, C, 0.3));
    const space = f.blocks.filter((b) => b.kind === 'space');
    const flatTop = z + 0.02;

    if (layerId === 'taban') {
      add(iso.grid(I, plan.Wp, plan.Dp, flatTop, 1, { stroke: C.ink, sw: 0.5, opacity: 0.07 }));
      f.blocks.forEach((b) => {
        const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map((q) => I.proj(q[0], q[1], flatTop + 0.02));
        if (b.kind === 'void') { P.push({ t: 'poly', pts: pts, stroke: C.ink, sw: 1, opacity: 0.35 }); return; }
        P.push({ t: 'poly', pts: pts, fill: b.kind === 'core' ? C.core : b.kind === 'corridor' ? C.corridor : '#FFFFFF', stroke: C.ink, sw: C.glass ? 1.1 : 1.8, opacity: b.kind === 'space' ? 0.95 : 1 });
      });
