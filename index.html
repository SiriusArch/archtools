    const rows = [
      ['Bina sayısı', String(A.built.count)],
      ['Taban alanı oranı (TAKS)', fmt(A.built.coverage, 2)],
      ['Tahmini emsal (KAKS)', fmt(A.built.far, 2)],
      ['Yeşil alan', pctS(A.green.share)],
      ['Yol ağı yoğunluğu', fmt(A.mob.density, 1) + ' km/km²'],
      ['Kesişim yoğunluğu', Math.round(A.mob.interDensity) + ' /km²'],
      ['Durak (10 dk içinde)', String(A.transit.in10)],
      ['Gürültü göstergesi', A.noise.cls.label],
    ];
    rows.forEach((r, i) => SS.kv(X, 490 + i * 22, W, r[0], r[1], C).forEach((p) => P.push(p)));
    // 4. iklim ve güneş
    SS.panelTitle(X, 686, W, 'İklim ve güneş', C).forEach((p) => P.push(p));
    if (A.climate) {
      P.push({ t: 'text', x: X, y: 710, s: 'Aylık sıcaklık (çizgi) ve ışınım (sütun)' + (A.climate.demo ? ' · örnek' : ''), size: 11, weight: 500, fam: 'b', fill: C.ink, opacity: 0.55 });
      D.monthly(X, 718, 232, 64, A.climate, C).forEach((p) => P.push(p));
      D.windRose(X + 292, 752, 34, A.climate, C).forEach((p) => P.push(p));
      if (A.climate.dominant) P.push({ t: 'text', x: X + 292, y: 818, s: 'Hâkim rüzgâr ' + gis.compass(A.climate.dominant.dir), size: 11, weight: 600, fam: 'b', fill: C.ink, opacity: 0.7, anchor: 'middle' });
    } else P.push({ t: 'text', x: X, y: 722, s: 'İklim verisi alınamadı', size: 12, weight: 500, fam: 'b', fill: C.ink, opacity: 0.55 });
    const w = A.sun.find((s) => s.id === 'kis'), su = A.sun.find((s) => s.id === 'yaz');
    if (w && su) {
      SS.kv(X, 828, 232, '21 Aralık: gün ' + fmt(w.len, 1) + ' sa', 'öğlen ' + Math.round(w.noonAlt) + '°', C).forEach((p) => P.push(p));
      SS.kv(X, 846, 232, '21 Haziran: gün ' + fmt(su.len, 1) + ' sa', 'öğlen ' + Math.round(su.noonAlt) + '°', C).forEach((p) => P.push(p));
    }
    return P;
  }

  /* ---------------- ortak: künye ---------------- */
  function infoOf(project, A, mode, layers) {
    const C = D.cols();
    const s = project.site;
    const nm = s.loc.name.length > 26 ? s.loc.name.slice(0, 25) + '…' : s.loc.name;
    return {
      name: project.meta.name,
      subtitle: 'Arsa analizi · ' + nm + ' · ' + A.template.label + (mode === 'iso' ? ' · katmanlar' : ''),
      legend: legendFor(layers, C),
      stats: [['Yarıçap', fmt(A.R, 0) + ' m'], ['Yürüme', s.walkMin + ' dk'], ['Veri', A.demo ? 'Demo (sentetik)' : 'OSM']],
      scoreLabel: 'Konum skoru', percent: A.score,
    };
  }

  /* ---------------- HARİTA kipi ---------------- */
  SS.arsaMap = function (project, A, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const layers = view.layers;
    const on = (id) => layers.indexOf(id) >= 0;
    const CX = 506, CY = 442, RP = 376;
    const s = RP / A.R;
    const T = D.mapT(CX, CY, s);
    const sun = D.sunState(A, view);
    const prims = sheet.frame(infoOf(project, A, 'map', layers), live);
    const add = (L) => L.forEach((p) => prims.push(p));
    // zemin
    add(D.disc(T, A.R, C, 0));
    if (on('topo')) add(D.topo(T, A, C, 0, { opacity: 0.9 }));
    add(D.green(T, A.clip, C, 0, { opacity: on('yesil') ? 1 : 0.5, deep: on('yesil') }));
    add(D.water(T, A.clip, C, 0));
    if (on('gurultu')) add(D.noise(T, A, C, 0));
    if (on('erisim')) add(D.access(T, A, C, 0));
    add(D.roads(T, A.clip, C, 0, { emph: on('ulasim') || on('yapi') === false }));
    if (on('ulasim')) add(D.rails(T, A.clip, C, 0));
    add(D.buildings(T, A.clip, C, 0, { mode: on('yapi') ? 'tone' : 'faint', opacity: on('yapi') ? 1 : 0.9 }));
    if (on('gunes')) { add(D.shadows(T, A, C, 0, sun)); }
    if (view.parcel !== false && project.site.parcel) {
      add(D.parcel(T, project.site.parcel, C, 0, { sw: 2.6 }));
      const c = gis.centroid(project.site.parcel), q = T.P(c[0], c[1], 0);
      const ar = Math.abs(gis.area(project.site.parcel));
      add([{ t: 'text', x: q[0], y: q[1] + 4, s: 'Parsel ' + fmt(ar, 0) + ' m²', size: 11.5, weight: 800, fam: 'b', fill: C.ink, anchor: 'middle', pe: false }]);
    }
    if (on('erisim')) add(D.rings(T, A, C, 0));
    if (on('islev')) add(D.pois(T, A, C, 0));
    if (on('ulasim')) add(D.transit(T, A, C, 0));
    // üzerine gelince bilgi (SVG ekranda başlık olarak gösterilir)
    const hits = [];
    if (on('islev')) A.pois.filter((p) => p.inR).forEach((p) => {
      const q = T.P(p.x, p.y);
      hits.push({ kind: 'poi', x: q[0], y: q[1], r: 8, label: (p.name || p.kind || 'İşlev') + (p.min != null ? ' · ' + minS(p.min) + ' yürüme' : '') });
    });
    if (on('ulasim')) A.entry.data.transit.forEach((p) => {
      if (p.x * p.x + p.y * p.y > A.R * A.R) return;
      const q = T.P(p.x, p.y);
      hits.push({ kind: 'poi', x: q[0], y: q[1], r: 9, label: (p.name || site.TRANSIT_LABEL[p.kind] || 'Durak') });
    });
    // etiketler
    if (view.labels) {
      const lab = D.labeler();
      const bounds = { x0: CX - RP + 8, x1: CX + RP - 8, y0: CY - RP + 8, y1: CY + RP - 8 };
      add(D.roadNames(T, A.clip, C, lab, bounds));
      if (on('islev')) add(D.poiNames(T, A, C, lab, bounds));
    }
    add(D.center(T, C, 0));
    if (on('gunes')) add(D.sunMark(T, A.R, C, sun, 0));
    // yarıçap halkası ve yön
    prims.push({ t: 'path', d: D.ringD(T, gis.circlePoly(A.R, 96), 0), stroke: C.ink, sw: C.glass ? 1.4 : 3 });
    add(D.north(86, 92, C, 20));
    add(D.scaleBar(70, tb.y - 28, s, C, 120));
    add(rightColumn(A, C, view, sun));
    // yarıçap etiketi
    prims.push({ t: 'text', x: CX + RP, y: CY + RP + 22, s: 'r = ' + fmt(A.R, 0) + ' m', size: 12, weight: 700, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'end' });
    return { prims: prims, hits: hits, geom: { cx: CX, cy: CY, s: s, R: A.R, Rpx: RP, W: sheet.W, H: sheet.H }, W: sheet.W, H: sheet.H, sun: sun, mode: 'map' };
  };

  /* ---------------- KATMANLAR kipi (izometrik levhalar) ---------------- */
  SS.arsaIso = function (project, A, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const order = site.LAYERS.map((l) => l.id);
    let ids = order.filter((id) => view.layers.indexOf(id) >= 0);
    if (!ids.length) ids = ['yapi'];
    const n = ids.length;
    const area = { x: 360, y: 62, w: 990, h: tb.y - 62 - 30 };
    const R = A.R;
    const ex = U.clamp(view.explode, 0, 1);
    const zx = view.zx || 1.6;
    const maxH = Math.max(20, Math.min(90, (A.built.maxH || 20))) * zx;
    const topoH = A.topo ? (A.topo.max - A.topo.min) * zx : 0;
    const GAP0 = 16, GX = 0.42 * R * 2 * 0.38;
    const step = GAP0 + ex * GX;
    const lastH = Math.max(maxH, topoH);
    const zMax = (n - 1) * (GAP0 + GX) + lastH * 0.9;
    const zCur = (n - 1) * step + lastH * 0.9;
    const pr = (view.pitch * Math.PI) / 180;
    const diag = 2 * R;
    const bw = diag * 1.04, bh = diag * Math.sin(pr) + zMax * Math.cos(pr);
    const sc = Math.min(area.w / bw, area.h / bh) * 0.97;
    const cx = area.x + area.w / 2;
    const cy = area.y + area.h / 2 + (zCur * Math.cos(pr) * sc) / 2 - (lastH * 0.25 * Math.cos(pr) * sc) / 2;
    const I = iso.make({ yaw: view.yaw, pitch: view.pitch, s: sc, cx: cx, cy: cy, center: [0, 0] });
    const T = D.isoT(I);
    const sun = D.sunState(A, view);
    const prims = sheet.frame(infoOf(project, A, 'iso', ids), live);
    const hits = [];
    const marks = [];
    const lod = !!view.lod;

    ids.forEach((id, i) => {
      const z = i * step;
      const dim = view.sel && view.sel !== id ? 0.26 : 1;
      let P = [];
      const add = (L) => L.forEach((p) => P.push(p));
      add(D.disc(T, R, C, z));
      if (id === 'topo') {
        add(D.topo(T, A, C, z, { lift: true, zx: zx }));
        add(D.water(T, A.clip, C, z));
      } else if (id === 'yapi') {
        add(D.green(T, A.clip, C, z, { opacity: 0.4 }));
        add(D.water(T, A.clip, C, z));
        add(D.roads(T, A.clip, C, z, { emph: false }));
        add(D.buildings(T, A.clip, C, z, { extrude: true, zx: zx, lod: lod }));
      } else if (id === 'yesil') {
        add(D.green(T, A.clip, C, z, { opacity: 1, deep: true }));
        add(D.water(T, A.clip, C, z));
        add(D.roads(T, A.clip, C, z, { emph: false, opacity: 0.6 }));
        add(D.buildings(T, A.clip, C, z, { mode: 'faint', opacity: 0.55 }));
      } else if (id === 'ulasim') {
        add(D.green(T, A.clip, C, z, { opacity: 0.3 }));
        add(D.water(T, A.clip, C, z));
        add(D.roads(T, A.clip, C, z, { emph: true }));
        add(D.rails(T, A.clip, C, z));
        add(D.transit(T, A, C, z));
      } else if (id === 'erisim') {
        add(D.ground(T, A, C, z, { greenOpacity: 0.3, roadOpacity: 0.9 }).slice(1));
        add(D.access(T, A, C, z));
        add(D.rings(T, A, C, z));
        add(D.center(T, C, z));
      } else if (id === 'islev') {
        add(D.ground(T, A, C, z, { greenOpacity: 0.35, buildings: true, bOpacity: 0.6 }).slice(1));
        add(D.pois(T, A, C, z, { r: 5.4 }));
      } else if (id === 'gurultu') {
        add(D.ground(T, A, C, z, { greenOpacity: 0.3 }).slice(1));
        add(D.noise(T, A, C, z));
        add(D.roads(T, A.clip, C, z, { emph: true, opacity: 0.8 }));
        add(D.rails(T, A.clip, C, z));
      } else if (id === 'gunes') {
        add(D.ground(T, A, C, z, { greenOpacity: 0.3, buildings: true }).slice(1));
        add(D.shadows(T, A, C, z, sun));
        add(D.sunMark(T, R, C, sun, z));
      }
      if (project.site.parcel && (id === 'yapi' || id === 'erisim')) add(D.parcel(T, project.site.parcel, C, z + 0.2, { sw: 2.2 }));
      dimOp(P, dim).forEach((p) => prims.push(p));
      // levha kontur ve tıklama bölgesi
      const ring = gis.circlePoly(R, 48).map((q) => T.P(q[0], q[1], z));
      hits.push({ kind: 'slab', id: id, pts: ring });
      const xs = ring.map((q) => q[0]), ys = ring.map((q) => q[1]);
      marks.push({ i: i, id: id, cy: (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2, minX: Math.min.apply(null, xs), z: z, dim: dim });
    });

    // sol sütun: başlık, not, gösterge — slaytlara yakın ama üst üste binmeden dağıtılır
    const g = C.glass;
    const showLeg = n <= 4;
    const blockH = showLeg ? 62 + 18 * 3 : 54;
    const top = area.y + 20, bot = tb.y - 36 - blockH;
    const ys = marks.map((mk) => mk.cy - 30);
    // aşağıdan yukarı sırala: ids[0] en altta; en üst blok en küçük y
    const asc = ys.map((y, i) => ({ y: y, i: i })).sort((p, q) => p.y - q.y);
    let prev = top - blockH;
    asc.forEach((o) => { o.y = Math.max(o.y, prev + blockH, top); prev = o.y; });
    let nxt = bot + blockH;
    for (let k = asc.length - 1; k >= 0; k--) { asc[k].y = Math.min(asc[k].y, nxt - blockH, bot); nxt = asc[k].y; }
    asc.forEach((o) => { ys[o.i] = o.y; });
    ids.forEach((id, i) => {
      const mk = marks[i];
      const meta = site.LAYERS.find((l) => l.id === id);
      const x0 = 60, y0 = ys[i];
      const xe = Math.max(x0 + 170, Math.min(mk.minX - 14, 330));
      const Pg = [];
      Pg.push({ t: 'text', x: x0, y: y0, s: g ? meta.name : meta.name.toLocaleUpperCase('tr'), size: 17, weight: g ? 400 : 700, fam: 'd', fill: C.ink, ls: g ? 0 : 1 });
      Pg.push({ t: 'line', x1: x0, y1: y0 + 8, x2: xe, y2: y0 + 8, stroke: C.ink, sw: g ? 1.2 : 2.5, opacity: g ? 0.5 : 1 });
      Pg.push({ t: 'text', x: x0, y: y0 + 26, s: layerNote(id, A, sun), size: 12, weight: 700, fam: g ? 'b' : 'm', fill: C.ink, opacity: 0.7 });
      if (showLeg) legendFor([id], C).slice(0, 3).forEach((it, j) => {
        const yy = y0 + 46 + j * 18;
        Pg.push({ t: 'rect', x: x0, y: yy - 11, w: 14, h: 14, rx: g ? 7 : 0, fill: it.fill, stroke: g ? 'rgba(23,24,27,.3)' : C.ink, sw: g ? 1 : 1.6 });
        Pg.push({ t: 'text', x: x0 + 22, y: yy, s: it.label, size: 12, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
      });
      dimOp(Pg, mk.dim).forEach((p) => prims.push(p));
      prims.push({ t: 'line', x1: xe, y1: y0 + 8, x2: mk.minX + 6, y2: mk.cy, stroke: C.ink, sw: 1, dash: [2, 4], opacity: 0.45 * mk.dim });
    });
    return { prims: prims, hits: hits, geom: null, W: sheet.W, H: sheet.H, sun: sun, mode: 'iso', ids: ids };
  };

  SS.arsa = function (project, A, view, live) { return view.mode === 'iso' ? SS.arsaIso(project, A, view, live) : SS.arsaMap(project, A, view, live); };
})();

/* ==========================================================================
   39-lib-f-imarscene.js — İmar ve kapasite paftası (Modül 5)
   Parsel çevresini yakın plan (daire pencere) çizer: parsel, çekme zarfı, kütle, gölge, çevre yapıları.
   Kipler: "plan" (düz plan, kenar etiketleri ve tutamaçlar) ve "iso" (izometrik kütle, kat çizgileri).
   Çıktı: { prims, hits, geom, W, H } — hits ekran koordinatında; geom plan ↔ ekran dönüşümü içindir.
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = App.gis;
  const osm = App.osm;
  const Z = App.zoning;
  const D = App.siteDraw;
  const SS = App.siteScene;
  const sheet = App.sheet;
  const iso = App.iso;
  const U = App.util;
  const fmt = U.fmt;
  const IS = (App.imarScene = {});

  /* ---------------- yerel görünüm: veriyi parsel merkezine kaydır ve kırp ---------------- */
  const memo = new WeakMap();
  IS.local = function (data, c, Rv) {
    const key = Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(Rv);
    let m = memo.get(data);
    if (m && m.k === key) return m.v;
    const cx = Math.round(c[0]), cy = Math.round(c[1]);
    const R2 = Rv + 160; // kaydırılmış veri kırpma dairesinden biraz büyük alınır
    const near = (b) => Math.abs(b.cx - cx) <= R2 && Math.abs(b.cy - cy) <= R2;
    const mv = (pts) => pts.map((q) => [q[0] - cx, q[1] - cy]);
    const bb = (o) => { const b = gis.bbox(o.pts); return !(b.x1 < cx - R2 || b.x0 > cx + R2 || b.y1 < cy - R2 || b.y0 > cy + R2); };
    const sh = (list) => list.filter(bb).map((o) => Object.assign({}, o, { pts: mv(o.pts) }));
    const d2 = {
      R: R2,
      buildings: data.buildings.filter(near).map((b) => Object.assign({}, b, { pts: mv(b.pts), cx: b.cx - cx, cy: b.cy - cy })),
      roads: sh(data.roads), rails: sh(data.rails), green: sh(data.green), landuse: sh(data.landuse), water: sh(data.water),
      poi: data.poi.map((p) => Object.assign({}, p, { x: p.x - cx, y: p.y - cy })),
      transit: data.transit.map((p) => Object.assign({}, p, { x: p.x - cx, y: p.y - cy })),
    };
    const v = osm.clipped(d2, Rv);
    v.offset = [cx, cy];
    memo.set(data, { k: key, v: v });
    return v;
  };

  // görünüm penceresi: parsel merkezi ve yarıçap (sürükleme sırasında view.fixed ile dondurulur)
  IS.frame = function (parcel, view, k, lo, hi) {
    if (view && view.fixed) return { c: view.fixed.c, Rv: view.fixed.Rv };
    if (!parcel || parcel.length < 3) return { c: [0, 0], Rv: 160 };
    const c = gis.centroid(parcel);
    const maxd = Math.max.apply(null, parcel.map((q) => Math.hypot(q[0] - c[0], q[1] - c[1])));
    return { c: c, Rv: U.clamp(Math.ceil((maxd * k) / 10) * 10, lo, hi) };
  };

  const EDGE_LABEL = { on: 'ÖN', yan: 'YAN', arka: 'ARKA' };
  const EDGE_LABEL_G = { on: 'Ön', yan: 'Yan', arka: 'Arka' };

  /* ---------------- ortak sağ sütun: program tablosu ---------------- */
  function rightColumn(R, im, C, project) {
    const P = [];
    const X = 1018, W = 340;
    const use = Z.use(im.use);
    SS.panelTitle(X, 56, W, 'İmar durumu · ' + use.label.split(' (')[0], C).forEach((p) => P.push(p));
    const f = R.ok ? R.facts : null;
    const bar = (y, label, used, allow, text) => {
      P.push({ t: 'text', x: X, y: y, s: label, size: 12.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
      const v = allow ? used / allow : 0;
      D.bar(X + 128, y - 9, 120, 8, Math.min(1, v), C, { fill: v > 1.002 ? C.bad : undefined }).forEach((q) => P.push(q));
      P.push({ t: 'text', x: X + W, y: y, s: text, size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
    };
    if (f) {
      bar(84, 'Taban alanı (TAKS)', f.taksUsed, im.taks, fmt(f.taksUsed, 2) + ' / ' + fmt(im.taks, 2));
      bar(106, 'Emsal (KAKS)', f.kaksUsed, im.kaks, fmt(f.kaksUsed, 2) + ' / ' + fmt(im.kaks, 2));
      bar(128, 'Yükseklik', R.height, im.hmax, fmt(R.height, 1) + ' / ' + fmt(im.hmax, 1) + ' m');
    } else {
      P.push({ t: 'text', x: X, y: 84, s: R.reason === 'cekme' ? 'Çekmeler parseli tüketiyor' : R.reason === 'kucuk' ? 'Yapılabilir alan çok küçük' : 'Önce parsel çizin', size: 13, weight: 700, fam: 'b', fill: C.bad, });
    }
    SS.panelTitle(X, 162, W, 'Alanlar ve kapasite', C).forEach((p) => P.push(p));
    const rows = f ? [
      ['Parsel alanı', fmt(R.A, 0) + ' m²'],
      ['Yapılabilir alan (çekme sonrası)', fmt(R.Aenv, 0) + ' m²'],
      ['Taban alanı', fmt(R.footprint, 0) + ' m²'],
      ['Kat sayısı', R.floors + ' kat × ' + fmt(im.floorH, 1) + ' m'],
      ['Toplam inşaat alanı', fmt(R.built, 0) + ' m²'],
      ['Net kullanım alanı (~%' + Math.round(im.eff * 100) + ')', fmt(f.net, 0) + ' m²'],
      [use.unitName.charAt(0).toLocaleUpperCase('tr') + use.unitName.slice(1) + ' sayısı (~' + fmt(im.unit, 0) + ' m²)', String(f.units)],
      ['Tahmini ' + use.perName + ' sayısı', String(f.people)],
      ['Yoğunluk', fmt(f.density, 0) + ' ' + (use.perName === 'kişi' ? 'kişi' : 'kullanıcı') + '/ha'],
      ['Otopark (gerekli / ' + im.basement + ' bodrum)', f.carsNeed + ' / ' + f.carsCap],
      ['Açık alan', '%' + Math.round(f.freeShare * 100)],
    ] : [['Parsel alanı', fmt(R.A || 0, 0) + ' m²'], ['Yapılabilir alan', fmt(R.Aenv || 0, 0) + ' m²']];
    rows.forEach((r, i) => SS.kv(X, 190 + i * 22, W, r[0], r[1], C).forEach((p) => P.push(p)));
    // çekmeler
    let y = 190 + rows.length * 22 + 22;
    SS.panelTitle(X, y, W, 'Çekme mesafeleri', C).forEach((p) => P.push(p));
    y += 28;
    [['on', 'Ön bahçe'], ['yan', 'Yan bahçe'], ['arka', 'Arka bahçe']].forEach((k, i) => {
      SS.kv(X, y + i * 22, W, k[1], fmt(im.setback[k[0]], 1) + ' m', C).forEach((p) => P.push(p));
    });
    y += 3 * 22 + 18;
    // senaryolar
    if (im.scn.length && y < 760) {
      SS.panelTitle(X, y, W, 'Senaryolar', C).forEach((p) => P.push(p));
      y += 26;
      P.push({ t: 'text', x: X + 150, y: y, s: 'kat', size: 11, weight: 600, fam: 'b', fill: C.ink, opacity: 0.55, anchor: 'end' });
      P.push({ t: 'text', x: X + 220, y: y, s: 'emsal', size: 11, weight: 600, fam: 'b', fill: C.ink, opacity: 0.55, anchor: 'end' });
      P.push({ t: 'text', x: X + W, y: y, s: use.unitName, size: 11, weight: 600, fam: 'b', fill: C.ink, opacity: 0.55, anchor: 'end' });
      y += 20;
      im.scn.slice(0, 4).forEach((sc) => {
        if (y > 840) return;
        const s = sc.sum || {};
        P.push({ t: 'text', x: X, y: y, s: sc.name, size: 12, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
        P.push({ t: 'text', x: X + 150, y: y, s: s.ok ? String(s.floors) : '—', size: 12, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
        P.push({ t: 'text', x: X + 220, y: y, s: s.ok ? fmt(s.kaks, 2) : '—', size: 12, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
        P.push({ t: 'text', x: X + W, y: y, s: s.ok ? String(s.units) : '—', size: 12, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
        y += 20;
      });
    }
    void project;
    return P;
  }

  function infoOf(project, R, im, mode, C, ctxName) {
    const f = R.ok ? R.facts : null;
    const legend = [
      { label: 'Parsel', fill: C.accent },
      { label: 'Yapılabilir zarf', fill: C.env },
      { label: 'Önerilen kütle', fill: C.glass ? C.ink : '#EAAE1B' },
      { label: 'Yeni gölge', fill: C.shadow },
      { label: 'Çevre yapıları', fill: C.bTone[2] },
    ];
    return {
      name: project.meta.name,
      subtitle: 'İmar ve kapasite · ' + Z.use(im.use).label.split(' (')[0] + (mode === 'iso' ? ' · kütle' : '') + ' · ' + (ctxName.length > 22 ? ctxName.slice(0, 21) + '…' : ctxName),
      legend: legend,
      stats: [['Parsel', fmt(R.A || 0, 0) + ' m²'], ['TAKS·KAKS', fmt(im.taks, 2) + '·' + fmt(im.kaks, 1)], ['Yençok', fmt(im.hmax, 1) + ' m']],
      scoreLabel: 'Emsal kullanımı', percent: f ? Math.round(Math.min(1, f.emsalUse) * 100) : 0,
    };
  }

  const massFill = (C) => (C.glass ? '#2E3036' : '#EAAE1B');

  /* ---------------- PLAN kipi ---------------- */
  IS.plan = function (project, A, R, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const s0 = project.site, im = s0.imar, parcel = s0.parcel;
    const e = App.site.entry(s0);
    const fv = IS.frame(parcel, view, 2.1, 90, 300);
    const c = fv.c, Rv = fv.Rv;
    const CX = 506, CY = 442, RP = 376;
    const sc = RP / Rv;
    const T = D.mapT(CX, CY, sc);
    const cl = e ? IS.local(e.data, c, Rv) : { R: Rv, buildings: [], roads: [], rails: [], green: [], landuse: [], water: [], poi: [], transit: [], offset: [0, 0] };
    const mv = (pts) => pts.map((q) => [q[0] - cl.offset[0], q[1] - cl.offset[1]]);
    const mvc = (pts) => (cl.offset ? mv(pts) : pts);
    const prims = sheet.frame(infoOf(project, R, im, 'plan', C, s0.loc.name), live);
    const add = (L) => L.forEach((p) => prims.push(p));
    const hits = [];

    add(D.disc(T, Rv, C, 0));
    add(D.green(T, cl, C, 0, { opacity: 0.7, deep: false }));
    add(D.water(T, cl, C, 0));
    add(D.roads(T, cl, C, 0, { emph: true }));
    add(D.rails(T, cl, C, 0));
    add(D.buildings(T, cl, C, 0, { mode: 'tone', opacity: 1 }));
    // gölge
    if (view.shadow && R.ok && R.shadow && R.shadow.polys.length) {
      let d = '';
      R.shadow.polys.forEach((p) => { if (p.length >= 3) d += D.ringD(T, mvc(p), 0); });
      if (d) add([{ t: 'path', d: d, fill: C.shadow }]);
      // gölgede kalan komşular
      const hitB = D.clippedBuildings(cl).filter((b) => R.shadow.polys.some((p) => p.length >= 3 && gis.pointInPoly([b.cx + cl.offset[0], b.cy + cl.offset[1]], p)));
      if (hitB.length) {
        let dd = '';
        hitB.forEach((b) => { dd += D.ringD(T, b.pts, 0); });
        add([{ t: 'path', d: dd, fill: C.glass ? C.ink : C.red || '#C03A22', opacity: 0.55, stroke: C.ink, sw: 0.8 }]);
      }
    }
    // parsel
    const par = parcel ? mvc(parcel) : [];
    if (par.length >= 3) add([{ t: 'path', d: D.ringD(T, par, 0), fill: C.parcelFill }]);
    // zarf
    if (R.env && R.env.length >= 3) {
      add([{ t: 'path', d: D.ringD(T, mvc(R.env), 0), fill: C.glass ? 'rgba(23,24,27,.06)' : 'rgba(0,66,122,.08)', stroke: C.env, sw: 1.6, dash: [6, 4] }]);
    }
    // kütle
    if (R.ok) {
      R.pieces.forEach((pc) => add([{ t: 'path', d: D.ringD(T, mvc(pc), 0), fill: massFill(C), stroke: C.ink, sw: C.glass ? 1.4 : 2.6 }]));
    }
    // parsel sınırı: kenar türüne göre
    (R.edges || []).forEach((ed) => {
      const a = T.P(ed.a[0] - cl.offset[0], ed.a[1] - cl.offset[1]), b = T.P(ed.b[0] - cl.offset[0], ed.b[1] - cl.offset[1]);
      const w = ed.kind === 'on' ? (C.glass ? 4 : 5.5) : ed.kind === 'arka' ? 2.4 : 3;
      add([{ t: 'line', x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.accent, sw: w, dash: ed.kind === 'arka' ? [7, 4] : undefined, cap: 'round' }]);
    });
    // kenar etiketleri (tıklanabilir)
    (R.edges || []).forEach((ed) => {
      const dx = ed.dir[0], dy = ed.dir[1];
      const n = [dy, -dx]; // CCW parselde dışa
      const m = T.P(ed.mid[0] - cl.offset[0], ed.mid[1] - cl.offset[1]);
      const sx = n[0], sy = -n[1]; // ekran (y ters)
      const off = 22;
      const x = m[0] + sx * off, y = m[1] + sy * off;
      const dist = ed.kind === 'on' ? im.setback.on : ed.kind === 'arka' ? im.setback.arka : im.setback.yan;
      const txt = (C.glass ? EDGE_LABEL_G[ed.kind] : EDGE_LABEL[ed.kind]) + ' ' + fmt(dist, 1) + ' m';
      const w = txt.length * 6.6 + 14, h = 19;
      const rx = Math.max(CX - RP + 6 + w / 2, Math.min(CX + RP - 6 - w / 2, x)), ry = Math.max(CY - RP + 16, Math.min(CY + RP - 16, y));
      add([
        { t: 'rect', x: rx - w / 2, y: ry - h / 2, w: w, h: h, rx: C.glass ? h / 2 : 0, fill: C.glass ? '#fff' : C.paper, stroke: C.ink, sw: C.glass ? 1 : 1.6 },
        { t: 'text', x: rx, y: ry + 4.2, s: txt, size: 11, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'middle', pe: false },
      ]);
      hits.push({ kind: 'edge', i: ed.i, x0: rx - w / 2, x1: rx + w / 2, y0: ry - h / 2, y1: ry + h / 2 });
      // kenar uzunluğu
      if (ed.len * sc > 46) {
        const lx = m[0] - sx * 12, ly = m[1] - sy * 12;
        add([{ t: 'text', x: lx, y: ly + 3.5, s: fmt(ed.len, 1) + ' m', size: 10.5, weight: 700, fam: 'b', fill: C.ink, opacity: 0.8, anchor: 'middle', pe: false }]);
      }
    });
    // tutamaçlar
    if (view.handles) {
      par.forEach((q, i) => {
        const p = T.P(q[0], q[1]);
        add([{ t: 'circle', cx: p[0], cy: p[1], r: 6, fill: '#fff', stroke: C.accent, sw: 2.2 }]);
        hits.push({ kind: 'pv', i: i, x: p[0], y: p[1], r: 11 });
      });
    }
    // kütle etiketi
    if (R.ok && R.pieces.length) {
      const big = R.pieces.reduce((m, p) => (Math.abs(gis.area(p)) > Math.abs(gis.area(m)) ? p : m), R.pieces[0]);
      const bc = gis.centroid(big);
      const q = T.P(bc[0] - cl.offset[0], bc[1] - cl.offset[1]);
      const fnt = C.glass ? '#fff' : C.ink;
      add([
        { t: 'text', x: q[0], y: q[1] - 1, s: R.floors + ' kat', size: 15, weight: 800, fam: 'b', fill: fnt, anchor: 'middle', pe: false },
        { t: 'text', x: q[0], y: q[1] + 15, s: fmt(R.height, 1) + ' m', size: 11.5, weight: 600, fam: 'b', fill: fnt, anchor: 'middle', pe: false, opacity: 0.85 },
      ]);
    }
    // etiketler
    if (view.labels) {
      const lab = D.labeler();
      hits.forEach((h) => lab.reserve({ x0: h.x0 || h.x - 8, x1: h.x1 || h.x + 8, y0: h.y0 || h.y - 8, y1: h.y1 || h.y + 8 }));
      add(D.roadNames(T, cl, C, lab, { x0: CX - RP + 8, x1: CX + RP - 8, y0: CY - RP + 8, y1: CY + RP - 8 }));
    }
    // güneş yönü
    if (view.shadow && R.ok && R.shadow && R.shadow.alt > 0) add(D.sunMark(T, Rv, C, { alt: R.shadow.alt, az: R.shadow.az }, 0));
    prims.push({ t: 'path', d: D.ringD(T, gis.circlePoly(Rv, 96), 0), stroke: C.ink, sw: C.glass ? 1.4 : 3 });
    add(D.north(86, 92, C, 20));
    add(D.scaleBar(70, tb.y - 28, sc, C, 110 / sc));
    prims.push({ t: 'text', x: CX + RP, y: CY + RP + 22, s: 'r = ' + fmt(Rv, 0) + ' m' + (view.shadow && R.ok && R.shadow ? ' · ' + R.shadow.day.label + ' ' + fmt(im.hour, 0) + ':00' : ''), size: 12, weight: 700, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'end' });
    add(rightColumn(R, im, C, project));
    return { prims: prims, hits: hits, geom: { cx: CX, cy: CY, s: sc, c: cl.offset, Rv: Rv, Rpx: RP, W: sheet.W, H: sheet.H }, W: sheet.W, H: sheet.H, mode: 'plan' };
  };

  /* ---------------- İZO kipi ---------------- */
  IS.iso = function (project, A, R, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const s0 = project.site, im = s0.imar, parcel = s0.parcel;
    const e = App.site.entry(s0);
    const fv = IS.frame(parcel, view, 2.6, 100, 260);
    const c = fv.c, Rv = fv.Rv;
    const cl = e ? IS.local(e.data, c, Rv) : { R: Rv, buildings: [], roads: [], rails: [], green: [], landuse: [], water: [], poi: [], transit: [], offset: [0, 0] };
    const mvc = (pts) => pts.map((q) => [q[0] - cl.offset[0], q[1] - cl.offset[1]]);
    const zx = view.zx || 1;
    const H = R.ok ? R.height : 0;
    const maxCtx = cl.buildings.reduce((m, b) => Math.max(m, osm.heightOf(b)), 0);
    const hMax = Math.max(H, Math.min(maxCtx, 60), 12) * zx;
    const area = { x: 40, y: 56, w: 940, h: tb.y - 56 - 24 };
    const pr = (view.pitch * Math.PI) / 180;
    const sc = Math.min(area.w / (2 * Rv * 1.04), area.h / (2 * Rv * Math.sin(pr) + hMax * Math.cos(pr))) * 0.98;
    const cx = area.x + area.w / 2;
    const cy = area.y + area.h / 2 + (hMax * Math.cos(pr) * sc) / 2;
    const I = iso.make({ yaw: view.yaw, pitch: view.pitch, s: sc, cx: cx, cy: cy, center: [0, 0] });
    const T = D.isoT(I);
    const prims = sheet.frame(infoOf(project, R, im, 'iso', C, s0.loc.name), live);
    const add = (L) => L.forEach((p) => prims.push(p));
    add(D.disc(T, Rv, C, 0));
    add(D.green(T, cl, C, 0, { opacity: 0.6 }));
    add(D.water(T, cl, C, 0));
    add(D.roads(T, cl, C, 0, { emph: true }));
    add(D.rails(T, cl, C, 0));
    // gölge
    if (view.shadow && R.ok && R.shadow && R.shadow.polys.length) {
      let d = '';
      R.shadow.polys.forEach((p) => { if (p.length >= 3) d += D.ringD(T, mvc(p), 0.05); });
      if (d) add([{ t: 'path', d: d, fill: C.shadow }]);
    }
    const par = mvc(parcel);
    add([{ t: 'path', d: D.ringD(T, par, 0.1), fill: C.parcelFill, stroke: C.accent, sw: 2.4 }]);
    if (R.env && R.env.length >= 3) add([{ t: 'path', d: D.ringD(T, mvc(R.env), 0.15), stroke: C.env, sw: 1.4, dash: [6, 4] }]);
    // yapılar: derinlik sırası
    const ents = [];
    const pcen = gis.centroid(mvc(parcel)), pdp = I.depth(pcen[0], -pcen[1]);
    D.clippedBuildings(cl).forEach((b) => {
      if (gis.pointInPoly([b.cx + cl.offset[0], b.cy + cl.offset[1]], parcel)) return;
      ents.push({ dp: I.depth(b.cx, -b.cy), ctx: b });
    });
    if (R.ok) R.pieces.forEach((pc) => { const q = gis.centroid(mvc(pc)); ents.push({ dp: I.depth(q[0], -q[1]) - 0.5, piece: mvc(pc) }); });
    ents.sort((a, b) => a.dp - b.dp);
    const lod = !!view.lod;
    ents.forEach((en) => {
      if (en.ctx) {
        const b = en.ctx, h = osm.heightOf(b) * zx;
        const fill = C.bTone[D.hClass(osm.heightOf(b))];
        const ring = b.pts.map((q) => [q[0], -q[1]]);
        if (lod) { const F = iso.extrudeFaces(I, ring, 0, h); prims.push({ t: 'poly', pts: F.roof, fill: fill, stroke: C.bLine, sw: 0.5 }); }
        else {
          // parselin önünde kalıp kütleyi örten yakın yapılar yarı saydam çizilir: önerilen kütle görünür kalsın
          const veil = R.ok && en.dp > pdp && Math.hypot(b.cx - pcen[0], b.cy - pcen[1]) < 70 + h;
          iso.extrude(I, ring, 0, h, fill, { stroke: C.glass ? 'rgba(23,24,27,.30)' : 'rgba(38,29,17,.55)', sw: 0.7 }).forEach((p) => { if (veil) p.opacity = 0.32; prims.push(p); });
        }
        return;
      }
      const ring = en.piece.map((q) => [q[0], -q[1]]);
      const h = H * zx;
      const fill = massFill(C);
      const F = iso.extrudeFaces(I, ring, 0, h);
      F.walls.forEach((w) => {
        prims.push({ t: 'poly', pts: w.pts, fill: iso.shade(fill, w.f), stroke: C.ink, sw: C.glass ? 0.8 : 1.6 });
        if (!lod && R.floors > 1 && R.floors <= 40) {
          for (let k = 1; k < R.floors; k++) {
            const t = k / R.floors;
            const a = [w.pts[3][0] + (w.pts[0][0] - w.pts[3][0]) * t, w.pts[3][1] + (w.pts[0][1] - w.pts[3][1]) * t];
            const b = [w.pts[2][0] + (w.pts[1][0] - w.pts[2][0]) * t, w.pts[2][1] + (w.pts[1][1] - w.pts[2][1]) * t];
            prims.push({ t: 'line', x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.glass ? 'rgba(255,255,255,.35)' : 'rgba(38,29,17,.45)', sw: 0.8 });
          }
        }
      });
      prims.push({ t: 'poly', pts: F.roof, fill: iso.shade(fill, 1.12), stroke: C.ink, sw: C.glass ? 1 : 2 });
    });
    if (view.shadow && R.ok && R.shadow && R.shadow.alt > 0) add(D.sunMark(T, Rv, C, { alt: R.shadow.alt, az: R.shadow.az }, 0));
    // yön oku
    const nd = I.dir(0, -1);
    const nl = Math.hypot(nd[0], nd[1]) || 1;
    prims.push({ t: 'line', x1: 86, y1: 100, x2: 86 + (nd[0] / nl) * 26, y2: 100 + (nd[1] / nl) * 26, stroke: C.ink, sw: 2.4, cap: 'round' });
    prims.push({ t: 'text', x: 86 + (nd[0] / nl) * 38, y: 104 + (nd[1] / nl) * 38, s: 'K', size: 13, weight: 800, fam: 'b', fill: C.ink, anchor: 'middle' });
    add(rightColumn(R, im, C, project));
    return { prims: prims, hits: [], geom: null, W: sheet.W, H: sheet.H, mode: 'iso' };
  };

  /* boş (kütle yok) durum için ortak: arayüz parsel yoksa bu işlevi çağırmaz */
  IS.scene = function (project, A, R, view, live) { return view.mode === 'iso' ? IS.iso(project, A, R, view, live) : IS.plan(project, A, R, view, live); };
})();

/* ==========================================================================
   39-lib-g-selscene.js — Yer Seçimi paftası (Modül 6)
   Kip "karsilastir": aday konumların küçük çoklu haritaları + sıralama, ölçüt matrisi, ağırlıklar.
   Kip "bul": tek veri kümesi üzerinde ızgara taraması — skor ısı haritası, en iyi noktalar, seçili nokta ayrıntısı.
   Çıktı: { prims, hits, geom, W, H } — hits ekran koordinatında.
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = App.gis;
  const osm = App.osm;
  const site = App.site;
  const sel = App.select;
  const D = App.siteDraw;
  const SS = App.siteScene;
  const sheet = App.sheet;
  const U = App.util;
  const fmt = U.fmt;
  const YS = (App.selScene = {});

  const SHORT = { erisim: 'Erişim', ulasim: 'Taşıma', yesil: 'Yeşil', sessizlik: 'Sessiz', karisim: 'Karışım', baglanti: 'Bağlantı' };
  const cut = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  // 0..100 skor → kademe rengi
  function ramp(C, v) {
    const k = Math.max(0, Math.min(4, Math.floor((v / 100) * 5 - 1e-9)));
    return C.score[k];
  }
  YS.ramp = ramp;

  function legendRamp(x, y, w, C, lo, hi) {
    const P = [];
    const n = C.score.length, cw = w / n;
    C.score.forEach((col, i) => P.push({ t: 'rect', x: x + i * cw, y: y, w: cw + 0.5, h: 10, fill: col, stroke: C.glass ? 'rgba(23,24,27,.2)' : C.ink, sw: C.glass ? 0.6 : 1 }));
    P.push({ t: 'text', x: x, y: y + 24, s: '%' + Math.round(lo), size: 11, weight: 700, fam: 'b', fill: C.ink, opacity: 0.7 });
    P.push({ t: 'text', x: x + w, y: y + 24, s: '%' + Math.round(hi), size: 11, weight: 700, fam: 'b', fill: C.ink, opacity: 0.7, anchor: 'end' });
    return P;
  }

  /* ---------------- KARŞILAŞTIR ---------------- */
  YS.compare = function (project, ctx, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const cmp = ctx.cmp, cand = project.cand, s0 = project.site;
    const rows = cmp.rows;
    const n = Math.max(1, rows.length);
    const prims = [];
    const best = cmp.best || cmp.ranked[0];
    const info = {
      name: project.meta.name,
      subtitle: 'Yer seçimi · karşılaştırma · ' + site.template(s0.template).label,
      legend: [
        { label: 'Birinci aday', fill: C.glass ? C.ink : C.good },
        { label: 'Elenen aday', fill: C.glass ? '#B5B8C0' : C.bad },
        { label: '10 dk yürüme', fill: C.isoBand[1] },
        { label: 'Yapı', fill: C.bTone[2] },
        { label: 'Yeşil alan', fill: C.green },
        { label: 'Su', fill: C.water },
      ],
      stats: [['Aday', String(rows.length)], ['Yarıçap', fmt(s0.radius, 0) + ' m'], ['Yürüme', s0.walkMin + ' dk']],
      scoreLabel: 'En yüksek skor', percent: best ? best.score : 0,
    };
    sheet.frame(info, live).forEach((p) => prims.push(p));
    const hits = [];
    const add = (L) => L.forEach((p) => prims.push(p));

    // karo ızgarası
    const area = { x: 40, y: 54, w: 950, h: tb.y - 54 - 20 };
    const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 6 ? 3 : 4;
    const rws = Math.ceil(n / cols);
    const tw = area.w / cols, th = area.h / rws;
    const ts = Math.min(tw, th);
    rows.forEach((r, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x0 = area.x + col * tw + (tw - ts) / 2, y0 = area.y + row * th + (th - ts) / 2;
      const cx = x0 + ts / 2, cy = y0 + ts / 2 - 10;
      const rt = ts / 2 - 34;
      const isSel = cand.sel === r.id;
      hits.push({ kind: 'cand', id: r.id, x0: x0, y0: y0, x1: x0 + ts, y1: y0 + ts });
      if (isSel) add([{ t: 'rect', x: x0 + 4, y: y0 + 2, w: ts - 8, h: ts - 4, rx: C.glass ? 18 : 0, stroke: C.ink, sw: C.glass ? 1.4 : 2.4, dash: [5, 4] }]);
      if (!r.ready) {
        add([{ t: 'circle', cx: cx, cy: cy, r: rt, fill: C.disc, stroke: C.ink, sw: C.glass ? 1.2 : 2.4 }]);
        add([{ t: 'text', x: cx, y: cy + 4, s: 'veri yok', size: 13, weight: 700, fam: 'b', fill: C.ink, opacity: 0.5, anchor: 'middle' }]);
        add([{ t: 'text', x: cx, y: cy + rt + 24, s: cut(r.c.name, 26), size: 13, weight: 700, fam: 'b', fill: C.ink, anchor: 'middle' }]);
        return;
      }
      const A = r.A;
      const T = D.mapT(cx, cy, rt / A.R);
      const dim = r.pass ? 1 : 0.5;
      const P = [];
      const pa = (L) => L.forEach((p) => P.push(p));
      pa(D.disc(T, A.R, C, 0));
      pa(D.green(T, A.clip, C, 0, { opacity: 0.8 }));
      pa(D.water(T, A.clip, C, 0));
      pa(D.access(T, A, C, 0, { opacity: 0.8 }));
      pa(D.roads(T, A.clip, C, 0, { emph: false, minW: 0.6 }));
      pa(D.buildings(T, A.clip, C, 0, { mode: 'tone', opacity: 0.95 }));
      pa(D.center(T, C, 0));
      P.push({ t: 'path', d: D.ringD(T, gis.circlePoly(A.R, 72), 0), stroke: C.ink, sw: C.glass ? 1.2 : 2.4 });
      SS.dimOp(P, dim).forEach((p) => prims.push(p));
      // sıra rozeti
      const bx = cx - rt * 0.78, by = cy - rt * 0.78;
      const first = r.rank === 1 && r.pass;
      add([
        { t: 'circle', cx: bx, cy: by, r: 15, fill: first ? (C.glass ? C.ink : C.good) : C.glass ? '#fff' : C.paper, stroke: C.ink, sw: C.glass ? 1.2 : 2.2 },
        { t: 'text', x: bx, y: by + 5, s: String(r.rank), size: 15, weight: 800, fam: 'b', fill: first ? '#fff' : C.ink, anchor: 'middle', pe: false },
      ]);
      // ad ve skor
      add([
        { t: 'text', x: cx, y: cy + rt + 22, s: cut(r.c.name, 28), size: 13.5, weight: 700, fam: 'b', fill: C.ink, anchor: 'middle', opacity: dim },
        { t: 'text', x: cx, y: cy + rt + 41, s: '%' + r.score + (r.pass ? '' : ' · elendi'), size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: r.pass ? C.ink : C.bad, anchor: 'middle' },
      ]);
    });

    // sağ sütun
    const X = 1018, W = 340;
    SS.panelTitle(X, 56, W, 'Sıralama', C).forEach((p) => prims.push(p));
    cmp.ranked.slice(0, 8).forEach((r, i) => {
      const y = 84 + i * 22;
      prims.push({ t: 'text', x: X, y: y, s: r.rank + '.', size: 12.5, weight: 800, fam: C.glass ? 'b' : 'm', fill: C.ink });
      prims.push({ t: 'text', x: X + 20, y: y, s: cut(r.c.name, 17), size: 12.5, weight: 600, fam: 'b', fill: C.ink, opacity: r.pass ? 0.9 : 0.5 });
      D.bar(X + 170, y - 9, 100, 8, r.score / 100, C, r.pass ? {} : { fill: C.glass ? '#B5B8C0' : C.bad }).forEach((q) => prims.push(q));
      prims.push({ t: 'text', x: X + W, y: y, s: '%' + r.score, size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
    });
    const y1 = 84 + Math.max(1, cmp.ranked.length) * 22 + 14;
    SS.panelTitle(X, y1, W, 'Ölçüt matrisi', C).forEach((p) => prims.push(p));
    const mx = X + 26, mw = 52;
    site.PARTS.forEach((p, j) => {
      prims.push({ t: 'text', x: mx + j * mw * 0.0 + (j * (W - 26)) / 6 + (W - 26) / 12, y: y1 + 28, s: SHORT[p.id], size: 10.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.65, anchor: 'middle' });
    });
    const cw = (W - 26) / 6;
    cmp.ranked.slice(0, 8).forEach((r, i) => {
      const y = y1 + 38 + i * 26;
      prims.push({ t: 'text', x: X + 6, y: y + 15, s: String(r.rank), size: 12, weight: 800, fam: C.glass ? 'b' : 'm', fill: C.ink });
      r.parts.forEach((p, j) => {
        const x = mx + j * cw;
        const f = p.v >= 0.7 ? 1 : p.v >= 0.4 ? 0.6 : 0.3;
        prims.push({ t: 'rect', x: x + 2, y: y, w: cw - 4, h: 21, rx: C.glass ? 6 : 0, fill: ramp(C, p.v * 100), stroke: C.glass ? 'rgba(23,24,27,.18)' : C.ink, sw: C.glass ? 0.8 : 1.2 });
        prims.push({ t: 'text', x: x + cw / 2, y: y + 14.5, s: String(Math.round(p.v * 100)), size: 11, weight: 700, fam: C.glass ? 'b' : 'm', fill: p.v >= 0.6 ? (C.glass ? '#fff' : '#fff') : C.ink, anchor: 'middle', opacity: f > 0 ? 1 : 1 });
      });
    });
    const y2 = y1 + 38 + Math.max(1, cmp.ranked.length) * 26 + 18;
    SS.panelTitle(X, y2, W, 'Ağırlıklar', C).forEach((p) => prims.push(p));
    site.PARTS.forEach((p, i) => {
      const y = y2 + 28 + i * 20;
      prims.push({ t: 'text', x: X, y: y, s: p.label, size: 12, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
      D.bar(X + 150, y - 9, 130, 8, cmp.w[p.id] != null ? cmp.w[p.id] : 0, C).forEach((q) => prims.push(q));
      prims.push({ t: 'text', x: X + W, y: y, s: fmt((cmp.w[p.id] || 0) * 100, 0), size: 12, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
    });
    if (best && (best.strong || []).length && y2 + 28 + 6 * 20 + 20 < tb.y - 8) {
      const y = y2 + 28 + 6 * 20 + 14;
      prims.push({ t: 'text', x: X, y: y, s: cut('Öne çıkan: ' + best.strong.map((x) => x.label.toLowerCase()).join(', '), 48), size: 11.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.75 });
    }
    return { prims: prims, hits: hits, geom: null, W: sheet.W, H: sheet.H, mode: 'karsilastir' };
  };

  /* ---------------- KONUM BUL (ızgara taraması) ---------------- */
  YS.scan = function (project, ctx, view, live) {
    const C = D.cols();
    const tb = sheet.tb;
    const sc = ctx.scan, e = ctx.entry, s0 = project.site, cand = project.cand;
    const prims = [];
    const peaks = sc ? sc.peaks : [];
    const info = {
      name: project.meta.name,
      subtitle: 'Yer seçimi · konum bul · ' + site.template(s0.template).label,
      legend: [
        { label: 'Düşük skor', fill: C.score[0] },
        { label: 'Orta', fill: C.score[2] },
        { label: 'Yüksek skor', fill: C.score[4] },
        { label: 'Filtreyi geçmeyen', fill: C.glass ? '#B5B8C0' : C.mid },
        { label: 'En iyi nokta', fill: C.ink },
      ],
      stats: [['Alan', sc ? '⌀ ' + fmt(sc.R * 2, 0) + ' m' : '—'], ['Adım', sc ? sc.step + ' m' : '—'], ['Geçen', sc ? sc.passN + ' / ' + sc.validN : '—']],
      scoreLabel: 'En iyi nokta', percent: peaks.length ? peaks[0].score : sc ? sc.max : 0,
    };
    sheet.frame(info, live).forEach((p) => prims.push(p));
    const add = (L) => L.forEach((p) => prims.push(p));
    const hits = [];
    const CX = 506, CY = 442, RP = 376;
    if (!sc || !e) {
      add([{ t: 'circle', cx: CX, cy: CY, r: RP, fill: C.disc, stroke: C.ink, sw: C.glass ? 1.2 : 2.4 }]);
      add([{ t: 'text', x: CX, y: CY, s: 'Tarama için konum verisi gerekli', size: 15, weight: 700, fam: 'b', fill: C.ink, opacity: 0.55, anchor: 'middle' }]);
      return { prims: prims, hits: hits, geom: null, W: sheet.W, H: sheet.H, mode: 'bul' };
    }
    const Rs = sc.R;
    const Rd = Math.min(e.data.R, Rs + sc.step * 0.75);
    const s = RP / Rd;
    const T = D.mapT(CX, CY, s);
    const cl = osm.clipped(e.data, Rd);
    add(D.disc(T, Rd, C, 0));
    add(D.green(T, cl, C, 0, { opacity: 0.5 }));
    add(D.water(T, cl, C, 0));
    add(D.roads(T, cl, C, 0, { emph: false, minW: 0.6, opacity: 0.8 }));
    add(D.buildings(T, cl, C, 0, { mode: 'faint', opacity: 0.8 }));
    // ısı hücreleri
    const buckets = [[], [], [], [], []];
    const fail = [];
    const half = sc.step / 2;
    sc.cells.forEach((c) => {
      if (c.score == null) return;
      const ring = [[c.x - half, c.y - half], [c.x + half, c.y - half], [c.x + half, c.y + half], [c.x - half, c.y + half]];
      const d = D.ringD(T, ring, 0);
      if (!c.pass) { fail.push(d); return; }
      const k = Math.max(0, Math.min(4, Math.floor((c.score / 100) * 5 - 1e-9)));
      buckets[k].push(d);
    });
    if (fail.length) add([{ t: 'path', d: fail.join(''), fill: C.glass ? '#B5B8C0' : C.mid, opacity: 0.32 }]);
    buckets.forEach((b, k) => { if (b.length) add([{ t: 'path', d: b.join(''), fill: C.score[k], opacity: 0.78, stroke: C.glass ? 'rgba(255,255,255,.55)' : 'rgba(241,230,203,.6)', sw: 0.8 }]); });
    // aday konumları (merkezde)
    add(D.center(T, C, 0));
    // seçili hücre
    const pick = view.pick && sc.cells.find((c) => c.x === view.pick.x && c.y === view.pick.y);
    if (pick) {
      const q = T.P(pick.x, pick.y);
      add([{ t: 'rect', x: q[0] - half * s, y: q[1] - half * s, w: sc.step * s, h: sc.step * s, stroke: C.ink, sw: C.glass ? 2 : 3 }]);
    }
    // en iyi noktalar
    peaks.forEach((p, i) => {
      const q = T.P(p.x, p.y);
      add([
        { t: 'circle', cx: q[0], cy: q[1], r: 13, fill: C.ink, stroke: C.glass ? '#fff' : C.paper, sw: 2.4 },
        { t: 'text', x: q[0], y: q[1] + 4.6, s: String(i + 1), size: 13, weight: 800, fam: 'b', fill: C.glass ? '#fff' : C.paper, anchor: 'middle', pe: false },
      ]);
      hits.push({ kind: 'peak', i: i, x: q[0], y: q[1], r: 16, cx: p.x, cy: p.y });
    });
    prims.push({ t: 'path', d: D.ringD(T, gis.circlePoly(Rd, 96), 0), stroke: C.ink, sw: C.glass ? 1.4 : 3 });
    add(D.north(86, 92, C, 20));
    add(D.scaleBar(70, tb.y - 28, s, C, 110 / s));
    prims.push({ t: 'text', x: CX + RP, y: CY + RP + 22, s: 'tarama yarıçapı ' + fmt(Rs, 0) + ' m', size: 12, weight: 700, fam: 'b', fill: C.ink, opacity: 0.6, anchor: 'end' });

    // sağ sütun
    const X = 1018, W = 340;
    SS.panelTitle(X, 56, W, 'En iyi noktalar', C).forEach((p) => prims.push(p));
    if (!peaks.length) prims.push({ t: 'text', x: X, y: 86, s: sc.validN ? 'Filtreleri geçen nokta yok' : 'Taranabilir yol ağı yok', size: 12.5, weight: 700, fam: 'b', fill: C.bad });
    peaks.slice(0, 8).forEach((p, i) => {
      const y = 86 + i * 24;
      const dist = Math.hypot(p.x, p.y);
      const brg = (Math.atan2(p.x, p.y) * 180) / Math.PI;
      prims.push({ t: 'circle', cx: X + 9, cy: y - 4.5, r: 9, fill: C.ink });
      prims.push({ t: 'text', x: X + 9, y: y - 0.5, s: String(i + 1), size: 11, weight: 800, fam: 'b', fill: C.glass ? '#fff' : C.paper, anchor: 'middle' });
      prims.push({ t: 'text', x: X + 28, y: y, s: dist < 20 ? 'Merkez' : gis.compass((brg + 360) % 360) + ' · ' + Math.round(dist) + ' m', size: 12.5, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
      D.bar(X + 170, y - 9, 100, 8, p.score / 100, C).forEach((q) => prims.push(q));
      prims.push({ t: 'text', x: X + W, y: y, s: '%' + p.score, size: 12.5, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
    });
    let y = 86 + Math.max(1, Math.min(8, peaks.length)) * 24 + 12;
    SS.panelTitle(X, y, W, 'Skor ölçeği', C).forEach((p) => prims.push(p));
    legendRamp(X, y + 24, W, C, sc.min, sc.max).forEach((p) => prims.push(p));
    y += 78;
    const tgt = pick || peaks[0];
    SS.panelTitle(X, y, W, pick ? 'Seçili nokta' : 'Birinci nokta', C).forEach((p) => prims.push(p));
    if (tgt && tgt.parts) {
      SS.kv(X, y + 26, W, 'Konum', 'x ' + Math.round(tgt.x) + ' · y ' + Math.round(tgt.y) + ' m', C).forEach((p) => prims.push(p));
      site.PARTS.forEach((p, i) => {
        const yy = y + 50 + i * 20;
        prims.push({ t: 'text', x: X, y: yy, s: p.label, size: 12, weight: 600, fam: 'b', fill: C.ink, opacity: 0.85 });
        D.bar(X + 150, yy - 9, 130, 8, tgt.parts[p.id], C).forEach((q) => prims.push(q));
        prims.push({ t: 'text', x: X + W, y: yy, s: String(Math.round(tgt.parts[p.id] * 100)), size: 12, weight: 700, fam: C.glass ? 'b' : 'm', fill: C.ink, anchor: 'end' });
      });
      const m = tgt.m || {};
      const yy = y + 50 + 6 * 20 + 6;
      if (yy < tb.y - 36) {
        SS.kv(X, yy, W, 'Park · durak · günlük', (m.park == null ? '—' : fmt(m.park, 0)) + ' · ' + (m.durak == null ? '—' : fmt(m.durak, 0)) + ' · ' + (m.gunluk == null ? '—' : fmt(m.gunluk, 0)) + ' dk', C).forEach((p) => prims.push(p));
      }
    } else prims.push({ t: 'text', x: X, y: y + 28, s: 'Haritada bir noktaya tıklayın', size: 12, weight: 500, fam: 'b', fill: C.ink, opacity: 0.55 });
    void cand;
    return { prims: prims, hits: hits, geom: { cx: CX, cy: CY, s: s, R: Rd, Rpx: RP, W: sheet.W, H: sheet.H }, W: sheet.W, H: sheet.H, mode: 'bul' };
  };

  YS.scene = function (project, ctx, view, live) { return view.mode === 'bul' ? YS.scan(project, ctx, view, live) : YS.compare(project, ctx, view, live); };
})();

/* ==========================================================================
   39-lib-h-geoexport.js — CAD / GIS / tablo dışa aktarma (Modül 4, 5, 6 ortak)
   Ortak ara biçim "özellik listesi": { layer, type: 'polygon' | 'line' | 'point' | 'text', pts, props, text? }
   Koordinatlar yerel metredir (x doğu, y kuzey, çalışma noktası merkez). Biçimler:
     · GeoJSON  (WGS84 boylam/enlem — QGIS, ArcGIS, geojson.io)
     · DXF R12  (metre, katmanlı — AutoCAD, Rhino, Revit, ArchiCAD, LibreCAD)
     · CSV      (Türkçe Excel uyumlu: ; ayracı, virgüllü ondalık, UTF-8 BOM)
     · SVG      (pafta primitiflerinden vektör)
   Saf mantık: dosya kaydetme çağıran tarafa bırakılır (App.files.saveBlob).
   ========================================================================== */
(function () {
  const App = window.App;
  const gis = App.gis;
  const osm = App.osm;
  const site = App.site;
  const Z = App.zoning;
  const GX = (App.geoExport = {});

  /* ---------------- özellik toplayıcılar ---------------- */
  const poly = (layer, pts, props) => ({ layer: layer, type: 'polygon', pts: pts, props: props || {} });
  const line = (layer, pts, props) => ({ layer: layer, type: 'line', pts: pts, props: props || {} });
  const point = (layer, p, props) => ({ layer: layer, type: 'point', pts: [p], props: props || {} });
  const text = (layer, p, s, props) => ({ layer: layer, type: 'text', pts: [p], text: s, props: props || {} });

  const r2 = (v) => Math.round(v * 100) / 100;

  /* Arsa Analizi: harita katmanlarının tamamı */
  GX.collectArsa = function (project, A) {
    const F = [];
    const cl = A.clip;
    F.push(poly('yaricap', gis.circlePoly(A.R, 96), { radiusM: A.R }));
    cl.buildings.forEach((b) => F.push(poly('bina', b.pts, { heightM: r2(osm.heightOf(b)), kind: b.kind || '', use: site.useOf(b.kind) })));
    cl.roads.forEach((r) => { if (r.pts.length > 1) F.push(line('yol', r.pts, { class: r.cls, name: r.name || '' })); });
    cl.rails.forEach((r) => { if (r.pts.length > 1) F.push(line('ray', r.pts, { kind: r.kind || '' })); });
    cl.green.forEach((g) => F.push(poly('yesil', g.pts, { kind: g.kind || '', name: g.name || '' })));
    cl.water.forEach((w) => { if (w.line) { if (w.pts.length > 1) F.push(line('su', w.pts, { kind: w.kind || '' })); } else F.push(poly('su', w.pts, { kind: w.kind || '' })); });
    A.pois.filter((p) => p.inR).forEach((p) => F.push(point('islev', [p.x, p.y], { category: p.cat, kind: p.kind || '', name: p.name || '', walkMin: p.min == null ? '' : r2(p.min) })));
    cl.transit.forEach((p) => F.push(point('durak', [p.x, p.y], { kind: p.kind || '', name: p.name || '' })));
    A.iso.forEach((b) => b.segs.forEach((q) => F.push(line('erisim_' + b.min, [[q[0], q[1]], [q[2], q[3]]], { minutes: b.min }))));
    F.push(point('merkez', [0, 0], { name: project.site.loc.name }));
    const s = project.site;
    if (s.parcel) addParcel(F, project, A, null);
    return F;
  };

  function addParcel(F, project, A, R) {
    const s = project.site;
    if (!s.parcel) return;
    const e = site.entry(s);
    if (!R) R = Z.compute(s.imar, s.parcel, e ? { data: e.data, A: A || site.analyze(s, e), lat: e.data.lat0, parcel: s.parcel } : null);
    F.push(poly('parsel', s.parcel, { areaM2: r2(Math.abs(gis.area(s.parcel))) }));
    if (R.env && R.env.length >= 3) F.push(poly('zarf', R.env, { areaM2: r2(R.Aenv) }));
    if (R.ok) R.pieces.forEach((p) => F.push(poly('kutle', p, { floors: R.floors, heightM: r2(R.height), footprintM2: r2(R.footprint), totalM2: r2(R.built) })));
    (R.edges || []).forEach((ed) => F.push(line('parsel_kenar', [ed.a, ed.b], { kind: ed.kind, lengthM: r2(ed.len), road: ed.roadName || '' })));
  }

  /* İmar ve kapasite: parsel, zarf, kütle, gölge, çevre yapıları */
  GX.collectImar = function (project, A, R) {
    const F = [];
    const s = project.site;
    if (!s.parcel) return F;
    const e = site.entry(s);
    addParcel(F, project, A, R);
    if (R && R.shadow) R.shadow.polys.forEach((p) => { if (p.length >= 3) F.push(poly('golge', p, { day: R.shadow.day.label, hour: s.imar.hour })); });
    if (e) {
      const c = gis.centroid(s.parcel);
      e.data.buildings.forEach((b) => { if (Math.hypot(b.cx - c[0], b.cy - c[1]) <= 220 && !gis.pointInPoly([b.cx, b.cy], s.parcel)) F.push(poly('bina', b.pts, { heightM: r2(osm.heightOf(b)), kind: b.kind || '' })); });
      e.data.roads.forEach((r) => { if (r.pts.length > 1 && r.pts.some((q) => Math.hypot(q[0] - c[0], q[1] - c[1]) <= 220)) F.push(line('yol', r.pts, { class: r.cls, name: r.name || '' })); });
    }
    return F;
  };

  // yerel koordinatların başlangıcı: tarama varsa tarama merkezi, yoksa ilk aday
  GX.yerRef = function (project, ctx) {
    if (ctx && ctx.scan) return [ctx.scan.lat0, ctx.scan.lon0];
    const c = project.cand && project.cand.list[0];
    return c ? [c.lat, c.lon] : [project.site.loc.lat, project.site.loc.lon];
  };

  /* Yer Seçimi: adaylar ve (varsa) tarama hücreleri */
  GX.collectYer = function (project, ctx) {
    const F = [];
    const cand = project.cand;
    const ref = GX.yerRef(project, ctx);
    const PJ = ref ? gis.makeProj(ref[0], ref[1]) : null;
    if (ctx.cmp) ctx.cmp.rows.forEach((r) => {
      F.push(point('aday', PJ ? PJ.fwd(r.c.lat, r.c.lon).map((v) => Math.round(v * 10) / 10) : [r.c.dx || 0, r.c.dy || 0], { name: r.c.name, rank: r.rank || '', score: r.score == null ? '' : r.score, passes: r.pass == null ? '' : r.pass, lat: r.c.lat, lon: r.c.lon }));
    });
    const sc = ctx.scan;
    if (sc) {
      const half = sc.step / 2;
      sc.cells.forEach((c) => {
        if (c.score == null) return;
        F.push(poly('tarama', [[c.x - half, c.y - half], [c.x + half, c.y - half], [c.x + half, c.y + half], [c.x - half, c.y + half]], { score: c.score, passes: c.pass }));
      });
      sc.peaks.forEach((p, i) => F.push(point('en_iyi', [p.x, p.y], { rank: i + 1, score: p.score })));
    }
    void cand;
    return F;
  };

  /* ---------------- GeoJSON ---------------- */
  const r7 = (v) => Math.round(v * 1e7) / 1e7;
  GX.geojson = function (features, lat0, lon0, meta) {
    const P = gis.makeProj(lat0, lon0);
    const ll = (q) => { const p = P.inv(q[0], q[1]); return [r7(p[1]), r7(p[0])]; };
    const out = [];
    features.forEach((f) => {
      if (f.type === 'text') return;
      const props = Object.assign({ layer: f.layer }, f.props);
      let g;
      if (f.type === 'point') g = { type: 'Point', coordinates: ll(f.pts[0]) };
      else if (f.type === 'line') g = { type: 'LineString', coordinates: f.pts.map(ll) };
      else {
        const ring = f.pts.map(ll);
        const a = ring[0], b = ring[ring.length - 1];
        if (a[0] !== b[0] || a[1] !== b[1]) ring.push(a);
        g = { type: 'Polygon', coordinates: [ring] };
      }
      out.push({ type: 'Feature', properties: props, geometry: g });
    });
    return JSON.stringify({ type: 'FeatureCollection', name: 'archtools', archtools: Object.assign({ origin: { lat: lat0, lon: lon0 }, localUnit: 'm' }, meta || {}), features: out });
  };

  /* ---------------- DXF R12 ---------------- */
  // ACI renkleri: 1 kırmızı · 2 sarı · 3 yeşil · 4 camgöbeği · 5 mavi · 6 eflatun · 7 beyaz/siyah · 8 koyu gri · 9 açık gri
  const DXF_LAYERS = {
    yaricap: ['ARCH_YARICAP', 8], bina: ['ARCH_BINA', 9], yol: ['ARCH_YOL', 7], ray: ['ARCH_RAY', 1], yesil: ['ARCH_YESIL', 3], su: ['ARCH_SU', 5],
    islev: ['ARCH_ISLEV', 6], durak: ['ARCH_DURAK', 30], merkez: ['ARCH_MERKEZ', 1], parsel: ['ARCH_PARSEL', 1], zarf: ['ARCH_ZARF', 4], kutle: ['ARCH_KUTLE', 2],
    golge: ['ARCH_GOLGE', 8], parsel_kenar: ['ARCH_PARSEL_KENAR', 1], aday: ['ARCH_ADAY', 1], tarama: ['ARCH_TARAMA', 3], en_iyi: ['ARCH_EN_IYI', 2], yazi: ['ARCH_YAZI', 7],
    erisim_5: ['ARCH_ERISIM_5', 1], erisim_10: ['ARCH_ERISIM_10', 30], erisim_15: ['ARCH_ERISIM_15', 2],
  };
  const dxfLayer = (id) => (DXF_LAYERS[id] || ['ARCH_' + String(id).toUpperCase().replace(/[^A-Z0-9_]/g, '_'), 7]);
  const n6 = (v) => (Math.round(v * 1e4) / 1e4).toFixed(4);

  GX.dxf = function (features) {
    const used = {};
    const E = [];
    const g = (code, val) => { E.push(String(code)); E.push(String(val)); };
    features.forEach((f) => {
      const L = dxfLayer(f.layer);
      used[L[0]] = L[1];
      if (f.type === 'polygon' || f.type === 'line') {
        if (f.pts.length < 2) return;
        g(0, 'POLYLINE'); g(8, L[0]); g(66, 1); g(70, f.type === 'polygon' ? 1 : 0);
        f.pts.forEach((q) => { g(0, 'VERTEX'); g(8, L[0]); g(10, n6(q[0])); g(20, n6(q[1])); g(30, '0.0'); });
        g(0, 'SEQEND'); g(8, L[0]);
      } else if (f.type === 'point') {
        g(0, 'CIRCLE'); g(8, L[0]); g(10, n6(f.pts[0][0])); g(20, n6(f.pts[0][1])); g(30, '0.0'); g(40, f.layer === 'merkez' ? '4.0' : '2.0');
      } else if (f.type === 'text') {
        g(0, 'TEXT'); g(8, L[0]); g(10, n6(f.pts[0][0])); g(20, n6(f.pts[0][1])); g(30, '0.0'); g(40, (f.props && f.props.height) || '3.0'); g(1, asciiTr(f.text));
      }
    });
    const H = [];
    const h = (code, val) => { H.push(String(code)); H.push(String(val)); };
    h(0, 'SECTION'); h(2, 'HEADER'); h(9, '$ACADVER'); h(1, 'AC1009'); h(0, 'ENDSEC');
    h(0, 'SECTION'); h(2, 'TABLES');
    h(0, 'TABLE'); h(2, 'LTYPE'); h(70, 1); h(0, 'LTYPE'); h(2, 'CONTINUOUS'); h(70, 0); h(3, 'Solid line'); h(72, 65); h(73, 0); h(40, '0.0'); h(0, 'ENDTAB');
    const names = Object.keys(used);
    h(0, 'TABLE'); h(2, 'LAYER'); h(70, names.length + 1);
    h(0, 'LAYER'); h(2, '0'); h(70, 0); h(62, 7); h(6, 'CONTINUOUS');
    names.forEach((n) => { h(0, 'LAYER'); h(2, n); h(70, 0); h(62, used[n]); h(6, 'CONTINUOUS'); });
    h(0, 'ENDTAB');
    h(0, 'ENDSEC');
    h(0, 'SECTION'); h(2, 'ENTITIES');
    return H.join('\n') + '\n' + E.join('\n') + '\n0\nENDSEC\n0\nEOF\n';
  };
  const TR = { 'ç': 'c', 'Ç': 'C', 'ğ': 'g', 'Ğ': 'G', 'ı': 'i', 'İ': 'I', 'ö': 'o', 'Ö': 'O', 'ş': 's', 'Ş': 'S', 'ü': 'u', 'Ü': 'U', 'â': 'a', 'î': 'i', 'û': 'u', '²': '2' };
  function asciiTr(s) { return String(s == null ? '' : s).replace(/[çÇğĞıİöÖşŞüÜâîû²]/g, (c) => TR[c] || c).replace(/[^\x20-\x7e]/g, '?'); }
  GX.asciiTr = asciiTr;

  /* ---------------- CSV ---------------- */
  // rows: dizi dizisi (sayılar virgüllü ondalıkla yazılır)
  GX.csv = function (rows) {
    const cell = (v) => {
      if (v == null) return '';
      if (typeof v === 'number') return Number.isFinite(v) ? String(Math.round(v * 1000) / 1000).replace('.', ',') : '';
      if (typeof v === 'boolean') return v ? 'evet' : 'hayır';
      const s = String(v);
      return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n') + '\r\n';
  };

  GX.csvArsa = function (project, A) {
    const s = project.site;
    const rows = [['archtools · Arsa analizi'], ['Konum', s.loc.name], ['Enlem', s.loc.lat], ['Boylam', s.loc.lon], ['Yarıçap (m)', A.R], ['Yürüme süresi (dk)', s.walkMin], ['Program', A.template.label], ['Veri', A.demo ? 'Demo (sentetik)' : 'OpenStreetMap'], ['Konum skoru (%)', A.score], []];
    rows.push(['Skor bileşeni', 'Değer (0-1)', 'Ağırlık']);
    A.parts.forEach((p) => rows.push([p.label, Math.round(p.v * 1000) / 1000, p.w]));
    rows.push([]);
    rows.push(['İşlev kategorisi', 'En yakın (dk)', '5 dk içinde', '10 dk içinde', '15 dk içinde', 'Yarıçap içinde toplam']);
    A.cats.forEach((c) => rows.push([c.label, c.nearMin == null ? '' : Math.round(c.nearMin * 10) / 10, c.c5, c.c10, c.c15, c.total]));
    rows.push([]);
    rows.push(['Çevre ölçüsü', 'Değer']);
    [['Bina sayısı', A.built.count], ['Taban alanı oranı (TAKS)', A.built.coverage], ['Tahmini emsal (KAKS)', A.built.far], ['Yeşil alan payı', A.green.share], ['Yol ağı yoğunluğu (km/km²)', A.mob.density], ['Kesişim yoğunluğu (/km²)', A.mob.interDensity], ['Durak (10 dk içinde)', A.transit.in10], ['Gürültü göstergesi', A.noise.cls.label]].forEach((r) => rows.push(r));
    rows.push([]);
    rows.push(['İşlev noktası', 'Kategori', 'Tür', 'Yürüme (dk)']);
    A.pois.filter((p) => p.inR).forEach((p) => rows.push([p.name || '', osm.cat(p.cat).label, p.kind || '', p.min == null ? '' : Math.round(p.min * 10) / 10]));
    return GX.csv(rows);
  };

  GX.csvImar = function (project, R) {
    const im = project.site.imar;
    const use = Z.use(im.use);
    const rows = [['archtools · İmar ve kapasite'], ['Proje', project.meta.name], ['Program', use.label], [], ['Parametre', 'Değer']];
    [['TAKS', im.taks], ['KAKS (emsal)', im.kaks], ['Yençok (m)', im.hmax], ['Kat yüksekliği (m)', im.floorH], ['Ön çekme (m)', im.setback.on], ['Yan çekme (m)', im.setback.yan], ['Arka çekme (m)', im.setback.arka], ['Kütle biçimi', (Z.FORMS.find((f) => f.id === im.form) || {}).label], ['Net/brüt verim', im.eff], ['Ortalama birim net alan (m²)', im.unit], ['Birim başına araç', im.cars], ['Birim başına kişi', im.per], ['Bodrum kat sayısı', im.basement]].forEach((r) => rows.push(r));
    rows.push([]);
    rows.push(['Sonuç', 'Değer']);
    if (R && R.ok) {
      const f = R.facts;
      [['Parsel alanı (m²)', R.A], ['Yapılabilir alan (m²)', R.Aenv], ['Taban alanı (m²)', R.footprint], ['Kat sayısı', R.floors], ['Yükseklik (m)', R.height], ['Toplam inşaat alanı (m²)', R.built], ['Kullanılan TAKS', f.taksUsed], ['Kullanılan KAKS', f.kaksUsed], ['Net kullanım alanı (m²)', f.net], [use.unitName + ' sayısı', f.units], ['Tahmini ' + use.perName, f.people], ['Gerekli otopark', f.carsNeed], ['Bodrum otopark kapasitesi', f.carsCap], ['Açık alan payı', f.freeShare]].forEach((r) => rows.push(r));
    } else rows.push(['Hesaplanamadı', R && R.reason ? R.reason : '']);
    if (im.scn.length) {
      rows.push([]);
      rows.push(['Senaryo', 'Kat', 'Emsal', 'Toplam inşaat (m²)', 'Birim']);
      im.scn.forEach((c) => { const s = c.sum || {}; rows.push([c.name, s.floors, s.kaks, s.built, s.units]); });
    }
    return GX.csv(rows);
  };

  GX.csvYer = function (project, ctx) {
    const rows = [['archtools · Yer seçimi'], ['Proje', project.meta.name], []];
    if (ctx.cmp && ctx.cmp.ranked.length) {
      rows.push(['Sıra', 'Aday', 'Skor (%)', 'Filtreleri geçti'].concat(site.PARTS.map((p) => p.label)).concat(['Elenme nedeni']));
      ctx.cmp.ranked.forEach((r) => rows.push([r.rank, r.c.name, r.score, r.pass].concat(r.parts.map((p) => Math.round(p.v * 1000) / 1000)).concat([r.fail.join(' | ')])));
      rows.push([]);
      rows.push(['Ağırlık'].concat(site.PARTS.map((p) => p.label)));
      rows.push(['Değer'].concat(site.PARTS.map((p) => (ctx.cmp.w[p.id] == null ? '' : Math.round(ctx.cmp.w[p.id] * 100) / 100))));
    }
    if (ctx.scan) {
      rows.push([]);
      rows.push(['Tarama hücresi x (m)', 'y (m)', 'Skor (%)', 'Filtreleri geçti']);
      ctx.scan.cells.forEach((c) => { if (c.score != null) rows.push([c.x, c.y, c.score, c.pass]); });
    }
    return GX.csv(rows);
  };

  /* ---------------- SVG ---------------- */
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const n1 = (v) => Math.round(v * 100) / 100;
  GX.svg = function (prims, W, H, title) {
    const F = App.FONTS || {};
    const shadowDefs = [];
    const out = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">', '<title>' + esc(title || 'archtools') + '</title>'];
    prims.forEach((p) => {
      const a = [];
      if (p.opacity != null) a.push('opacity="' + p.opacity + '"');
      const st = () => {
        if (p.stroke) { a.push('stroke="' + p.stroke + '" stroke-width="' + p.sw + '" stroke-linejoin="round"'); if (p.cap) a.push('stroke-linecap="' + p.cap + '"'); }
        if (p.dash) a.push('stroke-dasharray="' + p.dash.join(' ') + '"');
      };
      switch (p.t) {
        case 'rect': a.push('x="' + n1(p.x) + '" y="' + n1(p.y) + '" width="' + n1(p.w) + '" height="' + n1(p.h) + '" fill="' + (p.fill || 'none') + '"'); if (p.rx) a.push('rx="' + p.rx + '"'); st(); out.push('<rect ' + a.join(' ') + '/>'); break;
        case 'circle': a.push('cx="' + n1(p.cx) + '" cy="' + n1(p.cy) + '" r="' + n1(p.r) + '" fill="' + (p.fill || 'none') + '"'); st(); out.push('<circle ' + a.join(' ') + '/>'); break;
        case 'line': a.push('x1="' + n1(p.x1) + '" y1="' + n1(p.y1) + '" x2="' + n1(p.x2) + '" y2="' + n1(p.y2) + '" stroke="' + p.stroke + '" stroke-width="' + p.sw + '" stroke-linecap="' + (p.cap || 'butt') + '"'); if (p.dash) a.push('stroke-dasharray="' + p.dash.join(' ') + '"'); out.push('<line ' + a.join(' ') + '/>'); break;
        case 'poly': a.push('points="' + p.pts.map((q) => n1(q[0]) + ',' + n1(q[1])).join(' ') + '" fill="' + (p.fill || 'none') + '"'); st(); out.push('<polygon ' + a.join(' ') + '/>'); break;
        case 'path': a.push('d="' + p.d + '" fill="' + (p.fill || 'none') + '"'); st(); out.push('<path ' + a.join(' ') + '/>'); break;
        case 'text': {
          const font = esc(F[p.fam] || F.b || 'sans-serif');
          if (p.xf) a.push('x="0" y="0" transform="matrix(' + p.xf.map((v) => Math.round(v * 1000) / 1000).join(' ') + ' ' + n1(p.x) + ' ' + n1(p.y) + ')"');
          else a.push('x="' + n1(p.x) + '" y="' + n1(p.y) + '"');
          a.push('fill="' + p.fill + '" font-family="' + font + '" font-size="' + p.size + '" font-weight="' + p.weight + '" text-anchor="' + (p.anchor || 'start') + '"');
          if (p.ls) a.push('letter-spacing="' + p.ls + '"');
          out.push('<text ' + a.join(' ') + '>' + esc(p.s) + '</text>');
          break;
        }
        default:
      }
    });
    void shadowDefs;
    out.push('</svg>');
    return out.join('\n');
  };
})();

/* ==========================================================================
   39-state-site.js — Arsa / İmar / Yer Seçimi eylemleri (reducer eklentisi) ve JSON uzantıları
   Proje içinde: project.site { loc, radius, walkMin, template, parcel, imar } ve project.cand { list, w, f, sel, mode, scan }
   Böylece geri al/ileri al, otomatik kayıt ve JSON içe/dışa aktarma Modül 1 ile aynı akışı kullanır.
   Eylemler: SITE_SET / SITE_SET_LIVE {patch} · IMAR_SET / IMAR_SET_LIVE {patch} · IMAR_EDGE {i, kind}
             IMAR_SCN_SAVE {name} · IMAR_SCN_DEL {id} · IMAR_SCN_APPLY {id}
             CAND_ADD {c} · CAND_REMOVE {id} · CAND_SET {patch} · CAND_UPDATE {id, patch} · CAND_CLEAR
   JSON uzantıları: extensions.siteAnalysis · extensions.zoning · extensions.siteSelection
   ========================================================================== */
(function () {
  const App = window.App;
  const U = App.util;
  const S = App.state;
  const site = App.site;
  const Z = App.zoning;
  const sel = App.select;

  /* ---------------- ek alanlar ---------------- */
  site.init = function () { return { site: site.defaults(), cand: sel.defaults() }; };

  const withSite = (P, patch) => Object.assign({}, P, { site: Object.assign({}, P.site, patch) });
  const withImar = (P, patch) => withSite(P, { imar: Z.clampImar(Object.assign({}, P.site.imar, patch)) });
  const withCand = (P, patch) => Object.assign({}, P, { cand: sel.clamp(Object.assign({}, P.cand, patch)) });

  function cleanSite(P, patch) {
    const o = Object.assign({}, patch);
    if (o.radius != null) o.radius = U.clamp(Math.round(o.radius / 50) * 50, 250, 1000);
    if (o.walkMin != null) o.walkMin = [5, 10, 15].indexOf(o.walkMin) >= 0 ? o.walkMin : P.site.walkMin;
    if (o.template != null && !site.TEMPLATES.some((t) => t.id === o.template)) o.template = P.site.template;
    if ('parcel' in o && o.parcel != null) o.parcel = Z.cleanParcel(o.parcel) || null;
    return o;
  }

  S.hooks.push(function (next, a, prev) {
    let P = next.project;
    let state = next;
    if (!P.site || !P.cand) {
      P = Object.assign({}, P, { site: P.site || site.defaults(), cand: P.cand || sel.defaults() });
      state = Object.assign({}, state, { project: P });
    }
    if (!P.site.imar) { P = withSite(P, { imar: Z.defaults() }); state = Object.assign({}, state, { project: P }); }
    const apply = (project, history) => (history ? Object.assign(S.withHistory(state, project), { selectedId: state.selectedId }) : Object.assign({}, state, { project: project }));
    const same = () => (state === next ? undefined : state);

    switch (a.type) {
      case 'SITE_SET': return apply(withSite(P, cleanSite(P, a.patch)), true);
      case 'SITE_SET_LIVE': return apply(withSite(P, cleanSite(P, a.patch)), false);
      case 'IMAR_SET': return apply(withImar(P, a.patch), true);
      case 'IMAR_SET_LIVE': return apply(withImar(P, a.patch), false);
      case 'IMAR_EDGE': {
        const ek = Object.assign({}, P.site.imar.ek);
        if (a.kind) ek[a.i] = a.kind; else delete ek[a.i];
        return apply(withImar(P, { ek: ek }), true);
      }
      case 'IMAR_PRESET': return apply(withImar(P, a.patch), true);
      case 'IMAR_SCN_SAVE': {
        const im = P.site.imar;
        const scn = im.scn.concat([{ id: U.uid(), name: String(a.name || 'Senaryo').slice(0, 24), p: a.p, sum: a.sum }]).slice(-4);
        return apply(withImar(P, { scn: scn }), true);
      }
      case 'IMAR_SCN_DEL': return apply(withImar(P, { scn: P.site.imar.scn.filter((s) => s.id !== a.id) }), true);
      case 'IMAR_SCN_APPLY': {
        const s = P.site.imar.scn.find((x) => x.id === a.id);
        if (!s) return same();
        return apply(withImar(P, Object.assign({}, s.p, { scn: P.site.imar.scn })), true);
      }
      case 'CAND_ADD': {
        const c = a.c;
        if (P.cand.list.length >= 8) return same();
        if (P.cand.list.some((x) => x.src !== 'demo' && Math.abs(x.lat - c.lat) < 1e-4 && Math.abs(x.lon - c.lon) < 1e-4)) return same();
        const item = { id: U.uid(), name: String(c.name || 'Aday').slice(0, 60), lat: c.lat, lon: c.lon, src: c.src || 'koordinat', dx: c.dx || 0, dy: c.dy || 0, note: c.note || '' };
        return apply(withCand(P, { list: P.cand.list.concat([item]), sel: item.id }), true);
      }
      case 'CAND_REMOVE': return apply(withCand(P, { list: P.cand.list.filter((x) => x.id !== a.id), sel: P.cand.sel === a.id ? null : P.cand.sel }), true);
      case 'CAND_UPDATE': return apply(withCand(P, { list: P.cand.list.map((x) => (x.id === a.id ? Object.assign({}, x, a.patch) : x)) }), true);
      case 'CAND_SET': return apply(withCand(P, a.patch), !!a.history);
      case 'CAND_SET_LIVE': return apply(withCand(P, a.patch), false);
      case 'CAND_CLEAR': return apply(withCand(P, { list: [], sel: null }), true);
      default:
    }
    return same();
  });

  /* ---------------- JSON uzantıları ---------------- */
  const r1 = (v) => Math.round(v * 10) / 10;
  const baseToExt = site.toExt;
  site.toExt = function (project) {
    const out = baseToExt(project);
    const s = project.site;
    if (!s || !out.siteAnalysis) return out;
    if (s.parcel) out.siteAnalysis.parcel = { unit: 'm', origin: 'site-center (x east, y north)', ring: s.parcel.map((q) => [r1(q[0]), r1(q[1])]), area: Math.round(Math.abs(App.gis.area(s.parcel)) * 10) / 10 };
    return out;
  };
  const baseFromExt = site.fromExt;
  site.fromExt = function (x, project) {
    const d = baseFromExt(x, project);
    if (x && x.parcel && Array.isArray(x.parcel.ring)) d.parcel = Z.cleanParcel(x.parcel.ring);
    return d;
  };
  // ext sağlayıcıyı yenisiyle değiştir (39-lib-site.js eskisini ekledi)
  const pi = App.extProviders.indexOf(baseToExt);
  if (pi >= 0) App.extProviders[pi] = (p) => site.toExt(p);

  Z.toExt = function (project) {
    const s = project.site;
    if (!s || !s.parcel) return {};
    const im = s.imar;
    const e = site.entry(s);
    let ctx = null;
    if (e) { const A = site.analyze(s, e); ctx = { data: e.data, A: A, lat: e.data.lat0, parcel: s.parcel }; }
    const R = Z.compute(im, s.parcel, ctx);
    return {
      zoning: {
        version: 1,
        parameters: { use: im.use, taks: im.taks, kaks: im.kaks, maxHeightM: im.hmax, floorHeightM: im.floorH, setbacksM: im.setback, edgeOverrides: im.ek, form: im.form, efficiency: im.eff, avgUnitNetM2: im.unit, carsPerUnit: im.cars, personsPerUnit: im.per, basementFloors: im.basement },
        result: Z.summary(R, im),
        scenarios: im.scn.map((c) => ({ name: c.name, parameters: c.p, result: c.sum })),
      },
    };
  };
  App.extProviders.push(Z.toExt);

  sel.toExt = function (project) {
    const c = project.cand;
    if (!c || !c.list.length) return {};
    const s = project.site;
    const set = { radius: s.radius, walkMin: s.walkMin, template: s.template };
    const cmp = sel.compare(c, set);
    return {
      siteSelection: {
        version: 1,
        candidates: c.list.map((x) => ({ id: x.id, name: x.name, lat: x.lat, lon: x.lon, source: x.src, offsetM: x.src === 'demo' ? [x.dx, x.dy] : undefined, note: x.note || undefined })),
        weights: cmp.w, filters: c.f, settings: set,
        ranking: cmp.ranked.map((r) => ({ id: r.id, rank: r.rank, score: r.score, passes: r.pass, parts: r.parts.reduce((o, p) => { o[p.id] = Math.round(p.v * 1000) / 1000; return o; }, {}) })),
      },
    };
  };
  App.extProviders.push(sel.toExt);

  /* içe aktarma: fromJSON bu işlevleri çağırır; dönen alanlar projeye eklenir */
  App.extImporters = App.extImporters || [];
  App.extImporters.push(function (ext, project) {
    const out = {};
    if (ext.siteAnalysis) {
      const s = site.fromExt(ext.siteAnalysis, project);
      s.imar = Z.clampImar(ext.zoning && ext.zoning.parameters ? {
        use: ext.zoning.parameters.use, taks: ext.zoning.parameters.taks, kaks: ext.zoning.parameters.kaks, hmax: ext.zoning.parameters.maxHeightM, floorH: ext.zoning.parameters.floorHeightM,
        setback: ext.zoning.parameters.setbacksM, ek: ext.zoning.parameters.edgeOverrides, form: ext.zoning.parameters.form, eff: ext.zoning.parameters.efficiency, unit: ext.zoning.parameters.avgUnitNetM2,
        cars: ext.zoning.parameters.carsPerUnit, per: ext.zoning.parameters.personsPerUnit, basement: ext.zoning.parameters.basementFloors,
        scn: (ext.zoning.scenarios || []).map((c, i) => ({ id: 'k' + i, name: c.name, p: c.parameters, sum: c.result })),
      } : null);
      out.site = s;
    }
    if (ext.siteSelection) {
      const x = ext.siteSelection;
      out.cand = sel.clamp({
        list: (x.candidates || []).map((c) => ({ id: c.id, name: c.name, lat: c.lat, lon: c.lon, src: c.source, dx: c.offsetM ? c.offsetM[0] : 0, dy: c.offsetM ? c.offsetM[1] : 0, note: c.note })),
        w: x.weights, f: x.filters,
      });
    }
    return out;
  });
})();

/* ==========================================================================
   42-ui-board.js — canlı pafta (SVG): daireler, ilişki çizgileri, sürükle-bırak
